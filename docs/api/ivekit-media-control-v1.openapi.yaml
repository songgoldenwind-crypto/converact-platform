openapi: 3.1.0
info:
  title: iveKit Internal Voice Media Control API
  version: 1.0.0
  description: >
    Cell-local RustPBX to media-node control protocol. A successful response
    is authoritative; a client timeout or invalid response is an unknown
    outcome that must be reconciled with the same command_id.
x-ivekit-limits:
  payload_bytes: 131072
  sdp_bytes: 16384
  json_depth: 16
  json_nodes: 4096
  object_properties: 64
  array_items: 1024
servers:
  - url: https://media-control.internal
security:
  - mutualTLS: []
    bearerAuth: []
paths:
  /livez:
    get:
      operationId: mediaControlLive
      security:
        - mutualTLS: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: mediaControlReady
      security:
        - mutualTLS: []
      responses:
        "200":
          description: Agent is ready for control traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Agent is alive but not ready for control traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      operationId: mediaControlMetrics
      responses:
        "200":
          description: Low-cardinality Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
  /v1/commands:
    post:
      operationId: executeMediaControlCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: Determinate or explicitly unknown command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/reconcile:
    post:
      operationId: reconcileMediaControlCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reconcile"
      responses:
        "200":
          description: Current outcome of the exact prior command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/sessions/{reservation_id}:
    get:
      operationId: getMediaControlSession
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Current media session snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  responses:
    Error:
      description: Stable typed error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[A-Za-z0-9._:@/-]+$"
    OwnerEpoch:
      type: string
      pattern: "^(0|[1-9][0-9]{0,19})$"
    ProtocolVersion:
      type: string
      const: ivekit.media-control.v1
    ErrorCode:
      type: string
      minLength: 2
      maxLength: 128
      pattern: "^[a-z][a-z0-9_]+$"
      examples:
        - media_control_timeout
        - media_control_unavailable
        - stale_owner_epoch
    CanonicalDateTime:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          enum: [alive, ready, not_ready]
    Command:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - action
        - command_id
        - reservation_id
        - interaction_id
        - owner_epoch
        - sequence
        - lease_expires_at
        - payload
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        action:
          enum: [prepare, commit, cancel, close]
        command_id:
          $ref: "#/components/schemas/Identifier"
        reservation_id:
          $ref: "#/components/schemas/Identifier"
        interaction_id:
          $ref: "#/components/schemas/Identifier"
        owner_epoch:
          $ref: "#/components/schemas/OwnerEpoch"
        sequence:
          type: integer
          minimum: 1
          maximum: 4294967295
        lease_expires_at:
          $ref: "#/components/schemas/CanonicalDateTime"
        payload:
          type: object
          maxProperties: 64
      allOf:
        - if:
            properties:
              action:
                const: prepare
            required: [action]
          then:
            properties:
              payload:
                type: object
                required: [offer_sdp, media_profile_id]
                properties:
                  offer_sdp:
                    type: string
                    maxLength: 16384
                  media_profile_id:
                    $ref: "#/components/schemas/Identifier"
    Reconcile:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - action
        - command_id
        - reservation_id
        - interaction_id
        - owner_epoch
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        action:
          type: string
          const: reconcile
        command_id:
          $ref: "#/components/schemas/Identifier"
        reservation_id:
          $ref: "#/components/schemas/Identifier"
        interaction_id:
          $ref: "#/components/schemas/Identifier"
        owner_epoch:
          $ref: "#/components/schemas/OwnerEpoch"
    Session:
      type: object
      additionalProperties: false
      required:
        - reservation_id
        - interaction_id
        - owner_epoch
        - last_sequence
        - state
        - transport_session_id
        - effective_sdp
        - lease_expires_at
        - updated_at
      properties:
        reservation_id:
          $ref: "#/components/schemas/Identifier"
        interaction_id:
          $ref: "#/components/schemas/Identifier"
        owner_epoch:
          $ref: "#/components/schemas/OwnerEpoch"
        last_sequence:
          type: integer
          minimum: 1
          maximum: 4294967295
        state:
          enum: [prepared, committed, cancelled, closed, expired]
        transport_session_id:
          $ref: "#/components/schemas/Identifier"
        effective_sdp:
          type: string
          maxLength: 16384
        lease_expires_at:
          $ref: "#/components/schemas/CanonicalDateTime"
        updated_at:
          $ref: "#/components/schemas/CanonicalDateTime"
    Result:
      type: object
      additionalProperties: false
      required: [protocol_version, state, command_id]
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        state:
          enum: [succeeded, failed, unknown]
        command_id:
          $ref: "#/components/schemas/Identifier"
        error_code:
          $ref: "#/components/schemas/ErrorCode"
        retryable:
          type: boolean
        session:
          $ref: "#/components/schemas/Session"
      oneOf:
        - properties:
            state:
              const: succeeded
          required: [session]
          not:
            anyOf:
              - required: [error_code]
              - required: [retryable]
        - properties:
            state:
              const: failed
          required: [error_code, retryable]
        - properties:
            state:
              const: unknown
            retryable:
              const: true
          required: [error_code, retryable]
    ResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Result"
    Error:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        retryable:
          type: boolean
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
