        device_id: { type: string }
        rustdesk_id: { type: string, pattern: '^\d{6,20}$' }
        generated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/IveKitRustDeskNativeEvidenceBinding' }

    IveKitRustDeskNativeEvidenceCreate:
      type: object
      additionalProperties: false
      required: [native_event_id, source_origin, external_id, operation_id, authorization_scope, authorization_id, kind, filename, upload_mode, expected_size_bytes, observed_at]
      properties:
        native_event_id: { type: string, minLength: 1, maxLength: 512 }
        source_origin: { type: string, const: rustdesk_native_event }
        external_id: { type: string, minLength: 1, maxLength: 512 }
        operation_id: { type: string, minLength: 1, maxLength: 512 }
        authorization_scope: { type: string, enum: [operation, session] }
        authorization_id: { type: string, minLength: 1, maxLength: 512 }
        kind: { type: string, enum: [file, screen_recording] }
        filename: { type: string, minLength: 1, maxLength: 512 }
        declared_mime: { type: string, maxLength: 255 }
        upload_mode: { type: string, enum: [single, multipart] }
        expected_size_bytes: { type: integer, minimum: 1, maximum: 10737418240 }
        part_size_bytes: { type: integer, minimum: 1, maximum: 536870912 }
        observed_at: { type: string, format: date-time }
        direction: { type: string, enum: [upload, download] }
        control_version: { type: integer, minimum: 1 }
        retention_until: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
      oneOf:
        - required: [direction, control_version]
          properties:
            kind: { const: file }
            authorization_scope: { const: operation }
        - properties:
            kind: { const: screen_recording }
            authorization_scope: { const: session }
            direction: false
            control_version: false

    IveKitSecureFileCompleteInput:
      type: object
      additionalProperties: false
      required: [size_bytes, sha256]
      properties:
        size_bytes: { type: integer, minimum: 1, maximum: 10737418240 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }

    IveKitRustDeskEdgeEvidenceFileResponse:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: object
          additionalProperties: true
          description: Edge-internal secure-file record. It must not be exposed directly to LED browser clients.

    IveKitSecureFileDerivative:
      type: object
      additionalProperties: false
      required: [kind, status, mime, size_bytes, sha256, error_code, created_at, updated_at, completed_at]
      properties:
        kind: { type: string, enum: [image_thumbnail, video_thumbnail, video_transcode, audio_transcode] }
        status: { type: string, enum: [pending, processing, retry_wait, ready, failed, expired] }
        mime: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }

    IveKitSecureFile:
      type: object
      additionalProperties: false
      description: Safe public projection. Object-store keys, multipart ids, provider raw output, leases, and worker fields are never returned.
      required: [file_id, session_id, created_by, kind, filename, extension, declared_mime, detected_mime, mime_conflict, status, threat_status, failure_code, upload_mode, expected_size_bytes, received_size_bytes, part_size_bytes, size_bytes, sha256, scan_attempt_count, retention_until, expires_at, created_at, updated_at, completed_at, derivatives]
      properties:
        file_id: { type: string }
        session_id: { type: string }
        created_by: { type: string }
        kind: { type: string, enum: [image, video, audio, file, screen_recording] }
        filename: { type: string }
        extension: { type: string }
        declared_mime: { type: string }
        detected_mime: { type: string }
        mime_conflict: { type: boolean }
        status: { type: string, enum: [initiated, uploading, scanning, processing, ready, quarantined, failed, expired] }
        threat_status: { type: string, enum: [pending, scanning, clean, infected, error] }
        failure_code: { type: string }
        upload_mode: { type: string, enum: [single, multipart] }
        expected_size_bytes: { type: integer, minimum: 1 }
        received_size_bytes: { type: integer, minimum: 0 }
        part_size_bytes: { type: integer, minimum: 1 }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string }
        scan_attempt_count: { type: integer, minimum: 0 }
        retention_until: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        derivatives:
          type: array
          items: { $ref: '#/components/schemas/IveKitSecureFileDerivative' }

    IveKitSecureFileResponse:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { $ref: '#/components/schemas/IveKitSecureFile' }

    IveKitSecureFilePart:
      type: object
      additionalProperties: false
      required: [part_number, size_bytes, sha256, status, created_at, updated_at]
      properties:
        part_number: { type: integer, minimum: 1, maximum: 10000 }
        size_bytes: { type: integer, minimum: 1, maximum: 536870912 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [staged, uploaded, committed, aborted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DashboardResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            total_calls: { type: integer }
            active_calls: { type: integer }
            avg_intent_score: { type: number }
            active_seats: { type: integer }

    CreateOutboundTask:
      type: object
      required: [tenant_id, phone_number, channel]
      properties:
        tenant_id: { type: string }
        phone_number: { type: string }
        channel: { type: string, enum: [pstn_voice, livekit_sip] }
        scheduled_at: { type: string, format: date-time }

    CreateWebhookSubscription:
      type: object
      required: [tenant_id, url, events]
      properties:
        tenant_id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }

    WhiteLabelConfig:
      type: object
      properties:
        tenant_id: { type: string }
        brand_name: { type: string }
        logo_url: { type: string }
        primary_color: { type: string }
        custom_domain: { type: string }
        email_from_name: { type: string }
        email_from_address: { type: string }

    IveKitProviderCapability:
      type: string
      enum: [ocr, asr, quality_review, translation]

    IveKitProviderRouteCandidate:
      type: object
      required: [profile_id, mode, available, reason]
      properties:
        profile_id: { type: string }
        mode: { type: string, enum: [self_hosted, third_party, unconfigured] }
        available: { type: boolean }
        reason: { type: string, enum: ['', profile_unavailable, credential_unavailable] }

    IveKitIntelligenceCapability:
      type: object
      required: [enabled, automatic, available, provider_mode, provider_profile_ids, providers, reason]
      properties:
        enabled: { type: boolean }
        automatic: { type: boolean }
        available: { type: boolean }
        provider_mode: { type: string, enum: [self_hosted, third_party, unconfigured] }
        provider_profile_ids:
          type: array
          maxItems: 10
          items: { type: string }
        providers:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/IveKitProviderRouteCandidate' }
        reason: { type: string }

    IveKitIntelligenceCapabilities:
      type: object
      required: [tenant_id, policy_configured, policy_version, capabilities, translation_target_languages, confidence_thresholds]
      properties:
        tenant_id: { type: string }
        policy_configured: { type: boolean }
        policy_version: { type: integer, minimum: 0 }
        capabilities:
          type: object
          required: [ocr, asr, quality_review, translation]
          properties:
            ocr: { $ref: '#/components/schemas/IveKitIntelligenceCapability' }
            asr: { $ref: '#/components/schemas/IveKitIntelligenceCapability' }
            quality_review: { $ref: '#/components/schemas/IveKitIntelligenceCapability' }
            translation: { $ref: '#/components/schemas/IveKitIntelligenceCapability' }
        translation_target_languages:
          type: array
          items: { type: string }
        confidence_thresholds:
          type: object
          required: [ocr, asr]
          properties:
            ocr: { type: number, minimum: 0, maximum: 1 }
            asr: { type: number, minimum: 0, maximum: 1 }

    IveKitIntelligencePolicyWrite:
      type: object
      required: [version, ocr_enabled, asr_enabled, quality_review_enabled, translation_enabled, ocr_profile_ids, asr_profile_ids, quality_profile_ids, translation_profile_ids, allow_third_party, auto_ocr, auto_asr, auto_quality_review, auto_translation, translation_target_languages, min_ocr_confidence, min_asr_confidence]
      properties:
        version: { type: integer, minimum: 0 }
        ocr_enabled: { type: boolean }
        asr_enabled: { type: boolean }
        quality_review_enabled: { type: boolean }
        translation_enabled: { type: boolean }
        ocr_profile_id: { type: string }
        asr_profile_id: { type: string }
        quality_profile_id: { type: string }
        translation_profile_id: { type: string }
        ocr_profile_ids: { type: array, maxItems: 10, uniqueItems: true, items: { type: string } }
        asr_profile_ids: { type: array, maxItems: 10, uniqueItems: true, items: { type: string } }
        quality_profile_ids: { type: array, maxItems: 10, uniqueItems: true, items: { type: string } }
        translation_profile_ids: { type: array, maxItems: 10, uniqueItems: true, items: { type: string } }
        allow_third_party: { type: boolean }
        auto_ocr: { type: boolean }
        auto_asr: { type: boolean }
        auto_quality_review: { type: boolean }
        auto_translation: { type: boolean }
        translation_target_languages: { type: array, items: { type: string } }
        min_ocr_confidence: { type: number, minimum: 0, maximum: 1 }
        min_asr_confidence: { type: number, minimum: 0, maximum: 1 }

    IveKitIntelligencePolicy:
      allOf:
        - { $ref: '#/components/schemas/IveKitIntelligencePolicyWrite' }
        - type: object
          required: [tenant_id, configured, updated_by, created_at, updated_at]
          properties:
            tenant_id: { type: string }
            configured: { type: boolean }
            updated_by: { type: string }
            created_at: { type: [string, 'null'], format: date-time }
            updated_at: { type: [string, 'null'], format: date-time }

    IveKitProviderProfileSummary:
      type: object
      required: [id, capability, mode, name, configured, token_configured, requests_per_minute, requests_per_day, max_concurrency, failure_threshold, open_cooldown_ms, reservation_ttl_ms]
      properties:
        id: { type: string }
        capability: { $ref: '#/components/schemas/IveKitProviderCapability' }
        mode: { type: string, enum: [self_hosted, third_party] }
        name: { type: string }
        configured: { type: boolean }
        token_configured: { type: boolean }
        requests_per_minute: { type: integer, minimum: 0 }
        requests_per_day: { type: integer, minimum: 0 }
        max_concurrency: { type: integer, minimum: 1, maximum: 100 }
        failure_threshold: { type: integer, minimum: 1 }
        open_cooldown_ms: { type: integer, minimum: 1000 }
        reservation_ttl_ms: { type: integer, minimum: 5000 }

    IveKitProviderRuntimeSnapshot:
      type: object
      required: [tenant_id, capability, profile_id, minute_request_count, day_request_count, circuit_state, consecutive_retryable_failures, opened_until, last_success_at, last_failure_at, last_error_code, updated_at]
      properties:
        tenant_id: { type: string }
        capability: { $ref: '#/components/schemas/IveKitProviderCapability' }
        profile_id: { type: string }
        minute_request_count: { type: integer, minimum: 0 }
        day_request_count: { type: integer, minimum: 0 }
        circuit_state: { type: string, enum: [closed, open, half_open] }
        consecutive_retryable_failures: { type: integer, minimum: 0 }
        opened_until: { type: [string, 'null'], format: date-time }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_failure_at: { type: [string, 'null'], format: date-time }
        last_error_code: { type: string }
        updated_at: { type: string, format: date-time }

    IveKitProviderRouteError:
      type: object
      description: Safe Provider routing failure. No raw provider body, URL, token, or source content is returned.
      required: [code, retryable, attempt_codes]
      properties:
        code:
          type: string
          enum: [provider_route_unavailable]
        retryable: { type: boolean }
        attempt_codes:
          type: array
          description: Safe per-candidate failure or skip reasons.
          items:
            type: string
            enum: [minute_quota_exhausted, day_quota_exhausted, concurrency_exhausted, circuit_open, circuit_half_open_busy, provider_credential_unavailable, third_party_not_allowed, provider_unavailable, provider_timeout, provider_http_408, provider_http_425, provider_http_429, provider_http_500, provider_http_502, provider_http_503, provider_http_504]

    IveKitPolicyFinding:
      type: object
      required: [id, tenant_id, session_id, message_id, source, source_ref_id, policy_type, severity, matched_text_hash, fingerprint, action, evidence_refs, detector_version, policy_version, evidence_snapshot_hash, content_version, review_status, metadata, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        session_id: { type: string }
        message_id: { type: string }
        source: { type: string, enum: [text, ocr, asr, aggregate, ai] }
        source_ref_id: { type: string }
        policy_type: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        matched_text_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        action: { type: string }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        evidence_refs:
          type: array
          maxItems: 100
          items: { type: object, additionalProperties: true }
        detector_version: { type: string }
        policy_version: { type: string }
        evidence_snapshot_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        content_version: { type: integer, minimum: 1 }
        review_status: { type: string, enum: [pending, confirmed, false_positive, resolved, escalated] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IveKitAttachmentProcessingJob:
      type: object
      required: [id, attachment_id, processor, status, attempt_count, max_attempts, provider_mode, provider_profile_id, error_code, output_metadata]
      properties:
        id: { type: string }
        attachment_id: { type: string }
        processor: { type: string, enum: [ocr, asr, video_frame_ocr] }
        status: { type: string, enum: [pending, processing, retry_wait, succeeded, failed, cancelled] }
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1, maximum: 10 }
        provider_mode: { type: string, enum: [unconfigured, self_hosted, third_party] }
        provider_profile_id: { type: string }
        error_code: { type: string }
        output_metadata: { type: object, additionalProperties: true }

    IveKitVisualObservation:
      type: object
      additionalProperties: false
      description: Hash-only visual evidence. The decoded QR, barcode, or text value is never persisted or returned.
      required: [id, tenant_id, session_id, message_id, attachment_id, processor_job_id, observation_type, value_hash, symbology, confidence, frame_timestamp_ms, page_number, metadata, detector_version, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        session_id: { type: string }
        message_id: { type: string }
        attachment_id: { type: string }
        processor_job_id: { type: string }
        observation_type: { type: string, enum: [qr_code, barcode, text_region] }
        value_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        symbology: { type: string }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        frame_timestamp_ms: { type: [integer, 'null'], minimum: 0, maximum: 86400000 }
        page_number: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        metadata: { type: object, additionalProperties: true }
        detector_version: { type: string }
        created_at: { type: string, format: date-time }

    IveKitAttachmentInspection:
      type: object
      required: [attachment, job, jobs, observations]
      properties:
        attachment: { type: object, additionalProperties: true }
        job:
          oneOf:
            - { $ref: '#/components/schemas/IveKitAttachmentProcessingJob' }
            - { type: 'null' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/IveKitAttachmentProcessingJob' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/IveKitVisualObservation' }

security:
  - BearerAuth: []
  - ApiKey: []

tags:
  - name: Dashboard
  - name: Outbound
  - name: Agents
  - name: Quality Management
  - name: Knowledge Base
  - name: Billing
  - name: Webhooks
  - name: WFM
  - name: White Label
  - name: iveKit Intelligence
  - name: iveKit Files
  - name: iveKit Events
  - name: iveKit Notifications
  - name: iveKit RustDesk
  - name: iveKit RustDesk Edge
