# Non-runnable structure reference only.
# Production config is generated by scripts/render-rustpbx-config.ts.
http_addr = "0.0.0.0:8080"
log_level = "info"
database_url = "__RUSTPBX_DATABASE_URL_REQUIRED__"
rtp_start_port = 20000
rtp_end_port = 20100

[console]
base_path = "/console"
api_prefix = "/api"
allow_registration = false
secure_cookie = false

[[console.api_tokens]]
token = "__RUSTPBX_MANAGEMENT_TOKEN_REQUIRED__"
scopes = ["extensions.write", "trunks.write", "routing.write"]
description = "iveKit management adapter"

[ami]
allows = ["127.0.0.1"]

[proxy]
addr = "0.0.0.0"
generated_dir = "/app/generated"
udp_port = 5060
tcp_port = 5060
modules = ["acl", "auth", "registrar", "call"]
media_proxy = "auto"
ensure_user = true
acl_rules = ["allow all", "deny all"]

[[proxy.user_backends]]
type = "extension"
ttl = 30

[proxy.http_router]
url = "__RUSTPBX_ROUTER_URL_REQUIRED__"
timeout_ms = 3000
fallback_to_static = false
fallback_action = "reject"

[proxy.http_router.headers]
X-PBX-Key = "__RUSTPBX_WEBHOOK_TOKEN_REQUIRED__"

[rwi]
enabled = true
max_connections = 200
max_calls_per_connection = 50
orphan_hold_secs = 30

[[rwi.tokens]]
token = "__RUSTPBX_RWI_TOKEN_REQUIRED__"
scopes = ["call.control", "queue.control", "record.control", "supervisor.control", "media.stream"]

[callrecord]
type = "http"
url = "__RUSTPBX_CDR_WEBHOOK_URL_REQUIRED__"
headers = { "X-PBX-Key" = "__RUSTPBX_WEBHOOK_TOKEN_REQUIRED__" }
