[workspace]
members = [
  "apps/converact-api",
  "apps/converact-migration-tool",
  "crates/audit",
  "crates/config",
  "crates/contracts",
  "crates/event-log",
  "crates/idempotency",
  "crates/kernel-ids",
  "crates/migration-routing",
  "crates/migration-store",
  "crates/migration-tooling",
  "crates/observability",
  "crates/outbox-worker",
  "crates/postgres-store",
  "crates/runtime-health",
  "crates/tenant-auth",
  "crates/testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
deadpool-postgres = { version = "=0.14.1", default-features = false, features = ["rt_tokio_1"] }
hex = "=0.4.3"
hmac = "=0.13.0"
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
ryu = "=1.0.23"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sha2_11 = { package = "sha2", version = "=0.11.0" }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["fmt", "json"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
