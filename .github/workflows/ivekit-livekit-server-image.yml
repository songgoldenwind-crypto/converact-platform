name: iveKit LiveKit Server image

on:
  workflow_dispatch:
  push:
    tags:
      - 'ivekit-livekit-server-v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ivekit-livekit-server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_CONFIG: /tmp/ivekit-docker-config
      LIVEKIT_COMMIT: 0b3fd288e3ef3263ec475ba0d78cf3ad77459981
      LIVEKIT_TAG: v1.13.4
      IMAGE: ghcr.io/songgoldenwind-crypto/opc-ivekit-livekit-server
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out iveKit overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: opc
          persist-credentials: false

      - name: Check out exact LiveKit source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: livekit/livekit
          ref: 0b3fd288e3ef3263ec475ba0d78cf3ad77459981
          path: upstream
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact upstream identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "${LIVEKIT_COMMIT}"
          test "$(git -C upstream describe --tags --exact-match HEAD)" = "${LIVEKIT_TAG}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Apply overlay and test exact source
        shell: bash
        run: |
          set -euo pipefail
          node opc/infra/converact/livekit/apply-overlay.mjs upstream
          node opc/infra/converact/livekit/apply-overlay.mjs upstream
          GOCACHE=/tmp/ivekit-livekit-go-cache \
            go test -C upstream ./cmd/server ./pkg/sfu ./pkg/sfu/utils
          GOCACHE=/tmp/ivekit-livekit-go-cache \
            go test -C upstream/ivekit/component-hook-go ./...
          GOCACHE=/tmp/ivekit-livekit-go-cache \
            go test -C upstream/ivekit/livekit-owner ./...
          go -C upstream mod vendor
          git -C upstream diff --check

      - name: Authenticate to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build and publish immutable LiveKit fork
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/livekit/livekit
            org.opencontainers.image.version=v1.13.4-ivekit.1
            org.opencontainers.image.revision=0b3fd288e3ef3263ec475ba0d78cf3ad77459981
            io.ivekit.overlay-revision=${{ github.sha }}
            io.ivekit.component=livekit-server
            io.ivekit.owner-contract=component-node-v1
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ivekit-livekit-server
          cache-to: type=gha,mode=max,scope=ivekit-livekit-server

      - name: Verify published digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

  release:
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/ivekit-oci-release-gate.yml
    with:
      image: ghcr.io/songgoldenwind-crypto/opc-ivekit-livekit-server
      digest: ${{ needs.publish.outputs.digest }}
