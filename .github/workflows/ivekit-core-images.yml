name: iveKit core source images

on:
  workflow_dispatch:
  push:
    tags:
      - 'ivekit-release-*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ivekit-core-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: opc-platform
            image: ghcr.io/songgoldenwind-crypto/opc-platform
            context: .
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            prepare: none
          - id: opc-frontend
            image: ghcr.io/songgoldenwind-crypto/opc-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
            prepare: none
          - id: ivekit-service
            image: ghcr.io/songgoldenwind-crypto/opc-ivekit-service
            context: .tmp/ivekit-standalone-context
            dockerfile: .tmp/ivekit-standalone-context/Dockerfile
            platforms: linux/amd64,linux/arm64
            prepare: ivekit-standalone
          - id: capacity-tools
            image: ghcr.io/songgoldenwind-crypto/opc-ivekit-capacity-tools
            context: .
            dockerfile: infra/capacity/Dockerfile
            platforms: linux/amd64,linux/arm64
            prepare: none
          - id: kamailio
            image: ghcr.io/songgoldenwind-crypto/opc-ivekit-kamailio
            context: infra/ivekit/kamailio
            dockerfile: infra/ivekit/kamailio/Dockerfile
            platforms: linux/amd64,linux/arm64
            prepare: none
          - id: ai-agent
            image: ghcr.io/songgoldenwind-crypto/opc-ai-agent
            context: services/ai-agent-py
            dockerfile: services/ai-agent-py/Dockerfile
            platforms: linux/amd64,linux/arm64
            prepare: none
    uses: ./.github/workflows/ivekit-source-image-release.yml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      platforms: ${{ matrix.platforms }}
      prepare: ${{ matrix.prepare }}
    secrets: inherit
