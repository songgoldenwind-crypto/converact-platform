name: iveKit RustPBX image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/ivekit-rustpbx-image.yml'
      - 'infra/ivekit/rustpbx/**'
      - 'package.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: ivekit-rustpbx-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/songgoldenwind-crypto/opc-rustpbx
  VERSION: 0.4.11-ivekit.27-6c49ee76

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate to GHCR
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build pinned RustPBX
        env:
          TARGETARCH: ${{ matrix.arch }}
          IVEKIT_RUSTPBX_IMAGE: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
        run: bash infra/ivekit/rustpbx/build.sh
      - name: Smoke test image
        run: docker run --rm ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }} --version
      - name: Push architecture image
        run: docker push ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}

  manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Authenticate to GHCR
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Create and push manifest
        run: |
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest annotate "${IMAGE}:${VERSION}" "${IMAGE}:${VERSION}-amd64" --arch amd64
          docker manifest annotate "${IMAGE}:${VERSION}" "${IMAGE}:${VERSION}-arm64" --arch arm64
          docker manifest push "${IMAGE}:${VERSION}"
      - name: Inspect published manifest
        run: docker manifest inspect "${IMAGE}:${VERSION}"
      - name: Resolve immutable manifest digest
        id: digest
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<<"${manifest}")"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

  release:
    needs: manifest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/ivekit-oci-release-gate.yml
    with:
      image: ghcr.io/songgoldenwind-crypto/opc-rustpbx
      digest: ${{ needs.manifest.outputs.digest }}
