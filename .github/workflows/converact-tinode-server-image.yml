name: Converact Fabric Tinode Server image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/converact-tinode-server-image.yml'
      - '.github/workflows/converact-oci-release-gate.yml'
      - 'infra/converact/tinode/**'
      - 'integrations/component-hook-go/**'
      - 'integrations/tinode-v0.25.3/**'
      - 'test/converact-tinode-owner-patch.test.ts'
      - 'test/converact-image-supply-chain.test.ts'

permissions:
  contents: read
  packages: write

concurrency:
  group: converact-tinode-server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/songgoldenwind-crypto/converact-tinode-server
  VERSION: v0.25.3-ivekit.3-22a7c18e
  TINODE_COMMIT: 22a7c18e9cd695e9a061bf1b8c84175196ef5a15
  TINODE_TAG: v0.25.3
  CONVERACT_FABRIC_TINODE_BUILDER_IMAGE: ${{ vars.CONVERACT_FABRIC_TINODE_BUILDER_IMAGE }}
  CONVERACT_FABRIC_TINODE_RUNTIME_IMAGE: ${{ vars.CONVERACT_FABRIC_TINODE_RUNTIME_IMAGE }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DOCKER_CONFIG: /tmp/converact-docker-config
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out Converact Fabric overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: converact-platform
          persist-credentials: false

      - name: Check out exact Tinode source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: tinode/chat
          ref: 22a7c18e9cd695e9a061bf1b8c84175196ef5a15
          path: upstream
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact source and immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "${TINODE_COMMIT}"
          test "$(git -C upstream describe --tags --exact-match HEAD)" = "${TINODE_TAG}"
          for name in CONVERACT_FABRIC_TINODE_BUILDER_IMAGE CONVERACT_FABRIC_TINODE_RUNTIME_IMAGE; do
            value="${!name:-}"
            [[ "${value}" =~ @sha256:[a-f0-9]{64}$ ]] || {
              printf '%s must be an immutable digest reference\n' "${name}" >&2
              exit 1
            }
          done

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Authenticate to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build, verify and push both architectures
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            export TINODE_SOURCE_DIR="${GITHUB_WORKSPACE}/upstream"
            export CONVERACT_FABRIC_TINODE_TARGETARCH="${arch}"
            export CONVERACT_FABRIC_TINODE_IMAGE="${IMAGE}:${VERSION}-${arch}"
            bash converact-platform/infra/converact/tinode/build-converact.sh
            docker push "${CONVERACT_FABRIC_TINODE_IMAGE}"
          done

      - name: Publish multi-architecture manifest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

  release:
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/converact-oci-release-gate.yml
    with:
      image: ghcr.io/songgoldenwind-crypto/converact-tinode-server
      digest: ${{ needs.publish.outputs.digest }}
