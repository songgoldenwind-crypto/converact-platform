name: Platform Nightly CI

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Mainline guardrails
        run: npm run check:mainline

      - name: Typecheck
        run: npm run typecheck

      - name: Prospect outreach suite
        run: npm run test:prospect-outreach

      - name: Full platform test suite
        run: npm test
