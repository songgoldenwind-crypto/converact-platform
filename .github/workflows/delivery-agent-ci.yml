name: Delivery Agent CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  prospect-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Mainline guardrails
        run: npm run check:mainline

      - name: Typecheck
        run: npm run typecheck

      - name: Prospect outreach CI suite (G1-G6 + §8 + gate)
        run: npm run test:prospect-outreach
