name: iveKit LiveKit Ingress image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/ivekit-livekit-ingress-image.yml'
      - '.github/workflows/ivekit-oci-release-gate.yml'
      - 'infra/ivekit/livekit-ingress/**'
      - 'test/ivekit-livekit-ingress-foundation.test.ts'
      - 'test/ivekit-image-supply-chain.test.ts'

permissions:
  contents: read
  packages: write

concurrency:
  group: ivekit-livekit-ingress-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/songgoldenwind-crypto/opc-ivekit-livekit-ingress
  VERSION: v1.5.0-ivekit.1-363f6090
  LIVEKIT_INGRESS_COMMIT: 363f6090d572db8eef5b60c273c0970826fb7ca6
  LIVEKIT_INGRESS_TAG: v1.5.0
  IVEKIT_LIVEKIT_INGRESS_BUILDER_IMAGE: ${{ vars.IVEKIT_LIVEKIT_INGRESS_BUILDER_IMAGE }}
  IVEKIT_LIVEKIT_INGRESS_RUNTIME_IMAGE: ${{ vars.IVEKIT_LIVEKIT_INGRESS_RUNTIME_IMAGE }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DOCKER_CONFIG: /tmp/ivekit-docker-config
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out iveKit build contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: opc
          persist-credentials: false

      - name: Check out exact LiveKit Ingress source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: livekit/ingress
          ref: 363f6090d572db8eef5b60c273c0970826fb7ca6
          path: upstream
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact source and immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "${LIVEKIT_INGRESS_COMMIT}"
          test "$(git -C upstream describe --tags --exact-match HEAD)" = "${LIVEKIT_INGRESS_TAG}"
          for name in IVEKIT_LIVEKIT_INGRESS_BUILDER_IMAGE IVEKIT_LIVEKIT_INGRESS_RUNTIME_IMAGE; do
            value="${!name:-}"
            [[ "${value}" =~ @sha256:[a-f0-9]{64}$ ]] || {
              printf '%s must be an immutable digest reference\n' "${name}" >&2
              exit 1
            }
          done

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Authenticate to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build, verify and push both architectures
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            export LIVEKIT_INGRESS_SOURCE_DIR="${GITHUB_WORKSPACE}/upstream"
            export IVEKIT_LIVEKIT_INGRESS_TARGETARCH="${arch}"
            export IVEKIT_LIVEKIT_INGRESS_IMAGE="${IMAGE}:${VERSION}-${arch}"
            bash opc/infra/ivekit/livekit-ingress/build.sh
            docker push "${IVEKIT_LIVEKIT_INGRESS_IMAGE}"
          done

      - name: Publish multi-architecture manifest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

  release:
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/ivekit-oci-release-gate.yml
    with:
      image: ghcr.io/songgoldenwind-crypto/opc-ivekit-livekit-ingress
      digest: ${{ needs.publish.outputs.digest }}
