name: iveKit Component Hooks

on:
  push:
    paths:
      - "integrations/component-hook-go/**"
      - "integrations/livekit-v1.13.4/**"
      - "integrations/tinode-v0.25.3/**"
      - "integrations/component-hook-rs/**"
      - "infra/ivekit/livekit/**"
      - "infra/ivekit/tinode/**"
      - "infra/ivekit/rustdesk-server/**"
      - "src/agent-runtime/ivekit/placement/rustdesk-owner-binding.ts"
      - "scripts/ivekit-rustdesk-owner-binding.ts"
      - "config/branding/**"
      - "scripts/converact-name-inventory.ts"
      - "scripts/verify-converact-naming.ts"
      - "test/converact-name-inventory.test.ts"
      - "test/converact-naming-policy.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ivekit-component-hooks-ci.yml"
  pull_request:
    paths:
      - "integrations/component-hook-go/**"
      - "integrations/livekit-v1.13.4/**"
      - "integrations/tinode-v0.25.3/**"
      - "integrations/component-hook-rs/**"
      - "infra/ivekit/livekit/**"
      - "infra/ivekit/tinode/**"
      - "infra/ivekit/rustdesk-server/**"
      - "src/agent-runtime/ivekit/placement/rustdesk-owner-binding.ts"
      - "scripts/ivekit-rustdesk-owner-binding.ts"
      - "config/branding/**"
      - "scripts/converact-name-inventory.ts"
      - "scripts/verify-converact-naming.ts"
      - "test/converact-name-inventory.test.ts"
      - "test/converact-naming-policy.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ivekit-component-hooks-ci.yml"

permissions:
  contents: read

jobs:
  naming-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          node --import tsx --test
          test/converact-name-inventory.test.ts
          test/converact-naming-policy.test.ts
      - run: npm run verify:converact-naming

  go-hook:
    needs: naming-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/component-hook-go/go.mod
      - run: go test ./...
        working-directory: integrations/component-hook-go

  livekit-owner:
    needs: naming-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/livekit-v1.13.4/go.mod
      - run: go test ./...
        working-directory: integrations/livekit-v1.13.4

  tinode-owner:
    needs: naming-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/tinode-v0.25.3/go.mod
      - run: go test ./...
        working-directory: integrations/tinode-v0.25.3

  rust-hook:
    needs: naming-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
        working-directory: integrations/component-hook-rs

  rustdesk-owner-boundary:
    needs: naming-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          node --import tsx --test
          test/ivekit-rustdesk-server-owner-patch.test.ts
          test/ivekit-rustdesk-owner-binding.test.ts
