name: iveKit Stage 2 CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/ivekit-stage2-ci.yml'
      - 'infra/**'
      - 'services/ivekit-service/**'
      - 'scripts/ivekit-delivery-bundle.ts'
      - 'scripts/verify-component-governance.ts'
      - 'scripts/lib/component-governance.ts'
      - 'docs/architecture/component-authority-matrix-v1.json'
      - 'docs/architecture/communication-technology-baseline-v1.json'
      - 'docs/ivekit-component-governance.md'
      - 'services/ivekit-service/helm/ivekit/profiles/**'
      - 'scripts/ivekit-release-operations.ts'
      - 'scripts/ivekit-stage2-release-evidence.ts'
      - 'scripts/livekit-deployment-preflight.ts'
      - 'scripts/verify-ivekit-stage2-deployment.sh'
      - 'test/ivekit-delivery-bundle.test.ts'
      - 'test/component-governance.test.ts'
      - 'test/ivekit-release-operations.test.ts'
      - 'test/ivekit-stage2-deployment-gate.test.ts'
      - 'test/ivekit-stage2-release-evidence.test.ts'
      - 'test/livekit-deployment-preflight.test.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/ivekit-stage2-ci.yml'
      - 'infra/**'
      - 'services/ivekit-service/**'
      - 'scripts/ivekit-delivery-bundle.ts'
      - 'scripts/verify-component-governance.ts'
      - 'scripts/lib/component-governance.ts'
      - 'docs/architecture/component-authority-matrix-v1.json'
      - 'docs/architecture/communication-technology-baseline-v1.json'
      - 'docs/ivekit-component-governance.md'
      - 'services/ivekit-service/helm/ivekit/profiles/**'
      - 'scripts/ivekit-release-operations.ts'
      - 'scripts/ivekit-stage2-release-evidence.ts'
      - 'scripts/livekit-deployment-preflight.ts'
      - 'scripts/verify-ivekit-stage2-deployment.sh'
      - 'test/ivekit-delivery-bundle.test.ts'
      - 'test/component-governance.test.ts'
      - 'test/ivekit-release-operations.test.ts'
      - 'test/ivekit-stage2-deployment-gate.test.ts'
      - 'test/ivekit-stage2-release-evidence.test.ts'
      - 'test/livekit-deployment-preflight.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.4

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Compose and Helm deployment contracts
        run: npm run verify:ivekit:stage2-deployment

      - name: Verify component authority and deployment profiles
        run: npm run verify:component-governance

      - name: Verify communication technology baseline
        run: npm run verify:technology-baseline

      - name: Verify release evidence and delivery bundle
        run: npm run test:ivekit:delivery
