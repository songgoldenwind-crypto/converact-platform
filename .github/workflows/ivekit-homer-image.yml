name: iveKit HOMER image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/ivekit-homer-image.yml'
      - '.github/workflows/ivekit-oci-release-gate.yml'
      - 'infra/converact/homer/**'
      - 'test/ivekit-homer-postgres-catalog.test.ts'
      - 'test/ivekit-image-supply-chain.test.ts'

permissions:
  contents: read
  packages: write

concurrency:
  group: ivekit-homer-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/songgoldenwind-crypto/opc-homer
  VERSION: 11.0.297-ivekit.2-ac4e1ae7
  HOMER_UPSTREAM_REPOSITORY: https://github.com/sipcapture/homer.git
  HOMER_UPSTREAM_TAG: 11.0.297
  HOMER_UPSTREAM_COMMIT: ac4e1ae7f63660a655a5ef42e6607ab4cefc1c6b
  HOMER_BUILDER_IMAGE: ${{ vars.IVEKIT_HOMER_BUILDER_IMAGE }}
  HOMER_NODE_IMAGE: ${{ vars.IVEKIT_HOMER_NODE_IMAGE }}
  HOMER_RUNTIME_IMAGE: ${{ vars.IVEKIT_HOMER_RUNTIME_IMAGE }}
  HOMER_TARGETARCH: amd64

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/ivekit-docker-config
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out iveKit build overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          for image in "${HOMER_BUILDER_IMAGE}" "${HOMER_NODE_IMAGE}" "${HOMER_RUNTIME_IMAGE}"; do
            if [[ ! "${image}" =~ @sha256:[a-f0-9]{64}$ ]]; then
              printf 'HOMER base image must be configured as an immutable digest: %s\n' "${image}" >&2
              exit 1
            fi
          done

      - name: Fetch exact HOMER source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/homer-source"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin "${HOMER_UPSTREAM_REPOSITORY}"
          git -C "${source_dir}" fetch --depth=1 origin "refs/tags/${HOMER_UPSTREAM_TAG}:refs/tags/${HOMER_UPSTREAM_TAG}"
          git -C "${source_dir}" checkout --detach "${HOMER_UPSTREAM_TAG}"
          test "$(git -C "${source_dir}" rev-parse HEAD)" = "${HOMER_UPSTREAM_COMMIT}"
          printf 'source_dir=%s\n' "${source_dir}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GHCR
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "${DOCKER_CONFIG}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build exact HOMER fork
        shell: bash
        env:
          HOMER_SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          IVEKIT_HOMER_IMAGE: ${{ env.IMAGE }}:${{ env.VERSION }}
        run: bash infra/converact/homer/build.sh

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"

      - name: Resolve immutable manifest digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<<"${manifest}")"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

  release:
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/ivekit-oci-release-gate.yml
    with:
      image: ghcr.io/songgoldenwind-crypto/opc-homer
      digest: ${{ needs.publish.outputs.digest }}
