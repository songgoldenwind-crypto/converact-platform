name: Converact Fabric Capacity Contracts

on:
  push:
    paths:
      - ".github/workflows/converact-capacity-ci.yml"
      - "docs/capacity/**"
      - "infra/capacity/**"
      - "infra/converact/livekit/**"
      - "infra/converact/rustdesk-server/**"
      - "infra/converact/rustpbx/**"
      - "infra/converact/tinode/**"
      - "integrations/component-hook-go/**"
      - "integrations/component-hook-rs/**"
      - "integrations/livekit-v1.13.4/**"
      - "integrations/tinode-v0.25.3/**"
      - "scripts/capacity/**"
      - "scripts/converact-capacity*.ts"
      - "scripts/converact-cell-*.ts"
      - "scripts/converact-component-node-admission.ts"
      - "scripts/converact-rustdesk-owner-binding.ts"
      - "src/agent-runtime/converact/placement/**"
      - "src/agent-runtime/collaboration/collaboration-http.ts"
      - "src/agent-runtime/converact/media-http.ts"
      - "src/agent-runtime/converact/voice/**"
      - "src/agent-runtime/livekit/**"
      - "src/converact-component-node-admission.ts"
      - "src/converact-placement-snapshot-projector.ts"
      - "src/converact-rustpbx-route-snapshot.ts"
      - "src/migrations/077_ivekit_capacity_orchestrator.sql"
      - "src/migrations/078_ivekit_cell_leases.sql"
      - "src/migrations/080_ivekit_interaction_placements.sql"
      - "src/migrations/082_ivekit_capacity_worker_checkpoints.sql"
      - "src/migrations/083_ivekit_cell_admission_reservations.sql"
      - "src/migrations/084_ivekit_cell_lease_topology.sql"
      - "test/converact-capacity-*.test.ts"
      - "test/converact-cell-*.test.ts"
      - "test/converact-component-*.test.ts"
      - "test/converact-*-placement*.test.ts"
      - "test/converact-livekit-owner-patch.test.ts"
      - "test/converact-rustdesk-*.test.ts"
      - "test/converact-rustpbx-*.test.ts"
      - "test/converact-tinode-owner-patch.test.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/converact-capacity-ci.yml"
      - "docs/capacity/**"
      - "infra/capacity/**"
      - "infra/converact/livekit/**"
      - "infra/converact/rustdesk-server/**"
      - "infra/converact/rustpbx/**"
      - "infra/converact/tinode/**"
      - "integrations/component-hook-go/**"
      - "integrations/component-hook-rs/**"
      - "integrations/livekit-v1.13.4/**"
      - "integrations/tinode-v0.25.3/**"
      - "scripts/capacity/**"
      - "scripts/converact-capacity*.ts"
      - "scripts/converact-cell-*.ts"
      - "scripts/converact-component-node-admission.ts"
      - "scripts/converact-rustdesk-owner-binding.ts"
      - "src/agent-runtime/converact/placement/**"
      - "src/agent-runtime/collaboration/collaboration-http.ts"
      - "src/agent-runtime/converact/media-http.ts"
      - "src/agent-runtime/converact/voice/**"
      - "src/agent-runtime/livekit/**"
      - "src/converact-component-node-admission.ts"
      - "src/converact-placement-snapshot-projector.ts"
      - "src/converact-rustpbx-route-snapshot.ts"
      - "src/migrations/077_ivekit_capacity_orchestrator.sql"
      - "src/migrations/078_ivekit_cell_leases.sql"
      - "src/migrations/080_ivekit_interaction_placements.sql"
      - "src/migrations/082_ivekit_capacity_worker_checkpoints.sql"
      - "src/migrations/083_ivekit_cell_admission_reservations.sql"
      - "src/migrations/084_ivekit_cell_lease_topology.sql"
      - "test/converact-capacity-*.test.ts"
      - "test/converact-cell-*.test.ts"
      - "test/converact-component-*.test.ts"
      - "test/converact-*-placement*.test.ts"
      - "test/converact-livekit-owner-patch.test.ts"
      - "test/converact-rustdesk-*.test.ts"
      - "test/converact-rustpbx-*.test.ts"
      - "test/converact-tinode-owner-patch.test.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:converact:capacity-runtime
      - run: npm run test:converact:capacity
      - run: npm run test:converact:capacity:loopback
      - run: >-
          COMPOSE_DISABLE_ENV_FILE=1 docker compose
          --env-file infra/capacity/env.example
          -f infra/capacity/docker-compose.yml
          config --quiet
      - run: jq empty docs/capacity/*.json docs/capacity/forks/*.json
