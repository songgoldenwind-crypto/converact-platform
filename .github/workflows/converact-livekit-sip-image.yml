name: Converact Fabric LiveKit SIP image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/converact-livekit-sip-image.yml'
      - '.github/workflows/converact-oci-release-gate.yml'
      - 'infra/converact/livekit-sip/**'
      - 'test/converact-capacity-fork-status.test.ts'

permissions:
  contents: read
  packages: write

concurrency:
  group: converact-livekit-sip-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/songgoldenwind-crypto/converact-livekit-sip
  VERSION: v1.7.0-d5d1e09b
  LIVEKIT_SIP_UPSTREAM_REPOSITORY: https://github.com/livekit/sip.git
  LIVEKIT_SIP_UPSTREAM_TAG: v1.7.0
  LIVEKIT_SIP_UPSTREAM_COMMIT: d5d1e09bbe826baaae9c335d8f42523192c7ce29
  LIVEKIT_SIP_BUILDER_IMAGE: ${{ vars.CONVERACT_FABRIC_LIVEKIT_SIP_BUILDER_IMAGE }}
  LIVEKIT_SIP_RUNTIME_IMAGE: ${{ vars.CONVERACT_FABRIC_LIVEKIT_SIP_RUNTIME_IMAGE }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_CONFIG: /tmp/converact-docker-config
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out Converact Fabric build contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          for image in "${LIVEKIT_SIP_BUILDER_IMAGE}" "${LIVEKIT_SIP_RUNTIME_IMAGE}"; do
            if [[ ! "${image}" =~ @sha256:[a-f0-9]{64}$ ]]; then
              printf 'LiveKit SIP base image must be configured by immutable digest: %s\n' "${image}" >&2
              exit 1
            fi
          done

      - name: Fetch exact LiveKit SIP source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/livekit-sip-source"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin "${LIVEKIT_SIP_UPSTREAM_REPOSITORY}"
          git -C "${source_dir}" fetch --depth=1 origin "refs/tags/${LIVEKIT_SIP_UPSTREAM_TAG}:refs/tags/${LIVEKIT_SIP_UPSTREAM_TAG}"
          git -C "${source_dir}" checkout --detach "${LIVEKIT_SIP_UPSTREAM_TAG}"
          test "$(git -C "${source_dir}" rev-parse HEAD)" = "${LIVEKIT_SIP_UPSTREAM_COMMIT}"
          printf 'source_dir=%s\n' "${source_dir}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GHCR
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "${DOCKER_CONFIG}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and verify exact source image
        shell: bash
        env:
          LIVEKIT_SIP_SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          CONVERACT_FABRIC_LIVEKIT_SIP_IMAGE: ${{ env.IMAGE }}:${{ env.VERSION }}
        run: bash infra/converact/livekit-sip/build.sh

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"

      - name: Resolve immutable manifest digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<<"${manifest}")"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

  release:
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/converact-oci-release-gate.yml
    with:
      image: ghcr.io/songgoldenwind-crypto/converact-livekit-sip
      digest: ${{ needs.publish.outputs.digest }}
