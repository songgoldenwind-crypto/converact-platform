services:
  capacity-nats:
    image: ${OPC_IVEKIT_CAPACITY_NATS_IMAGE:?OPC_IVEKIT_CAPACITY_NATS_IMAGE immutable digest reference is required}
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${OPC_CAPACITY_NATS_CLIENT_PORT:-4223}:4222"
      - "127.0.0.1:${OPC_CAPACITY_NATS_MONITOR_PORT:-8223}:8222"
    volumes:
      - capacity_nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  capacity-dispatcher:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    environment:
      OPC_DATABASE_URL: ${OPC_DATABASE_URL:?set OPC_DATABASE_URL}
      NATS_URL: nats://capacity-nats:4222
      OPC_IVEKIT_CAPACITY_DISPATCHER_ID: ${OPC_IVEKIT_CAPACITY_DISPATCHER_ID:-capacity-dispatcher-local}
      OPC_IVEKIT_CAPACITY_DISPATCH_INTERVAL_MS: ${OPC_IVEKIT_CAPACITY_DISPATCH_INTERVAL_MS:-250}
      OPC_IVEKIT_CAPACITY_DISPATCH_LEASE_MS: ${OPC_IVEKIT_CAPACITY_DISPATCH_LEASE_MS:-10000}
      OPC_IVEKIT_CAPACITY_DISPATCH_BATCH_SIZE: ${OPC_IVEKIT_CAPACITY_DISPATCH_BATCH_SIZE:-100}
    depends_on:
      capacity-nats:
        condition: service_healthy
    restart: unless-stopped

  capacity-controller:
    profiles: ["controller"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/ivekit-capacity-controller.ts"]
    environment:
      OPC_DATABASE_URL: ${OPC_DATABASE_URL:?set OPC_DATABASE_URL}
      OPC_IVEKIT_CAPACITY_CONTROLLER_ID: ${OPC_IVEKIT_CAPACITY_CONTROLLER_ID:-capacity-controller-local}
      OPC_IVEKIT_CAPACITY_MANIFEST_PATH: /run/ivekit-capacity/manifest.json
      OPC_IVEKIT_CAPACITY_CONTROLLER_LEASE_MS: ${OPC_IVEKIT_CAPACITY_CONTROLLER_LEASE_MS:-15000}
      OPC_IVEKIT_CAPACITY_CONTROLLER_POLL_INTERVAL_MS: ${OPC_IVEKIT_CAPACITY_CONTROLLER_POLL_INTERVAL_MS:-500}
    volumes:
      - ${OPC_IVEKIT_CAPACITY_MANIFEST_HOST_PATH:?set OPC_IVEKIT_CAPACITY_MANIFEST_HOST_PATH}:/run/ivekit-capacity/manifest.json:ro
    restart: unless-stopped

  capacity-finalizer:
    profiles: ["finalizer"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/ivekit-capacity-finalizer.ts"]
    environment:
      OPC_DATABASE_URL: ${OPC_DATABASE_URL:?set OPC_DATABASE_URL}
      OPC_IVEKIT_CAPACITY_FINALIZER_ID: ${OPC_IVEKIT_CAPACITY_FINALIZER_ID:-capacity-finalizer-local}
      OPC_IVEKIT_CAPACITY_MANIFEST_PATH: /run/ivekit-capacity/manifest.json
      OPC_IVEKIT_CAPACITY_EVIDENCE_SUBMISSION_PATH: /run/ivekit-capacity/evidence-submission.json
      OPC_IVEKIT_CAPACITY_FINALIZER_LEASE_MS: ${OPC_IVEKIT_CAPACITY_FINALIZER_LEASE_MS:-15000}
      OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX: ${OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX:?set OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET:?set OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION:?set OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ENDPOINT: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ENDPOINT:-}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE:-false}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID:-}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${OPC_IVEKIT_CAPACITY_MANIFEST_HOST_PATH:?set OPC_IVEKIT_CAPACITY_MANIFEST_HOST_PATH}:/run/ivekit-capacity/manifest.json:ro
      - ${OPC_IVEKIT_CAPACITY_EVIDENCE_SUBMISSION_HOST_PATH:?set OPC_IVEKIT_CAPACITY_EVIDENCE_SUBMISSION_HOST_PATH}:/run/ivekit-capacity/evidence-submission.json:ro

  capacity-worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/ivekit-capacity-worker.ts"]
    environment:
      OPC_DATABASE_URL: ${OPC_DATABASE_URL:?set OPC_DATABASE_URL}
      NATS_URL: nats://capacity-nats:4222
      OPC_IVEKIT_CAPACITY_RUN_ID: ${OPC_IVEKIT_CAPACITY_RUN_ID:?set OPC_IVEKIT_CAPACITY_RUN_ID}
      OPC_IVEKIT_CAPACITY_PHASE_ID: ${OPC_IVEKIT_CAPACITY_PHASE_ID:-}
      OPC_IVEKIT_CAPACITY_FLEET_ID: ${OPC_IVEKIT_CAPACITY_FLEET_ID:?set OPC_IVEKIT_CAPACITY_FLEET_ID}
      OPC_IVEKIT_CAPACITY_WORKER_ID: ${OPC_IVEKIT_CAPACITY_WORKER_ID:-capacity-worker-local}
      OPC_IVEKIT_CAPACITY_RELEASE_ID: ${OPC_IVEKIT_CAPACITY_RELEASE_ID:?set OPC_IVEKIT_CAPACITY_RELEASE_ID}
      OPC_IVEKIT_CAPACITY_SAFE_CAPACITY: ${OPC_IVEKIT_CAPACITY_SAFE_CAPACITY:?set OPC_IVEKIT_CAPACITY_SAFE_CAPACITY}
      OPC_IVEKIT_CAPACITY_HEARTBEAT_INTERVAL_MS: ${OPC_IVEKIT_CAPACITY_HEARTBEAT_INTERVAL_MS:-5000}
      OPC_IVEKIT_CAPACITY_ASSIGNMENT_INTERVAL_MS: ${OPC_IVEKIT_CAPACITY_ASSIGNMENT_INTERVAL_MS:-500}
      OPC_IVEKIT_CAPACITY_SHARD_LEASE_MS: ${OPC_IVEKIT_CAPACITY_SHARD_LEASE_MS:-30000}
      OPC_IVEKIT_CAPACITY_ACK_WAIT_MS: ${OPC_IVEKIT_CAPACITY_ACK_WAIT_MS:-30000}
      OPC_IVEKIT_CAPACITY_RETRY_DELAY_MS: ${OPC_IVEKIT_CAPACITY_RETRY_DELAY_MS:-1000}
      OPC_IVEKIT_CAPACITY_DRIVER_SPEC_PATH: /opt/ivekit-capacity-worker/driver-spec.json
      OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX: ${OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX:?set OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET:?set OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION:?set OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ENDPOINT: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ENDPOINT:-}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE:-false}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID:-}
      OPC_IVEKIT_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY: ${OPC_IVEKIT_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY:-}
      OPC_IVEKIT_CAPACITY_WORKER_METADATA_JSON: ${OPC_IVEKIT_CAPACITY_WORKER_METADATA_JSON:-{}}
    volumes:
      - ${OPC_IVEKIT_CAPACITY_WORKER_BUNDLE_HOST_PATH:?set OPC_IVEKIT_CAPACITY_WORKER_BUNDLE_HOST_PATH}:/opt/ivekit-capacity-worker:ro
      - capacity_worker_results:/var/lib/ivekit-capacity
    depends_on:
      capacity-nats:
        condition: service_healthy
    restart: unless-stopped

  capacity-admission:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/ivekit-cell-admission.ts"]
    environment:
      OPC_DATABASE_URL: ${OPC_DATABASE_URL:?set OPC_DATABASE_URL}
      OPC_IVEKIT_CELL_ADMISSION_HOST: 0.0.0.0
      OPC_IVEKIT_CELL_ADMISSION_PORT: 3200
      OPC_IVEKIT_CELL_ADMISSION_TOKEN: ${OPC_IVEKIT_CELL_ADMISSION_TOKEN:?set OPC_IVEKIT_CELL_ADMISSION_TOKEN}
      OPC_IVEKIT_CELL_REGION_ID: ${OPC_IVEKIT_CELL_REGION_ID:?set OPC_IVEKIT_CELL_REGION_ID}
      OPC_IVEKIT_CELL_ZONE_ID: ${OPC_IVEKIT_CELL_ZONE_ID:?set OPC_IVEKIT_CELL_ZONE_ID}
      OPC_IVEKIT_CELL_ID: ${OPC_IVEKIT_CELL_ID:?set OPC_IVEKIT_CELL_ID}
      OPC_IVEKIT_CELL_INSTANCE_ID: ${OPC_IVEKIT_CELL_INSTANCE_ID:-capacity-admission-local}
      OPC_IVEKIT_CELL_LEASE_TTL_MS: ${OPC_IVEKIT_CELL_LEASE_TTL_MS:-30000}
      OPC_IVEKIT_CELL_LEASE_CLAIM_RETRY_MS: ${OPC_IVEKIT_CELL_LEASE_CLAIM_RETRY_MS:-1000}
      OPC_IVEKIT_CELL_PROFILE_IDS: ${OPC_IVEKIT_CELL_PROFILE_IDS:?set OPC_IVEKIT_CELL_PROFILE_IDS}
      OPC_IVEKIT_CELL_INTERACTION_KINDS: ${OPC_IVEKIT_CELL_INTERACTION_KINDS:?set OPC_IVEKIT_CELL_INTERACTION_KINDS}
      OPC_IVEKIT_CELL_RESERVATION_TTL_MS: ${OPC_IVEKIT_CELL_RESERVATION_TTL_MS:-10000}
      OPC_IVEKIT_CELL_TERMINAL_RETENTION_MS: ${OPC_IVEKIT_CELL_TERMINAL_RETENTION_MS:-300000}
      OPC_IVEKIT_CELL_SWEEP_INTERVAL_MS: ${OPC_IVEKIT_CELL_SWEEP_INTERVAL_MS:-1000}
      OPC_IVEKIT_CELL_INITIAL_STATE: ${OPC_IVEKIT_CELL_INITIAL_STATE:-accepting}
      OPC_IVEKIT_CELL_DIMENSIONS_JSON: ${OPC_IVEKIT_CELL_DIMENSIONS_JSON:?set OPC_IVEKIT_CELL_DIMENSIONS_JSON}
      OPC_IVEKIT_CELL_NODES_JSON: ${OPC_IVEKIT_CELL_NODES_JSON:-}
      OPC_IVEKIT_CELL_NODE_POOLS_JSON: ${OPC_IVEKIT_CELL_NODE_POOLS_JSON:-}
      OPC_IVEKIT_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:-}
      OPC_IVEKIT_COMPONENT_NODE_LEASE_TTL_MS: ${OPC_IVEKIT_COMPONENT_NODE_LEASE_TTL_MS:-10000}
      OPC_IVEKIT_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS: ${OPC_IVEKIT_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS:-3000}
      OPC_IVEKIT_COMPONENT_NODE_TIMEOUT_MS: ${OPC_IVEKIT_COMPONENT_NODE_TIMEOUT_MS:-2000}
    ports:
      - "127.0.0.1:${OPC_IVEKIT_CELL_ADMISSION_PORT:-3200}:3200"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3200/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  capacity-projector:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/ivekit-cell-capacity-projector.ts"]
    environment:
      OPC_IVEKIT_CELL_ADMISSION_ENDPOINT: http://capacity-admission:3200
      OPC_IVEKIT_CELL_ADMISSION_TOKEN: ${OPC_IVEKIT_CELL_ADMISSION_TOKEN:?set OPC_IVEKIT_CELL_ADMISSION_TOKEN}
      OPC_IVEKIT_CELL_REGION_ID: ${OPC_IVEKIT_CELL_REGION_ID:?set OPC_IVEKIT_CELL_REGION_ID}
      OPC_IVEKIT_CELL_ZONE_ID: ${OPC_IVEKIT_CELL_ZONE_ID:?set OPC_IVEKIT_CELL_ZONE_ID}
      OPC_IVEKIT_CELL_ID: ${OPC_IVEKIT_CELL_ID:?set OPC_IVEKIT_CELL_ID}
      OPC_IVEKIT_CELL_CAPACITY_PROFILE_ID: ${OPC_IVEKIT_CELL_CAPACITY_PROFILE_ID:?set OPC_IVEKIT_CELL_CAPACITY_PROFILE_ID}
      OPC_IVEKIT_CELL_CAPACITY_PROFILE_SHA256: ${OPC_IVEKIT_CELL_CAPACITY_PROFILE_SHA256:?set OPC_IVEKIT_CELL_CAPACITY_PROFILE_SHA256}
      OPC_IVEKIT_CELL_PROBE_INTERVAL_MS: ${OPC_IVEKIT_CELL_PROBE_INTERVAL_MS:-2000}
      OPC_IVEKIT_CELL_OBSERVATION_TTL_MS: ${OPC_IVEKIT_CELL_OBSERVATION_TTL_MS:-10000}
      OPC_IVEKIT_CELL_DIMENSIONS_JSON: ${OPC_IVEKIT_CELL_DIMENSIONS_JSON:?set OPC_IVEKIT_CELL_DIMENSIONS_JSON}
      OPC_IVEKIT_CELL_NODES_JSON: ${OPC_IVEKIT_CELL_NODES_JSON:-}
      OPC_IVEKIT_CELL_NODE_POOLS_JSON: ${OPC_IVEKIT_CELL_NODE_POOLS_JSON:-}
      OPC_IVEKIT_CELL_PROBES_JSON: ${OPC_IVEKIT_CELL_PROBES_JSON:?set OPC_IVEKIT_CELL_PROBES_JSON}
    depends_on:
      capacity-admission:
        condition: service_started
    restart: unless-stopped

  component-node-admission:
    profiles: ["component-node"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/ivekit-component-node-admission.ts"]
    environment:
      OPC_IVEKIT_COMPONENT_NODE_HOST: 0.0.0.0
      OPC_IVEKIT_COMPONENT_NODE_PORT: 3210
      OPC_IVEKIT_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:?set OPC_IVEKIT_COMPONENT_NODE_TOKEN}
      OPC_IVEKIT_COMPONENT_NODE_COMPONENT: ${OPC_IVEKIT_COMPONENT_NODE_COMPONENT:?set OPC_IVEKIT_COMPONENT_NODE_COMPONENT}
      OPC_IVEKIT_COMPONENT_NODE_REGION_ID: ${OPC_IVEKIT_CELL_REGION_ID:?set OPC_IVEKIT_CELL_REGION_ID}
      OPC_IVEKIT_COMPONENT_NODE_ZONE_ID: ${OPC_IVEKIT_CELL_ZONE_ID:?set OPC_IVEKIT_CELL_ZONE_ID}
      OPC_IVEKIT_COMPONENT_NODE_CELL_ID: ${OPC_IVEKIT_CELL_ID:?set OPC_IVEKIT_CELL_ID}
      OPC_IVEKIT_COMPONENT_NODE_ID: ${OPC_IVEKIT_COMPONENT_NODE_ID:?set OPC_IVEKIT_COMPONENT_NODE_ID}
      OPC_IVEKIT_COMPONENT_NODE_PROFILE_IDS: ${OPC_IVEKIT_CELL_PROFILE_IDS:?set OPC_IVEKIT_CELL_PROFILE_IDS}
      OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS: ${OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS:?set OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS}
      OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON: ${OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON:?set OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON}
      OPC_IVEKIT_COMPONENT_NODE_TERMINAL_RETENTION_MS: ${OPC_IVEKIT_COMPONENT_NODE_TERMINAL_RETENTION_MS:-300000}
      OPC_IVEKIT_COMPONENT_NODE_SWEEP_INTERVAL_MS: ${OPC_IVEKIT_COMPONENT_NODE_SWEEP_INTERVAL_MS:-1000}
    ports:
      - "127.0.0.1:${OPC_IVEKIT_COMPONENT_NODE_PORT:-3210}:3210"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/livez').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  placement-snapshot-projector:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command:
      - node
      - --import
      - tsx
      - src/ivekit-placement-snapshot-projector.ts
    environment:
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_FILE: /run/ivekit-placement/placement.json
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON: ${OPC_IVEKIT_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON:?set OPC_IVEKIT_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON}
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_KEY_ID: ${OPC_IVEKIT_PLACEMENT_SNAPSHOT_KEY_ID:?set OPC_IVEKIT_PLACEMENT_SNAPSHOT_KEY_ID}
      OPC_IVEKIT_PLACEMENT_PROFILE_ID: ${OPC_IVEKIT_PLACEMENT_PROFILE_ID:?set OPC_IVEKIT_PLACEMENT_PROFILE_ID}
      OPC_IVEKIT_PLACEMENT_TOPOLOGY_JSON: ${OPC_IVEKIT_PLACEMENT_TOPOLOGY_JSON:?set OPC_IVEKIT_PLACEMENT_TOPOLOGY_JSON}
      OPC_IVEKIT_CELL_ADMISSION_TOKEN: ${OPC_IVEKIT_CELL_ADMISSION_TOKEN:?set OPC_IVEKIT_CELL_ADMISSION_TOKEN}
      OPC_IVEKIT_PLACEMENT_PROJECTOR_INTERVAL_MS: ${OPC_IVEKIT_PLACEMENT_PROJECTOR_INTERVAL_MS:-2000}
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_TTL_MS: ${OPC_IVEKIT_PLACEMENT_SNAPSHOT_TTL_MS:-10000}
      OPC_IVEKIT_PLACEMENT_PROJECTOR_TIMEOUT_MS: ${OPC_IVEKIT_PLACEMENT_PROJECTOR_TIMEOUT_MS:-2000}
    volumes:
      - placement_snapshot:/run/ivekit-placement
    depends_on:
      capacity-admission:
        condition: service_healthy
      capacity-projector:
        condition: service_started
    restart: unless-stopped

volumes:
  capacity_nats_data:
  capacity_worker_results:
  placement_snapshot:
