services:
  capacity-nats:
    image: ${CONVERACT_FABRIC_CAPACITY_NATS_IMAGE:?CONVERACT_FABRIC_CAPACITY_NATS_IMAGE immutable digest reference is required}
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_CLIENT_USER: ${CONVERACT_FABRIC_CAPACITY_NATS_USER:?set CONVERACT_FABRIC_CAPACITY_NATS_USER}
      NATS_CLIENT_PASSWORD: ${CONVERACT_FABRIC_CAPACITY_NATS_PASSWORD:?set CONVERACT_FABRIC_CAPACITY_NATS_PASSWORD}
    ports:
      - "127.0.0.1:${CONVERACT_CAPACITY_NATS_CLIENT_PORT:-4223}:4222"
      - "127.0.0.1:${CONVERACT_CAPACITY_NATS_MONITOR_PORT:-8223}:8222"
    volumes:
      - ../config/nats.conf:/etc/nats/nats.conf:ro
      - capacity_nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  capacity-dispatcher:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    environment:
      CONVERACT_DATABASE_URL: ${CONVERACT_DATABASE_URL:?set CONVERACT_DATABASE_URL}
      NATS_URL: nats://capacity-nats:4222
      NATS_USER: ${CONVERACT_FABRIC_CAPACITY_NATS_USER:?set CONVERACT_FABRIC_CAPACITY_NATS_USER}
      NATS_PASSWORD: ${CONVERACT_FABRIC_CAPACITY_NATS_PASSWORD:?set CONVERACT_FABRIC_CAPACITY_NATS_PASSWORD}
      NATS_TLS_MODE: disabled
      CONVERACT_FABRIC_CAPACITY_NATS_STREAM_REPLICAS: "1"
      CONVERACT_FABRIC_CAPACITY_DISPATCHER_ID: ${CONVERACT_FABRIC_CAPACITY_DISPATCHER_ID:-capacity-dispatcher-local}
      CONVERACT_FABRIC_CAPACITY_DISPATCH_INTERVAL_MS: ${CONVERACT_FABRIC_CAPACITY_DISPATCH_INTERVAL_MS:-250}
      CONVERACT_FABRIC_CAPACITY_DISPATCH_LEASE_MS: ${CONVERACT_FABRIC_CAPACITY_DISPATCH_LEASE_MS:-10000}
      CONVERACT_FABRIC_CAPACITY_DISPATCH_BATCH_SIZE: ${CONVERACT_FABRIC_CAPACITY_DISPATCH_BATCH_SIZE:-100}
    depends_on:
      capacity-nats:
        condition: service_healthy
    restart: unless-stopped

  capacity-controller:
    profiles: ["controller"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/converact-capacity-controller.ts"]
    environment:
      CONVERACT_DATABASE_URL: ${CONVERACT_DATABASE_URL:?set CONVERACT_DATABASE_URL}
      CONVERACT_FABRIC_CAPACITY_CONTROLLER_ID: ${CONVERACT_FABRIC_CAPACITY_CONTROLLER_ID:-capacity-controller-local}
      CONVERACT_FABRIC_CAPACITY_MANIFEST_PATH: /run/converact-capacity/manifest.json
      CONVERACT_FABRIC_CAPACITY_CONTROLLER_LEASE_MS: ${CONVERACT_FABRIC_CAPACITY_CONTROLLER_LEASE_MS:-15000}
      CONVERACT_FABRIC_CAPACITY_CONTROLLER_POLL_INTERVAL_MS: ${CONVERACT_FABRIC_CAPACITY_CONTROLLER_POLL_INTERVAL_MS:-500}
    volumes:
      - ${CONVERACT_FABRIC_CAPACITY_MANIFEST_HOST_PATH:?set CONVERACT_FABRIC_CAPACITY_MANIFEST_HOST_PATH}:/run/converact-capacity/manifest.json:ro
    restart: unless-stopped

  capacity-finalizer:
    profiles: ["finalizer"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/converact-capacity-finalizer.ts"]
    environment:
      CONVERACT_DATABASE_URL: ${CONVERACT_DATABASE_URL:?set CONVERACT_DATABASE_URL}
      CONVERACT_FABRIC_CAPACITY_FINALIZER_ID: ${CONVERACT_FABRIC_CAPACITY_FINALIZER_ID:-capacity-finalizer-local}
      CONVERACT_FABRIC_CAPACITY_MANIFEST_PATH: /run/converact-capacity/manifest.json
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_SUBMISSION_PATH: /run/converact-capacity/evidence-submission.json
      CONVERACT_FABRIC_CAPACITY_FINALIZER_LEASE_MS: ${CONVERACT_FABRIC_CAPACITY_FINALIZER_LEASE_MS:-15000}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ENDPOINT: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ENDPOINT:-}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE:-false}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID:-}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${CONVERACT_FABRIC_CAPACITY_MANIFEST_HOST_PATH:?set CONVERACT_FABRIC_CAPACITY_MANIFEST_HOST_PATH}:/run/converact-capacity/manifest.json:ro
      - ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_SUBMISSION_HOST_PATH:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_SUBMISSION_HOST_PATH}:/run/converact-capacity/evidence-submission.json:ro

  capacity-worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/converact-capacity-worker.ts"]
    environment:
      CONVERACT_DATABASE_URL: ${CONVERACT_DATABASE_URL:?set CONVERACT_DATABASE_URL}
      NATS_URL: nats://capacity-nats:4222
      NATS_USER: ${CONVERACT_FABRIC_CAPACITY_NATS_USER:?set CONVERACT_FABRIC_CAPACITY_NATS_USER}
      NATS_PASSWORD: ${CONVERACT_FABRIC_CAPACITY_NATS_PASSWORD:?set CONVERACT_FABRIC_CAPACITY_NATS_PASSWORD}
      NATS_TLS_MODE: disabled
      CONVERACT_FABRIC_CAPACITY_RUN_ID: ${CONVERACT_FABRIC_CAPACITY_RUN_ID:?set CONVERACT_FABRIC_CAPACITY_RUN_ID}
      CONVERACT_FABRIC_CAPACITY_PHASE_ID: ${CONVERACT_FABRIC_CAPACITY_PHASE_ID:-}
      CONVERACT_FABRIC_CAPACITY_FLEET_ID: ${CONVERACT_FABRIC_CAPACITY_FLEET_ID:?set CONVERACT_FABRIC_CAPACITY_FLEET_ID}
      CONVERACT_FABRIC_CAPACITY_WORKER_ID: ${CONVERACT_FABRIC_CAPACITY_WORKER_ID:-capacity-worker-local}
      CONVERACT_FABRIC_CAPACITY_RELEASE_ID: ${CONVERACT_FABRIC_CAPACITY_RELEASE_ID:?set CONVERACT_FABRIC_CAPACITY_RELEASE_ID}
      CONVERACT_FABRIC_CAPACITY_SAFE_CAPACITY: ${CONVERACT_FABRIC_CAPACITY_SAFE_CAPACITY:?set CONVERACT_FABRIC_CAPACITY_SAFE_CAPACITY}
      CONVERACT_FABRIC_CAPACITY_HEARTBEAT_INTERVAL_MS: ${CONVERACT_FABRIC_CAPACITY_HEARTBEAT_INTERVAL_MS:-5000}
      CONVERACT_FABRIC_CAPACITY_ASSIGNMENT_INTERVAL_MS: ${CONVERACT_FABRIC_CAPACITY_ASSIGNMENT_INTERVAL_MS:-500}
      CONVERACT_FABRIC_CAPACITY_SHARD_LEASE_MS: ${CONVERACT_FABRIC_CAPACITY_SHARD_LEASE_MS:-30000}
      CONVERACT_FABRIC_CAPACITY_ACK_WAIT_MS: ${CONVERACT_FABRIC_CAPACITY_ACK_WAIT_MS:-30000}
      CONVERACT_FABRIC_CAPACITY_RETRY_DELAY_MS: ${CONVERACT_FABRIC_CAPACITY_RETRY_DELAY_MS:-1000}
      CONVERACT_FABRIC_CAPACITY_DRIVER_SPEC_PATH: /opt/converact-capacity-worker/driver-spec.json
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION:?set CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ENDPOINT: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ENDPOINT:-}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE:-false}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID:-}
      CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY: ${CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY:-}
      CONVERACT_FABRIC_CAPACITY_WORKER_METADATA_JSON: ${CONVERACT_FABRIC_CAPACITY_WORKER_METADATA_JSON:-{}}
    volumes:
      - ${CONVERACT_FABRIC_CAPACITY_WORKER_BUNDLE_HOST_PATH:?set CONVERACT_FABRIC_CAPACITY_WORKER_BUNDLE_HOST_PATH}:/opt/converact-capacity-worker:ro
      - capacity_worker_results:/var/lib/converact-capacity
    depends_on:
      capacity-nats:
        condition: service_healthy
    restart: unless-stopped

  capacity-admission:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/converact-cell-admission.ts"]
    environment:
      CONVERACT_DATABASE_URL: ${CONVERACT_DATABASE_URL:?set CONVERACT_DATABASE_URL}
      CONVERACT_FABRIC_CELL_ADMISSION_HOST: 0.0.0.0
      CONVERACT_FABRIC_CELL_ADMISSION_PORT: 3200
      CONVERACT_FABRIC_CELL_ADMISSION_TOKEN: ${CONVERACT_FABRIC_CELL_ADMISSION_TOKEN:?set CONVERACT_FABRIC_CELL_ADMISSION_TOKEN}
      CONVERACT_FABRIC_CELL_REGION_ID: ${CONVERACT_FABRIC_CELL_REGION_ID:?set CONVERACT_FABRIC_CELL_REGION_ID}
      CONVERACT_FABRIC_CELL_ZONE_ID: ${CONVERACT_FABRIC_CELL_ZONE_ID:?set CONVERACT_FABRIC_CELL_ZONE_ID}
      CONVERACT_FABRIC_CELL_ID: ${CONVERACT_FABRIC_CELL_ID:?set CONVERACT_FABRIC_CELL_ID}
      CONVERACT_FABRIC_CELL_INSTANCE_ID: ${CONVERACT_FABRIC_CELL_INSTANCE_ID:-capacity-admission-local}
      CONVERACT_FABRIC_CELL_LEASE_TTL_MS: ${CONVERACT_FABRIC_CELL_LEASE_TTL_MS:-30000}
      CONVERACT_FABRIC_CELL_LEASE_CLAIM_RETRY_MS: ${CONVERACT_FABRIC_CELL_LEASE_CLAIM_RETRY_MS:-1000}
      CONVERACT_FABRIC_CELL_PROFILE_IDS: ${CONVERACT_FABRIC_CELL_PROFILE_IDS:?set CONVERACT_FABRIC_CELL_PROFILE_IDS}
      CONVERACT_FABRIC_CELL_INTERACTION_KINDS: ${CONVERACT_FABRIC_CELL_INTERACTION_KINDS:?set CONVERACT_FABRIC_CELL_INTERACTION_KINDS}
      CONVERACT_FABRIC_CELL_RESERVATION_TTL_MS: ${CONVERACT_FABRIC_CELL_RESERVATION_TTL_MS:-10000}
      CONVERACT_FABRIC_CELL_TERMINAL_RETENTION_MS: ${CONVERACT_FABRIC_CELL_TERMINAL_RETENTION_MS:-300000}
      CONVERACT_FABRIC_CELL_SWEEP_INTERVAL_MS: ${CONVERACT_FABRIC_CELL_SWEEP_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_CELL_INITIAL_STATE: ${CONVERACT_FABRIC_CELL_INITIAL_STATE:-accepting}
      CONVERACT_FABRIC_CELL_DIMENSIONS_JSON: ${CONVERACT_FABRIC_CELL_DIMENSIONS_JSON:?set CONVERACT_FABRIC_CELL_DIMENSIONS_JSON}
      CONVERACT_FABRIC_CELL_NODES_JSON: ${CONVERACT_FABRIC_CELL_NODES_JSON:-}
      CONVERACT_FABRIC_CELL_NODE_POOLS_JSON: ${CONVERACT_FABRIC_CELL_NODE_POOLS_JSON:-}
      CONVERACT_FABRIC_COMPONENT_NODE_TOKEN: ${CONVERACT_FABRIC_COMPONENT_NODE_TOKEN:-}
      CONVERACT_FABRIC_COMPONENT_NODE_LEASE_TTL_MS: ${CONVERACT_FABRIC_COMPONENT_NODE_LEASE_TTL_MS:-10000}
      CONVERACT_FABRIC_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS: ${CONVERACT_FABRIC_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS:-3000}
      CONVERACT_FABRIC_COMPONENT_NODE_TIMEOUT_MS: ${CONVERACT_FABRIC_COMPONENT_NODE_TIMEOUT_MS:-2000}
    ports:
      - "127.0.0.1:${CONVERACT_FABRIC_CELL_ADMISSION_PORT:-3200}:3200"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3200/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  capacity-projector:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/converact-cell-capacity-projector.ts"]
    environment:
      CONVERACT_FABRIC_CELL_ADMISSION_ENDPOINT: http://capacity-admission:3200
      CONVERACT_FABRIC_CELL_ADMISSION_TOKEN: ${CONVERACT_FABRIC_CELL_ADMISSION_TOKEN:?set CONVERACT_FABRIC_CELL_ADMISSION_TOKEN}
      CONVERACT_FABRIC_CELL_REGION_ID: ${CONVERACT_FABRIC_CELL_REGION_ID:?set CONVERACT_FABRIC_CELL_REGION_ID}
      CONVERACT_FABRIC_CELL_ZONE_ID: ${CONVERACT_FABRIC_CELL_ZONE_ID:?set CONVERACT_FABRIC_CELL_ZONE_ID}
      CONVERACT_FABRIC_CELL_ID: ${CONVERACT_FABRIC_CELL_ID:?set CONVERACT_FABRIC_CELL_ID}
      CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_ID: ${CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_ID:?set CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_ID}
      CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_SHA256: ${CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_SHA256:?set CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_SHA256}
      CONVERACT_FABRIC_CELL_PROBE_INTERVAL_MS: ${CONVERACT_FABRIC_CELL_PROBE_INTERVAL_MS:-2000}
      CONVERACT_FABRIC_CELL_OBSERVATION_TTL_MS: ${CONVERACT_FABRIC_CELL_OBSERVATION_TTL_MS:-10000}
      CONVERACT_FABRIC_CELL_DIMENSIONS_JSON: ${CONVERACT_FABRIC_CELL_DIMENSIONS_JSON:?set CONVERACT_FABRIC_CELL_DIMENSIONS_JSON}
      CONVERACT_FABRIC_CELL_NODES_JSON: ${CONVERACT_FABRIC_CELL_NODES_JSON:-}
      CONVERACT_FABRIC_CELL_NODE_POOLS_JSON: ${CONVERACT_FABRIC_CELL_NODE_POOLS_JSON:-}
      CONVERACT_FABRIC_CELL_PROBES_JSON: ${CONVERACT_FABRIC_CELL_PROBES_JSON:?set CONVERACT_FABRIC_CELL_PROBES_JSON}
    depends_on:
      capacity-admission:
        condition: service_started
    restart: unless-stopped

  component-node-admission:
    profiles: ["component-node"]
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command: ["node", "--import", "tsx", "scripts/converact-component-node-admission.ts"]
    environment:
      CONVERACT_FABRIC_COMPONENT_NODE_HOST: 0.0.0.0
      CONVERACT_FABRIC_COMPONENT_NODE_PORT: 3210
      CONVERACT_FABRIC_COMPONENT_NODE_TOKEN: ${CONVERACT_FABRIC_COMPONENT_NODE_TOKEN:?set CONVERACT_FABRIC_COMPONENT_NODE_TOKEN}
      CONVERACT_FABRIC_COMPONENT_NODE_COMPONENT: ${CONVERACT_FABRIC_COMPONENT_NODE_COMPONENT:?set CONVERACT_FABRIC_COMPONENT_NODE_COMPONENT}
      CONVERACT_FABRIC_COMPONENT_NODE_REGION_ID: ${CONVERACT_FABRIC_CELL_REGION_ID:?set CONVERACT_FABRIC_CELL_REGION_ID}
      CONVERACT_FABRIC_COMPONENT_NODE_ZONE_ID: ${CONVERACT_FABRIC_CELL_ZONE_ID:?set CONVERACT_FABRIC_CELL_ZONE_ID}
      CONVERACT_FABRIC_COMPONENT_NODE_CELL_ID: ${CONVERACT_FABRIC_CELL_ID:?set CONVERACT_FABRIC_CELL_ID}
      CONVERACT_FABRIC_COMPONENT_NODE_ID: ${CONVERACT_FABRIC_COMPONENT_NODE_ID:?set CONVERACT_FABRIC_COMPONENT_NODE_ID}
      CONVERACT_FABRIC_COMPONENT_NODE_PROFILE_IDS: ${CONVERACT_FABRIC_CELL_PROFILE_IDS:?set CONVERACT_FABRIC_CELL_PROFILE_IDS}
      CONVERACT_FABRIC_COMPONENT_NODE_INTERACTION_KINDS: ${CONVERACT_FABRIC_COMPONENT_NODE_INTERACTION_KINDS:?set CONVERACT_FABRIC_COMPONENT_NODE_INTERACTION_KINDS}
      CONVERACT_FABRIC_COMPONENT_NODE_DIMENSIONS_JSON: ${CONVERACT_FABRIC_COMPONENT_NODE_DIMENSIONS_JSON:?set CONVERACT_FABRIC_COMPONENT_NODE_DIMENSIONS_JSON}
      CONVERACT_FABRIC_COMPONENT_NODE_TERMINAL_RETENTION_MS: ${CONVERACT_FABRIC_COMPONENT_NODE_TERMINAL_RETENTION_MS:-300000}
      CONVERACT_FABRIC_COMPONENT_NODE_SWEEP_INTERVAL_MS: ${CONVERACT_FABRIC_COMPONENT_NODE_SWEEP_INTERVAL_MS:-1000}
    ports:
      - "127.0.0.1:${CONVERACT_FABRIC_COMPONENT_NODE_PORT:-3210}:3210"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/livez').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  placement-snapshot-projector:
    build:
      context: ../..
      dockerfile: infra/capacity/Dockerfile
    command:
      - node
      - --import
      - tsx
      - src/converact-placement-snapshot-projector.ts
    environment:
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_FILE: /run/converact-placement/placement.json
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON:?set CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID:?set CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID}
      CONVERACT_FABRIC_PLACEMENT_PROFILE_ID: ${CONVERACT_FABRIC_PLACEMENT_PROFILE_ID:?set CONVERACT_FABRIC_PLACEMENT_PROFILE_ID}
      CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON: ${CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON:?set CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON}
      CONVERACT_FABRIC_CELL_ADMISSION_TOKEN: ${CONVERACT_FABRIC_CELL_ADMISSION_TOKEN:?set CONVERACT_FABRIC_CELL_ADMISSION_TOKEN}
      CONVERACT_FABRIC_PLACEMENT_PROJECTOR_INTERVAL_MS: ${CONVERACT_FABRIC_PLACEMENT_PROJECTOR_INTERVAL_MS:-2000}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_TTL_MS: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_TTL_MS:-10000}
      CONVERACT_FABRIC_PLACEMENT_PROJECTOR_TIMEOUT_MS: ${CONVERACT_FABRIC_PLACEMENT_PROJECTOR_TIMEOUT_MS:-2000}
    volumes:
      - placement_snapshot:/run/converact-placement
    depends_on:
      capacity-admission:
        condition: service_healthy
      capacity-projector:
        condition: service_started
    restart: unless-stopped

volumes:
  capacity_nats_data:
  capacity_worker_results:
  placement_snapshot:
