apiVersion: v1
kind: Service
metadata:
  name: ivekit-capacity-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ivekit-capacity-worker
  ports:
    - name: identity
      port: 1
      targetPort: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ivekit-capacity-worker
  labels:
    app.kubernetes.io/name: ivekit-capacity-worker
spec:
  serviceName: ivekit-capacity-worker
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ivekit-capacity-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: replace.example.com/ivekit/capacity-worker-tinode@sha256:replace-with-capacity-worker-tinode-digest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "scripts/ivekit-capacity-worker.ts"]
          env:
            - name: CONVERACT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: database-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: nats-url
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: nats-user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: nats-password
            - name: NATS_TLS_MODE
              value: required
            - name: NATS_TLS_CA_FILE
              value: /etc/nats/tls/ca.crt
            - name: NATS_TLS_CERT_FILE
              value: /etc/nats/tls/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /etc/nats/tls/tls.key
            - name: CONVERACT_FABRIC_CAPACITY_RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: run-id
            - name: CONVERACT_FABRIC_CAPACITY_FLEET_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: fleet-id
            - name: CONVERACT_FABRIC_CAPACITY_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONVERACT_FABRIC_CAPACITY_RELEASE_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: release-id
            - name: CONVERACT_FABRIC_CAPACITY_SAFE_CAPACITY
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: safe-capacity
            - name: CONVERACT_FABRIC_CAPACITY_HEARTBEAT_INTERVAL_MS
              value: "5000"
            - name: CONVERACT_FABRIC_CAPACITY_ASSIGNMENT_INTERVAL_MS
              value: "500"
            - name: CONVERACT_FABRIC_CAPACITY_SHARD_LEASE_MS
              value: "30000"
            - name: CONVERACT_FABRIC_CAPACITY_ACK_WAIT_MS
              value: "30000"
            - name: CONVERACT_FABRIC_CAPACITY_RETRY_DELAY_MS
              value: "1000"
            - name: CONVERACT_FABRIC_CAPACITY_DRIVER_SPEC_PATH
              value: /etc/ivekit-capacity-worker/driver-spec.json
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-prefix
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-bucket
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-region
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-endpoint
                  optional: true
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-force-path-style
                  optional: true
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-evidence
                  key: evidence-s3-access-key-id
                  optional: true
            - name: CONVERACT_FABRIC_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-evidence
                  key: evidence-s3-secret-access-key
                  optional: true
            - name: CONVERACT_FABRIC_CAPACITY_WORKER_METADATA_JSON
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: metadata-json
          volumeMounts:
            - name: nats-tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: driver-spec
              mountPath: /etc/ivekit-capacity-worker
              readOnly: true
            - name: results
              mountPath: /var/lib/ivekit-capacity
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        - name: network-impairment
          image: replace.example.com/ivekit/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "scripts/ivekit-capacity-network-impairment.ts"]
          env:
            - name: CONVERACT_FABRIC_NETWORK_IMPAIRMENT_HOST
              value: "127.0.0.1"
            - name: CONVERACT_FABRIC_NETWORK_IMPAIRMENT_PORT
              value: "3199"
            - name: CONVERACT_FABRIC_NETWORK_IMPAIRMENT_INTERFACE
              value: eth0
            - name: CONVERACT_FABRIC_NETWORK_IMPAIRMENT_IFB_INTERFACE
              value: ifb-ivekit0
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              port: 3199
              path: /readyz
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
      volumes:
        - name: nats-tls
          secret:
            secretName: ivekit-capacity-nats-tls
        - name: driver-spec
          configMap:
            name: ivekit-capacity-worker-driver
        - name: results
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ivekit-capacity-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-worker
