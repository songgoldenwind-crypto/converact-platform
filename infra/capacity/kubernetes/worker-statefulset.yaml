apiVersion: v1
kind: Service
metadata:
  name: ivekit-capacity-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ivekit-capacity-worker
  ports:
    - name: identity
      port: 1
      targetPort: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ivekit-capacity-worker
  labels:
    app.kubernetes.io/name: ivekit-capacity-worker
spec:
  serviceName: ivekit-capacity-worker
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ivekit-capacity-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: replace.example.com/ivekit/capacity-worker-tinode:replace-with-digest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "scripts/ivekit-capacity-worker.ts"]
          env:
            - name: OPC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: database-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: nats-url
            - name: OPC_IVEKIT_CAPACITY_RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: run-id
            - name: OPC_IVEKIT_CAPACITY_FLEET_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: fleet-id
            - name: OPC_IVEKIT_CAPACITY_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_CAPACITY_RELEASE_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: release-id
            - name: OPC_IVEKIT_CAPACITY_SAFE_CAPACITY
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: safe-capacity
            - name: OPC_IVEKIT_CAPACITY_HEARTBEAT_INTERVAL_MS
              value: "5000"
            - name: OPC_IVEKIT_CAPACITY_ASSIGNMENT_INTERVAL_MS
              value: "500"
            - name: OPC_IVEKIT_CAPACITY_SHARD_LEASE_MS
              value: "30000"
            - name: OPC_IVEKIT_CAPACITY_ACK_WAIT_MS
              value: "30000"
            - name: OPC_IVEKIT_CAPACITY_RETRY_DELAY_MS
              value: "1000"
            - name: OPC_IVEKIT_CAPACITY_DRIVER_SPEC_PATH
              value: /etc/ivekit-capacity-worker/driver-spec.json
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-prefix
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-bucket
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-region
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-endpoint
                  optional: true
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: evidence-s3-force-path-style
                  optional: true
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-evidence
                  key: evidence-s3-access-key-id
                  optional: true
            - name: OPC_IVEKIT_CAPACITY_EVIDENCE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-evidence
                  key: evidence-s3-secret-access-key
                  optional: true
            - name: OPC_IVEKIT_CAPACITY_WORKER_METADATA_JSON
              valueFrom:
                configMapKeyRef:
                  name: ivekit-capacity-worker
                  key: metadata-json
          volumeMounts:
            - name: driver-spec
              mountPath: /etc/ivekit-capacity-worker
              readOnly: true
            - name: results
              mountPath: /var/lib/ivekit-capacity
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: driver-spec
          configMap:
            name: ivekit-capacity-worker-driver
        - name: results
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ivekit-capacity-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-worker
