apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivekit-capacity-controller
  labels:
    app.kubernetes.io/name: ivekit-capacity-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ivekit-capacity-controller
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: replace.example.com/ivekit/capacity-tools:replace-with-digest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "scripts/ivekit-capacity-controller.ts"]
          env:
            - name: OPC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: database-url
            - name: OPC_IVEKIT_CAPACITY_CONTROLLER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_CAPACITY_MANIFEST_PATH
              value: /run/ivekit-capacity/manifest.json
            - name: OPC_IVEKIT_CAPACITY_CONTROLLER_LEASE_MS
              value: "15000"
            - name: OPC_IVEKIT_CAPACITY_CONTROLLER_POLL_INTERVAL_MS
              value: "500"
          volumeMounts:
            - name: manifest
              mountPath: /run/ivekit-capacity
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: manifest
          persistentVolumeClaim:
            claimName: ivekit-capacity-manifests
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ivekit-capacity-controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-controller
