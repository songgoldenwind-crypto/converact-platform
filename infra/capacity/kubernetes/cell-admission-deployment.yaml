apiVersion: apps/v1
kind: Deployment
metadata:
  name: converact-cell-admission
  labels:
    app.kubernetes.io/name: converact-cell-admission
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-cell-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converact-cell-admission
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: converact-cell-admission
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: converact-cell-admission
      containers:
        - name: admission
          image: replace.example.com/converact/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          command: ["node", "--import", "tsx", "scripts/converact-cell-admission.ts"]
          ports:
            - name: http
              containerPort: 3200
          env:
            - name: CONVERACT_FABRIC_CELL_ADMISSION_HOST
              value: "0.0.0.0"
            - name: CONVERACT_FABRIC_CELL_ADMISSION_PORT
              value: "3200"
            - name: CONVERACT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: converact-capacity-runtime
                  key: database-url
            - name: CONVERACT_FABRIC_CELL_ADMISSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-cell-admission
                  key: admission-token
            - name: CONVERACT_FABRIC_CELL_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: region-id
            - name: CONVERACT_FABRIC_CELL_ZONE_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: zone-id
            - name: CONVERACT_FABRIC_CELL_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: cell-id
            - name: CONVERACT_FABRIC_CELL_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONVERACT_FABRIC_CELL_LEASE_TTL_MS
              value: "30000"
            - name: CONVERACT_FABRIC_CELL_LEASE_CLAIM_RETRY_MS
              value: "1000"
            - name: CONVERACT_FABRIC_CELL_PROFILE_IDS
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: profile-ids
            - name: CONVERACT_FABRIC_CELL_INTERACTION_KINDS
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: interaction-kinds
            - name: CONVERACT_FABRIC_CELL_RESERVATION_TTL_MS
              value: "10000"
            - name: CONVERACT_FABRIC_CELL_TERMINAL_RETENTION_MS
              value: "300000"
            - name: CONVERACT_FABRIC_CELL_SWEEP_INTERVAL_MS
              value: "1000"
            - name: CONVERACT_FABRIC_CELL_INITIAL_STATE
              value: "draining"
            - name: CONVERACT_FABRIC_CELL_DIMENSIONS_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: dimensions-json
            - name: CONVERACT_FABRIC_CELL_NODES_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: nodes-json
                  optional: true
            - name: CONVERACT_FABRIC_CELL_NODE_POOLS_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: node-pools-json
                  optional: true
            - name: CONVERACT_FABRIC_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-cell-admission
                  key: component-node-token
            - name: CONVERACT_FABRIC_COMPONENT_NODE_LEASE_TTL_MS
              value: "10000"
            - name: CONVERACT_FABRIC_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS
              value: "3000"
            - name: CONVERACT_FABRIC_COMPONENT_NODE_TIMEOUT_MS
              value: "2000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        - name: capacity-projector
          image: replace.example.com/converact/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          command:
            ["node", "--import", "tsx", "scripts/converact-cell-capacity-projector.ts"]
          env:
            - name: CONVERACT_FABRIC_CELL_ADMISSION_ENDPOINT
              value: "http://127.0.0.1:3200"
            - name: CONVERACT_FABRIC_CELL_ADMISSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-cell-admission
                  key: admission-token
            - name: CONVERACT_FABRIC_CELL_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: region-id
            - name: CONVERACT_FABRIC_CELL_ZONE_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: zone-id
            - name: CONVERACT_FABRIC_CELL_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: cell-id
            - name: CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: capacity-profile-id
            - name: CONVERACT_FABRIC_CELL_CAPACITY_PROFILE_SHA256
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: capacity-profile-sha256
            - name: CONVERACT_FABRIC_CELL_PROBE_INTERVAL_MS
              value: "2000"
            - name: CONVERACT_FABRIC_CELL_OBSERVATION_TTL_MS
              value: "10000"
            - name: CONVERACT_FABRIC_CELL_DIMENSIONS_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: dimensions-json
            - name: CONVERACT_FABRIC_CELL_NODES_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: nodes-json
                  optional: true
            - name: CONVERACT_FABRIC_CELL_NODE_POOLS_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: node-pools-json
                  optional: true
            - name: CONVERACT_FABRIC_CELL_PROBES_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-cell-admission
                  key: probes-json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: converact-cell-admission
spec:
  selector:
    app.kubernetes.io/name: converact-cell-admission
  ports:
    - name: http
      port: 3200
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: converact-cell-admission
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-cell-admission
