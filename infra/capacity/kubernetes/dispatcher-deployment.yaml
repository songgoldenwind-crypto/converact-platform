apiVersion: apps/v1
kind: Deployment
metadata:
  name: converact-capacity-dispatcher
  labels:
    app.kubernetes.io/name: converact-capacity-dispatcher
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-capacity-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converact-capacity-dispatcher
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dispatcher
          image: replace.example.com/converact/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONVERACT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: converact-capacity-runtime
                  key: database-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: converact-capacity-runtime
                  key: nats-url
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: converact-capacity-runtime
                  key: nats-user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: converact-capacity-runtime
                  key: nats-password
            - name: NATS_TLS_MODE
              value: required
            - name: NATS_TLS_CA_FILE
              value: /etc/nats/tls/ca.crt
            - name: NATS_TLS_CERT_FILE
              value: /etc/nats/tls/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /etc/nats/tls/tls.key
            - name: CONVERACT_FABRIC_CAPACITY_NATS_STREAM_REPLICAS
              value: "3"
            - name: CONVERACT_FABRIC_CAPACITY_DISPATCHER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONVERACT_FABRIC_CAPACITY_DISPATCH_INTERVAL_MS
              value: "250"
            - name: CONVERACT_FABRIC_CAPACITY_DISPATCH_LEASE_MS
              value: "10000"
            - name: CONVERACT_FABRIC_CAPACITY_DISPATCH_BATCH_SIZE
              value: "100"
          volumeMounts:
            - name: nats-tls
              mountPath: /etc/nats/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nats-tls
          secret:
            secretName: converact-capacity-nats-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: converact-capacity-dispatcher
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-capacity-dispatcher
