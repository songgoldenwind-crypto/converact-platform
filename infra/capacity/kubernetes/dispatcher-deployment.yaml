apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivekit-capacity-dispatcher
  labels:
    app.kubernetes.io/name: ivekit-capacity-dispatcher
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ivekit-capacity-dispatcher
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dispatcher
          image: replace.example.com/ivekit/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          env:
            - name: OPC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: database-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: ivekit-capacity-runtime
                  key: nats-url
            - name: OPC_IVEKIT_CAPACITY_DISPATCHER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_CAPACITY_DISPATCH_INTERVAL_MS
              value: "250"
            - name: OPC_IVEKIT_CAPACITY_DISPATCH_LEASE_MS
              value: "10000"
            - name: OPC_IVEKIT_CAPACITY_DISPATCH_BATCH_SIZE
              value: "100"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ivekit-capacity-dispatcher
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-capacity-dispatcher
