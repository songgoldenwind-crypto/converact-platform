apiVersion: v1
kind: Service
metadata:
  name: converact-rustdesk-cell
  labels:
    app.kubernetes.io/name: converact-rustdesk-cell
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: converact-rustdesk-cell
  ports:
    - name: nat-test
      port: 21115
      targetPort: nat-test
      protocol: TCP
    - name: rendezvous-tcp
      port: 21116
      targetPort: rendezvous-tcp
      protocol: TCP
    - name: rendezvous-udp
      port: 21116
      targetPort: rendezvous-udp
      protocol: UDP
    - name: relay
      port: 21117
      targetPort: relay
      protocol: TCP
    - name: rendezvous-ws
      port: 21118
      targetPort: rendezvous-ws
      protocol: TCP
    - name: relay-ws
      port: 21119
      targetPort: relay-ws
      protocol: TCP
    - name: owner-binding
      port: 3211
      targetPort: owner-binding
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: converact-rustdesk-cell
  labels:
    app.kubernetes.io/name: converact-rustdesk-cell
spec:
  serviceName: converact-rustdesk-cell
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-rustdesk-cell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converact-rustdesk-cell
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: converact-rustdesk-cell
      containers:
        - name: hbbs
          image: replace.example.com/converact/rustdesk-server@sha256:replace-with-rustdesk-server-fork-digest
          imagePullPolicy: IfNotPresent
          command: ["hbbs"]
          env: &rustdesk-owner-env
            - name: HOME
              value: /var/lib/rustdesk
            - name: ALWAYS_USE_RELAY
              value: "Y"
            - name: IVEKIT_COMPONENT_NODE_ENDPOINT
              value: http://127.0.0.1:3210
            - name: IVEKIT_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-component-node
                  key: service-token
            - name: IVEKIT_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IVEKIT_OWNER_GUARD_REQUIRED
              value: "1"
            - name: IVEKIT_OWNER_REFRESH_INTERVAL_MS
              value: "3000"
            - name: IVEKIT_OWNER_REFRESH_TIMEOUT_MS
              value: "1000"
            - name: IVEKIT_RUSTDESK_OWNER_BINDING_ENDPOINT
              value: http://127.0.0.1:3211
            - name: IVEKIT_RUSTDESK_OWNER_BINDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-rustdesk-owner
                  key: service-token
          ports:
            - name: nat-test
              containerPort: 21115
              protocol: TCP
            - name: rendezvous-tcp
              containerPort: 21116
              protocol: TCP
            - name: rendezvous-udp
              containerPort: 21116
              protocol: UDP
            - name: rendezvous-ws
              containerPort: 21118
              protocol: TCP
          volumeMounts:
            - name: rustdesk-data
              mountPath: /var/lib/rustdesk
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: rendezvous-tcp
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: rendezvous-tcp
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext: &rustdesk-security-context
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
        - name: hbbr
          image: replace.example.com/converact/rustdesk-server@sha256:replace-with-rustdesk-server-fork-digest
          imagePullPolicy: IfNotPresent
          command: ["hbbr"]
          env: *rustdesk-owner-env
          ports:
            - name: relay
              containerPort: 21117
              protocol: TCP
            - name: relay-ws
              containerPort: 21119
              protocol: TCP
          volumeMounts:
            - name: rustdesk-data
              mountPath: /var/lib/rustdesk
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: relay
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: relay
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "16"
              memory: 16Gi
          securityContext: *rustdesk-security-context
        - name: rustdesk-owner-binding
          image: replace.example.com/converact/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          command:
            ["node", "--import", "tsx", "scripts/converact-rustdesk-owner-binding.ts"]
          ports:
            - name: owner-binding
              containerPort: 3211
              protocol: TCP
          env:
            - name: CONVERACT_FABRIC_RUSTDESK_OWNER_BINDING_HOST
              value: "0.0.0.0"
            - name: CONVERACT_FABRIC_RUSTDESK_OWNER_BINDING_PORT
              value: "3211"
            - name: CONVERACT_FABRIC_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONVERACT_FABRIC_RUSTDESK_OWNER_BINDING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-rustdesk-owner
                  key: service-token
            - name: CONVERACT_FABRIC_RUSTDESK_OWNER_BINDING_CHECKPOINT
              value: /var/lib/converact-rustdesk-owner/bindings.json
            - name: CONVERACT_FABRIC_RUSTDESK_OWNER_BINDING_LIMIT
              value: "4096"
            - name: CONVERACT_FABRIC_RUSTDESK_OWNER_BINDING_CLAIMED_TTL_MS
              value: "120000"
          volumeMounts:
            - name: rustdesk-data
              mountPath: /var/lib/converact-rustdesk-owner
          readinessProbe:
            httpGet:
              path: /readyz
              port: owner-binding
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: owner-binding
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext: *rustdesk-security-context
        - name: component-node-admission
          image: replace.example.com/converact/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          command:
            ["node", "--import", "tsx", "scripts/converact-component-node-admission.ts"]
          ports:
            - name: node-admission
              containerPort: 3210
              protocol: TCP
          env:
            - name: CONVERACT_FABRIC_COMPONENT_NODE_HOST
              value: "0.0.0.0"
            - name: CONVERACT_FABRIC_COMPONENT_NODE_PORT
              value: "3210"
            - name: CONVERACT_FABRIC_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: converact-component-node
                  key: service-token
            - name: CONVERACT_FABRIC_COMPONENT_NODE_COMPONENT
              value: rustdesk
            - name: CONVERACT_FABRIC_COMPONENT_NODE_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-rustdesk-cell
                  key: region-id
            - name: CONVERACT_FABRIC_COMPONENT_NODE_ZONE_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-rustdesk-cell
                  key: zone-id
            - name: CONVERACT_FABRIC_COMPONENT_NODE_CELL_ID
              valueFrom:
                configMapKeyRef:
                  name: converact-rustdesk-cell
                  key: cell-id
            - name: CONVERACT_FABRIC_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONVERACT_FABRIC_COMPONENT_NODE_PROFILE_IDS
              valueFrom:
                configMapKeyRef:
                  name: converact-rustdesk-cell
                  key: profile-ids
            - name: CONVERACT_FABRIC_COMPONENT_NODE_INTERACTION_KINDS
              value: rustdesk_remote
            - name: CONVERACT_FABRIC_COMPONENT_NODE_DIMENSIONS_JSON
              valueFrom:
                configMapKeyRef:
                  name: converact-rustdesk-cell
                  key: dimensions-json
            - name: CONVERACT_FABRIC_COMPONENT_NODE_TERMINAL_RETENTION_MS
              value: "300000"
            - name: CONVERACT_FABRIC_COMPONENT_NODE_SWEEP_INTERVAL_MS
              value: "1000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: node-admission
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: node-admission
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext: *rustdesk-security-context
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: rustdesk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: converact-rustdesk-cell
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-rustdesk-cell
