apiVersion: v1
kind: Service
metadata:
  name: ivekit-livekit-cell
  labels:
    app.kubernetes.io/name: ivekit-livekit-cell
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: ivekit-livekit-cell
  ports:
    - name: signal
      port: 7880
      targetPort: signal
    - name: rtc-tcp
      port: 7881
      targetPort: rtc-tcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ivekit-livekit-cell
  labels:
    app.kubernetes.io/name: ivekit-livekit-cell
spec:
  serviceName: ivekit-livekit-cell
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-livekit-cell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ivekit-livekit-cell
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: livekit
          image: replace.example.com/ivekit/livekit-server@sha256:replace-with-livekit-fork-digest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/livekit/livekit.yaml"]
          env:
            - name: IVEKIT_COMPONENT_NODE_ENDPOINT
              value: http://127.0.0.1:3210
            - name: IVEKIT_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ivekit-component-node
                  key: service-token
            - name: IVEKIT_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IVEKIT_OWNER_GUARD_REQUIRED
              value: "1"
            - name: IVEKIT_OWNER_REFRESH_INTERVAL_MS
              value: "3000"
            - name: IVEKIT_OWNER_REFRESH_TIMEOUT_MS
              value: "1000"
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: signal
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: signal
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "16"
              memory: 32Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        - name: component-node-admission
          image: replace.example.com/ivekit/capacity-tools@sha256:replace-with-capacity-tools-digest
          imagePullPolicy: IfNotPresent
          command:
            ["node", "--import", "tsx", "scripts/ivekit-component-node-admission.ts"]
          ports:
            - name: node-admission
              containerPort: 3210
              protocol: TCP
          env:
            - name: OPC_IVEKIT_COMPONENT_NODE_HOST
              value: "0.0.0.0"
            - name: OPC_IVEKIT_COMPONENT_NODE_PORT
              value: "3210"
            - name: OPC_IVEKIT_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ivekit-component-node
                  key: service-token
            - name: OPC_IVEKIT_COMPONENT_NODE_COMPONENT
              value: livekit
            - name: OPC_IVEKIT_COMPONENT_NODE_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-livekit-cell
                  key: region-id
            - name: OPC_IVEKIT_COMPONENT_NODE_ZONE_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-livekit-cell
                  key: zone-id
            - name: OPC_IVEKIT_COMPONENT_NODE_CELL_ID
              valueFrom:
                configMapKeyRef:
                  name: ivekit-livekit-cell
                  key: cell-id
            - name: OPC_IVEKIT_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_COMPONENT_NODE_PROFILE_IDS
              valueFrom:
                configMapKeyRef:
                  name: ivekit-livekit-cell
                  key: profile-ids
            - name: OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS
              value: livekit_av,livekit_screen
            - name: OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON
              valueFrom:
                configMapKeyRef:
                  name: ivekit-livekit-cell
                  key: dimensions-json
            - name: OPC_IVEKIT_COMPONENT_NODE_TERMINAL_RETENTION_MS
              value: "300000"
            - name: OPC_IVEKIT_COMPONENT_NODE_SWEEP_INTERVAL_MS
              value: "1000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: node-admission
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: node-admission
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: livekit-config
          secret:
            secretName: ivekit-livekit-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ivekit-livekit-cell
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ivekit-livekit-cell
