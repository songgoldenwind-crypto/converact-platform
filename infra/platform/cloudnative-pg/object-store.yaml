apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: converact-postgres-backup
  labels:
    app.kubernetes.io/name: converact-postgres-backup
    app.kubernetes.io/part-of: converact-platform
spec:
  configuration:
    destinationPath: s3://converact-postgres-backups/cluster
    serverName: converact-postgres
    s3Credentials:
      accessKeyId:
        name: converact-postgres-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: converact-postgres-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: snappy
      maxParallel: 8
    data:
      compression: gzip
      jobs: 4
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 1Gi
