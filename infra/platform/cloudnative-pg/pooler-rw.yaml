apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: opc-postgres-rw-pooler
  labels:
    app.kubernetes.io/name: opc-postgres-rw-pooler
    app.kubernetes.io/part-of: ivekit-platform
spec:
  cluster:
    name: opc-postgres
  instances: 3
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "4000"
      default_pool_size: "80"
      reserve_pool_size: "20"
      max_db_connections: "120"
      server_idle_timeout: "300"
      query_wait_timeout: "15"
      client_idle_timeout: "900"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opc-postgres-rw-pooler
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: opc-postgres-rw-pooler
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opc-postgres-rw-pooler
