apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ivekit-victoria-metrics
spec:
  groups:
    - name: ivekit-victoria-metrics
      rules:
        - alert: IvekitVictoriaMetricsUnavailable
          expr: up{job="ivekit-victoria-metrics"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: VictoriaMetrics is unavailable; live communication must remain unaffected
        - alert: IvekitPrometheusRemoteWriteBacklog
          expr: prometheus_remote_storage_samples_pending{remote_name="ivekit-victoria-metrics"} > 100000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Prometheus remote-write WAL backlog is growing
        - alert: IvekitPrometheusRemoteWriteFailures
          expr: rate(prometheus_remote_storage_samples_failed_total{remote_name="ivekit-victoria-metrics"}[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Prometheus cannot deliver metrics to VictoriaMetrics
        - alert: IvekitVictoriaMetricsDiskLow
          expr: kubelet_volume_stats_available_bytes{persistentvolumeclaim="ivekit-victoria-metrics-data"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="ivekit-victoria-metrics-data"} < 0.15
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: VictoriaMetrics persistent volume has less than 15 percent free
