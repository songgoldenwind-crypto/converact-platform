apiVersion: v1
kind: ConfigMap
metadata:
  name: ivekit-otel-collector
  labels:
    app.kubernetes.io/name: ivekit-otel-collector
    app.kubernetes.io/component: trace-gateway
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
        spike_limit_mib: 192
      attributes/privacy:
        actions:
          - key: db.statement
            action: delete
          - key: db.query.text
            action: delete
          - key: url.full
            action: delete
          - key: url.query
            action: delete
          - key: http.url
            action: delete
          - key: http.target
            action: delete
          - key: enduser.id
            action: delete
          - key: user.id
            action: delete
          - key: messaging.message.id
            action: delete
      batch:
        timeout: 2s
        send_batch_size: 512
        send_batch_max_size: 1024
    exporters:
      otlp_http/traces:
        endpoint: ${env:OTEL_TRACE_BACKEND_ENDPOINT}
        timeout: 5s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 4096
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 30s
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/privacy, batch]
          exporters: [otlp_http/traces]
