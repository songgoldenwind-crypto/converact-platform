    read_only: true
    environment:
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_FILE: /run/converact-placement/placement.json
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON:?CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON is required}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID:?CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID is required}
      CONVERACT_FABRIC_PLACEMENT_PROFILE_ID: ${CONVERACT_FABRIC_PLACEMENT_PROFILE_ID:?CONVERACT_FABRIC_PLACEMENT_PROFILE_ID is required}
      CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON: ${CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON:?CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON is required}
      CONVERACT_FABRIC_CELL_ADMISSION_TOKEN: ${CONVERACT_FABRIC_CELL_ADMISSION_TOKEN:?CONVERACT_FABRIC_CELL_ADMISSION_TOKEN is required}
      CONVERACT_FABRIC_PLACEMENT_PROJECTOR_INTERVAL_MS: ${CONVERACT_FABRIC_PLACEMENT_PROJECTOR_INTERVAL_MS:-2000}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_TTL_MS: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_TTL_MS:-10000}
      CONVERACT_FABRIC_PLACEMENT_PROJECTOR_TIMEOUT_MS: ${CONVERACT_FABRIC_PLACEMENT_PROJECTOR_TIMEOUT_MS:-2000}
