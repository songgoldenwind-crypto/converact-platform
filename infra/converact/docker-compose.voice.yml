  rtpengine-config-validate:
    image: ${CONVERACT_FABRIC_MEDIA_CONTROL_IMAGE_NAME:-converact-media-control:local}
    profiles: ["voice-media-control"]
    entrypoint:
      - node
      - --import
      - tsx
      - scripts/converact-rtpengine-deployment-preflight.ts
    restart: "no"
    user: node
    read_only: true
    environment:
      CONVERACT_FABRIC_RTPENGINE_IMAGE: ${CONVERACT_FABRIC_RTPENGINE_IMAGE:?CONVERACT_FABRIC_RTPENGINE_IMAGE must be digest-pinned}
      CONVERACT_FABRIC_RTPENGINE_RUNTIME_MODE: userspace
      CONVERACT_FABRIC_RTPENGINE_INTERFACE: ${CONVERACT_FABRIC_RTPENGINE_INTERFACE:?CONVERACT_FABRIC_RTPENGINE_INTERFACE is required}
      CONVERACT_FABRIC_RTPENGINE_PORT_MIN: ${CONVERACT_FABRIC_RTPENGINE_PORT_MIN:-23000}
      CONVERACT_FABRIC_RTPENGINE_PORT_MAX: ${CONVERACT_FABRIC_RTPENGINE_PORT_MAX:-32768}
      CONVERACT_FABRIC_PROCESSING_MEDIA_RTP_PORT_START: ${CONVERACT_FABRIC_PROCESSING_MEDIA_RTP_PORT_START:-40000}
      CONVERACT_FABRIC_PROCESSING_MEDIA_RTP_PORT_END: ${CONVERACT_FABRIC_PROCESSING_MEDIA_RTP_PORT_END:-59998}
    tmpfs:
      - /tmp:size=16m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rtpengine:
    image: ${CONVERACT_FABRIC_RTPENGINE_IMAGE:?CONVERACT_FABRIC_RTPENGINE_IMAGE must be digest-pinned}
    profiles: ["voice-media-control"]
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    environment:
      IVEKIT_RTPENGINE_RUNTIME_MODE: userspace
      IVEKIT_RTPENGINE_INTERFACE: ${CONVERACT_FABRIC_RTPENGINE_INTERFACE:?CONVERACT_FABRIC_RTPENGINE_INTERFACE is required}
      IVEKIT_RTPENGINE_LISTEN_NG: 0.0.0.0:22222
      IVEKIT_RTPENGINE_LISTEN_TCP_NG: 0.0.0.0:22222
      IVEKIT_RTPENGINE_LISTEN_HTTP: 0.0.0.0:8080
      IVEKIT_RTPENGINE_PORT_MIN: ${CONVERACT_FABRIC_RTPENGINE_PORT_MIN:-23000}
      IVEKIT_RTPENGINE_PORT_MAX: ${CONVERACT_FABRIC_RTPENGINE_PORT_MAX:-32768}
      IVEKIT_RTPENGINE_MAX_ACTIVE_CALLS: ${CONVERACT_FABRIC_RTPENGINE_MAX_ACTIVE_CALLS:-100000}
      IVEKIT_RTPENGINE_GUARD_MAX_ENTRIES: ${CONVERACT_FABRIC_RTPENGINE_GUARD_MAX_ENTRIES:-1600000}
      IVEKIT_RTPENGINE_REPLAY_SDP_MAX_BYTES: ${CONVERACT_FABRIC_RTPENGINE_REPLAY_SDP_MAX_BYTES:-268435456}
    expose:
      - "22222"
      - "8080"
    ports:
      - "${CONVERACT_FABRIC_RTPENGINE_BIND_ADDRESS:-0.0.0.0}:${CONVERACT_FABRIC_RTPENGINE_PORT_MIN:-23000}-${CONVERACT_FABRIC_RTPENGINE_PORT_MAX:-32768}:${CONVERACT_FABRIC_RTPENGINE_PORT_MIN:-23000}-${CONVERACT_FABRIC_RTPENGINE_PORT_MAX:-32768}/udp"
    tmpfs:
      - /run/converact-rtpengine:size=16m,uid=10001,gid=10001,mode=0700
      - /rec:size=64m,uid=10001,gid=10001,mode=0700
    deploy:
      resources:
        limits:
          cpus: ${CONVERACT_FABRIC_RTPENGINE_CPU_LIMIT:-4}
          memory: ${CONVERACT_FABRIC_RTPENGINE_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${CONVERACT_FABRIC_RTPENGINE_CPU_RESERVATION:-1}
          memory: ${CONVERACT_FABRIC_RTPENGINE_MEMORY_RESERVATION:-1G}
    depends_on:
      rtpengine-config-validate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /run/converact-rtpengine/runtime.identity && kill -0 1
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  voice-media-processing:
    image: ${CONVERACT_FABRIC_VOICE_MEDIA_IMAGE_NAME:-converact-voice-media:local}
    build:
      context: ../..
      dockerfile: infra/converact/voice-media/Dockerfile
      args:
        CONVERACT_SOURCE_COMMIT: ${CONVERACT_SOURCE_COMMIT:-unknown}
    profiles: ["voice-media-control"]
    init: true
    restart: unless-stopped
    read_only: true
    network_mode: service:rustpbx
    environment:
      VOICE_MEDIA_LISTEN: 127.0.0.1:8093
      VOICE_MEDIA_API_TOKEN_FILE: /run/secrets/voice-media-processing-token
      VOICE_MEDIA_CLIENT_IDENTITY: media-control-sidecar
      VOICE_MEDIA_RTP_BIND_IP: 0.0.0.0
      VOICE_MEDIA_RTP_ADVERTISED_IP: ${CONVERACT_FABRIC_PROCESSING_MEDIA_ADVERTISED_IP:?CONVERACT_FABRIC_PROCESSING_MEDIA_ADVERTISED_IP is required}
      VOICE_MEDIA_RTP_PORT_START: ${CONVERACT_FABRIC_PROCESSING_MEDIA_RTP_PORT_START:-40000}
      VOICE_MEDIA_RTP_PORT_END: ${CONVERACT_FABRIC_PROCESSING_MEDIA_RTP_PORT_END:-59998}
      VOICE_MEDIA_WORKER_THREADS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_WORKER_THREADS:-4}
      VOICE_MEDIA_MAX_SESSIONS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_SESSIONS:-5000}
      VOICE_MEDIA_CODEC_PAIR_CAPACITY: ${CONVERACT_FABRIC_PROCESSING_MEDIA_CODEC_PAIR_CAPACITY:-5000}
      VOICE_MEDIA_SESSION_SHARDS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_SESSION_SHARDS:-64}
      VOICE_MEDIA_MAX_INFLIGHT_CONTROL: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_INFLIGHT_CONTROL:-1024}
      VOICE_MEDIA_COMMAND_HISTORY_PER_SESSION: ${CONVERACT_FABRIC_PROCESSING_MEDIA_COMMAND_HISTORY_PER_SESSION:-32}
      VOICE_MEDIA_TERMINAL_RETENTION_MS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_TERMINAL_RETENTION_MS:-300000}
      VOICE_MEDIA_SWEEP_INTERVAL_MS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_SWEEP_INTERVAL_MS:-1000}
      VOICE_MEDIA_SWEEP_LIMIT: ${CONVERACT_FABRIC_PROCESSING_MEDIA_SWEEP_LIMIT:-1024}
      VOICE_MEDIA_JITTER_CAPACITY: ${CONVERACT_FABRIC_PROCESSING_MEDIA_JITTER_CAPACITY:-8}
      VOICE_MEDIA_MAX_DRAIN_PER_DATAGRAM: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_DRAIN_PER_DATAGRAM:-8}
    secrets:
      - voice-media-processing-token
    tmpfs:
      - /tmp:size=16m,uid=10001,gid=10001,mode=0700
    depends_on:
      rustpbx:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8093/ready
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: ${CONVERACT_FABRIC_PROCESSING_MEDIA_CPU_LIMIT:-4}
          memory: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${CONVERACT_FABRIC_PROCESSING_MEDIA_CPU_RESERVATION:-1}
          memory: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MEMORY_RESERVATION:-1G}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  media-control:
    image: ${CONVERACT_FABRIC_MEDIA_CONTROL_IMAGE_NAME:-converact-media-control:local}
    build:
      context: ../..
      dockerfile: infra/converact/media-control/Dockerfile
      args:
        CONVERACT_SOURCE_COMMIT: ${CONVERACT_SOURCE_COMMIT:-unknown}
    profiles: ["voice-media-control"]
    init: true
    restart: unless-stopped
    user: node
    read_only: true
    network_mode: service:rustpbx
    command: []
    environment:
      CONVERACT_FABRIC_MEDIA_CONTROL_PRODUCTION: "true"
      CONVERACT_FABRIC_MEDIA_CONTROL_REQUIRE_MTLS: "true"
      CONVERACT_FABRIC_MEDIA_CONTROL_TRANSPORT: hybrid
      CONVERACT_FABRIC_MEDIA_CONTROL_HOST: 127.0.0.1
      CONVERACT_FABRIC_MEDIA_CONTROL_PORT: 3211
      CONVERACT_FABRIC_MEDIA_CONTROL_TOKEN_FILE: /run/secrets/media-control-token
      CONVERACT_FABRIC_MEDIA_CONTROL_TLS_KEY_FILE: /run/secrets/media-control-server-key
      CONVERACT_FABRIC_MEDIA_CONTROL_TLS_CERT_FILE: /run/secrets/media-control-server-cert
      CONVERACT_FABRIC_MEDIA_CONTROL_TLS_CA_FILE: /run/secrets/media-control-ca
      CONVERACT_FABRIC_MEDIA_CONTROL_ADMISSION_ENDPOINT: http://127.0.0.1:3210
      CONVERACT_FABRIC_MEDIA_CONTROL_ADMISSION_TOKEN_FILE: /run/secrets/component-node-token
      CONVERACT_FABRIC_MEDIA_CONTROL_ADMISSION_REQUIRE_MTLS: "false"
      CONVERACT_FABRIC_MEDIA_CONTROL_ADMISSION_HEALTH_INTERVAL_MS: ${CONVERACT_FABRIC_MEDIA_CONTROL_ADMISSION_HEALTH_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_MEDIA_CONTROL_MAX_RESERVATIONS: ${CONVERACT_FABRIC_MEDIA_CONTROL_MAX_RESERVATIONS:-100000}
      CONVERACT_FABRIC_MEDIA_CONTROL_MAX_TERMINAL_RESERVATIONS: ${CONVERACT_FABRIC_MEDIA_CONTROL_MAX_TERMINAL_RESERVATIONS:-100000}
      CONVERACT_FABRIC_MEDIA_CONTROL_MAX_COMMANDS_PER_RESERVATION: ${CONVERACT_FABRIC_MEDIA_CONTROL_MAX_COMMANDS_PER_RESERVATION:-16}
      CONVERACT_FABRIC_MEDIA_CONTROL_TERMINAL_RETENTION_MS: ${CONVERACT_FABRIC_MEDIA_CONTROL_TERMINAL_RETENTION_MS:-300000}
      CONVERACT_FABRIC_MEDIA_CONTROL_EVENT_MAX_BINDINGS: ${CONVERACT_FABRIC_MEDIA_CONTROL_EVENT_MAX_BINDINGS:-100000}
      CONVERACT_FABRIC_MEDIA_CONTROL_EVENT_REPLAY_CAPACITY: ${CONVERACT_FABRIC_MEDIA_CONTROL_EVENT_REPLAY_CAPACITY:-4096}
      CONVERACT_FABRIC_MEDIA_CONTROL_EVENT_MAX_SUBSCRIBERS_PER_OWNER: ${CONVERACT_FABRIC_MEDIA_CONTROL_EVENT_MAX_SUBSCRIBERS_PER_OWNER:-2}
      CONVERACT_FABRIC_MEDIA_CONTROL_SWEEP_INTERVAL_MS: ${CONVERACT_FABRIC_MEDIA_CONTROL_SWEEP_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_MEDIA_CONTROL_ORPHAN_BATCH_SIZE: ${CONVERACT_FABRIC_MEDIA_CONTROL_ORPHAN_BATCH_SIZE:-256}
      CONVERACT_FABRIC_MEDIA_CONTROL_ORPHAN_SWEEP_INTERVAL_MS: ${CONVERACT_FABRIC_MEDIA_CONTROL_ORPHAN_SWEEP_INTERVAL_MS:-30000}
      CONVERACT_FABRIC_MEDIA_CONTROL_TRANSPORT_MAX_BINDINGS: ${CONVERACT_FABRIC_MEDIA_CONTROL_TRANSPORT_MAX_BINDINGS:-100000}
      CONVERACT_FABRIC_PROCESSING_MEDIA_ENDPOINT: http://127.0.0.1:8093
      CONVERACT_FABRIC_PROCESSING_MEDIA_TOKEN_FILE: /run/secrets/voice-media-processing-token
      CONVERACT_FABRIC_PROCESSING_MEDIA_CLIENT_IDENTITY: media-control-sidecar
      CONVERACT_FABRIC_PROCESSING_MEDIA_TIMEOUT_MS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_TIMEOUT_MS:-2000}
      CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_RESPONSE_BYTES: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_RESPONSE_BYTES:-262144}
      CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_RELEASE_CONTEXTS: ${CONVERACT_FABRIC_PROCESSING_MEDIA_MAX_RELEASE_CONTEXTS:-100000}
      CONVERACT_FABRIC_MEDIA_CONTROL_WAL_DIRECTORY: /var/lib/converact-media-control
      CONVERACT_FABRIC_MEDIA_CONTROL_WAL_MAX_RECORDS: ${CONVERACT_FABRIC_MEDIA_CONTROL_WAL_MAX_RECORDS:-1000000}
      CONVERACT_FABRIC_MEDIA_CONTROL_WAL_MAX_BYTES: ${CONVERACT_FABRIC_MEDIA_CONTROL_WAL_MAX_BYTES:-268435456}
      CONVERACT_FABRIC_MEDIA_CONTROL_WAL_MAX_RECORD_BYTES: ${CONVERACT_FABRIC_MEDIA_CONTROL_WAL_MAX_RECORD_BYTES:-2097152}
      CONVERACT_FABRIC_RTPENGINE_NG_ENDPOINT: tcp://rtpengine:22222
      CONVERACT_FABRIC_RTPENGINE_RUNTIME_MODE: userspace
      CONVERACT_FABRIC_RTPENGINE_MAX_CONNECTIONS: ${CONVERACT_FABRIC_RTPENGINE_MAX_CONNECTIONS:-4}
      CONVERACT_FABRIC_RTPENGINE_MAX_IN_FLIGHT: ${CONVERACT_FABRIC_RTPENGINE_MAX_IN_FLIGHT:-1024}
      CONVERACT_FABRIC_RTPENGINE_MAX_REQUEST_BYTES: ${CONVERACT_FABRIC_RTPENGINE_MAX_REQUEST_BYTES:-1048576}
      CONVERACT_FABRIC_RTPENGINE_MAX_RESPONSE_BYTES: ${CONVERACT_FABRIC_RTPENGINE_MAX_RESPONSE_BYTES:-1048576}
      CONVERACT_FABRIC_RTPENGINE_MAX_QUEUED_BYTES: ${CONVERACT_FABRIC_RTPENGINE_MAX_QUEUED_BYTES:-4194304}
      CONVERACT_FABRIC_RTPENGINE_REQUEST_TIMEOUT_MS: ${CONVERACT_FABRIC_RTPENGINE_REQUEST_TIMEOUT_MS:-2000}
      CONVERACT_FABRIC_RTPENGINE_RECOVERY_CONCURRENCY: ${CONVERACT_FABRIC_RTPENGINE_RECOVERY_CONCURRENCY:-32}
      CONVERACT_FABRIC_RTPENGINE_MAX_SESSIONS: ${CONVERACT_FABRIC_RTPENGINE_MAX_SESSIONS:-100000}
      CONVERACT_FABRIC_RTPENGINE_MAX_COMMANDS: ${CONVERACT_FABRIC_RTPENGINE_MAX_COMMANDS:-1600000}
    volumes:
      - media-control-wal:/var/lib/converact-media-control
    secrets:
      - media-control-token
      - media-control-server-key
      - media-control-server-cert
      - media-control-client-identity
      - media-control-ca
      - component-node-token
      - voice-media-processing-token
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      rtpengine:
        condition: service_healthy
      voice-media-processing:
        condition: service_healthy
      rustpbx:
        condition: service_healthy
      rustpbx-component-node:
        condition: service_started
      cell-admission:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const fs=require('node:fs'),https=require('node:https'),identity=fs.readFileSync('/run/secrets/media-control-client-identity'),ca=fs.readFileSync('/run/secrets/media-control-ca');const r=https.request('https://localhost:3211/readyz',{key:identity,cert:identity,ca},x=>{x.resume();x.on('end',()=>process.exit(x.statusCode===200?0:1))});r.setTimeout(1000,()=>r.destroy());r.on('error',()=>process.exit(1));r.end()
      interval: 5s
      timeout: 2s
      retries: 20
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rustpbx-runtime-recovery:
    image: ${CONVERACT_PLATFORM_IMAGE:-converact-platform:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "--import", "tsx", "scripts/converact-rustpbx-recovery.ts"]
    restart: "no"
    network_mode: service:rustpbx
    depends_on:
      rustpbx:
        condition: service_healthy

  converact:
    env_file:
      - path: ${CONVERACT_FABRIC_VOICE_RUNTIME_ENV_FILE:-./voice-runtime.env}
        required: false
    environment:
      CONVERACT_FABRIC_INTERNAL_TLS_PORT: "3443"
      CONVERACT_FABRIC_INTERNAL_TLS_KEY_FILE: /run/secrets/rustpbx-cdr-server-key
      CONVERACT_FABRIC_INTERNAL_TLS_CERT_FILE: /run/secrets/rustpbx-cdr-server-cert
      CONVERACT_FABRIC_INTERNAL_TLS_CLIENT_CA_FILE: /run/secrets/rustpbx-cdr-ca
      CONVERACT_FABRIC_VOICE_WORKERS_ENABLED: "1"
      CONVERACT_FABRIC_CDR_REGION_ID: ${CONVERACT_FABRIC_CDR_REGION_ID:?CONVERACT_FABRIC_CDR_REGION_ID is required}
      CONVERACT_FABRIC_VOICE_ADDRESS_KEY: ${CONVERACT_FABRIC_VOICE_ADDRESS_KEY:?CONVERACT_FABRIC_VOICE_ADDRESS_KEY is required}
      CONVERACT_FABRIC_VOICE_ADDRESS_HMAC_KEY: ${CONVERACT_FABRIC_VOICE_ADDRESS_HMAC_KEY:?CONVERACT_FABRIC_VOICE_ADDRESS_HMAC_KEY is required}
      CONVERACT_FABRIC_VOICE_SECRET_ENV_NAMES: ${CONVERACT_FABRIC_VOICE_SECRET_ENV_NAMES:-RUSTPBX_MANAGEMENT_TOKEN,RUSTPBX_RWI_TOKEN}
      CONVERACT_FABRIC_VOICE_WEBHOOK_SECRET_ENV_NAMES: ${CONVERACT_FABRIC_VOICE_WEBHOOK_SECRET_ENV_NAMES:-RUSTPBX_WEBHOOK_TOKEN}
      RUSTPBX_MANAGEMENT_TOKEN: ${RUSTPBX_MANAGEMENT_TOKEN:?RUSTPBX_MANAGEMENT_TOKEN is required}
      RUSTPBX_RWI_TOKEN: ${RUSTPBX_RWI_TOKEN:?RUSTPBX_RWI_TOKEN is required}
      RUSTPBX_WEBHOOK_TOKEN: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      CONVERACT_FABRIC_WEBPHONE_ENABLED: "1"
      CONVERACT_FABRIC_WEBPHONE_WSS_URL: ${CONVERACT_FABRIC_WEBPHONE_WSS_URL:?CONVERACT_FABRIC_WEBPHONE_WSS_URL is required}
      CONVERACT_FABRIC_WEBPHONE_SIP_REALM: ${CONVERACT_FABRIC_WEBPHONE_SIP_REALM:?CONVERACT_FABRIC_WEBPHONE_SIP_REALM is required}
      CONVERACT_FABRIC_WEBPHONE_JWT_SECRET: ${CONVERACT_FABRIC_WEBPHONE_JWT_SECRET:?CONVERACT_FABRIC_WEBPHONE_JWT_SECRET is required}
      CONVERACT_FABRIC_WEBPHONE_JWT_ISSUER: ${CONVERACT_FABRIC_WEBPHONE_JWT_ISSUER:-converact}
      CONVERACT_FABRIC_WEBPHONE_JWT_AUDIENCE: ${CONVERACT_FABRIC_WEBPHONE_JWT_AUDIENCE:-rustpbx-webphone}
      CONVERACT_FABRIC_WEBPHONE_TTL_SECONDS: ${CONVERACT_FABRIC_WEBPHONE_TTL_SECONDS:-300}
      CONVERACT_FABRIC_WEBPHONE_REGISTER_EXPIRES_SECONDS: ${CONVERACT_FABRIC_WEBPHONE_REGISTER_EXPIRES_SECONDS:-240}
      CONVERACT_FABRIC_WEBPHONE_ICE_SERVERS_JSON: ${CONVERACT_FABRIC_WEBPHONE_ICE_SERVERS_JSON:-[]}
      CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_ENABLED: "1"
      CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_INTERVAL_MS: ${CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_INTERVAL_MS:-60000}
      CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_TENANT_LIMIT: ${CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_TENANT_LIMIT:-100}
      CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_BATCH_SIZE: ${CONVERACT_FABRIC_WEBPHONE_SESSION_CLEANUP_BATCH_SIZE:-500}
      CONVERACT_FABRIC_PLACEMENT_ENABLED: ${CONVERACT_FABRIC_PLACEMENT_ENABLED:-0}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_FILE: /run/converact-placement/placement.json
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_TOKEN_HMAC_KEYS_JSON: ${CONVERACT_FABRIC_PLACEMENT_TOKEN_HMAC_KEYS_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_TOKEN_KEY_ID: ${CONVERACT_FABRIC_PLACEMENT_TOKEN_KEY_ID:-}
      CONVERACT_FABRIC_CELL_ADMISSION_TOKEN: ${CONVERACT_FABRIC_CELL_ADMISSION_TOKEN:-}
      CONVERACT_FABRIC_PLACEMENT_HOME_REGION_ID: ${CONVERACT_FABRIC_PLACEMENT_HOME_REGION_ID:-}
      CONVERACT_FABRIC_PLACEMENT_FAILOVER_REGION_IDS: ${CONVERACT_FABRIC_PLACEMENT_FAILOVER_REGION_IDS:-}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_REFRESH_MS: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_REFRESH_MS:-1000}
      CONVERACT_FABRIC_PLACEMENT_STALE_GRACE_MS: ${CONVERACT_FABRIC_PLACEMENT_STALE_GRACE_MS:-30000}
      CONVERACT_FABRIC_PLACEMENT_ADMISSION_TIMEOUT_MS: ${CONVERACT_FABRIC_PLACEMENT_ADMISSION_TIMEOUT_MS:-2000}
      CONVERACT_FABRIC_PLACEMENT_MEDIA_POLICY_JSON: ${CONVERACT_FABRIC_PLACEMENT_MEDIA_POLICY_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_VOICE_POLICY_JSON: ${CONVERACT_FABRIC_PLACEMENT_VOICE_POLICY_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_TINODE_POLICY_JSON: ${CONVERACT_FABRIC_PLACEMENT_TINODE_POLICY_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_RUSTDESK_POLICY_JSON: ${CONVERACT_FABRIC_PLACEMENT_RUSTDESK_POLICY_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_EGRESS_TRACK_POLICY_JSON: ${CONVERACT_FABRIC_PLACEMENT_EGRESS_TRACK_POLICY_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_EGRESS_COMPOSITE_POLICY_JSON: ${CONVERACT_FABRIC_PLACEMENT_EGRESS_COMPOSITE_POLICY_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_WORKER_INTERVAL_MS: ${CONVERACT_FABRIC_PLACEMENT_WORKER_INTERVAL_MS:-250}
      CONVERACT_FABRIC_PLACEMENT_WORKER_TENANT_LIMIT: ${CONVERACT_FABRIC_PLACEMENT_WORKER_TENANT_LIMIT:-100}
      CONVERACT_FABRIC_PLACEMENT_WORKER_BATCH_SIZE: ${CONVERACT_FABRIC_PLACEMENT_WORKER_BATCH_SIZE:-50}
    expose:
      - "3443"
    volumes:
      - converact-placement-snapshot:/run/converact-placement:ro
    secrets:
      - source: rustpbx-cdr-server-key
        target: rustpbx-cdr-server-key
        mode: 0400
      - rustpbx-cdr-server-cert
      - rustpbx-cdr-ca
    depends_on:
      rustpbx:
        condition: service_healthy
        required: false
      rustpbx-runtime-recovery:
        condition: service_completed_successfully
        required: false
      rustpbx-placement-snapshot-projector:
        condition: service_healthy
        required: false

volumes:
  rustpbx-runtime-config:
  rustpbx-generated-config:
  rustpbx-route-snapshot:
  rustpbx-storage:
