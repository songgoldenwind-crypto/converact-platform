      CONVERACT_FABRIC_CELL_NODES_JSON: ${CONVERACT_FABRIC_CELL_NODES_JSON:-${RUSTPBX_CELL_NODES_JSON:?RUSTPBX_CELL_NODES_JSON is required}}
      CONVERACT_FABRIC_COMPONENT_NODE_TOKEN: ${CONVERACT_FABRIC_COMPONENT_NODE_TOKEN:?CONVERACT_FABRIC_COMPONENT_NODE_TOKEN is required}
      CONVERACT_FABRIC_COMPONENT_NODE_LEASE_TTL_MS: ${RUSTPBX_COMPONENT_NODE_LEASE_TTL_MS:-30000}
      CONVERACT_FABRIC_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS: ${RUSTPBX_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS:-10000}
