  media-control-ca:
    file: ${RUSTPBX_MEDIA_CONTROL_CA_FILE:?RUSTPBX_MEDIA_CONTROL_CA_FILE is required}
  component-node-token:
    file: ${CONVERACT_FABRIC_COMPONENT_NODE_TOKEN_FILE:?CONVERACT_FABRIC_COMPONENT_NODE_TOKEN_FILE is required}
  voice-media-processing-token:
    file: ${CONVERACT_FABRIC_PROCESSING_MEDIA_TOKEN_FILE:?CONVERACT_FABRIC_PROCESSING_MEDIA_TOKEN_FILE is required}
