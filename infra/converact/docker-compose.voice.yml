  dialog-recovery-current-key:
    file: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE:-/dev/null}
  dialog-recovery-previous-key:
    file: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE:-/dev/null}
  dialog-shadow-nats-ca:
