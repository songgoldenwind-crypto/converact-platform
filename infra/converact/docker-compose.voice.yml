      CONVERACT_FABRIC_CELL_INTERACTION_KINDS: ${CONVERACT_FABRIC_CELL_INTERACTION_KINDS:-sip_voice}
      CONVERACT_FABRIC_CELL_RESERVATION_TTL_MS: ${RUSTPBX_CELL_RESERVATION_TTL_MS:-10000}
      CONVERACT_FABRIC_CELL_TERMINAL_RETENTION_MS: ${RUSTPBX_CELL_TERMINAL_RETENTION_MS:-300000}
