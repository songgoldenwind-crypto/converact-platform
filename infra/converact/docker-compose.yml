      TINODE_ROOT_API_KEY: ${TINODE_ROOT_API_KEY:?TINODE_ROOT_API_KEY is required}
      TINODE_BASIC_USER: ${TINODE_BASIC_USER:?TINODE_BASIC_USER is required}
      TINODE_BASIC_PASSWORD: ${TINODE_BASIC_PASSWORD:?TINODE_BASIC_PASSWORD is required}
      TINODE_USER_PASSWORD_SECRET: ${TINODE_USER_PASSWORD_SECRET:?TINODE_USER_PASSWORD_SECRET is required}
      CONVERACT_TINODE_DELIVERY_WORKER_ENABLED: "1"
      CONVERACT_SCHEMA_MANAGED_BY_MIGRATIONS: "1"
      CONVERACT_REMOTE_GATEWAY_PROVIDER: rustdesk
      CONVERACT_REMOTE_GATEWAY_BASE_URL: http://converact-api:3000
      CONVERACT_REMOTE_GATEWAY_API_TOKEN: ${CONVERACT_REMOTE_GATEWAY_API_TOKEN:?CONVERACT_REMOTE_GATEWAY_API_TOKEN is required}
      CONVERACT_RUSTDESK_CONTROL_PLANE_BASE_URL: http://converact-api:3000
      RUSTDESK_SERVER_IMAGE_TAG: ${RUSTDESK_SERVER_IMAGE_TAG:?RUSTDESK_SERVER_IMAGE_TAG is required}
      CONVERACT_RUSTDESK_CLIENT_VERSION: ${CONVERACT_RUSTDESK_CLIENT_VERSION:-1.4.9}
      CONVERACT_RUSTDESK_ID_SERVER: ${CONVERACT_RUSTDESK_ID_SERVER:?CONVERACT_RUSTDESK_ID_SERVER is required}
      CONVERACT_RUSTDESK_RELAY_SERVER: ${CONVERACT_RUSTDESK_RELAY_SERVER:?CONVERACT_RUSTDESK_RELAY_SERVER is required}
      CONVERACT_RUSTDESK_PUBLIC_KEY_FILE: /rustdesk/id_ed25519.pub
      CONVERACT_RUSTDESK_CLIENT_ARTIFACTS_JSON: ${CONVERACT_RUSTDESK_CLIENT_ARTIFACTS_JSON:-}
      CONVERACT_RUSTDESK_CLIENT_PROFILE_TTL_SECONDS: ${CONVERACT_RUSTDESK_CLIENT_PROFILE_TTL_SECONDS:-900}
      CONVERACT_RUSTDESK_LAUNCH_BASE_URL: ${CONVERACT_RUSTDESK_LAUNCH_BASE_URL:?CONVERACT_RUSTDESK_LAUNCH_BASE_URL is required}
      CONVERACT_RUSTDESK_PROTOCOL_URL_TEMPLATE: ${CONVERACT_RUSTDESK_PROTOCOL_URL_TEMPLATE:-rustdesk://connect/{rustdesk_id}?session={external_id}}
      CONVERACT_RUSTDESK_LAUNCH_SECRET: ${CONVERACT_RUSTDESK_LAUNCH_SECRET:?CONVERACT_RUSTDESK_LAUNCH_SECRET is required}
      CONVERACT_RUSTDESK_AUTHORIZATION_CODE_SECRET: ${CONVERACT_RUSTDESK_AUTHORIZATION_CODE_SECRET:?CONVERACT_RUSTDESK_AUTHORIZATION_CODE_SECRET is required}
      CONVERACT_RUSTDESK_REQUIRE_AUTHORIZATION_CODE: ${CONVERACT_RUSTDESK_REQUIRE_AUTHORIZATION_CODE:-1}
      CONVERACT_RUSTDESK_EDGE_TOKEN_SECRET: ${CONVERACT_RUSTDESK_EDGE_TOKEN_SECRET:?CONVERACT_RUSTDESK_EDGE_TOKEN_SECRET is required}
      CONVERACT_RUSTDESK_API_TOKEN: ${CONVERACT_RUSTDESK_API_TOKEN:?CONVERACT_RUSTDESK_API_TOKEN is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - rustdesk_data:/rustdesk:ro
    networks:
      default:
        aliases:
          - converact-api
      converact_media: {}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-runtime-role:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tinode-bootstrap:
        condition: service_completed_successfully

  controlled-intelligence-provider:
    image: ${CONVERACT_PLATFORM_IMAGE:-converact-platform:local}
    profiles: ["acceptance"]
    command: ["npm", "run", "converact:controlled-provider"]
    init: true
    restart: unless-stopped
    environment:
      CONVERACT_FABRIC_CONTROLLED_HOST: 0.0.0.0
      CONVERACT_FABRIC_CONTROLLED_PORT: "8790"
      CONVERACT_FABRIC_CONTROLLED_MODE: ${CONVERACT_FABRIC_CONTROLLED_MODE:-success}
      CONVERACT_FABRIC_CONTROLLED_TOKEN: ${CONVERACT_FABRIC_CONTROLLED_TOKEN:-}
      CONVERACT_FABRIC_CONTROL_TOKEN: ${CONVERACT_FABRIC_CONTROL_TOKEN:-}
    expose:
      - "8790"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  rustdesk-hbbs:
    image: ${RUSTDESK_SERVER_IMAGE:?RUSTDESK_SERVER_IMAGE immutable digest reference is required}
    command: hbbs
    network_mode: "host"
    restart: unless-stopped
    environment:
      ALWAYS_USE_RELAY: ${RUSTDESK_ALWAYS_USE_RELAY:-N}
    volumes:
      - rustdesk_data:/data
    depends_on:
      - rustdesk-hbbr

  rustdesk-hbbr:
    image: ${RUSTDESK_SERVER_IMAGE:?RUSTDESK_SERVER_IMAGE immutable digest reference is required}
    command: hbbr
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - rustdesk_data:/data

networks:
  converact_media:
    external: true
    name: ${CONVERACT_MEDIA_DOCKER_NETWORK:-converact-media_default}

volumes:
  postgres_data:
  redis_data:
  tinode_botdata:
  tinode_uploads:
  rustdesk_data:
