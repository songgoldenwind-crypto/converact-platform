# Reusable Converact Fabric application plane. Pair with the standalone Media Core in infra/livekit.
services:
  postgres:
    image: ${CONVERACT_POSTGRES_IMAGE:?CONVERACT_POSTGRES_IMAGE immutable digest reference is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: opc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: opc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc_admin -d opc"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres-runtime-role:
    image: ${CONVERACT_POSTGRES_IMAGE:?CONVERACT_POSTGRES_IMAGE immutable digest reference is required}
    entrypoint: ["sh", "/bootstrap/init-postgres-runtime-role.sh"]
    restart: "no"
    environment:
      POSTGRES_USER: opc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: opc
      CONVERACT_RUNTIME_DB_PASSWORD: ${CONVERACT_RUNTIME_DB_PASSWORD:?CONVERACT_RUNTIME_DB_PASSWORD is required}
      TINODE_DB_PASSWORD: ${TINODE_DB_PASSWORD:?TINODE_DB_PASSWORD is required}
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:-}
    volumes:
      - ./init-postgres-runtime-role.sh:/bootstrap/init-postgres-runtime-role.sh:ro
      - ../../scripts/converact-env-compat.sh:/bootstrap/converact-env-compat.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: ${CONVERACT_REDIS_IMAGE:?CONVERACT_REDIS_IMAGE immutable digest reference is required}
    command: redis-server --appendonly yes --protected-mode yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres-migrate:
    image: ${CONVERACT_PLATFORM_IMAGE:-converact-platform:local}
    entrypoint: ["node", "--import", "tsx", "scripts/run-postgres-migrations.ts"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres-runtime-role:
        condition: service_completed_successfully

  tinode:
    image: ${TINODE_IMAGE:?TINODE_IMAGE immutable digest reference is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TINODE_HTTP_PORT:-6060}:6060"
    environment:
      STORE_USE_ADAPTER: postgres
      POSTGRES_DSN: postgresql://tinode_app@postgres:5432/tinode?sslmode=disable&connect_timeout=10
      PGPASSWORD: ${TINODE_DB_PASSWORD:?TINODE_DB_PASSWORD is required}
      WAIT_FOR: postgres:5432
      API_KEY_SALT: ${TINODE_API_KEY_SALT:?TINODE_API_KEY_SALT is required}
      AUTH_TOKEN_KEY: ${TINODE_AUTH_TOKEN_KEY:?TINODE_AUTH_TOKEN_KEY is required}
      UID_ENCRYPTION_KEY: ${TINODE_UID_ENCRYPTION_KEY:?TINODE_UID_ENCRYPTION_KEY is required}
      SAMPLE_DATA: ""
      RESET_DB: "false"
      UPGRADE_DB: ${TINODE_UPGRADE_DB:-false}
      NO_DB_INIT: "false"
      SERVER_STATUS_PATH: /health
      WEBRTC_ENABLED: "false"
      ACC_GC_ENABLED: "true"
    volumes:
      - tinode_botdata:/botdata
      - tinode_uploads:/opt/tinode/uploads
    depends_on:
      postgres:
        condition: service_healthy
      postgres-runtime-role:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6060/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  tinode-bootstrap:
    image: ${CONVERACT_PLATFORM_IMAGE:-converact-platform:local}
    entrypoint: ["node", "--import", "tsx", "scripts/bootstrap-tinode-service-account.ts"]
    restart: "no"
    environment:
      TINODE_WS_URL: ws://tinode:6060/v0/channels
      TINODE_ROOT_API_KEY: ${TINODE_ROOT_API_KEY:?TINODE_ROOT_API_KEY is required}
      TINODE_BASIC_USER: ${TINODE_BASIC_USER:?TINODE_BASIC_USER is required}
      TINODE_BASIC_PASSWORD: ${TINODE_BASIC_PASSWORD:?TINODE_BASIC_PASSWORD is required}
      TINODE_POSTGRES_DSN: postgresql://tinode_app@postgres:5432/tinode?sslmode=disable&connect_timeout=10
      PGPASSWORD: ${TINODE_DB_PASSWORD:?TINODE_DB_PASSWORD is required}
      TINODE_BOOTSTRAP_TIMEOUT_MS: ${TINODE_BOOTSTRAP_TIMEOUT_MS:-10000}
    depends_on:
      tinode:
        condition: service_healthy

  converact:
    env_file:
      - path: ${CONVERACT_FABRIC_VOICE_RUNTIME_ENV_FILE:-./voice-runtime.env}
        required: false
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${CONVERACT_PLATFORM_IMAGE:-converact-platform:local}
    command: ["npm", "run", "start:converact"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONVERACT_HTTP_PORT:-8300}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_runtime
      PGPASSWORD: ${CONVERACT_RUNTIME_DB_PASSWORD:?CONVERACT_RUNTIME_DB_PASSWORD is required}
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      CONVERACT_SIP_VOLTE_ENABLED: ${CONVERACT_SIP_VOLTE_ENABLED:-0}
      LIVEKIT_SIP_BRIDGE_TARGET: ${LIVEKIT_SIP_BRIDGE_TARGET:-}
      RUSTPBX_LIVEKIT_TRUNK: ${RUSTPBX_LIVEKIT_TRUNK:-}
      RUSTPBX_RWI_URL: ${RUSTPBX_RWI_URL:-}
      CONVERACT_MEDIA_API_TOKEN: ${CONVERACT_MEDIA_API_TOKEN:?CONVERACT_MEDIA_API_TOKEN is required}
      CONVERACT_MEDIA_INVITE_SECRET: ${CONVERACT_MEDIA_INVITE_SECRET:?CONVERACT_MEDIA_INVITE_SECRET is required}
      CONVERACT_API_KEY: ${CONVERACT_API_KEY:?CONVERACT_API_KEY is required}
      CONVERACT_JWT_SECRET: ${CONVERACT_JWT_SECRET:?CONVERACT_JWT_SECRET is required}
      CONVERACT_FABRIC_ALLOWED_ORIGINS: ${CONVERACT_FABRIC_ALLOWED_ORIGINS:?CONVERACT_FABRIC_ALLOWED_ORIGINS is required}
      CONVERACT_FABRIC_HTTP_BODY_MAX_BYTES: ${CONVERACT_FABRIC_HTTP_BODY_MAX_BYTES:-1048576}
      CONVERACT_FABRIC_AUDIT_IP_HMAC_KEY: ${CONVERACT_FABRIC_AUDIT_IP_HMAC_KEY:?CONVERACT_FABRIC_AUDIT_IP_HMAC_KEY is required}
