{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: converact-rtpengine
  labels:
    app.kubernetes.io/name: converact-rtpengine
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: converact-rtpengine
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
