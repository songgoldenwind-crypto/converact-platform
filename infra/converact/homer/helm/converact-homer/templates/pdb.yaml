{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "converact-homer.fullname" . }}
  labels:
    {{- include "converact-homer.labels" . | nindent 4 }}
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "converact-homer.selectorLabels" . | nindent 6 }}
{{- end }}
