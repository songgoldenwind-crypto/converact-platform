{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "converact-homer.fullname" . }}
  labels:
    {{- include "converact-homer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "converact-homer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.kamailioNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.kamailioPodSelector | nindent 12 }}
      ports:
        - port: {{ .Values.homer.ingest.udpPort }}
          protocol: UDP
        - port: {{ .Values.homer.metrics.port }}
          protocol: TCP
    {{- with .Values.networkPolicy.operatorIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.homer.coordinator.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.monitoringIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.homer.metrics.port }}
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.postgresEgressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.postgresPort }}
          protocol: TCP
{{- end }}
