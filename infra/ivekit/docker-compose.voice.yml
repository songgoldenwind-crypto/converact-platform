# Optional RustPBX Voice data plane. Load with docker-compose.yml and --profile voice.
services:
  postgres-runtime-role:
    environment:
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:?RUSTPBX_DB_PASSWORD is required}

  rustpbx-config-render:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice", "voice-capacity", "voice-media-control", "voice-t1"]
    command: ["node", "--import", "tsx", "scripts/render-rustpbx-config.ts"]
    restart: "no"
    environment:
      RUSTPBX_CONFIG_OUTPUT: /app/config/rustpbx.toml
      RUSTPBX_IMAGE: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
      RUSTPBX_DATABASE_URL: postgresql://rustpbx_app@postgres:5432/rustpbx
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:?RUSTPBX_DB_PASSWORD is required}
      RUSTPBX_AMI_ALLOWS: ${RUSTPBX_AMI_ALLOWS:?RUSTPBX_AMI_ALLOWS is required}
      RUSTPBX_MANAGEMENT_TOKEN: ${RUSTPBX_MANAGEMENT_TOKEN:?RUSTPBX_MANAGEMENT_TOKEN is required}
      RUSTPBX_RWI_TOKEN: ${RUSTPBX_RWI_TOKEN:?RUSTPBX_RWI_TOKEN is required}
      RUSTPBX_WEBHOOK_TOKEN: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      OPC_IVEKIT_WEBPHONE_ENABLED: "1"
      OPC_IVEKIT_WEBPHONE_JWT_SECRET: ${OPC_IVEKIT_WEBPHONE_JWT_SECRET:?OPC_IVEKIT_WEBPHONE_JWT_SECRET is required}
      OPC_IVEKIT_WEBPHONE_JWT_ISSUER: ${OPC_IVEKIT_WEBPHONE_JWT_ISSUER:-ivekit}
      OPC_IVEKIT_WEBPHONE_JWT_AUDIENCE: ${OPC_IVEKIT_WEBPHONE_JWT_AUDIENCE:-rustpbx-webphone}
      RUSTPBX_ROUTER_URL: http://ivekit-api:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/router
      RUSTPBX_CDR_WEBHOOK_URL: http://ivekit-api:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/cdrs
      RUSTPBX_EXTERNAL_IP: ${RUSTPBX_EXTERNAL_IP:-}
      RUSTPBX_SIP_PORT: "5060"
      RUSTPBX_RTP_START_PORT: "20000"
      RUSTPBX_RTP_END_PORT: "20100"
      RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS: ${RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS:-65536}
      RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS: ${RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS:-65536}
      RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY: ${RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY:-8192}
      RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS: ${RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS:-32768}
      RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY: ${RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY:-64}
      RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS: ${RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS:-2000}
      RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY: ${RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY:-256}
      RUSTPBX_MEDIA_RECORDING_WORKER_THREADS: ${RUSTPBX_MEDIA_RECORDING_WORKER_THREADS:-4}
      RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY: ${RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY:-4096}
      RUSTPBX_CALL_RECORD_MAX_CONCURRENT: ${RUSTPBX_CALL_RECORD_MAX_CONCURRENT:-64}
      RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY: ${RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY:-65536}
      RUSTPBX_CALL_RECORD_WORKER_THREADS: ${RUSTPBX_CALL_RECORD_WORKER_THREADS:-1}
    volumes:
      - rustpbx-runtime-config:/app/config
    depends_on:
      postgres-runtime-role:
        condition: service_completed_successfully

  rustpbx-route-snapshot:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice", "voice-capacity", "voice-media-control", "voice-t1"]
    command: ["node", "--import", "tsx", "src/ivekit-rustpbx-route-snapshot.ts"]
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://opc_runtime:${OPC_RUNTIME_DB_PASSWORD:?OPC_RUNTIME_DB_PASSWORD is required}@postgres:5432/opc
      IVEKIT_RUSTPBX_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      IVEKIT_RUSTPBX_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY: ${RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY:?RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS: ${RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS:-1000}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_TTL_MS: ${RUSTPBX_ROUTE_SNAPSHOT_TTL_MS:-10000}
      IVEKIT_RUSTPBX_ROUTE_DEPENDENCIES: ${RUSTPBX_ROUTE_DEPENDENCIES:-}
    volumes:
      - rustpbx-route-snapshot:/app/route-snapshot
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  rustpbx:
    image: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
    profiles: ["voice", "voice-capacity", "voice-media-control", "voice-t1"]
    command: ["--conf", "/app/config/rustpbx.toml"]
    init: true
    restart: unless-stopped
    environment:
      RUSTPBX_ENV: ${RUSTPBX_ENV:-production}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY: ${RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY:?RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_LOOKUP_HMAC_ROOT_KEY: ${OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY:?OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      IVEKIT_RUSTPBX_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS: ${RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS:-500}
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_URL: http://ivekit-api:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/inbound-admission
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_SERVICE_KEY: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      IVEKIT_RUSTPBX_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      IVEKIT_RUSTPBX_OWNER_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:?RUSTPBX_OWNER_NODE_ID is required}
      IVEKIT_RUSTPBX_CDR_SPOOL_DIR: /app/storage/cdr-spool
      IVEKIT_RUSTPBX_CDR_ENDPOINT: ${RUSTPBX_CDR_ENDPOINT:?RUSTPBX_CDR_ENDPOINT is required}
      IVEKIT_RUSTPBX_CDR_REGION_ID: ${OPC_IVEKIT_CDR_REGION_ID:?OPC_IVEKIT_CDR_REGION_ID is required}
      IVEKIT_RUSTPBX_CDR_SERVICE_KEY_FILE: /run/secrets/rustpbx-cdr-service-key
      IVEKIT_RUSTPBX_CDR_POLL_MS: ${RUSTPBX_CDR_POLL_MS:-500}
      IVEKIT_RUSTPBX_FAULT_DOMAIN: ${RUSTPBX_FAULT_DOMAIN:-}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_ENDPOINT: ${RUSTPBX_DIALOG_SHADOW_ENDPOINT:-}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TOKEN_FILE: /run/secrets/dialog-shadow-token
      IVEKIT_RUSTPBX_DIALOG_SHADOW_PRODUCTION: "true"
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_IDENTITY_FILE: /run/secrets/dialog-shadow-client-identity
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_CA_FILE: /run/secrets/dialog-shadow-ca
      IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_INFLIGHT: ${RUSTPBX_DIALOG_SHADOW_MAX_INFLIGHT:-2048}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TIMEOUT_MS: ${RUSTPBX_DIALOG_SHADOW_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES: ${RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES:-131072}
      IVEKIT_RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS: ${RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS:-1000}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID:-recovery-current}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE: /run/secrets/dialog-recovery-current-key
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID:-recovery-previous}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE: /run/secrets/dialog-recovery-previous-key
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS: ${RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS:-250}
      IVEKIT_RUSTPBX_MEDIA_CONTROL_MODE: ${RUSTPBX_MEDIA_CONTROL_MODE:-}
      IVEKIT_RUSTPBX_MEDIA_CONTROL_FAILURE_POLICY: ${RUSTPBX_MEDIA_CONTROL_FAILURE_POLICY:-fail_closed}
      IVEKIT_RUSTPBX_MEDIA_CONTROL_ENDPOINT: https://localhost:3211/
      IVEKIT_RUSTPBX_MEDIA_CONTROL_TOKEN_FILE: /run/secrets/media-control-token
      IVEKIT_RUSTPBX_MEDIA_CONTROL_PRODUCTION: "true"
      IVEKIT_RUSTPBX_MEDIA_CONTROL_TLS_IDENTITY_FILE: /run/secrets/media-control-client-identity
      IVEKIT_RUSTPBX_MEDIA_CONTROL_TLS_CA_FILE: /run/secrets/media-control-ca
      IVEKIT_RUSTPBX_MEDIA_CONTROL_MAX_INFLIGHT: ${RUSTPBX_MEDIA_CONTROL_MAX_INFLIGHT:-2048}
      IVEKIT_RUSTPBX_MEDIA_CONTROL_TIMEOUT_MS: ${RUSTPBX_MEDIA_CONTROL_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_MEDIA_CONTROL_MAX_RESPONSE_BYTES: ${RUSTPBX_MEDIA_CONTROL_MAX_RESPONSE_BYTES:-262144}
      IVEKIT_RUSTPBX_MEDIA_PROFILE_ID: ${RUSTPBX_MEDIA_PROFILE_ID:-g711-relay-v1}
      IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED: ${RUSTPBX_COMPONENT_NODE_ENABLED:-false}
      IVEKIT_RUSTPBX_COMPONENT_NODE_URL: http://127.0.0.1:3210
      IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:-}
      IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS: ${RUSTPBX_COMPONENT_NODE_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS: ${RUSTPBX_COMPONENT_NODE_REFRESH_MS:-3000}
      IVEKIT_RUSTPBX_RECORDING_SPOOL_ENABLED: ${RUSTPBX_RECORDING_SPOOL_ENABLED:-true}
      IVEKIT_RUSTPBX_RECORDING_SPOOL_DIR: /app/recording-spool
      IVEKIT_RUSTPBX_RECORDING_SEGMENT_SECONDS: ${RUSTPBX_RECORDING_SEGMENT_SECONDS:-60}
      IVEKIT_RUSTPBX_RECORDING_SEGMENT_MAX_BYTES: ${RUSTPBX_RECORDING_SEGMENT_MAX_BYTES:-67108864}
      IVEKIT_REGION_ID: ${RUSTPBX_REGION_ID:?RUSTPBX_REGION_ID is required}
      IVEKIT_ZONE_ID: ${RUSTPBX_ZONE_ID:?RUSTPBX_ZONE_ID is required}
    expose:
      - "8080"
      - "3210"
    ports:
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_SIP_PORT:-5060}:5060/udp"
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_SIP_PORT:-5060}:5060/tcp"
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_RTP_START_PORT:-20000}-${RUSTPBX_RTP_END_PORT:-20100}:20000-20100/udp"
    volumes:
      - rustpbx-runtime-config:/app/config:ro
      - rustpbx-generated-config:/app/generated
      - rustpbx-route-snapshot:/app/route-snapshot:ro
      - rustpbx-storage:/app/storage
      - rustpbx-recording-spool:/app/recording-spool
    secrets:
      - rustpbx-cdr-service-key
      - dialog-shadow-token
      - dialog-shadow-client-identity
      - dialog-shadow-ca
      - dialog-recovery-current-key
      - dialog-recovery-previous-key
      - media-control-token
      - media-control-client-identity
      - media-control-ca
    networks:
      default: {}
    depends_on:
      postgres-runtime-role:
        condition: service_completed_successfully
      rustpbx-config-render:
        condition: service_completed_successfully
      rustpbx-route-snapshot:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/rustpbx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  rustpbx-dialog-shadow:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice-t1"]
    command: ["node", "--import", "tsx", "src/ivekit-dialog-shadow-agent.ts"]
    init: true
    restart: unless-stopped
    network_mode: service:rustpbx
    environment:
      IVEKIT_DIALOG_SHADOW_PRODUCTION: "true"
      IVEKIT_DIALOG_SHADOW_HOST: 127.0.0.1
      IVEKIT_DIALOG_SHADOW_PORT: 3212
      IVEKIT_DIALOG_SHADOW_CELL_ID: ${RUSTPBX_CELL_ID:-invalid}
      IVEKIT_DIALOG_SHADOW_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:-invalid}
      IVEKIT_DIALOG_SHADOW_FAULT_DOMAIN: ${RUSTPBX_FAULT_DOMAIN:-invalid}
      IVEKIT_DIALOG_SHADOW_JOURNAL_PATH: /app/dialog-shadow/dialog-shadow.wal
      IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_RECORDS: ${IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_RECORDS:-1000000}
      IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_BYTES: ${IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_BYTES:-268435456}
      IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_RECORD_BYTES: ${IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_RECORD_BYTES:-32768}
      IVEKIT_DIALOG_SHADOW_COMPACT_INTERVAL_MS: ${IVEKIT_DIALOG_SHADOW_COMPACT_INTERVAL_MS:-60000}
      IVEKIT_DIALOG_SHADOW_SERVICE_TOKEN_FILE: /run/secrets/dialog-shadow-token
      IVEKIT_DIALOG_SHADOW_TLS_KEY_FILE: /run/secrets/dialog-shadow-server-key
      IVEKIT_DIALOG_SHADOW_TLS_CERT_FILE: /run/secrets/dialog-shadow-server-cert
      IVEKIT_DIALOG_SHADOW_TLS_CA_FILE: /run/secrets/dialog-shadow-ca
      IVEKIT_DIALOG_SHADOW_SPIFFE_TRUST_DOMAIN: ${IVEKIT_DIALOG_SHADOW_SPIFFE_TRUST_DOMAIN:-ivekit.internal}
      IVEKIT_DIALOG_RECOVERY_DATABASE_URL_FILE: /run/secrets/dialog-recovery-database-url
      IVEKIT_DIALOG_RECOVERY_CURRENT_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID:-recovery-current}
      IVEKIT_DIALOG_RECOVERY_CURRENT_KEY_FILE: /run/secrets/dialog-recovery-current-key
      IVEKIT_DIALOG_RECOVERY_PREVIOUS_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID:-recovery-previous}
      IVEKIT_DIALOG_RECOVERY_PREVIOUS_KEY_FILE: /run/secrets/dialog-recovery-previous-key
      IVEKIT_DIALOG_RECOVERY_TOKEN_TTL_MS: ${IVEKIT_DIALOG_RECOVERY_TOKEN_TTL_MS:-5000}
      IVEKIT_DIALOG_RECOVERY_NODE_LEASE_TTL_MS: ${IVEKIT_DIALOG_RECOVERY_NODE_LEASE_TTL_MS:-3000}
      IVEKIT_DIALOG_RECOVERY_POSTGRES_POOL_MAX: ${IVEKIT_DIALOG_RECOVERY_POSTGRES_POOL_MAX:-8}
      IVEKIT_DIALOG_TERMINAL_REPAIR_INTERVAL_MS: ${IVEKIT_DIALOG_TERMINAL_REPAIR_INTERVAL_MS:-1000}
      IVEKIT_DIALOG_TERMINAL_REPAIR_LEASE_TTL_MS: ${IVEKIT_DIALOG_TERMINAL_REPAIR_LEASE_TTL_MS:-10000}
      IVEKIT_DIALOG_TERMINAL_REPAIR_TENANT_BATCH_SIZE: ${IVEKIT_DIALOG_TERMINAL_REPAIR_TENANT_BATCH_SIZE:-32}
      IVEKIT_DIALOG_SHADOW_NATS_SERVER_FAULT_DOMAINS_FILE: /run/secrets/dialog-shadow-nats-fault-domains
      IVEKIT_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER: ${IVEKIT_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER:-invalid}
      IVEKIT_DIALOG_SHADOW_NATS_PLACEMENT_TAGS: ${IVEKIT_DIALOG_SHADOW_NATS_PLACEMENT_TAGS:-}
      IVEKIT_DIALOG_SHADOW_NATS_STREAM_REPLICAS: ${IVEKIT_DIALOG_SHADOW_NATS_STREAM_REPLICAS:-3}
      IVEKIT_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS: ${IVEKIT_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS:-2}
      NATS_URL: ${RUSTPBX_DIALOG_SHADOW_NATS_URL:-}
      NATS_TLS_MODE: required
      NATS_TLS_CA_FILE: /run/secrets/dialog-shadow-nats-ca
      NATS_TLS_CERT_FILE: /run/secrets/dialog-shadow-nats-cert
      NATS_TLS_KEY_FILE: /run/secrets/dialog-shadow-nats-key
      NATS_CONNECT_TIMEOUT_MS: ${NATS_CONNECT_TIMEOUT_MS:-5000}
      NATS_RECONNECT_WAIT_MS: ${NATS_RECONNECT_WAIT_MS:-1000}
      NATS_MAX_RECONNECT_ATTEMPTS: ${NATS_MAX_RECONNECT_ATTEMPTS:--1}
    volumes:
      - rustpbx-storage:/app/dialog-shadow
    secrets:
      - dialog-shadow-token
      - dialog-shadow-server-key
      - dialog-shadow-server-cert
      - dialog-shadow-ca
      - dialog-recovery-database-url
      - dialog-recovery-current-key
      - dialog-recovery-previous-key
      - dialog-shadow-nats-ca
      - dialog-shadow-nats-cert
      - dialog-shadow-nats-key
      - dialog-shadow-nats-fault-domains
    depends_on:
      rustpbx:
        condition: service_started
      postgres-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const s=net.connect(3212,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(1000,()=>process.exit(1));s.on('error',()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rustpbx-recording-spool:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "--import", "tsx", "src/ivekit-rustpbx-recording-spool.ts"]
    init: true
    restart: unless-stopped
    environment:
      OPC_IVEKIT_RECORDING_BASE_URL: http://ivekit-api:3000
      OPC_IVEKIT_RECORDING_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      OPC_IVEKIT_RECORDING_WORKER_ID: ${RUSTPBX_RECORDING_WORKER_ID:-rustpbx-recording-sidecar}
      OPC_IVEKIT_RECORDING_SPOOL_DIR: /app/recording-spool
      OPC_IVEKIT_RECORDING_STATE_DIR: /app/recording-state
      OPC_IVEKIT_RECORDING_SERVICE_KEY_FILE: /run/secrets/rustpbx-recording-service-key
      OPC_IVEKIT_RECORDING_LEASE_SECRET_FILE: /run/secrets/rustpbx-recording-lease-secret
      OPC_IVEKIT_RECORDING_PART_SIZE_BYTES: ${RUSTPBX_RECORDING_PART_SIZE_BYTES:-8388608}
      OPC_IVEKIT_RECORDING_LEASE_MS: ${RUSTPBX_RECORDING_LEASE_MS:-300000}
      OPC_IVEKIT_RECORDING_UPLOAD_CONCURRENCY: ${RUSTPBX_RECORDING_UPLOAD_CONCURRENCY:-4}
      OPC_IVEKIT_RECORDING_POLL_INTERVAL_MS: ${RUSTPBX_RECORDING_POLL_INTERVAL_MS:-1000}
    volumes:
      - rustpbx-recording-spool:/app/recording-spool
      - rustpbx-recording-state:/app/recording-state
    secrets:
      - rustpbx-recording-service-key
      - rustpbx-recording-lease-secret
    depends_on:
      rustpbx:
        condition: service_started
      opc:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  rustpbx-component-node:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice-capacity", "voice-media-control", "voice-t1"]
    command: ["node", "--import", "tsx", "scripts/ivekit-component-node-admission.ts"]
    init: true
    restart: unless-stopped
    network_mode: service:rustpbx
    environment:
      OPC_IVEKIT_COMPONENT_NODE_HOST: 0.0.0.0
      OPC_IVEKIT_COMPONENT_NODE_PORT: 3210
      OPC_IVEKIT_COMPONENT_NODE_PRODUCTION: "false"
      OPC_IVEKIT_COMPONENT_NODE_REQUIRE_MTLS: "false"
      OPC_IVEKIT_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:?OPC_IVEKIT_COMPONENT_NODE_TOKEN is required}
      OPC_IVEKIT_COMPONENT_NODE_COMPONENT: rustpbx
      OPC_IVEKIT_COMPONENT_NODE_REGION_ID: ${RUSTPBX_COMPONENT_NODE_REGION_ID:?RUSTPBX_COMPONENT_NODE_REGION_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_ZONE_ID: ${RUSTPBX_COMPONENT_NODE_ZONE_ID:?RUSTPBX_COMPONENT_NODE_ZONE_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:?RUSTPBX_OWNER_NODE_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_PROFILE_IDS: ${RUSTPBX_COMPONENT_NODE_PROFILE_IDS:?RUSTPBX_COMPONENT_NODE_PROFILE_IDS is required}
      OPC_IVEKIT_COMPONENT_NODE_PROFILE_REQUIREMENTS_JSON: ${RUSTPBX_COMPONENT_NODE_PROFILE_REQUIREMENTS_JSON:?RUSTPBX_COMPONENT_NODE_PROFILE_REQUIREMENTS_JSON is required}
      OPC_IVEKIT_COMPONENT_NODE_READINESS_PROFILE_IDS: ${RUSTPBX_COMPONENT_NODE_READINESS_PROFILE_IDS:?RUSTPBX_COMPONENT_NODE_READINESS_PROFILE_IDS is required}
      OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS: sip_voice
      OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON: ${RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON:?RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON is required}
      OPC_IVEKIT_COMPONENT_NODE_MEDIA_READINESS_ENABLED: "true"
      OPC_IVEKIT_COMPONENT_NODE_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      OPC_IVEKIT_COMPONENT_NODE_ROUTE_SNAPSHOT_HMAC_KEY_FILE: /run/secrets/route-snapshot-hmac-key
      OPC_IVEKIT_COMPONENT_NODE_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_MEDIA_CONTROL_ENDPOINT: https://localhost:3211/
      OPC_IVEKIT_COMPONENT_NODE_MEDIA_CONTROL_TLS_IDENTITY_FILE: /run/secrets/media-control-client-identity
      OPC_IVEKIT_COMPONENT_NODE_MEDIA_CONTROL_TLS_CA_FILE: /run/secrets/media-control-ca
      OPC_IVEKIT_COMPONENT_NODE_MEDIA_CONTROL_TIMEOUT_MS: ${RUSTPBX_MEDIA_CONTROL_TIMEOUT_MS:-500}
      OPC_IVEKIT_COMPONENT_NODE_MEDIA_READINESS_REFRESH_MS: ${RUSTPBX_MEDIA_READINESS_REFRESH_MS:-1000}
      OPC_IVEKIT_COMPONENT_NODE_TERMINAL_RETENTION_MS: ${RUSTPBX_COMPONENT_NODE_TERMINAL_RETENTION_MS:-300000}
      OPC_IVEKIT_COMPONENT_NODE_SWEEP_INTERVAL_MS: ${RUSTPBX_COMPONENT_NODE_SWEEP_INTERVAL_MS:-1000}
      OPC_IVEKIT_COMPONENT_NODE_RECORDING_SPOOL_METRICS_FILE: /app/recording-state/metrics.json
      OPC_IVEKIT_COMPONENT_NODE_RECORDING_SPOOL_REFRESH_MS: ${RUSTPBX_RECORDING_METRICS_REFRESH_MS:-1000}
      OPC_IVEKIT_COMPONENT_NODE_RECORDING_SPOOL_STALE_MS: ${RUSTPBX_RECORDING_METRICS_STALE_MS:-5000}
    volumes:
      - rustpbx-recording-state:/app/recording-state:ro
      - rustpbx-route-snapshot:/app/route-snapshot:ro
    secrets:
      - route-snapshot-hmac-key
      - media-control-client-identity
      - media-control-ca
    depends_on:
      rustpbx:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true

  cell-admission:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice-capacity", "voice-media-control", "voice-t1"]
    command: ["node", "--import", "tsx", "scripts/ivekit-cell-admission.ts"]
    init: true
    restart: unless-stopped
    user: node
    read_only: true
    environment:
      OPC_DATABASE_URL: postgresql://opc_runtime:${OPC_RUNTIME_DB_PASSWORD:?OPC_RUNTIME_DB_PASSWORD is required}@postgres:5432/opc
      OPC_IVEKIT_CELL_ADMISSION_HOST: 0.0.0.0
      OPC_IVEKIT_CELL_ADMISSION_PORT: "3200"
      OPC_IVEKIT_CELL_ADMISSION_TOKEN: ${OPC_IVEKIT_CELL_ADMISSION_TOKEN:?OPC_IVEKIT_CELL_ADMISSION_TOKEN is required}
      OPC_IVEKIT_CELL_REGION_ID: ${RUSTPBX_COMPONENT_NODE_REGION_ID:?RUSTPBX_COMPONENT_NODE_REGION_ID is required}
      OPC_IVEKIT_CELL_ZONE_ID: ${RUSTPBX_COMPONENT_NODE_ZONE_ID:?RUSTPBX_COMPONENT_NODE_ZONE_ID is required}
      OPC_IVEKIT_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      OPC_IVEKIT_CELL_INSTANCE_ID: ${RUSTPBX_CELL_ADMISSION_INSTANCE_ID:-rustpbx-cell-admission-1}
      OPC_IVEKIT_CELL_LEASE_TTL_MS: ${RUSTPBX_CELL_LEASE_TTL_MS:-30000}
      OPC_IVEKIT_CELL_LEASE_RENEWAL_INTERVAL_MS: ${RUSTPBX_CELL_LEASE_RENEWAL_INTERVAL_MS:-10000}
      OPC_IVEKIT_CELL_LEASE_CLAIM_RETRY_MS: ${RUSTPBX_CELL_LEASE_CLAIM_RETRY_MS:-1000}
      OPC_IVEKIT_CELL_PROFILE_IDS: ${RUSTPBX_COMPONENT_NODE_PROFILE_IDS:?RUSTPBX_COMPONENT_NODE_PROFILE_IDS is required}
      OPC_IVEKIT_CELL_INTERACTION_KINDS: sip_voice
      OPC_IVEKIT_CELL_RESERVATION_TTL_MS: ${RUSTPBX_CELL_RESERVATION_TTL_MS:-10000}
      OPC_IVEKIT_CELL_TERMINAL_RETENTION_MS: ${RUSTPBX_CELL_TERMINAL_RETENTION_MS:-300000}
      OPC_IVEKIT_CELL_SWEEP_INTERVAL_MS: ${RUSTPBX_CELL_SWEEP_INTERVAL_MS:-1000}
      OPC_IVEKIT_CELL_INITIAL_STATE: accepting
      OPC_IVEKIT_CELL_DIMENSIONS_JSON: ${RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON:?RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON is required}
      OPC_IVEKIT_CELL_NODES_JSON: ${RUSTPBX_CELL_NODES_JSON:?RUSTPBX_CELL_NODES_JSON is required}
      OPC_IVEKIT_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:?OPC_IVEKIT_COMPONENT_NODE_TOKEN is required}
      OPC_IVEKIT_COMPONENT_NODE_LEASE_TTL_MS: ${RUSTPBX_COMPONENT_NODE_LEASE_TTL_MS:-30000}
      OPC_IVEKIT_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS: ${RUSTPBX_COMPONENT_NODE_HEARTBEAT_INTERVAL_MS:-10000}
      OPC_IVEKIT_COMPONENT_NODE_TIMEOUT_MS: ${RUSTPBX_COMPONENT_NODE_TIMEOUT_MS:-2000}
    expose:
      - "3200"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      rustpbx-component-node:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3200/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rtpengine-config-validate:
    image: ${IVEKIT_MEDIA_CONTROL_IMAGE_NAME:-ivekit-media-control:local}
    profiles: ["voice-media-control"]
    entrypoint:
      - node
      - --import
      - tsx
      - scripts/ivekit-rtpengine-deployment-preflight.ts
    restart: "no"
    user: node
    read_only: true
    environment:
      IVEKIT_RTPENGINE_IMAGE: ${IVEKIT_RTPENGINE_IMAGE:?IVEKIT_RTPENGINE_IMAGE must be digest-pinned}
      IVEKIT_RTPENGINE_RUNTIME_MODE: userspace
      IVEKIT_RTPENGINE_INTERFACE: ${IVEKIT_RTPENGINE_INTERFACE:?IVEKIT_RTPENGINE_INTERFACE is required}
      IVEKIT_RTPENGINE_PORT_MIN: ${IVEKIT_RTPENGINE_PORT_MIN:-23000}
      IVEKIT_RTPENGINE_PORT_MAX: ${IVEKIT_RTPENGINE_PORT_MAX:-32768}
    tmpfs:
      - /tmp:size=16m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rtpengine:
    image: ${IVEKIT_RTPENGINE_IMAGE:?IVEKIT_RTPENGINE_IMAGE must be digest-pinned}
    profiles: ["voice-media-control"]
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    environment:
      IVEKIT_RTPENGINE_RUNTIME_MODE: userspace
      IVEKIT_RTPENGINE_INTERFACE: ${IVEKIT_RTPENGINE_INTERFACE:?IVEKIT_RTPENGINE_INTERFACE is required}
      IVEKIT_RTPENGINE_LISTEN_NG: 0.0.0.0:22222
      IVEKIT_RTPENGINE_LISTEN_TCP_NG: 0.0.0.0:22222
      IVEKIT_RTPENGINE_LISTEN_HTTP: 0.0.0.0:8080
      IVEKIT_RTPENGINE_PORT_MIN: ${IVEKIT_RTPENGINE_PORT_MIN:-23000}
      IVEKIT_RTPENGINE_PORT_MAX: ${IVEKIT_RTPENGINE_PORT_MAX:-32768}
      IVEKIT_RTPENGINE_MAX_ACTIVE_CALLS: ${IVEKIT_RTPENGINE_MAX_ACTIVE_CALLS:-100000}
      IVEKIT_RTPENGINE_GUARD_MAX_ENTRIES: ${IVEKIT_RTPENGINE_GUARD_MAX_ENTRIES:-1600000}
      IVEKIT_RTPENGINE_REPLAY_SDP_MAX_BYTES: ${IVEKIT_RTPENGINE_REPLAY_SDP_MAX_BYTES:-268435456}
    expose:
      - "22222"
      - "8080"
    ports:
      - "${IVEKIT_RTPENGINE_BIND_ADDRESS:-0.0.0.0}:${IVEKIT_RTPENGINE_PORT_MIN:-23000}-${IVEKIT_RTPENGINE_PORT_MAX:-32768}:${IVEKIT_RTPENGINE_PORT_MIN:-23000}-${IVEKIT_RTPENGINE_PORT_MAX:-32768}/udp"
    tmpfs:
      - /run/ivekit-rtpengine:size=16m,uid=10001,gid=10001,mode=0700
      - /rec:size=64m,uid=10001,gid=10001,mode=0700
    deploy:
      resources:
        limits:
          cpus: ${IVEKIT_RTPENGINE_CPU_LIMIT:-4}
          memory: ${IVEKIT_RTPENGINE_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${IVEKIT_RTPENGINE_CPU_RESERVATION:-1}
          memory: ${IVEKIT_RTPENGINE_MEMORY_RESERVATION:-1G}
    depends_on:
      rtpengine-config-validate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /run/ivekit-rtpengine/runtime.identity && kill -0 1
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  media-control:
    image: ${IVEKIT_MEDIA_CONTROL_IMAGE_NAME:-ivekit-media-control:local}
    build:
      context: ../..
      dockerfile: infra/ivekit/media-control/Dockerfile
      args:
        OPC_SOURCE_COMMIT: ${OPC_SOURCE_COMMIT:-unknown}
    profiles: ["voice-media-control"]
    init: true
    restart: unless-stopped
    user: node
    read_only: true
    network_mode: service:rustpbx
    command: []
    environment:
      IVEKIT_MEDIA_CONTROL_PRODUCTION: "true"
      IVEKIT_MEDIA_CONTROL_REQUIRE_MTLS: "true"
      IVEKIT_MEDIA_CONTROL_TRANSPORT: rtpengine
      IVEKIT_MEDIA_CONTROL_HOST: 127.0.0.1
      IVEKIT_MEDIA_CONTROL_PORT: 3211
      IVEKIT_MEDIA_CONTROL_TOKEN_FILE: /run/secrets/media-control-token
      IVEKIT_MEDIA_CONTROL_TLS_KEY_FILE: /run/secrets/media-control-server-key
      IVEKIT_MEDIA_CONTROL_TLS_CERT_FILE: /run/secrets/media-control-server-cert
      IVEKIT_MEDIA_CONTROL_TLS_CA_FILE: /run/secrets/media-control-ca
      IVEKIT_MEDIA_CONTROL_ADMISSION_ENDPOINT: http://127.0.0.1:3210
      IVEKIT_MEDIA_CONTROL_ADMISSION_TOKEN_FILE: /run/secrets/component-node-token
      IVEKIT_MEDIA_CONTROL_ADMISSION_REQUIRE_MTLS: "false"
      IVEKIT_MEDIA_CONTROL_ADMISSION_HEALTH_INTERVAL_MS: ${IVEKIT_MEDIA_CONTROL_ADMISSION_HEALTH_INTERVAL_MS:-1000}
      IVEKIT_MEDIA_CONTROL_MAX_RESERVATIONS: ${IVEKIT_MEDIA_CONTROL_MAX_RESERVATIONS:-100000}
      IVEKIT_MEDIA_CONTROL_MAX_TERMINAL_RESERVATIONS: ${IVEKIT_MEDIA_CONTROL_MAX_TERMINAL_RESERVATIONS:-100000}
      IVEKIT_MEDIA_CONTROL_MAX_COMMANDS_PER_RESERVATION: ${IVEKIT_MEDIA_CONTROL_MAX_COMMANDS_PER_RESERVATION:-16}
      IVEKIT_MEDIA_CONTROL_TERMINAL_RETENTION_MS: ${IVEKIT_MEDIA_CONTROL_TERMINAL_RETENTION_MS:-300000}
      IVEKIT_MEDIA_CONTROL_EVENT_MAX_BINDINGS: ${IVEKIT_MEDIA_CONTROL_EVENT_MAX_BINDINGS:-100000}
      IVEKIT_MEDIA_CONTROL_EVENT_REPLAY_CAPACITY: ${IVEKIT_MEDIA_CONTROL_EVENT_REPLAY_CAPACITY:-4096}
      IVEKIT_MEDIA_CONTROL_EVENT_MAX_SUBSCRIBERS_PER_OWNER: ${IVEKIT_MEDIA_CONTROL_EVENT_MAX_SUBSCRIBERS_PER_OWNER:-2}
      IVEKIT_MEDIA_CONTROL_SWEEP_INTERVAL_MS: ${IVEKIT_MEDIA_CONTROL_SWEEP_INTERVAL_MS:-1000}
      IVEKIT_MEDIA_CONTROL_ORPHAN_BATCH_SIZE: ${IVEKIT_MEDIA_CONTROL_ORPHAN_BATCH_SIZE:-256}
      IVEKIT_MEDIA_CONTROL_ORPHAN_SWEEP_INTERVAL_MS: ${IVEKIT_MEDIA_CONTROL_ORPHAN_SWEEP_INTERVAL_MS:-30000}
      IVEKIT_MEDIA_CONTROL_WAL_DIRECTORY: /var/lib/ivekit-media-control
      IVEKIT_MEDIA_CONTROL_WAL_MAX_RECORDS: ${IVEKIT_MEDIA_CONTROL_WAL_MAX_RECORDS:-1000000}
      IVEKIT_MEDIA_CONTROL_WAL_MAX_BYTES: ${IVEKIT_MEDIA_CONTROL_WAL_MAX_BYTES:-268435456}
      IVEKIT_MEDIA_CONTROL_WAL_MAX_RECORD_BYTES: ${IVEKIT_MEDIA_CONTROL_WAL_MAX_RECORD_BYTES:-2097152}
      IVEKIT_RTPENGINE_NG_ENDPOINT: tcp://rtpengine:22222
      IVEKIT_RTPENGINE_RUNTIME_MODE: userspace
      IVEKIT_RTPENGINE_MAX_CONNECTIONS: ${IVEKIT_RTPENGINE_MAX_CONNECTIONS:-4}
      IVEKIT_RTPENGINE_MAX_IN_FLIGHT: ${IVEKIT_RTPENGINE_MAX_IN_FLIGHT:-1024}
      IVEKIT_RTPENGINE_MAX_REQUEST_BYTES: ${IVEKIT_RTPENGINE_MAX_REQUEST_BYTES:-1048576}
      IVEKIT_RTPENGINE_MAX_RESPONSE_BYTES: ${IVEKIT_RTPENGINE_MAX_RESPONSE_BYTES:-1048576}
      IVEKIT_RTPENGINE_MAX_QUEUED_BYTES: ${IVEKIT_RTPENGINE_MAX_QUEUED_BYTES:-4194304}
      IVEKIT_RTPENGINE_REQUEST_TIMEOUT_MS: ${IVEKIT_RTPENGINE_REQUEST_TIMEOUT_MS:-2000}
      IVEKIT_RTPENGINE_RECOVERY_CONCURRENCY: ${IVEKIT_RTPENGINE_RECOVERY_CONCURRENCY:-32}
      IVEKIT_RTPENGINE_MAX_SESSIONS: ${IVEKIT_RTPENGINE_MAX_SESSIONS:-100000}
      IVEKIT_RTPENGINE_MAX_COMMANDS: ${IVEKIT_RTPENGINE_MAX_COMMANDS:-1600000}
    volumes:
      - media-control-wal:/var/lib/ivekit-media-control
    secrets:
      - media-control-token
      - media-control-server-key
      - media-control-server-cert
      - media-control-client-identity
      - media-control-ca
      - component-node-token
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      rtpengine:
        condition: service_healthy
      rustpbx:
        condition: service_healthy
      rustpbx-component-node:
        condition: service_started
      cell-admission:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const fs=require('node:fs'),https=require('node:https'),identity=fs.readFileSync('/run/secrets/media-control-client-identity'),ca=fs.readFileSync('/run/secrets/media-control-ca');const r=https.request('https://localhost:3211/readyz',{key:identity,cert:identity,ca},x=>{x.resume();x.on('end',()=>process.exit(x.statusCode===200?0:1))});r.setTimeout(1000,()=>r.destroy());r.on('error',()=>process.exit(1));r.end()
      interval: 5s
      timeout: 2s
      retries: 20
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rustpbx-runtime-recovery:
    image: ${IVEKIT_OPC_IMAGE_NAME:-ivekit-opc:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "--import", "tsx", "scripts/ivekit-rustpbx-recovery.ts"]
    restart: "no"
    network_mode: service:rustpbx
    depends_on:
      rustpbx:
        condition: service_healthy

  opc:
    env_file:
      - path: ${OPC_IVEKIT_VOICE_RUNTIME_ENV_FILE:-./voice-runtime.env}
        required: false
    environment:
      OPC_IVEKIT_VOICE_WORKERS_ENABLED: "1"
      OPC_IVEKIT_CDR_REGION_ID: ${OPC_IVEKIT_CDR_REGION_ID:?OPC_IVEKIT_CDR_REGION_ID is required}
      OPC_IVEKIT_VOICE_ADDRESS_KEY: ${OPC_IVEKIT_VOICE_ADDRESS_KEY:?OPC_IVEKIT_VOICE_ADDRESS_KEY is required}
      OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY: ${OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY:?OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY is required}
      OPC_IVEKIT_VOICE_SECRET_ENV_NAMES: ${OPC_IVEKIT_VOICE_SECRET_ENV_NAMES:-RUSTPBX_MANAGEMENT_TOKEN,RUSTPBX_RWI_TOKEN}
      OPC_IVEKIT_VOICE_WEBHOOK_SECRET_ENV_NAMES: ${OPC_IVEKIT_VOICE_WEBHOOK_SECRET_ENV_NAMES:-RUSTPBX_WEBHOOK_TOKEN}
      RUSTPBX_MANAGEMENT_TOKEN: ${RUSTPBX_MANAGEMENT_TOKEN:?RUSTPBX_MANAGEMENT_TOKEN is required}
      RUSTPBX_RWI_TOKEN: ${RUSTPBX_RWI_TOKEN:?RUSTPBX_RWI_TOKEN is required}
      RUSTPBX_WEBHOOK_TOKEN: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      OPC_IVEKIT_WEBPHONE_ENABLED: "1"
      OPC_IVEKIT_WEBPHONE_WSS_URL: ${OPC_IVEKIT_WEBPHONE_WSS_URL:?OPC_IVEKIT_WEBPHONE_WSS_URL is required}
      OPC_IVEKIT_WEBPHONE_SIP_REALM: ${OPC_IVEKIT_WEBPHONE_SIP_REALM:?OPC_IVEKIT_WEBPHONE_SIP_REALM is required}
      OPC_IVEKIT_WEBPHONE_JWT_SECRET: ${OPC_IVEKIT_WEBPHONE_JWT_SECRET:?OPC_IVEKIT_WEBPHONE_JWT_SECRET is required}
      OPC_IVEKIT_WEBPHONE_JWT_ISSUER: ${OPC_IVEKIT_WEBPHONE_JWT_ISSUER:-ivekit}
      OPC_IVEKIT_WEBPHONE_JWT_AUDIENCE: ${OPC_IVEKIT_WEBPHONE_JWT_AUDIENCE:-rustpbx-webphone}
      OPC_IVEKIT_WEBPHONE_TTL_SECONDS: ${OPC_IVEKIT_WEBPHONE_TTL_SECONDS:-300}
      OPC_IVEKIT_WEBPHONE_REGISTER_EXPIRES_SECONDS: ${OPC_IVEKIT_WEBPHONE_REGISTER_EXPIRES_SECONDS:-240}
      OPC_IVEKIT_WEBPHONE_ICE_SERVERS_JSON: ${OPC_IVEKIT_WEBPHONE_ICE_SERVERS_JSON:-[]}
      OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_ENABLED: "1"
      OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_INTERVAL_MS: ${OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_INTERVAL_MS:-60000}
      OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_TENANT_LIMIT: ${OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_TENANT_LIMIT:-100}
      OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_BATCH_SIZE: ${OPC_IVEKIT_WEBPHONE_SESSION_CLEANUP_BATCH_SIZE:-500}
    depends_on:
      rustpbx:
        condition: service_healthy
        required: false
      rustpbx-runtime-recovery:
        condition: service_completed_successfully
        required: false

volumes:
  rustpbx-runtime-config:
  rustpbx-generated-config:
  rustpbx-route-snapshot:
  rustpbx-storage:
  rustpbx-recording-spool:
  rustpbx-recording-state:
  media-control-wal: {}

secrets:
  rustpbx-cdr-service-key:
    file: ${RUSTPBX_CDR_SERVICE_KEY_FILE:?RUSTPBX_CDR_SERVICE_KEY_FILE is required}
  rustpbx-recording-service-key:
    file: ${RUSTPBX_RECORDING_SERVICE_KEY_FILE:?RUSTPBX_RECORDING_SERVICE_KEY_FILE is required}
  rustpbx-recording-lease-secret:
    file: ${RUSTPBX_RECORDING_LEASE_SECRET_FILE:?RUSTPBX_RECORDING_LEASE_SECRET_FILE is required}
  media-control-token:
    file: ${RUSTPBX_MEDIA_CONTROL_TOKEN_FILE:?RUSTPBX_MEDIA_CONTROL_TOKEN_FILE is required}
  media-control-server-key:
    file: ${RUSTPBX_MEDIA_CONTROL_SERVER_KEY_FILE:?RUSTPBX_MEDIA_CONTROL_SERVER_KEY_FILE is required}
  media-control-server-cert:
    file: ${RUSTPBX_MEDIA_CONTROL_SERVER_CERT_FILE:?RUSTPBX_MEDIA_CONTROL_SERVER_CERT_FILE is required}
  media-control-client-identity:
    file: ${RUSTPBX_MEDIA_CONTROL_CLIENT_IDENTITY_FILE:?RUSTPBX_MEDIA_CONTROL_CLIENT_IDENTITY_FILE is required}
  media-control-ca:
    file: ${RUSTPBX_MEDIA_CONTROL_CA_FILE:?RUSTPBX_MEDIA_CONTROL_CA_FILE is required}
  component-node-token:
    environment: OPC_IVEKIT_COMPONENT_NODE_TOKEN
  route-snapshot-hmac-key:
    environment: RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY
  dialog-shadow-token:
    file: ${RUSTPBX_DIALOG_SHADOW_TOKEN_FILE:-/dev/null}
  dialog-shadow-server-key:
    file: ${RUSTPBX_DIALOG_SHADOW_SERVER_KEY_FILE:-/dev/null}
  dialog-shadow-server-cert:
    file: ${RUSTPBX_DIALOG_SHADOW_SERVER_CERT_FILE:-/dev/null}
  dialog-shadow-client-identity:
    file: ${RUSTPBX_DIALOG_SHADOW_CLIENT_IDENTITY_FILE:-/dev/null}
  dialog-shadow-ca:
    file: ${RUSTPBX_DIALOG_SHADOW_CA_FILE:-/dev/null}
  dialog-recovery-database-url:
    file: ${RUSTPBX_DIALOG_RECOVERY_DATABASE_URL_FILE:-/dev/null}
  dialog-recovery-current-key:
    file: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE:-/dev/null}
  dialog-recovery-previous-key:
    file: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE:-/dev/null}
  dialog-shadow-nats-ca:
    file: ${RUSTPBX_DIALOG_SHADOW_NATS_CA_FILE:-/dev/null}
  dialog-shadow-nats-cert:
    file: ${RUSTPBX_DIALOG_SHADOW_NATS_CERT_FILE:-/dev/null}
  dialog-shadow-nats-key:
    file: ${RUSTPBX_DIALOG_SHADOW_NATS_KEY_FILE:-/dev/null}
  dialog-shadow-nats-fault-domains:
    file: ${RUSTPBX_DIALOG_SHADOW_NATS_FAULT_DOMAINS_FILE:-/dev/null}
