#!KAMAILIO
#
# OPC SIP Edge Proxy
# Routes incoming SIP to RustPBX backend
#

#!define DBURL "sqlite:///etc/kamailio/kamailio.db"

####### Global Parameters #######
debug=2
log_stderror=yes
memdbg=5
memlog=5
children=4
auto_aliases=no

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

####### Modules Section #######
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"

# ----- tm params -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ----- rr params -----
modparam("rr", "append_fromtag", 1)

####### Routing Logic #######
request_route {
    # per request initial checks
    route(REQINIT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # handle retransmissions
    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # record routing for dialog forming requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # handle requests within SIP dialogs
    route(WITHINDLG);

    # Forward to RustPBX
    if (is_method("INVITE")) {
        route(LOCATION);
    }

    # default: reject
    sl_send_reply("404", "Not Found");
    exit;
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }
    if(is_method("OPTIONS") && uri==myself && ($rU==$null)) {
        sl_send_reply("200","OK");
        exit;
    }
    if(!sanity_check("17895", "7")) {
        xlog("Malformed SIP message from $si:$sp\n");
        exit;
    }
}

route[WITHINDLG] {
    if (!has_totag()) return;
    if (loose_route()) {
        route(RELAY);
        exit;
    }
    sl_send_reply("404","Not Found");
    exit;
}

route[LOCATION] {
    # Forward all INVITEs to RustPBX
    $du = "sip:rustpbx:5060";
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
