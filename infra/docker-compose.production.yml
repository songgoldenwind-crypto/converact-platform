      OPC_RUSTDESK_AUTHORIZATION_CODE_SECRET: ${OPC_RUSTDESK_AUTHORIZATION_CODE_SECRET:-}
      OPC_RUSTDESK_REQUIRE_AUTHORIZATION_CODE: ${OPC_RUSTDESK_REQUIRE_AUTHORIZATION_CODE:-0}
      OPC_RUSTDESK_LAUNCH_TOKEN_TTL_MS: ${OPC_RUSTDESK_LAUNCH_TOKEN_TTL_MS:-900000}
      OPC_RUSTDESK_PROTOCOL_URL_TEMPLATE: ${OPC_RUSTDESK_PROTOCOL_URL_TEMPLATE:-}
      OPC_RUSTDESK_REQUIRE_PROTOCOL_URL: ${OPC_RUSTDESK_REQUIRE_PROTOCOL_URL:-0}
      OPC_RUSTDESK_REQUIRE_DEVICE_ONLINE: ${OPC_RUSTDESK_REQUIRE_DEVICE_ONLINE:-0}
      OPC_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT: ${OPC_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT:-0}
      OPC_RUSTDESK_EDGE_TOKEN_SECRET: ${OPC_RUSTDESK_EDGE_TOKEN_SECRET}
      OPC_RUSTDESK_DEVICE_ONLINE_TTL_MS: ${OPC_RUSTDESK_DEVICE_ONLINE_TTL_MS:-300000}
      OPC_RUSTDESK_CHECK_DEVICE_ONLINE: ${OPC_RUSTDESK_CHECK_DEVICE_ONLINE:-0}
      OPC_RUSTDESK_CHECK_OPERATION_AUDIT: ${OPC_RUSTDESK_CHECK_OPERATION_AUDIT:-1}
      OPC_RUSTDESK_CHECK_SERVER_PORTS: ${OPC_RUSTDESK_CHECK_SERVER_PORTS:-0}
      OPC_RUSTDESK_CHECK_HOST: ${OPC_RUSTDESK_CHECK_HOST:-}
      OPC_RUSTDESK_CHECK_TCP_PORTS: ${OPC_RUSTDESK_CHECK_TCP_PORTS:-21115,21116,21117,21118,21119}
      OPC_RUSTDESK_CHECK_UDP_PORTS: ${OPC_RUSTDESK_CHECK_UDP_PORTS:-21116}
      OPC_RUSTDESK_CHECK_TIMEOUT_MS: ${OPC_RUSTDESK_CHECK_TIMEOUT_MS:-1500}
      OPC_RUSTDESK_READINESS_CHECK_DEVICE_ONLINE: ${OPC_RUSTDESK_READINESS_CHECK_DEVICE_ONLINE:-1}
      OPC_RUSTDESK_READINESS_CHECK_OPERATION_AUDIT: ${OPC_RUSTDESK_READINESS_CHECK_OPERATION_AUDIT:-1}
      OPC_RUSTDESK_READINESS_CHECK_SERVER_PORTS: ${OPC_RUSTDESK_READINESS_CHECK_SERVER_PORTS:-1}
      OPC_RUSTDESK_READINESS_REQUIRE_PROTOCOL_URL: ${OPC_RUSTDESK_READINESS_REQUIRE_PROTOCOL_URL:-1}
      OPC_RUSTDESK_READINESS_CHECK_LAUNCH_URL: ${OPC_RUSTDESK_READINESS_CHECK_LAUNCH_URL:-1}
      OPC_RUSTDESK_READINESS_REQUIRE_HTTPS_LAUNCH_URL: ${OPC_RUSTDESK_READINESS_REQUIRE_HTTPS_LAUNCH_URL:-1}
      OPC_RUSTDESK_READINESS_CHECK_PHYSICAL_DISCONNECT: ${OPC_RUSTDESK_READINESS_CHECK_PHYSICAL_DISCONNECT:-0}
      OPC_RUSTDESK_API_TOKEN: ${OPC_RUSTDESK_API_TOKEN}
      OPC_AUTH_ISSUER: http://keycloak:8080/realms/opc
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CHATWOOT_URL: http://chatwoot:3000
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
    secrets:
      - source: rustpbx-cdr-server-key
        target: rustpbx-cdr-server-key
        mode: 0400
      - rustpbx-cdr-server-cert
      - rustpbx-cdr-ca
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - rustdesk_data:/rustdesk:ro
      - realtime_audio_tap:/run/ivekit

  ai-agent:
    build: ../services/ai-agent-py
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      OPC_API_URL: http://opc:3000
      OPC_API_KEY: ${OPC_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.6-27B}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-{"chat_template_kwargs":{"enable_thinking":false}}}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      SPEECH_ASR_PROVIDER: ${SPEECH_ASR_PROVIDER:-funasr}
      SPEECH_ASR_FALLBACK_PROVIDERS: ${SPEECH_ASR_FALLBACK_PROVIDERS:-deepgram,openai}
      SPEECH_TTS_PROVIDER: ${SPEECH_TTS_PROVIDER:-cosyvoice}
      SPEECH_TTS_FALLBACK_PROVIDERS: ${SPEECH_TTS_FALLBACK_PROVIDERS:-cartesia,openai}
      FUNASR_URL: ${FUNASR_URL:-}
      COSYVOICE_URL: ${COSYVOICE_URL:-}
      COSYVOICE_SPK_ID: ${COSYVOICE_SPK_ID:-中文女}
      AI_AGENT_STT_ATTEMPT_TIMEOUT_MS: ${AI_AGENT_STT_ATTEMPT_TIMEOUT_MS:-2000}
      AI_AGENT_LLM_ATTEMPT_TIMEOUT_MS: ${AI_AGENT_LLM_ATTEMPT_TIMEOUT_MS:-1200}
      AI_AGENT_TTS_ATTEMPT_TIMEOUT_MS: ${AI_AGENT_TTS_ATTEMPT_TIMEOUT_MS:-1500}
      AI_AGENT_MAX_UNRECOVERABLE_PROVIDER_ERRORS: ${AI_AGENT_MAX_UNRECOVERABLE_PROVIDER_ERRORS:-3}
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:?NATS_USER is required}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
      NATS_TLS_MODE: disabled
      AI_AGENT_PROMETHEUS_PORT: ${AI_AGENT_PROMETHEUS_PORT:-9090}
      AI_AGENT_VOICE_METRICS_UDP_HOST: 127.0.0.1
      AI_AGENT_VOICE_METRICS_UDP_PORT: ${AI_AGENT_VOICE_METRICS_UDP_PORT:-9125}
    expose:
      - "9090"
    depends_on:
      opc:
        condition: service_started
      nats:
        condition: service_healthy

  # --- Omnichannel ---
  chatwoot:
    image: chatwoot/chatwoot:latest
    profiles: ["omnichannel"]
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3001}
      DATABASE_URL: postgres://opc:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis
    command: bundle exec rails s -p 3000 -b 0.0.0.0

  # --- Frontend ---
  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - opc
      - kong

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  rustpbx-runtime-config:
  rustpbx-generated-config:
  rustpbx-route-snapshot:
  rustpbx-storage:
  rustdesk_data:
  realtime_audio_tap:

secrets:
  rustpbx-cdr-service-key:
    file: ${RUSTPBX_CDR_SERVICE_KEY_FILE:?RUSTPBX_CDR_SERVICE_KEY_FILE is required}
  rustpbx-cdr-server-key:
    file: ${RUSTPBX_CDR_SERVER_KEY_FILE:?RUSTPBX_CDR_SERVER_KEY_FILE is required}
  rustpbx-cdr-server-cert:
    file: ${RUSTPBX_CDR_SERVER_CERT_FILE:?RUSTPBX_CDR_SERVER_CERT_FILE is required}
  rustpbx-cdr-client-identity:
    file: ${RUSTPBX_CDR_CLIENT_IDENTITY_FILE:?RUSTPBX_CDR_CLIENT_IDENTITY_FILE is required}
  rustpbx-cdr-ca:
    file: ${RUSTPBX_CDR_CA_FILE:?RUSTPBX_CDR_CA_FILE is required}
