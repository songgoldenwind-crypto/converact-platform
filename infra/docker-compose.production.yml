      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      NATS_URL: nats://nats:4222
    depends_on:
      - opc
      - nats

  # --- Omnichannel ---
  chatwoot:
    image: chatwoot/chatwoot:latest
    profiles: ["omnichannel"]
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3001}
      DATABASE_URL: postgres://opc:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis
    command: bundle exec rails s -p 3000 -b 0.0.0.0

  # --- Frontend ---
  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - opc
      - kong

