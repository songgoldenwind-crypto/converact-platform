# OPC Production Stack
# Usage: docker compose -f infra/docker-compose.production.yml up -d

services:
  # --- Data Layer ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-postgres-databases.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAINTENANCE_DATABASE: postgres
      OPC_POSTGRES_BOOTSTRAP_DATABASES: keycloak
    volumes:
      - ./scripts/bootstrap-postgres-databases.sh:/bootstrap/bootstrap-postgres-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rustpbx-postgres-bootstrap:
    image: postgres:16-alpine
    profiles: ["voice", "voice-capacity"]
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-postgres-databases.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAINTENANCE_DATABASE: postgres
      OPC_POSTGRES_BOOTSTRAP_DATABASES: rustpbx
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:?RUSTPBX_DB_PASSWORD is required}
    volumes:
      - ./scripts/bootstrap-postgres-databases.sh:/bootstrap/bootstrap-postgres-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: opc
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: opc
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$DB_PASSWORD psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 6432 -U $$DB_USER -d $$DB_NAME -Atqc 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: ${OPC_NATS_IMAGE:?OPC_NATS_IMAGE immutable digest reference is required}
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_CLIENT_USER: ${NATS_USER:?NATS_USER is required}
      NATS_CLIENT_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-minio-bucket.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-recordings}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_INIT_MAX_ATTEMPTS: ${MINIO_INIT_MAX_ATTEMPTS:-30}
      MINIO_INIT_RETRY_SECONDS: ${MINIO_INIT_RETRY_SECONDS:-2}
    volumes:
      - ./scripts/bootstrap-minio-bucket.sh:/bootstrap/bootstrap-minio-bucket.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # --- Auth ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: opc
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  # --- Media Layer ---
  livekit:
    image: ${LIVEKIT_SERVER_IMAGE:?LIVEKIT_SERVER_IMAGE immutable iveKit fork reference is required}
    profiles: ["media-bundled"]
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882-7892:7882-7892/udp"
    volumes:
      - ${OPC_MEDIA_CONFIG_DIR:-../.runtime/media}/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  livekit-sip:
    image: ${LIVEKIT_SIP_IMAGE:?LIVEKIT_SIP_IMAGE immutable reference is required}
    profiles: ["media-bundled"]
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      SIP_PORT: "5061"
    ports:
      - "5061:5061/udp"
      - "5061:5061/tcp"
    depends_on:
      - livekit

  livekit-egress:
    image: livekit/egress:${LIVEKIT_EGRESS_IMAGE_TAG:-v1.13.0}
    profiles: ["media-bundled"]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ${OPC_MEDIA_CONFIG_DIR:-../.runtime/media}/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8091/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  kamailio:
    image: kamailio/kamailio:5.8
    profiles: ["voice", "voice-capacity"]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./config/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    depends_on:
      - rustpbx

  rustpbx-config-render:
    build: ..
    profiles: ["voice", "voice-capacity"]
    command: ["node", "--import", "tsx", "scripts/render-rustpbx-config.ts"]
    environment:
      RUSTPBX_CONFIG_OUTPUT: /app/config/rustpbx.toml
      RUSTPBX_IMAGE: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
      RUSTPBX_DATABASE_URL: postgresql://rustpbx_app@postgres:5432/rustpbx
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:?RUSTPBX_DB_PASSWORD is required}
      RUSTPBX_AMI_ALLOWS: ${RUSTPBX_AMI_ALLOWS:?RUSTPBX_AMI_ALLOWS is required}
      RUSTPBX_MANAGEMENT_TOKEN: ${RUSTPBX_MANAGEMENT_TOKEN:?RUSTPBX_MANAGEMENT_TOKEN is required}
      RUSTPBX_RWI_TOKEN: ${RUSTPBX_RWI_TOKEN:?RUSTPBX_RWI_TOKEN is required}
      RUSTPBX_WEBHOOK_TOKEN: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      RUSTPBX_ROUTER_URL: http://opc:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/router
      RUSTPBX_EXTERNAL_IP: ${RUSTPBX_EXTERNAL_IP:-}
      RUSTPBX_SIP_PORT: "5060"
      RUSTPBX_RTP_START_PORT: "20000"
      RUSTPBX_RTP_END_PORT: "20100"
      RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS: ${RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS:-65536}
      RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS: ${RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS:-65536}
      RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY: ${RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY:-8192}
      RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS: ${RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS:-32768}
      RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY: ${RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY:-64}
      RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS: ${RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS:-2000}
      RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY: ${RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY:-256}
      RUSTPBX_MEDIA_RECORDING_WORKER_THREADS: ${RUSTPBX_MEDIA_RECORDING_WORKER_THREADS:-4}
      RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY: ${RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY:-4096}
      RUSTPBX_REALTIME_AUDIO_TAP_SOCKET_PATH: /run/ivekit/realtime-audio-tap.sock
      RUSTPBX_REALTIME_AUDIO_TAP_CHANNEL_CAPACITY: ${RUSTPBX_REALTIME_AUDIO_TAP_CHANNEL_CAPACITY:-256}
      RUSTPBX_REALTIME_AUDIO_TAP_SEND_TIMEOUT_MS: ${RUSTPBX_REALTIME_AUDIO_TAP_SEND_TIMEOUT_MS:-10}
      RUSTPBX_CALL_RECORD_MAX_CONCURRENT: ${RUSTPBX_CALL_RECORD_MAX_CONCURRENT:-64}
      RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY: ${RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY:-65536}
      RUSTPBX_CALL_RECORD_WORKER_THREADS: ${RUSTPBX_CALL_RECORD_WORKER_THREADS:-1}
    volumes:
      - rustpbx-runtime-config:/app/config
    depends_on:
      rustpbx-postgres-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  rustpbx-route-snapshot:
    build: ..
    profiles: ["voice", "voice-capacity"]
    command: ["node", "--import", "tsx", "src/converact-rustpbx-route-snapshot.ts"]
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://opc:${POSTGRES_PASSWORD}@pgbouncer:6432/opc
      IVEKIT_RUSTPBX_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      IVEKIT_RUSTPBX_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY: ${RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY:?RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS: ${RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS:-1000}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_TTL_MS: ${RUSTPBX_ROUTE_SNAPSHOT_TTL_MS:-10000}
      IVEKIT_RUSTPBX_ROUTE_DEPENDENCIES: ${RUSTPBX_ROUTE_DEPENDENCIES:-}
    volumes:
      - rustpbx-route-snapshot:/app/route-snapshot
    depends_on:
      pgbouncer:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  rustpbx:
    image: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
    profiles: ["voice", "voice-capacity"]
    command: ["--conf", "/app/config/rustpbx.toml"]
    init: true
    restart: unless-stopped
    environment:
      RUSTPBX_ENV: production
      RUSTRTC_UDP_RECEIVE_BUFFER_BYTES: ${RUSTRTC_UDP_RECEIVE_BUFFER_BYTES:-1048576}
      RUSTRTC_UDP_SEND_BUFFER_BYTES: ${RUSTRTC_UDP_SEND_BUFFER_BYTES:-524288}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY: ${RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY:?RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_LOOKUP_HMAC_ROOT_KEY: ${OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY:?OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      IVEKIT_RUSTPBX_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS: ${RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS:-500}
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_URL: http://opc:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/inbound-admission
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_SERVICE_KEY: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      IVEKIT_RUSTPBX_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      IVEKIT_RUSTPBX_OWNER_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:?RUSTPBX_OWNER_NODE_ID is required}
      IVEKIT_RUSTPBX_CDR_SPOOL_DIR: /app/storage/cdr-spool
      IVEKIT_RUSTPBX_CDR_ENDPOINT: ${RUSTPBX_CDR_ENDPOINT:?RUSTPBX_CDR_ENDPOINT is required}
      IVEKIT_RUSTPBX_CDR_REGION_ID: ${OPC_IVEKIT_CDR_REGION_ID:?OPC_IVEKIT_CDR_REGION_ID is required}
      IVEKIT_RUSTPBX_CDR_SERVICE_KEY_FILE: /run/secrets/rustpbx-cdr-service-key
      IVEKIT_RUSTPBX_CDR_TLS_IDENTITY_FILE: /run/secrets/rustpbx-cdr-client-identity
      IVEKIT_RUSTPBX_CDR_TLS_CA_FILE: /run/secrets/rustpbx-cdr-ca
      IVEKIT_RUSTPBX_CDR_POLL_MS: ${RUSTPBX_CDR_POLL_MS:-500}
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS: ${RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS:-250}
      IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED: ${RUSTPBX_COMPONENT_NODE_ENABLED:-false}
      IVEKIT_RUSTPBX_COMPONENT_NODE_URL: http://127.0.0.1:3210
      IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:-}
      IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS: ${RUSTPBX_COMPONENT_NODE_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS: ${RUSTPBX_COMPONENT_NODE_REFRESH_MS:-3000}
    expose:
      - "8080"
      - "3210"
    ports:
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_SIP_PORT:-5060}:5060/udp"
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_SIP_PORT:-5060}:5060/tcp"
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_RTP_START_PORT:-20000}-${RUSTPBX_RTP_END_PORT:-20100}:20000-20100/udp"
    volumes:
      - rustpbx-runtime-config:/app/config:ro
      - rustpbx-generated-config:/app/generated
      - rustpbx-route-snapshot:/app/route-snapshot:ro
      - rustpbx-storage:/app/storage
      - realtime_audio_tap:/run/ivekit
    secrets:
      - rustpbx-cdr-service-key
      - source: rustpbx-cdr-client-identity
        target: rustpbx-cdr-client-identity
        mode: 0400
      - rustpbx-cdr-ca
    depends_on:
      rustpbx-postgres-bootstrap:
        condition: service_completed_successfully
      rustpbx-config-render:
        condition: service_completed_successfully
      rustpbx-route-snapshot:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/rustpbx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  rustpbx-component-node:
    build: ..
    profiles: ["voice-capacity"]
    command: ["node", "--import", "tsx", "scripts/ivekit-component-node-admission.ts"]
    init: true
    restart: unless-stopped
    network_mode: service:rustpbx
    environment:
      OPC_IVEKIT_COMPONENT_NODE_HOST: 0.0.0.0
      OPC_IVEKIT_COMPONENT_NODE_PORT: 3210
      OPC_IVEKIT_COMPONENT_NODE_TOKEN: ${OPC_IVEKIT_COMPONENT_NODE_TOKEN:?OPC_IVEKIT_COMPONENT_NODE_TOKEN is required}
      OPC_IVEKIT_COMPONENT_NODE_COMPONENT: rustpbx
      OPC_IVEKIT_COMPONENT_NODE_REGION_ID: ${RUSTPBX_COMPONENT_NODE_REGION_ID:?RUSTPBX_COMPONENT_NODE_REGION_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_ZONE_ID: ${RUSTPBX_COMPONENT_NODE_ZONE_ID:?RUSTPBX_COMPONENT_NODE_ZONE_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:?RUSTPBX_OWNER_NODE_ID is required}
      OPC_IVEKIT_COMPONENT_NODE_PROFILE_IDS: ${RUSTPBX_COMPONENT_NODE_PROFILE_IDS:?RUSTPBX_COMPONENT_NODE_PROFILE_IDS is required}
      OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS: sip_voice
      OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON: ${RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON:?RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON is required}
      OPC_IVEKIT_COMPONENT_NODE_TERMINAL_RETENTION_MS: ${RUSTPBX_COMPONENT_NODE_TERMINAL_RETENTION_MS:-300000}
      OPC_IVEKIT_COMPONENT_NODE_SWEEP_INTERVAL_MS: ${RUSTPBX_COMPONENT_NODE_SWEEP_INTERVAL_MS:-1000}
    depends_on:
      rustpbx:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rustpbx-runtime-recovery:
    build: ..
    profiles: ["voice", "voice-capacity"]
    command: ["node", "--import", "tsx", "scripts/ivekit-rustpbx-recovery.ts"]
    restart: "no"
    network_mode: service:rustpbx
    depends_on:
      rustpbx:
        condition: service_healthy

  rustdesk-hbbs:
    image: ${RUSTDESK_SERVER_IMAGE:?RUSTDESK_SERVER_IMAGE immutable digest reference is required}
    command: hbbs
    profiles: ["rustdesk"]
    network_mode: "host"
    environment:
      ALWAYS_USE_RELAY: ${RUSTDESK_ALWAYS_USE_RELAY:-N}
    volumes:
      - rustdesk_data:/data
    depends_on:
      - rustdesk-hbbr
    restart: unless-stopped

  rustdesk-hbbr:
    image: ${RUSTDESK_SERVER_IMAGE:?RUSTDESK_SERVER_IMAGE immutable digest reference is required}
    command: hbbr
    profiles: ["rustdesk"]
    network_mode: "host"
    volumes:
      - rustdesk_data:/data
    restart: unless-stopped

  # --- Application Layer ---
  kong:
    image: kong:3.8-alpine
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./config/kong.yml:/etc/kong/kong.yml:ro

  opc:
    env_file:
      - path: ${OPC_IVEKIT_VOICE_RUNTIME_ENV_FILE:-./voice-runtime.env}
        required: false
    build: ..
    expose:
      - "3000"
      - "3010"
      - "3443"
    environment:
      PORT: "3000"
      OPC_IVEKIT_INTERNAL_TLS_PORT: "3443"
      OPC_IVEKIT_INTERNAL_TLS_KEY_FILE: /run/secrets/rustpbx-cdr-server-key
      OPC_IVEKIT_INTERNAL_TLS_CERT_FILE: /run/secrets/rustpbx-cdr-server-cert
      OPC_IVEKIT_INTERNAL_TLS_CLIENT_CA_FILE: /run/secrets/rustpbx-cdr-ca
      DATABASE_URL: postgres://opc:${POSTGRES_PASSWORD}@pgbouncer:6432/opc
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:?NATS_USER is required}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
      NATS_TLS_MODE: disabled
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL is required}
