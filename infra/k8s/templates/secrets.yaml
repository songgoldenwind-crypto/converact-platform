apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  {{- if eq (include "opc.postgresMode" .) "bundled-dev" }}
  database-url: {{ .Values.postgres.connectionString | default (printf "postgresql://%s:%s@%s-postgres:5432/%s" (.Values.postgres.auth.username | default "opc") (.Values.postgres.auth.password | default "opc") .Release.Name (.Values.postgres.auth.database | default "opc")) | quote }}
  {{- end }}
  redis-username: {{ .Values.livekit.redis.username | default "" | quote }}
  redis-password: {{ .Values.livekit.redis.password | default "" | quote }}
  redis-sentinel-username: {{ .Values.livekit.redis.sentinelUsername | default "" | quote }}
  redis-sentinel-password: {{ .Values.livekit.redis.sentinelPassword | default "" | quote }}
  livekit-api-key: {{ include "opc.livekitApiKey" . | quote }}
  livekit-api-secret: {{ include "opc.livekitApiSecret" . | quote }}
  media-api-token: {{ .Values.media.apiToken | default "change-me-media-service-token" | quote }}
  media-invite-secret: {{ .Values.media.inviteSecret | default "change-me-media-invite-secret" | quote }}
  {{- if .Values.media.realtimeAudioTap.enabled }}
  realtime-audio-tap-hmac-secret-b64: {{ required "media.realtimeAudioTap.hmacSecretB64 is required when realtime audio tap is enabled" .Values.media.realtimeAudioTap.hmacSecretB64 | quote }}
  {{- end }}
  opc-api-key: {{ .Values.opc.apiKey | default "change-me-opc-api-key" | quote }}
  opc-jwt-secret: {{ .Values.opc.env.OPC_JWT_SECRET | default "change-me" | quote }}
  tinode-api-key: {{ .Values.tinode.apiKey | default "" | quote }}
  tinode-auth-token: {{ .Values.tinode.authToken | default "" | quote }}
  tinode-basic-password: {{ .Values.tinode.basicPassword | default "" | quote }}
  tinode-user-password-secret: {{ .Values.tinode.userPasswordSecret | default "" | quote }}
  ocr-provider-token: {{ .Values.attachmentProcessing.ocrToken | default "" | quote }}
  asr-provider-token: {{ .Values.attachmentProcessing.asrToken | default "" | quote }}
  quality-review-token: {{ .Values.qualityReview.token | default "" | quote }}
  ivekit-ocr-provider-token: {{ .Values.intelligence.ocrToken | default "" | quote }}
  ivekit-asr-provider-token: {{ .Values.intelligence.asrToken | default "" | quote }}
  ivekit-quality-provider-token: {{ .Values.intelligence.qualityToken | default "" | quote }}
  ivekit-translation-provider-token: {{ .Values.intelligence.translationToken | default "" | quote }}
  rustdesk-api-token: {{ .Values.rustdesk.apiToken | default "change-me-rustdesk-control-token" | quote }}
  rustdesk-launch-secret: {{ .Values.rustdesk.launchSecret | default "change-me-rustdesk-launch-secret" | quote }}
  rustdesk-authorization-code-secret: {{ .Values.rustdesk.authorizationCodeSecret | default "change-me-rustdesk-authorization-code-secret" | quote }}
  rustdesk-edge-token-secret: {{ .Values.rustdesk.edgeTokenSecret | default "change-me-rustdesk-edge-token-secret" | quote }}
  rustdesk-public-key: {{ .Values.rustdesk.publicKey | default "" | quote }}
  rustdesk-server-key: {{ .Values.rustdesk.serverKey | default "" | quote }}
  {{- if .Values.voice.enabled }}
  rustpbx-database-url: {{ printf "postgresql://%s:%s@%s:%v/%s" (.Values.voice.database.username | required "voice.database.username is required") (.Values.voice.database.password | required "voice.database.password is required" | urlquery) (.Values.voice.database.host | default (printf "%s-postgres" .Release.Name)) .Values.voice.database.port (.Values.voice.database.name | required "voice.database.name is required") | quote }}
  rustpbx-management-token: {{ .Values.voice.managementToken | required "voice.managementToken is required" | quote }}
  rustpbx-rwi-token: {{ .Values.voice.rwiToken | required "voice.rwiToken is required" | quote }}
  rustpbx-webhook-token: {{ .Values.voice.webhookToken | required "voice.webhookToken is required" | quote }}
  {{- if .Values.voice.webphone.enabled }}
  rustpbx-webphone-jwt-secret: {{ .Values.voice.webphone.jwtSecret | required "voice.webphone.jwtSecret is required" | quote }}
  {{- end }}
  ivekit-voice-address-key: {{ .Values.voice.addressKey | required "voice.addressKey is required" | quote }}
  ivekit-voice-address-hmac-key: {{ .Values.voice.addressHmacKey | required "voice.addressHmacKey is required" | quote }}
  rustpbx-route-snapshot-hmac-key: {{ .Values.voice.routeSnapshot.hmacKey | required "voice.routeSnapshot.hmacKey is required" | quote }}
  {{- if .Values.voice.mediaControl.enabled }}
  {{ .Values.voice.mediaControl.serviceTokenKey }}: {{ .Values.voice.mediaControl.serviceToken | required "voice.mediaControl.serviceToken is required" | quote }}
  {{- end }}
  {{- if .Values.voice.recordingSpool.enabled }}
  rustpbx-recording-lease-secret: {{ .Values.voice.recordingSpool.leaseSecret | required "voice.recordingSpool.leaseSecret is required" | quote }}
  {{- end }}
  {{- if .Values.voice.componentNode.enabled }}
  ivekit-component-node-token: {{ .Values.voice.componentNode.token | required "voice.componentNode.token is required" | quote }}
  {{- end }}
  {{- if .Values.voice.dialogShadow.enabled }}
  {{ .Values.voice.dialogShadow.serviceTokenKey }}: {{ .Values.voice.dialogShadow.serviceToken | required "voice.dialogShadow.serviceToken is required" | quote }}
  {{ .Values.voice.dialogShadow.recoveryDatabaseUrlKey }}: {{ .Values.voice.dialogShadow.recoveryDatabaseUrl | required "voice.dialogShadow.recoveryDatabaseUrl is required" | quote }}
  {{ .Values.voice.dialogShadow.currentRecoveryKeyKey }}: {{ .Values.voice.dialogShadow.currentRecoveryKey | required "voice.dialogShadow.currentRecoveryKey is required" | quote }}
  {{ .Values.voice.dialogShadow.previousRecoveryKeyKey }}: {{ .Values.voice.dialogShadow.previousRecoveryKey | required "voice.dialogShadow.previousRecoveryKey is required" | quote }}
  {{- end }}
  {{- end }}
