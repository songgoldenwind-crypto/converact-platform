apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  database-url: {{ .Values.postgres.connectionString | default (printf "postgresql://%s:%s@%s-postgres:5432/%s" (.Values.postgres.auth.username | default "opc") (.Values.postgres.auth.password | default "opc") .Release.Name (.Values.postgres.auth.database | default "opc")) | quote }}
  livekit-api-key: {{ include "opc.livekitApiKey" . | quote }}
  livekit-api-secret: {{ include "opc.livekitApiSecret" . | quote }}
  media-api-token: {{ .Values.media.apiToken | default "change-me-media-service-token" | quote }}
  media-invite-secret: {{ .Values.media.inviteSecret | default "change-me-media-invite-secret" | quote }}
  minio-access-key: {{ .Values.media.minioAccessKey | default "minioadmin" | quote }}
  minio-secret-key: {{ .Values.media.minioSecretKey | default "minioadmin" | quote }}
  opc-api-key: {{ .Values.opc.apiKey | default "change-me-opc-api-key" | quote }}
  opc-jwt-secret: {{ .Values.opc.env.OPC_JWT_SECRET | default "change-me" | quote }}
  tinode-api-key: {{ .Values.tinode.apiKey | default "" | quote }}
  tinode-auth-token: {{ .Values.tinode.authToken | default "" | quote }}
  tinode-basic-password: {{ .Values.tinode.basicPassword | default "" | quote }}
  tinode-user-password-secret: {{ .Values.tinode.userPasswordSecret | default "" | quote }}
  ocr-provider-token: {{ .Values.attachmentProcessing.ocrToken | default "" | quote }}
  asr-provider-token: {{ .Values.attachmentProcessing.asrToken | default "" | quote }}
  quality-review-token: {{ .Values.qualityReview.token | default "" | quote }}
  ivekit-ocr-provider-token: {{ .Values.intelligence.ocrToken | default "" | quote }}
  ivekit-asr-provider-token: {{ .Values.intelligence.asrToken | default "" | quote }}
  ivekit-quality-provider-token: {{ .Values.intelligence.qualityToken | default "" | quote }}
  ivekit-translation-provider-token: {{ .Values.intelligence.translationToken | default "" | quote }}
  rustdesk-api-token: {{ .Values.rustdesk.apiToken | default "change-me-rustdesk-control-token" | quote }}
  rustdesk-launch-secret: {{ .Values.rustdesk.launchSecret | default "change-me-rustdesk-launch-secret" | quote }}
  rustdesk-edge-token-secret: {{ .Values.rustdesk.edgeTokenSecret | default "change-me-rustdesk-edge-token-secret" | quote }}
  rustdesk-public-key: {{ .Values.rustdesk.publicKey | default "" | quote }}
  rustdesk-server-key: {{ .Values.rustdesk.serverKey | default "" | quote }}
