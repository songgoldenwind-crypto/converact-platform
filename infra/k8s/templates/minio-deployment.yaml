{{- if .Values.media.minio.enabled }}
{{- $minioImageDigest := required "media.minio.image.digest is required" .Values.media.minio.image.digest }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $minioImageDigest) }}
{{- fail "media.minio.image.digest must be an immutable sha256 digest" }}
{{- end }}
{{- if .Values.media.minio.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.media.minio.persistence.size | default "20Gi" }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.media.minio.image.repository }}:{{ .Values.media.minio.image.tag }}@{{ $minioImageDigest }}"
          imagePullPolicy: {{ .Values.media.minio.image.pullPolicy | default "IfNotPresent" }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "opc.objectStorageSecretName" . }}
                  key: {{ include "opc.objectStorageAccessKeyIdKey" . }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opc.objectStorageSecretName" . }}
                  key: {{ include "opc.objectStorageSecretAccessKeyKey" . }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.media.minio.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.media.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-minio-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
spec:
  type: {{ .Values.media.minio.service.type }}
  selector:
    app: minio
  ports:
    - name: api
      port: {{ .Values.media.minio.service.port }}
      targetPort: 9000
    - name: console
      port: {{ .Values.media.minio.service.consolePort }}
      targetPort: 9001
{{- end }}
