{{- if .Values.voice.enabled }}
{{- $repository := required "voice.image.repository is required" .Values.voice.image.repository -}}
{{- $digest := required "voice.image.digest is required" .Values.voice.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) -}}
{{- fail "voice.image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- $rustpbxImage := printf "%s@%s" $repository $digest -}}
{{- if ne .Values.voice.database.username "rustpbx_app" -}}
{{- fail "voice.database.username must be rustpbx_app" -}}
{{- end -}}
{{- if ne .Values.voice.database.name "rustpbx" -}}
{{- fail "voice.database.name must be rustpbx" -}}
{{- end -}}
{{- $sipPort := int .Values.voice.service.sip.port -}}
{{- $managementPort := int .Values.voice.service.managementPort -}}
{{- $rtpStart := int .Values.voice.service.rtp.startPort -}}
{{- $rtpEnd := int .Values.voice.service.rtp.endPort -}}
{{- if or (lt (sub $rtpEnd $rtpStart) 99) (gt (sub $rtpEnd $rtpStart) 10000) -}}
{{- fail "voice RTP range must contain 100 to 10001 ascending ports" -}}
{{- end -}}
{{- if or (and (ge $sipPort $rtpStart) (le $sipPort $rtpEnd)) (and (ge $managementPort $rtpStart) (le $managementPort $rtpEnd)) -}}
{{- fail "voice RTP range must not overlap SIP or Management ports" -}}
{{- end -}}
{{- $profileId := required "voice.profileId is required" .Values.voice.profileId -}}
{{- $databasePassword := required "voice.database.password is required" .Values.voice.database.password -}}
{{- $databaseHost := .Values.voice.database.host | default (printf "%s-postgres" .Release.Name) -}}
{{- $databaseUrl := printf "postgresql://rustpbx_app:%s@%s:%v/rustpbx" ($databasePassword | urlquery) $databaseHost .Values.voice.database.port -}}
{{- $managementToken := required "voice.managementToken is required" .Values.voice.managementToken -}}
{{- $rwiToken := required "voice.rwiToken is required" .Values.voice.rwiToken -}}
{{- if eq $managementToken $rwiToken -}}
{{- fail "voice.managementToken and voice.rwiToken must be distinct" -}}
{{- end -}}
{{- $webhookToken := required "voice.webhookToken is required" .Values.voice.webhookToken -}}
{{- if not (has "127.0.0.1" .Values.voice.amiAllows) -}}
{{- fail "voice.amiAllows must include 127.0.0.1 for local runtime recovery" -}}
{{- end -}}
{{- if has "*" .Values.voice.amiAllows -}}
{{- fail "voice.amiAllows must not contain a wildcard" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-rustpbx-config
type: Opaque
stringData:
  rustpbx.toml: |
    # Generated by the OPC Helm chart. Do not edit in the running pod.
    http_addr = "0.0.0.0:{{ $managementPort }}"
    log_level = "info"
    database_url = {{ $databaseUrl | quote }}
    rtp_start_port = {{ $rtpStart }}
    rtp_end_port = {{ $rtpEnd }}
    {{- with .Values.voice.externalIp }}
    external_ip = {{ . | quote }}
    {{- end }}
    storage_dir = "/app/storage"

    [console]
    base_path = "/console"
    api_prefix = "/api"
    allow_registration = false
    secure_cookie = false

    [[console.api_tokens]]
    token = {{ $managementToken | quote }}
    scopes = ["extensions.write", "trunks.write", "routing.write"]
    description = "iveKit management adapter"

    [ami]
    allows = [{{- range $index, $allow := .Values.voice.amiAllows }}{{ if $index }}, {{ end }}{{ $allow | quote }}{{- end }}]

    [proxy]
    addr = "0.0.0.0"
    generated_dir = "/app/generated"
    udp_port = {{ $sipPort }}
    tcp_port = {{ $sipPort }}
    modules = ["acl", "auth", "presence", "registrar", "call"]
    media_proxy = "auto"
    ensure_user = true
    acl_rules = ["allow all", "deny all"]

    [[proxy.user_backends]]
    type = "extension"
    ttl = 30

    [proxy.http_router]
    url = {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/router" .Release.Name $profileId | quote }}
    timeout_ms = 3000
    fallback_to_static = false
    fallback_action = "reject"

    [proxy.http_router.headers]
    X-PBX-Key = {{ $webhookToken | quote }}

    [rwi]
    enabled = true
    max_connections = 2000
    max_calls_per_connection = 200
    orphan_hold_secs = 30
    originate_rate_limit = 10

    [[rwi.tokens]]
    token = {{ $rwiToken | quote }}
    scopes = ["call.control", "queue.control", "record.control", "supervisor.control", "media.stream"]

    [callrecord]
    type = "http"
    url = {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/cdrs" .Release.Name $profileId | quote }}
    headers = { "X-PBX-Key" = {{ $webhookToken | quote }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rustpbx
  labels:
    app: rustpbx
spec:
  replicas: {{ .Values.voice.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rustpbx
  template:
    metadata:
      labels:
        app: rustpbx
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.voice.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rustpbx
          image: {{ $rustpbxImage | quote }}
          imagePullPolicy: {{ .Values.voice.image.pullPolicy | default "IfNotPresent" }}
          args: ["--conf", "/app/config/rustpbx.toml"]
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    reload_trunks() {
                      local status=""
                      exec 3<>/dev/tcp/127.0.0.1/{{ $managementPort }} || return 1
                      printf 'POST /ami/v1/reload/trunks HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\nContent-Length: 0\r\n\r\n' >&3
                      IFS= read -r status <&3 || return 1
                      exec 3>&- 3<&-
                      [[ "$status" == *" 200 "* ]]
                    }
                    attempt=0
                    until reload_trunks; do
                      attempt=$((attempt + 1))
                      [ "$attempt" -lt 60 ] || exit 1
                      sleep 1
                    done
          ports:
            - name: management
              containerPort: {{ $managementPort }}
              protocol: TCP
            - name: sip-udp
              containerPort: {{ $sipPort }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ $sipPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: generated
              mountPath: /app/generated
            - name: storage
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.voice.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      volumes:
        - name: config
          secret:
            secretName: {{ .Release.Name }}-rustpbx-config
            defaultMode: 0400
        - name: generated
          emptyDir: {}
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-internal
spec:
  clusterIP: None
  selector:
    app: rustpbx
  ports:
    - name: management
      port: {{ $managementPort }}
      targetPort: management
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-sip
spec:
  type: {{ .Values.voice.service.sip.type }}
  selector:
    app: rustpbx
  ports:
    - name: sip-udp
      port: {{ $sipPort }}
      targetPort: {{ $sipPort }}
      protocol: UDP
    - name: sip-tcp
      port: {{ $sipPort }}
      targetPort: {{ $sipPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-rtp
spec:
  type: {{ .Values.voice.service.rtp.type }}
  selector:
    app: rustpbx
  ports:
    {{- range $port := untilStep $rtpStart (add1 $rtpEnd | int) 1 }}
    - name: rtp-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-rustpbx
spec:
  minAvailable: {{ .Values.voice.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: rustpbx
{{- end }}
