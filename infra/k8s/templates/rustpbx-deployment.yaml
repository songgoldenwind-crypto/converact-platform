{{- if .Values.voice.enabled }}
{{- $repository := required "voice.image.repository is required" .Values.voice.image.repository -}}
{{- if regexMatch "(^|/)restsend/rustpbx$" $repository -}}
{{- fail "voice.image.repository must reference the iveKit-patched RustPBX image, not the unpatched upstream image" -}}
{{- end -}}
{{- $digest := required "voice.image.digest is required" .Values.voice.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) -}}
{{- fail "voice.image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- $rustpbxImage := printf "%s@%s" $repository $digest -}}
{{- if ne .Values.voice.database.username "rustpbx_app" -}}
{{- fail "voice.database.username must be rustpbx_app" -}}
{{- end -}}
{{- if ne .Values.voice.database.name "rustpbx" -}}
{{- fail "voice.database.name must be rustpbx" -}}
{{- end -}}
{{- range $name, $value := dict "maxActiveTransactions" .Values.voice.sipCapacity.maxActiveTransactions "maxFinishedTransactions" .Values.voice.sipCapacity.maxFinishedTransactions "incomingTransactionQueueCapacity" .Values.voice.sipCapacity.incomingTransactionQueueCapacity "maxTransportConnections" .Values.voice.sipCapacity.maxTransportConnections -}}
{{- if or (lt (int $value) 1) (gt (int $value) 10000000) -}}
{{- fail (printf "voice.sipCapacity.%s must be between 1 and 10000000" $name) -}}
{{- end -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.sessionCleanupConcurrency) 1) (gt (int .Values.voice.mediaCapacity.sessionCleanupConcurrency) 4096) -}}
{{- fail "voice.mediaCapacity.sessionCleanupConcurrency must be between 1 and 4096" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs) 1) (gt (int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs) 60000) -}}
{{- fail "voice.mediaCapacity.sessionCleanupTimeoutMs must be between 1 and 60000" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingChannelCapacity) 1) (gt (int .Values.voice.mediaCapacity.recordingChannelCapacity) 65536) -}}
{{- fail "voice.mediaCapacity.recordingChannelCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingWorkerThreads) 1) (gt (int .Values.voice.mediaCapacity.recordingWorkerThreads) 64) -}}
{{- fail "voice.mediaCapacity.recordingWorkerThreads must be between 1 and 64" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity) 1) (gt (int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity) 65536) -}}
{{- fail "voice.mediaCapacity.recordingWorkerQueueCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- $sipPort := int .Values.voice.service.sip.port -}}
{{- $managementPort := int .Values.voice.service.managementPort -}}
{{- $rtpStart := int .Values.voice.service.rtp.startPort -}}
{{- $rtpEnd := int .Values.voice.service.rtp.endPort -}}
{{- if or (lt (sub $rtpEnd $rtpStart) 99) (gt (sub $rtpEnd $rtpStart) 10000) -}}
{{- fail "voice RTP range must contain 100 to 10001 ascending ports" -}}
{{- end -}}
{{- if or (and (ge $sipPort $rtpStart) (le $sipPort $rtpEnd)) (and (ge $managementPort $rtpStart) (le $managementPort $rtpEnd)) -}}
{{- fail "voice RTP range must not overlap SIP or Management ports" -}}
{{- end -}}
{{- $profileId := required "voice.profileId is required" .Values.voice.profileId -}}
{{- $tenantId := required "voice.tenantId is required" .Values.voice.tenantId -}}
{{- $cellId := required "voice.cellId is required" .Values.voice.cellId -}}
{{- if .Values.voice.recordingSpool.enabled -}}
{{- $_ := required "voice.regionId is required when recording spool is enabled" .Values.voice.regionId -}}
{{- $_ := required "voice.zoneId is required when recording spool is enabled" .Values.voice.zoneId -}}
{{- if ne .Values.voice.recordingSpool.leaseSecretKey "rustpbx-recording-lease-secret" -}}
{{- fail "voice.recordingSpool.leaseSecretKey must be rustpbx-recording-lease-secret" -}}
{{- end -}}
{{- $partSizeBytes := int .Values.voice.recordingSpool.partSizeBytes -}}
{{- if or (lt $partSizeBytes 5242880) (gt $partSizeBytes 16777216) -}}
{{- fail "voice.recordingSpool.partSizeBytes must be between 5 MiB and 16 MiB" -}}
{{- end -}}
{{- $uploadConcurrency := int .Values.voice.recordingSpool.uploadConcurrency -}}
{{- if or (lt $uploadConcurrency 1) (gt $uploadConcurrency 64) -}}
{{- fail "voice.recordingSpool.uploadConcurrency must be between 1 and 64" -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.componentNode.enabled -}}
{{- if ne (int .Values.voice.componentNode.port) 3210 -}}
{{- fail "voice.componentNode.port must be 3210" -}}
{{- end -}}
{{- if ne .Values.voice.componentNode.tokenKey "ivekit-component-node-token" -}}
{{- fail "voice.componentNode.tokenKey must be ivekit-component-node-token" -}}
{{- end -}}
{{- $_ := required "voice.componentNode.regionId is required when component-node is enabled" .Values.voice.componentNode.regionId -}}
{{- $_ := required "voice.componentNode.zoneId is required when component-node is enabled" .Values.voice.componentNode.zoneId -}}
{{- $_ := required "voice.componentNode.dimensionsJson is required when component-node is enabled" .Values.voice.componentNode.dimensionsJson -}}
{{- $_ := required "voice.componentNode.token is required when component-node is enabled" .Values.voice.componentNode.token -}}
{{- if empty .Values.voice.componentNode.profileIds -}}
{{- fail "voice.componentNode.profileIds is required when component-node is enabled" -}}
{{- end -}}
{{- end -}}
{{- $opcImage := include "opc.opcImage" . -}}
{{- $databasePassword := required "voice.database.password is required" .Values.voice.database.password -}}
{{- $databaseHost := .Values.voice.database.host | default (printf "%s-postgres" .Release.Name) -}}
{{- $databaseUrl := printf "postgresql://rustpbx_app:%s@%s:%v/rustpbx" ($databasePassword | urlquery) $databaseHost .Values.voice.database.port -}}
{{- $managementToken := required "voice.managementToken is required" .Values.voice.managementToken -}}
{{- $rwiToken := required "voice.rwiToken is required" .Values.voice.rwiToken -}}
{{- if eq $managementToken $rwiToken -}}
{{- fail "voice.managementToken and voice.rwiToken must be distinct" -}}
{{- end -}}
{{- $webhookToken := required "voice.webhookToken is required" .Values.voice.webhookToken -}}
{{- if not (has "127.0.0.1" .Values.voice.amiAllows) -}}
{{- fail "voice.amiAllows must include 127.0.0.1 for local runtime recovery" -}}
{{- end -}}
{{- if has "*" .Values.voice.amiAllows -}}
{{- fail "voice.amiAllows must not contain a wildcard" -}}
{{- end -}}
{{- if .Values.voice.webphone.enabled -}}
{{- $webphoneSecret := required "voice.webphone.jwtSecret is required when WebPhone is enabled" .Values.voice.webphone.jwtSecret -}}
{{- $_ := required "voice.webphone.publicWssUrl is required when WebPhone is enabled" .Values.voice.webphone.publicWssUrl -}}
{{- $_ := required "voice.webphone.sipRealm is required when WebPhone is enabled" .Values.voice.webphone.sipRealm -}}
{{- if lt (len $webphoneSecret) 32 -}}
{{- fail "voice.webphone.jwtSecret must contain at least 32 characters" -}}
{{- end -}}
{{- if or (eq $webphoneSecret $managementToken) (eq $webphoneSecret $rwiToken) (eq $webphoneSecret $webhookToken) -}}
{{- fail "voice.webphone.jwtSecret must be distinct from RustPBX runtime secrets" -}}
{{- end -}}
{{- if .Values.voice.webphone.ingress.enabled -}}
{{- $_ := required "voice.webphone.ingress.host is required when WebPhone ingress is enabled" .Values.voice.webphone.ingress.host -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-rustpbx-config
type: Opaque
stringData:
  rustpbx.toml: |
    # Generated by the OPC Helm chart. Do not edit in the running pod.
    http_addr = "0.0.0.0:{{ $managementPort }}"
    log_level = "info"
    database_url = {{ $databaseUrl | quote }}
    rtp_start_port = {{ $rtpStart }}
    rtp_end_port = {{ $rtpEnd }}
    {{- with .Values.voice.externalIp }}
    external_ip = {{ . | quote }}
    {{- end }}
    storage_dir = "/app/storage"

    [console]
    base_path = "/console"
    api_prefix = "/api"
    allow_registration = false
    secure_cookie = false

    [[console.api_tokens]]
    token = {{ $managementToken | quote }}
    scopes = ["extensions.write", "trunks.write", "routing.write"]
    description = "iveKit management adapter"

    [ami]
    allows = [{{- range $index, $allow := .Values.voice.amiAllows }}{{ if $index }}, {{ end }}{{ $allow | quote }}{{- end }}]

    [proxy]
    addr = "0.0.0.0"
    generated_dir = "/app/generated"
    udp_port = {{ $sipPort }}
    tcp_port = {{ $sipPort }}
    modules = ["acl", "auth", "presence", "registrar", "call"]
    media_proxy = "auto"
    ensure_user = true
    {{- if .Values.voice.webphone.enabled }}
    ws_handler = "/ws"
    {{- end }}
    acl_rules = ["allow all", "deny all"]
    sip_max_active_transactions = {{ int .Values.voice.sipCapacity.maxActiveTransactions }}
    sip_max_finished_transactions = {{ int .Values.voice.sipCapacity.maxFinishedTransactions }}
    sip_incoming_transaction_queue_capacity = {{ int .Values.voice.sipCapacity.incomingTransactionQueueCapacity }}
    sip_max_transport_connections = {{ int .Values.voice.sipCapacity.maxTransportConnections }}
    media_session_cleanup_concurrency = {{ int .Values.voice.mediaCapacity.sessionCleanupConcurrency }}
    media_session_cleanup_timeout_ms = {{ int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs }}
    media_recording_channel_capacity = {{ int .Values.voice.mediaCapacity.recordingChannelCapacity }}
    media_recording_worker_threads = {{ int .Values.voice.mediaCapacity.recordingWorkerThreads }}
    media_recording_worker_queue_capacity = {{ int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity }}

    {{- if .Values.voice.webphone.enabled }}
    [proxy.jwt_auth]
    enabled = true
    secret = {{ .Values.voice.webphone.jwtSecret | quote }}
    user_id_claim = "sub"
    issuer = {{ .Values.voice.webphone.jwtIssuer | quote }}
    audience = {{ .Values.voice.webphone.jwtAudience | quote }}
    check_local_user = true
    ws_token_param = "token"
    dev_mint_enabled = false
    {{- end }}

    [[proxy.user_backends]]
    type = "extension"
    ttl = 30

    [proxy.http_router]
    url = {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/router" .Release.Name $profileId | quote }}
    timeout_ms = 3000
    fallback_to_static = false
    fallback_action = "reject"

    [proxy.http_router.headers]
    X-PBX-Key = {{ $webhookToken | quote }}

    [rwi]
    enabled = true
    max_connections = 2000
    max_calls_per_connection = 200
    orphan_hold_secs = 30
    originate_rate_limit = 10

    [[rwi.tokens]]
    token = {{ $rwiToken | quote }}
    scopes = ["call.control", "queue.control", "record.control", "supervisor.control", "media.stream"]

    [callrecord]
    type = "http"
    max_concurrent = {{ int .Values.voice.callRecordCapacity.maxConcurrent }}
    channel_capacity = {{ int .Values.voice.callRecordCapacity.channelCapacity }}
    worker_threads = {{ int .Values.voice.callRecordCapacity.workerThreads }}
    persist_to_database = false
    url = {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/cdrs" .Release.Name $profileId | quote }}
    headers = { "X-PBX-Key" = {{ $webhookToken | quote }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustpbx
  labels:
    app: rustpbx
spec:
  serviceName: {{ .Release.Name }}-rustpbx-internal
  podManagementPolicy: Parallel
  replicas: {{ .Values.voice.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: rustpbx
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $managementPort | quote }}
        prometheus.io/path: /metrics
      labels:
        app: rustpbx
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.voice.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: route-snapshot-projector
          image: {{ $opcImage | quote }}
          imagePullPolicy: {{ .Values.opc.image.pullPolicy }}
          command: ["node", "--import", "tsx", "src/ivekit-rustpbx-route-snapshot.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: database-url
            - name: IVEKIT_RUSTPBX_ROUTE_TENANT_ID
              value: {{ $tenantId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_PROFILE_ID
              value: {{ $profileId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE
              value: /app/route-snapshot/routes.json
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-route-snapshot-hmac-key
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS
              value: {{ .Values.voice.routeSnapshot.intervalMs | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_TTL_MS
              value: {{ .Values.voice.routeSnapshot.ttlMs | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_DEPENDENCIES
              value: {{ .Values.voice.routeSnapshot.dependencies | quote }}
          volumeMounts:
            - name: route-snapshot
              mountPath: /app/route-snapshot
          securityContext:
            {{- toYaml .Values.voice.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.routeSnapshot.resources | nindent 12 }}
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-spool-uploader
          image: {{ $opcImage | quote }}
          imagePullPolicy: {{ .Values.opc.image.pullPolicy }}
          command: ["node", "--import", "tsx", "src/ivekit-rustpbx-recording-spool.ts"]
          env:
            - name: OPC_IVEKIT_RECORDING_BASE_URL
              value: {{ printf "http://%s-opc:3000" .Release.Name | quote }}
            - name: OPC_IVEKIT_RECORDING_PROFILE_ID
              value: {{ $profileId | quote }}
            - name: OPC_IVEKIT_RECORDING_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_RECORDING_SPOOL_DIR
              value: /app/recording-spool
            - name: OPC_IVEKIT_RECORDING_STATE_DIR
              value: /app/recording-state
            - name: OPC_IVEKIT_RECORDING_SERVICE_KEY_FILE
              value: /run/ivekit-recording-secrets/rustpbx-recording-service-key
            - name: OPC_IVEKIT_RECORDING_LEASE_SECRET_FILE
              value: /run/ivekit-recording-secrets/rustpbx-recording-lease-secret
            - name: OPC_IVEKIT_RECORDING_PART_SIZE_BYTES
              value: {{ .Values.voice.recordingSpool.partSizeBytes | quote }}
            - name: OPC_IVEKIT_RECORDING_LEASE_MS
              value: {{ .Values.voice.recordingSpool.leaseMs | quote }}
            - name: OPC_IVEKIT_RECORDING_UPLOAD_CONCURRENCY
              value: {{ .Values.voice.recordingSpool.uploadConcurrency | quote }}
            - name: OPC_IVEKIT_RECORDING_POLL_INTERVAL_MS
              value: {{ .Values.voice.recordingSpool.pollIntervalMs | quote }}
          volumeMounts:
            - name: recording-spool
              mountPath: /app/recording-spool
            - name: recording-state
              mountPath: /app/recording-state
            - name: recording-secrets
              mountPath: /run/ivekit-recording-secrets
              readOnly: true
          securityContext:
            {{- toYaml .Values.voice.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.recordingSpool.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.voice.componentNode.enabled }}
        - name: component-node-admission
          image: {{ $opcImage | quote }}
          imagePullPolicy: {{ .Values.opc.image.pullPolicy }}
          command: ["node", "--import", "tsx", "scripts/ivekit-component-node-admission.ts"]
          ports:
            - name: component-node
              containerPort: {{ .Values.voice.componentNode.port }}
              protocol: TCP
          env:
            - name: OPC_IVEKIT_COMPONENT_NODE_HOST
              value: "0.0.0.0"
            - name: OPC_IVEKIT_COMPONENT_NODE_PORT
              value: {{ .Values.voice.componentNode.port | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: {{ .Values.voice.componentNode.tokenKey }}
            - name: OPC_IVEKIT_COMPONENT_NODE_COMPONENT
              value: rustpbx
            - name: OPC_IVEKIT_COMPONENT_NODE_REGION_ID
              value: {{ .Values.voice.componentNode.regionId | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_ZONE_ID
              value: {{ .Values.voice.componentNode.zoneId | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_CELL_ID
              value: {{ $cellId | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_COMPONENT_NODE_PROFILE_IDS
              value: {{ join "," .Values.voice.componentNode.profileIds | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS
              value: sip_voice
            - name: OPC_IVEKIT_COMPONENT_NODE_DIMENSIONS_JSON
              value: {{ .Values.voice.componentNode.dimensionsJson | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_TERMINAL_RETENTION_MS
              value: {{ .Values.voice.componentNode.terminalRetentionMs | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_SWEEP_INTERVAL_MS
              value: {{ .Values.voice.componentNode.sweepIntervalMs | quote }}
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: OPC_IVEKIT_COMPONENT_NODE_RECORDING_SPOOL_METRICS_FILE
              value: /app/recording-state/metrics.json
            - name: OPC_IVEKIT_COMPONENT_NODE_RECORDING_SPOOL_REFRESH_MS
              value: {{ .Values.voice.recordingSpool.metricsRefreshMs | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_RECORDING_SPOOL_STALE_MS
              value: {{ .Values.voice.recordingSpool.metricsStaleMs | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: component-node
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: component-node
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            {{- toYaml .Values.voice.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.componentNode.resources | nindent 12 }}
          {{- if .Values.voice.recordingSpool.enabled }}
          volumeMounts:
            - name: recording-state
              mountPath: /app/recording-state
              readOnly: true
          {{- end }}
        {{- end }}
        - name: rustpbx
          image: {{ $rustpbxImage | quote }}
          imagePullPolicy: {{ .Values.voice.image.pullPolicy | default "IfNotPresent" }}
          args: ["--conf", "/app/config/rustpbx.toml"]
          env:
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE
              value: /app/route-snapshot/routes.json
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-route-snapshot-hmac-key
            - name: IVEKIT_RUSTPBX_ROUTE_LOOKUP_HMAC_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-voice-address-hmac-key
            - name: IVEKIT_RUSTPBX_ROUTE_TENANT_ID
              value: {{ $tenantId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_PROFILE_ID
              value: {{ $profileId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS
              value: {{ .Values.voice.routeSnapshot.refreshMs | quote }}
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_URL
              value: {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/inbound-admission" .Release.Name $profileId | quote }}
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-webhook-token
            - name: IVEKIT_RUSTPBX_CELL_ID
              value: {{ $cellId | quote }}
            - name: IVEKIT_RUSTPBX_OWNER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS
              value: "250"
            - name: IVEKIT_RUSTPBX_RECORDING_SPOOL_ENABLED
              value: {{ ternary "true" "false" .Values.voice.recordingSpool.enabled | quote }}
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: IVEKIT_RUSTPBX_RECORDING_SPOOL_DIR
              value: /app/recording-spool
            - name: IVEKIT_RUSTPBX_RECORDING_SEGMENT_SECONDS
              value: {{ .Values.voice.recordingSpool.segmentSeconds | quote }}
            - name: IVEKIT_RUSTPBX_RECORDING_SEGMENT_MAX_BYTES
              value: {{ .Values.voice.recordingSpool.segmentMaxBytes | quote }}
            - name: IVEKIT_REGION_ID
              value: {{ .Values.voice.regionId | quote }}
            - name: IVEKIT_ZONE_ID
              value: {{ .Values.voice.zoneId | quote }}
            {{- end }}
            {{- if .Values.voice.componentNode.enabled }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED
              value: "true"
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_URL
              value: "http://127.0.0.1:3210"
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: {{ .Values.voice.componentNode.tokenKey }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS
              value: {{ .Values.voice.componentNode.timeoutMs | quote }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS
              value: {{ .Values.voice.componentNode.refreshMs | quote }}
            {{- else }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED
              value: "false"
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    reload_trunks() {
                      local status=""
                      exec 3<>/dev/tcp/127.0.0.1/{{ $managementPort }} || return 1
                      printf 'POST /ami/v1/reload/trunks HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\nContent-Length: 0\r\n\r\n' >&3
                      IFS= read -r status <&3 || return 1
                      exec 3>&- 3<&-
                      [[ "$status" == *" 200 "* ]]
                    }
                    attempt=0
                    until reload_trunks; do
                      attempt=$((attempt + 1))
                      [ "$attempt" -lt 60 ] || exit 1
                      sleep 1
                    done
          ports:
            - name: management
              containerPort: {{ $managementPort }}
              protocol: TCP
            - name: sip-udp
              containerPort: {{ $sipPort }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ $sipPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: generated
              mountPath: /app/generated
            - name: route-snapshot
              mountPath: /app/route-snapshot
              readOnly: true
            - name: storage
              mountPath: /app/storage
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: recording-spool
              mountPath: /app/recording-spool
            {{- end }}
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.voice.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      volumes:
        - name: config
          secret:
            secretName: {{ .Release.Name }}-rustpbx-config
            defaultMode: 0400
        - name: generated
          emptyDir: {}
        - name: route-snapshot
          emptyDir: {}
        {{- if not .Values.voice.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-spool
          emptyDir: {}
        - name: recording-state
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: rustpbx-webhook-token
                      path: rustpbx-recording-service-key
                    - key: {{ .Values.voice.recordingSpool.leaseSecretKey }}
                      path: rustpbx-recording-lease-secret
        {{- end }}
        - name: tmp
          emptyDir: {}
  {{- if .Values.voice.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [{{ .Values.voice.persistence.accessMode | quote }}]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.storageSize }}
    {{- if .Values.voice.recordingSpool.enabled }}
    - metadata:
        name: recording-spool
      spec:
        accessModes: [{{ .Values.voice.persistence.accessMode | quote }}]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.recordingSpoolSize }}
    - metadata:
        name: recording-state
      spec:
        accessModes: [{{ .Values.voice.persistence.accessMode | quote }}]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.recordingStateSize }}
    {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-internal
  labels:
    app: rustpbx
spec:
  clusterIP: None
  selector:
    app: rustpbx
  ports:
    - name: management
      port: {{ $managementPort }}
      targetPort: management
      protocol: TCP
    {{- if .Values.voice.componentNode.enabled }}
    - name: component-node
      port: 3210
      targetPort: component-node
      protocol: TCP
    {{- end }}
{{- if and .Values.voice.webphone.enabled .Values.voice.webphone.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-rustpbx-webphone
  {{- with .Values.voice.webphone.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.voice.webphone.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.voice.webphone.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.voice.webphone.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.voice.webphone.ingress.path | quote }}
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-rustpbx-internal
                port:
                  name: management
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-sip
spec:
  type: {{ .Values.voice.service.sip.type }}
  selector:
    app: rustpbx
  ports:
    - name: sip-udp
      port: {{ $sipPort }}
      targetPort: {{ $sipPort }}
      protocol: UDP
    - name: sip-tcp
      port: {{ $sipPort }}
      targetPort: {{ $sipPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-rtp
spec:
  type: {{ .Values.voice.service.rtp.type }}
  selector:
    app: rustpbx
  ports:
    {{- range $port := untilStep $rtpStart (add1 $rtpEnd | int) 1 }}
    - name: rtp-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-rustpbx
spec:
  minAvailable: {{ .Values.voice.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: rustpbx
{{- if .Values.voice.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-rustpbx
  labels:
    app: rustpbx
    {{- with .Values.voice.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: rustpbx
  endpoints:
    - port: management
      path: /metrics
      interval: {{ .Values.voice.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.voice.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- if .Values.voice.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-rustpbx-capacity
  labels:
    app: rustpbx
    {{- with .Values.voice.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ivekit.rustpbx.capacity
      rules:
        - alert: IveKitRustPbxSipTransactionSaturation
          expr: 100 * rustpbx_sip_endpoint_running_transactions / clamp_min(rustpbx_sip_endpoint_active_transaction_limit, 1) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RustPBX SIP active transaction capacity is above 90 percent
        - alert: IveKitRustPbxSipQueueSaturation
          expr: 100 * rustpbx_sip_endpoint_incoming_queue_depth / clamp_min(rustpbx_sip_endpoint_incoming_queue_capacity, 1) > 80
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: RustPBX SIP transaction queue is above 80 percent
        - alert: IveKitRustPbxSipTransportSaturation
          expr: 100 * rustpbx_sip_transport_connections_active / clamp_min(rustpbx_sip_transport_connection_limit, 1) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RustPBX SIP transport connection capacity is above 90 percent
        - alert: IveKitRustPbxSipOverloadRejections
          expr: sum(increase({__name__=~"rustpbx_sip_(endpoint_(active_limit|incoming_queue)_rejections|transport_connection_limit_rejections)_total"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: RustPBX rejected SIP work because a bounded capacity limit was reached
        - alert: IveKitRustPbxRecordingQueueDrops
          expr: sum(increase(rustpbx_media_recording_queue_drops_total[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: RustPBX dropped recording samples to protect live RTP forwarding
        - alert: IveKitRustPbxSessionCleanupDegraded
          expr: sum(increase(rustpbx_media_session_cleanup_total{outcome=~"timed_out|capacity_exhausted"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: RustPBX force-dropped session resources to keep the media loop responsive
{{- end }}
{{- end }}
