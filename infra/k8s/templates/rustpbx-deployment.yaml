              value: {{ .Values.voice.dialogShadow.endpoint | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TOKEN_FILE
              value: /run/dialog-shadow-secrets/service-token
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_PRODUCTION
              value: "true"
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_IDENTITY_FILE
              value: {{ printf "/run/dialog-shadow-client-tls/%s" .Values.voice.dialogShadow.clientIdentity.identityFile | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_CA_FILE
              value: {{ printf "/run/dialog-shadow-client-tls/%s" .Values.voice.dialogShadow.clientIdentity.caFile | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_INFLIGHT
              value: {{ .Values.voice.dialogShadow.rustPbx.maxInflight | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TIMEOUT_MS
              value: {{ .Values.voice.dialogShadow.rustPbx.timeoutMs | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES
              value: {{ .Values.voice.dialogShadow.rustPbx.maxResponseBytes | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS
              value: {{ .Values.voice.dialogShadow.rustPbx.heartbeatIntervalMs | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID
              value: {{ .Values.voice.dialogShadow.currentRecoveryKeyId | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE
              value: /run/dialog-shadow-secrets/recovery-current-key
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID
              value: {{ .Values.voice.dialogShadow.previousRecoveryKeyId | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE
              value: /run/dialog-shadow-secrets/recovery-previous-key
            {{- end }}
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS
              value: "250"
            - name: IVEKIT_RUSTPBX_CDR_SPOOL_DIR
              value: /app/storage/cdr-spool
            - name: IVEKIT_RUSTPBX_CDR_ENDPOINT
              value: {{ $cdrEndpoint | quote }}
            - name: IVEKIT_RUSTPBX_CDR_REGION_ID
              value: {{ .Values.voice.cdr.regionId | quote }}
            - name: IVEKIT_RUSTPBX_CDR_SERVICE_KEY_FILE
              value: /run/cdr-secrets/service-key
            - name: IVEKIT_RUSTPBX_CDR_POLL_MS
              value: {{ .Values.voice.cdr.pollIntervalMs | quote }}
            - name: IVEKIT_RUSTPBX_RECORDING_SPOOL_ENABLED
              value: {{ ternary "true" "false" .Values.voice.recordingSpool.enabled | quote }}
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: IVEKIT_RUSTPBX_RECORDING_SPOOL_DIR
              value: /app/recording-spool
            - name: IVEKIT_RUSTPBX_RECORDING_SEGMENT_SECONDS
              value: {{ .Values.voice.recordingSpool.segmentSeconds | quote }}
            - name: IVEKIT_RUSTPBX_RECORDING_SEGMENT_MAX_BYTES
              value: {{ .Values.voice.recordingSpool.segmentMaxBytes | quote }}
            - name: IVEKIT_REGION_ID
              value: {{ .Values.voice.regionId | quote }}
            - name: IVEKIT_ZONE_ID
              value: {{ .Values.voice.zoneId | quote }}
            {{- end }}
            {{- if .Values.voice.componentNode.enabled }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED
              value: "true"
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_URL
              value: "http://127.0.0.1:3210"
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: {{ .Values.voice.componentNode.tokenKey }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS
              value: {{ .Values.voice.componentNode.timeoutMs | quote }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS
              value: {{ .Values.voice.componentNode.refreshMs | quote }}
            {{- else }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED
              value: "false"
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    reload_trunks() {
                      local status=""
                      exec 3<>/dev/tcp/127.0.0.1/{{ $managementPort }} || return 1
                      printf 'POST /ami/v1/reload/trunks HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\nContent-Length: 0\r\n\r\n' >&3
                      IFS= read -r status <&3 || return 1
                      exec 3>&- 3<&-
                      [[ "$status" == *" 200 "* ]]
                    }
                    attempt=0
                    until reload_trunks; do
                      attempt=$((attempt + 1))
                      [ "$attempt" -lt 60 ] || exit 1
                      sleep 1
                    done
            {{- if .Values.voice.componentNode.enabled }}
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    drain_component_node() {
                      local status=""
                      local payload
                      payload='{"propagation_delay_ms":{{ mul .Values.voice.drainPropagationSeconds 1000 }},"wait_for_reservations_ms":{{ .Values.voice.componentNode.drainWaitMs }},"poll_interval_ms":{{ .Values.voice.componentNode.drainPollMs }}}'
                      exec 3<>/dev/tcp/127.0.0.1/3210 || return 1
                      printf 'POST /v1/drain HTTP/1.1\r\nHost: 127.0.0.1\r\nAuthorization: Bearer %s\r\nConnection: close\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "$IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN" "${#payload}" "$payload" >&3
                      IFS= read -r status <&3 || return 1
                      exec 3>&- 3<&-
                      [[ "$status" == *" 200 "* ]]
                    }
                    drain_component_node
            {{- end }}
          ports:
            - name: management
              containerPort: {{ $managementPort }}
              protocol: TCP
            - name: sip-udp
              containerPort: {{ $sipPort }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ $sipPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: generated
              mountPath: /app/generated
            - name: route-snapshot
              mountPath: /app/route-snapshot
              readOnly: true
            - name: storage
              mountPath: /app/storage
            - name: cdr-secrets
              mountPath: /run/cdr-secrets
              readOnly: true
            {{- if .Values.voice.mediaControl.enabled }}
            - name: media-control-secrets
              mountPath: /run/media-control-secrets
              readOnly: true
            - name: media-control-client-tls
              mountPath: /run/media-control-client-tls
              readOnly: true
            {{- end }}
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: recording-spool
              mountPath: /app/recording-spool
            {{- end }}
            {{- if .Values.media.realtimeAudioTap.enabled }}
            - name: realtime-audio-tap
              mountPath: /run/ivekit
            {{- end }}
            {{- if .Values.voice.dialogShadow.enabled }}
            - name: dialog-shadow-shared-secrets
              mountPath: /run/dialog-shadow-secrets
              readOnly: true
            - name: dialog-shadow-client-tls
              mountPath: /run/dialog-shadow-client-tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.voice.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      volumes:
        - name: config
          secret:
            secretName: {{ .Release.Name }}-rustpbx-config
            defaultMode: 0400
        - name: generated
          emptyDir: {}
        - name: route-snapshot
          emptyDir: {}
        - name: cdr-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: rustpbx-webhook-token
                      path: service-key
        {{- if .Values.voice.mediaControl.enabled }}
        - name: media-control-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: {{ .Values.voice.mediaControl.serviceTokenKey }}
                      path: service-token
        - name: rustpbx-route-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: rustpbx-route-snapshot-hmac-key
                      path: hmac-key
        - name: media-control-client-tls
          secret:
            secretName: {{ .Values.voice.mediaControl.clientTlsSecretName }}
            defaultMode: 0440
        {{- end }}
        {{- if not .Values.voice.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-spool
          emptyDir: {}
        - name: recording-state
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: rustpbx-webhook-token
                      path: rustpbx-recording-service-key
                    - key: {{ .Values.voice.recordingSpool.leaseSecretKey }}
                      path: rustpbx-recording-lease-secret
        {{- end }}
        {{- if .Values.voice.dialogShadow.enabled }}
        - name: dialog-shadow-shared-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: {{ .Values.voice.dialogShadow.serviceTokenKey }}
                      path: service-token
                    - key: {{ .Values.voice.dialogShadow.currentRecoveryKeyKey }}
                      path: recovery-current-key
                    - key: {{ .Values.voice.dialogShadow.previousRecoveryKeyKey }}
                      path: recovery-previous-key
        - name: dialog-shadow-agent-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Release.Name }}-secrets
                  items:
                    - key: {{ .Values.voice.dialogShadow.recoveryDatabaseUrlKey }}
                      path: database-url
        - name: dialog-shadow-server-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.voice.dialogShadow.serverTlsSecretName }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.serverTlsKeyKey }}
                      path: server.key
                    - key: {{ .Values.voice.dialogShadow.serverTlsCertificateKey }}
                      path: server.crt
                    - key: {{ .Values.voice.dialogShadow.serverTlsClientCaKey }}
                      path: client-ca.crt
        - name: dialog-shadow-client-tls
          csi:
            driver: {{ .Values.voice.dialogShadow.clientIdentity.csi.driver | quote }}
            readOnly: {{ .Values.voice.dialogShadow.clientIdentity.csi.readOnly }}
            volumeAttributes:
              {{- toYaml .Values.voice.dialogShadow.clientIdentity.csi.volumeAttributes | nindent 14 }}
        - name: dialog-shadow-nats-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.voice.dialogShadow.nats.tlsSecretName }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.nats.tlsCaKey }}
                      path: ca.crt
                    - key: {{ .Values.voice.dialogShadow.nats.tlsCertificateKey }}
                      path: client.crt
                    - key: {{ .Values.voice.dialogShadow.nats.tlsPrivateKeyKey }}
                      path: client.key
        - name: dialog-shadow-nats-fault-domains
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.voice.dialogShadow.nats.faultDomainsSecretName }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.nats.faultDomainsKey }}
                      path: fault-domains.json
        {{- end }}
        {{- if .Values.media.realtimeAudioTap.enabled }}
        - name: realtime-audio-tap
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.media.realtimeAudioTap.socketVolumeSizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir: {}
  {{- if .Values.voice.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [{{ .Values.voice.persistence.accessMode | quote }}]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.storageSize }}
    {{- if .Values.voice.recordingSpool.enabled }}
    - metadata:
        name: recording-spool
      spec:
        accessModes: [{{ .Values.voice.persistence.accessMode | quote }}]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.recordingSpoolSize }}
    - metadata:
        name: recording-state
      spec:
        accessModes: [{{ .Values.voice.persistence.accessMode | quote }}]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.recordingStateSize }}
    {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-internal
  labels:
    app: rustpbx
spec:
  clusterIP: None
  selector:
    app: rustpbx
  ports:
    - name: management
      port: {{ $managementPort }}
      targetPort: management
      protocol: TCP
    {{- if .Values.voice.componentNode.enabled }}
    - name: component-node
      port: 3210
      targetPort: component-node
      protocol: TCP
    {{- end }}
{{- if and .Values.voice.webphone.enabled .Values.voice.webphone.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-rustpbx-webphone
  {{- with .Values.voice.webphone.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.voice.webphone.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.voice.webphone.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.voice.webphone.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.voice.webphone.ingress.path | quote }}
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-rustpbx-internal
                port:
                  name: management
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-sip
spec:
  type: {{ .Values.voice.service.sip.type }}
  selector:
    app: rustpbx
  ports:
    - name: sip-udp
      port: {{ $sipPort }}
      targetPort: {{ $sipPort }}
      protocol: UDP
    - name: sip-tcp
      port: {{ $sipPort }}
      targetPort: {{ $sipPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustpbx-rtp
spec:
  type: {{ .Values.voice.service.rtp.type }}
  selector:
    app: rustpbx
  ports:
    {{- range $port := untilStep $rtpStart (add1 $rtpEnd | int) 1 }}
    - name: rtp-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-rustpbx
spec:
  minAvailable: {{ .Values.voice.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: rustpbx
{{- if .Values.voice.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-rustpbx
  labels:
    app: rustpbx
    {{- with .Values.voice.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: rustpbx
  endpoints:
    - port: management
      path: /metrics
      interval: {{ .Values.voice.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.voice.monitoring.serviceMonitor.scrapeTimeout }}
    {{- if .Values.voice.componentNode.enabled }}
    - port: component-node
      path: /metrics
      interval: {{ .Values.voice.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.voice.monitoring.serviceMonitor.scrapeTimeout }}
    {{- end }}
{{- end }}
{{- if .Values.voice.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-rustpbx-capacity
  labels:
    app: rustpbx
    {{- with .Values.voice.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ivekit.rustpbx.capacity
      rules:
        - alert: IveKitRustPbxSipTransactionSaturation
          expr: 100 * rustpbx_sip_endpoint_running_transactions / clamp_min(rustpbx_sip_endpoint_active_transaction_limit, 1) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RustPBX SIP active transaction capacity is above 90 percent
        - alert: IveKitRustPbxSipQueueSaturation
          expr: 100 * rustpbx_sip_endpoint_incoming_queue_depth / clamp_min(rustpbx_sip_endpoint_incoming_queue_capacity, 1) > 80
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: RustPBX SIP transaction queue is above 80 percent
        - alert: IveKitRustPbxSipTransportSaturation
          expr: 100 * rustpbx_sip_transport_connections_active / clamp_min(rustpbx_sip_transport_connection_limit, 1) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: RustPBX SIP transport connection capacity is above 90 percent
        - alert: IveKitRustPbxSipOverloadRejections
          expr: sum(increase({__name__=~"rustpbx_sip_(endpoint_(active_limit|incoming_queue)_rejections|transport_connection_limit_rejections)_total"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: RustPBX rejected SIP work because a bounded capacity limit was reached
        - alert: IveKitRustPbxRecordingQueueDrops
          expr: sum(increase(rustpbx_media_recording_queue_drops_total[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: RustPBX dropped recording samples to protect live RTP forwarding
        - alert: IveKitRustPbxSessionCleanupDegraded
          expr: sum(increase(rustpbx_media_session_cleanup_total{outcome=~"timed_out|capacity_exhausted"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: RustPBX force-dropped session resources to keep the media loop responsive
        - alert: IveKitRustPbxOrdinaryRelayCapacityUnavailable
          expr: min(ivekit_rustpbx_media_profile_ready{profile="voice-ordinary-v1"}) < 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: A RustPBX node cannot admit ordinary relayed calls
        - alert: IveKitRustPbxRecordingProfileExhausted
          expr: min(ivekit_rustpbx_media_profile_ready{profile="voice-recording-v1"}) < 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: A RustPBX recording profile is out of safe capacity
        - alert: IveKitRustPbxAiTapProfileExhausted
          expr: min(ivekit_rustpbx_media_profile_ready{profile="voice-ai-tap-v1"}) < 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: A RustPBX AI audio-tap profile is out of safe capacity
{{- end }}
{{- end }}
