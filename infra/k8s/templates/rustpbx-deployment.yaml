{{- if .Values.voice.enabled }}
{{- $repository := required "voice.image.repository is required" .Values.voice.image.repository -}}
{{- if regexMatch "(^|/)restsend/rustpbx$" $repository -}}
{{- fail "voice.image.repository must reference the iveKit-patched RustPBX image, not the unpatched upstream image" -}}
{{- end -}}
{{- $digest := required "voice.image.digest is required" .Values.voice.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) -}}
{{- fail "voice.image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- $rustpbxImage := printf "%s@%s" $repository $digest -}}
{{- if ne .Values.voice.database.username "rustpbx_app" -}}
{{- fail "voice.database.username must be rustpbx_app" -}}
{{- end -}}
{{- if ne .Values.voice.database.name "rustpbx" -}}
{{- fail "voice.database.name must be rustpbx" -}}
{{- end -}}
{{- $cdrEndpoint := required "voice.cdr.endpoint is required when voice is enabled" .Values.voice.cdr.endpoint -}}
{{- $_ := required "voice.cdr.regionId is required when voice is enabled" .Values.voice.cdr.regionId -}}
{{- $admissionProfileIds := list .Values.voice.admissionProfiles.ordinary.id .Values.voice.admissionProfiles.t1.id .Values.voice.admissionProfiles.ivrTranscoding.id .Values.voice.admissionProfiles.recording.id .Values.voice.admissionProfiles.aiTap.id -}}
{{- if ne (len $admissionProfileIds) (len (uniq $admissionProfileIds)) -}}
{{- fail "RustPBX admission profile ids must be distinct" -}}
{{- end -}}
{{- if not (hasPrefix "https://" $cdrEndpoint) -}}
{{- fail "voice.cdr.endpoint must use HTTPS" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.cdr.pollIntervalMs) 100) (gt (int .Values.voice.cdr.pollIntervalMs) 60000) -}}
{{- fail "voice.cdr.pollIntervalMs must be between 100 and 60000" -}}
{{- end -}}
{{- if not .Values.voice.persistence.enabled -}}
{{- fail "voice.persistence.enabled must be true for the durable CDR spool" -}}
{{- end -}}
{{- range $name, $value := dict "maxActiveTransactions" .Values.voice.sipCapacity.maxActiveTransactions "maxFinishedTransactions" .Values.voice.sipCapacity.maxFinishedTransactions "incomingTransactionQueueCapacity" .Values.voice.sipCapacity.incomingTransactionQueueCapacity "maxTransportConnections" .Values.voice.sipCapacity.maxTransportConnections -}}
{{- if or (lt (int $value) 1) (gt (int $value) 10000000) -}}
{{- fail (printf "voice.sipCapacity.%s must be between 1 and 10000000" $name) -}}
{{- end -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.sessionCleanupConcurrency) 1) (gt (int .Values.voice.mediaCapacity.sessionCleanupConcurrency) 4096) -}}
{{- fail "voice.mediaCapacity.sessionCleanupConcurrency must be between 1 and 4096" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs) 1) (gt (int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs) 60000) -}}
{{- fail "voice.mediaCapacity.sessionCleanupTimeoutMs must be between 1 and 60000" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingChannelCapacity) 1) (gt (int .Values.voice.mediaCapacity.recordingChannelCapacity) 65536) -}}
{{- fail "voice.mediaCapacity.recordingChannelCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingWorkerThreads) 1) (gt (int .Values.voice.mediaCapacity.recordingWorkerThreads) 64) -}}
{{- fail "voice.mediaCapacity.recordingWorkerThreads must be between 1 and 64" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity) 1) (gt (int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity) 65536) -}}
{{- fail "voice.mediaCapacity.recordingWorkerQueueCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- range $name, $value := dict "udpReceiveBufferBytes" .Values.voice.mediaCapacity.udpReceiveBufferBytes "udpSendBufferBytes" .Values.voice.mediaCapacity.udpSendBufferBytes -}}
{{- if or (lt (int $value) 65536) (gt (int $value) 16777216) -}}
{{- fail (printf "voice.mediaCapacity.%s must be between 65536 and 16777216" $name) -}}
{{- end -}}
{{- end -}}
{{- if .Values.media.realtimeAudioTap.enabled -}}
{{- if or (lt (int .Values.media.realtimeAudioTap.rustPbxChannelCapacity) 1) (gt (int .Values.media.realtimeAudioTap.rustPbxChannelCapacity) 65536) -}}
{{- fail "media.realtimeAudioTap.rustPbxChannelCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- if or (lt (int .Values.media.realtimeAudioTap.rustPbxSendTimeoutMs) 1) (gt (int .Values.media.realtimeAudioTap.rustPbxSendTimeoutMs) 1000) -}}
{{- fail "media.realtimeAudioTap.rustPbxSendTimeoutMs must be between 1 and 1000" -}}
{{- end -}}
{{- if or (lt (int .Values.media.realtimeAudioTap.projectionQueueMaxItems) 1) (gt (int .Values.media.realtimeAudioTap.projectionQueueMaxItems) 100000) -}}
{{- fail "media.realtimeAudioTap.projectionQueueMaxItems must be between 1 and 100000" -}}
{{- end -}}
{{- if or (lt (int .Values.media.realtimeAudioTap.projectionShutdownTimeoutMs) 10) (gt (int .Values.media.realtimeAudioTap.projectionShutdownTimeoutMs) 30000) -}}
{{- fail "media.realtimeAudioTap.projectionShutdownTimeoutMs must be between 10 and 30000" -}}
{{- end -}}
{{- end -}}
{{- $sipPort := int .Values.voice.service.sip.port -}}
{{- $managementPort := int .Values.voice.service.managementPort -}}
{{- $rtpStart := int .Values.voice.service.rtp.startPort -}}
{{- $rtpEnd := int .Values.voice.service.rtp.endPort -}}
{{- if or (lt (sub $rtpEnd $rtpStart) 99) (gt (sub $rtpEnd $rtpStart) 10000) -}}
{{- fail "voice RTP range must contain 100 to 10001 ascending ports" -}}
{{- end -}}
{{- if or (and (ge $sipPort $rtpStart) (le $sipPort $rtpEnd)) (and (ge $managementPort $rtpStart) (le $managementPort $rtpEnd)) -}}
{{- fail "voice RTP range must not overlap SIP or Management ports" -}}
{{- end -}}
{{- $profileId := required "voice.profileId is required" .Values.voice.profileId -}}
{{- $tenantId := required "voice.tenantId is required" .Values.voice.tenantId -}}
{{- $cellId := required "voice.cellId is required" .Values.voice.cellId -}}
{{- if .Values.voice.recordingSpool.enabled -}}
{{- $_ := required "voice.regionId is required when recording spool is enabled" .Values.voice.regionId -}}
{{- $_ := required "voice.zoneId is required when recording spool is enabled" .Values.voice.zoneId -}}
{{- if ne .Values.voice.recordingSpool.leaseSecretKey "rustpbx-recording-lease-secret" -}}
{{- fail "voice.recordingSpool.leaseSecretKey must be rustpbx-recording-lease-secret" -}}
{{- end -}}
{{- $partSizeBytes := int .Values.voice.recordingSpool.partSizeBytes -}}
{{- if or (lt $partSizeBytes 5242880) (gt $partSizeBytes 16777216) -}}
{{- fail "voice.recordingSpool.partSizeBytes must be between 5 MiB and 16 MiB" -}}
{{- end -}}
{{- $uploadConcurrency := int .Values.voice.recordingSpool.uploadConcurrency -}}
{{- if or (lt $uploadConcurrency 1) (gt $uploadConcurrency 64) -}}
{{- fail "voice.recordingSpool.uploadConcurrency must be between 1 and 64" -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.componentNode.enabled -}}
{{- if ne (int .Values.voice.componentNode.port) 3210 -}}
{{- fail "voice.componentNode.port must be 3210" -}}
{{- end -}}
{{- if ne .Values.voice.componentNode.tokenKey "ivekit-component-node-token" -}}
{{- fail "voice.componentNode.tokenKey must be ivekit-component-node-token" -}}
{{- end -}}
{{- $_ := required "voice.componentNode.regionId is required when component-node is enabled" .Values.voice.componentNode.regionId -}}
{{- $_ := required "voice.componentNode.zoneId is required when component-node is enabled" .Values.voice.componentNode.zoneId -}}
{{- $_ := required "voice.componentNode.dimensionsJson is required when component-node is enabled" .Values.voice.componentNode.dimensionsJson -}}
{{- $_ := required "voice.componentNode.token is required when component-node is enabled" .Values.voice.componentNode.token -}}
{{- if empty .Values.voice.componentNode.profileIds -}}
{{- fail "voice.componentNode.profileIds is required when component-node is enabled" -}}
{{- end -}}
{{- if ne (len .Values.voice.componentNode.profileIds) (len $admissionProfileIds) -}}
{{- fail "voice.componentNode.profileIds must contain every RustPBX admission profile" -}}
{{- end -}}
{{- range $admissionProfileIds -}}
{{- if not (has . $.Values.voice.componentNode.profileIds) -}}
{{- fail "voice.componentNode.profileIds must contain every RustPBX admission profile" -}}
{{- end -}}
{{- end -}}
{{- $_ := required "voice.componentNode.profileRequirementsJson is required" .Values.voice.componentNode.profileRequirementsJson -}}
{{- if empty .Values.voice.componentNode.readinessProfileIds -}}
{{- fail "voice.componentNode.readinessProfileIds is required" -}}
{{- end -}}
{{- $componentDimensions := fromJson .Values.voice.componentNode.dimensionsJson -}}
{{- range $profile := list .Values.voice.admissionProfiles.ordinary .Values.voice.admissionProfiles.t1 .Values.voice.admissionProfiles.ivrTranscoding .Values.voice.admissionProfiles.recording .Values.voice.admissionProfiles.aiTap -}}
{{- if not (hasKey $componentDimensions $profile.dimension) -}}
{{- fail (printf "voice.componentNode.dimensionsJson must contain %s" $profile.dimension) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.mediaControl.enabled -}}
{{- if ne .Values.voice.mediaControl.endpoint "https://localhost:3211/" -}}
{{- fail "voice.mediaControl.endpoint must be https://localhost:3211/" -}}
{{- end -}}
{{- $_ := required "voice.mediaControl.serviceTokenKey is required" .Values.voice.mediaControl.serviceTokenKey -}}
{{- $_ := required "voice.mediaControl.serviceToken is required" .Values.voice.mediaControl.serviceToken -}}
{{- $_ := required "voice.mediaControl.clientTlsSecretName is required" .Values.voice.mediaControl.clientTlsSecretName -}}
{{- if or (ne .Values.voice.mediaControl.mode "ordinary_relay") (ne .Values.voice.mediaControl.failurePolicy "fail_closed") -}}
{{- fail "voice.mediaControl must use ordinary_relay and fail_closed" -}}
{{- end -}}
{{- if not (regexMatch "^(0(\\.[0-9]+)?|1(\\.0+)?)$" .Values.voice.mediaControl.traceSampleRatio) -}}
{{- fail "voice.mediaControl.traceSampleRatio must be between 0 and 1" -}}
{{- end -}}
{{- range $name, $value := dict "identityFile" .Values.voice.mediaControl.identityFile "caFile" .Values.voice.mediaControl.caFile -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" $value) -}}
{{- fail (printf "voice.mediaControl.%s must be a filename" $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.dialogShadow.enabled -}}
{{- if not .Values.voice.persistence.enabled -}}
{{- fail "voice.persistence.enabled must be true when dialog shadow is enabled" -}}
{{- end -}}
{{- if not (regexMatch "^https://localhost:3212/?$" (required "voice.dialogShadow.endpoint is required" .Values.voice.dialogShadow.endpoint)) -}}
{{- fail "voice.dialogShadow.endpoint must be node-local https://localhost:3212/" -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.faultDomain is required" .Values.voice.dialogShadow.faultDomain -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" .Values.voice.dialogShadow.faultDomain) -}}
{{- fail "voice.dialogShadow.faultDomain is invalid" -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?$" .Values.voice.dialogShadow.faultDomain) -}}
{{- fail "voice.dialogShadow.faultDomain must be a Kubernetes fault-domain label" -}}
{{- end -}}
{{- if not (regexMatch "(^[a-z0-9]$)|(^[a-z0-9][a-z0-9.-]{0,251}[a-z0-9]$)" (required "voice.dialogShadow.spiffeTrustDomain is required" .Values.voice.dialogShadow.spiffeTrustDomain)) -}}
{{- fail "voice.dialogShadow.spiffeTrustDomain is invalid" -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.serviceTokenKey is required" .Values.voice.dialogShadow.serviceTokenKey -}}
{{- $_ := required "voice.dialogShadow.serviceToken is required" .Values.voice.dialogShadow.serviceToken -}}
{{- $_ := required "voice.dialogShadow.recoveryDatabaseUrlKey is required" .Values.voice.dialogShadow.recoveryDatabaseUrlKey -}}
{{- $_ := required "voice.dialogShadow.recoveryDatabaseUrl is required" .Values.voice.dialogShadow.recoveryDatabaseUrl -}}
{{- $_ := required "voice.dialogShadow.currentRecoveryKeyId is required" .Values.voice.dialogShadow.currentRecoveryKeyId -}}
{{- $_ := required "voice.dialogShadow.currentRecoveryKeyKey is required" .Values.voice.dialogShadow.currentRecoveryKeyKey -}}
{{- $_ := required "voice.dialogShadow.currentRecoveryKey is required" .Values.voice.dialogShadow.currentRecoveryKey -}}
{{- $_ := required "voice.dialogShadow.previousRecoveryKeyId is required" .Values.voice.dialogShadow.previousRecoveryKeyId -}}
{{- $_ := required "voice.dialogShadow.previousRecoveryKeyKey is required" .Values.voice.dialogShadow.previousRecoveryKeyKey -}}
{{- $_ := required "voice.dialogShadow.previousRecoveryKey is required" .Values.voice.dialogShadow.previousRecoveryKey -}}
{{- if eq .Values.voice.dialogShadow.currentRecoveryKeyId .Values.voice.dialogShadow.previousRecoveryKeyId -}}
{{- fail "voice.dialogShadow recovery key ids must be distinct" -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.serverTlsSecretName is required" .Values.voice.dialogShadow.serverTlsSecretName -}}
{{- $_ := required "voice.dialogShadow.clientIdentity.csi.driver is required" .Values.voice.dialogShadow.clientIdentity.csi.driver -}}
{{- if empty .Values.voice.dialogShadow.clientIdentity.csi.volumeAttributes -}}
{{- fail "voice.dialogShadow.clientIdentity.csi.volumeAttributes must identify a per-Pod certificate provider" -}}
{{- end -}}
{{- range $name, $value := dict "identityFile" .Values.voice.dialogShadow.clientIdentity.identityFile "caFile" .Values.voice.dialogShadow.clientIdentity.caFile -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" $value) -}}
{{- fail (printf "voice.dialogShadow.clientIdentity.%s must be a filename" $name) -}}
{{- end -}}
{{- end -}}
{{- if empty .Values.voice.dialogShadow.nats.urls -}}
{{- fail "voice.dialogShadow.nats.urls must contain TLS NATS endpoints" -}}
{{- end -}}
{{- range .Values.voice.dialogShadow.nats.urls -}}
{{- if not (regexMatch "^tls://[^/@[:space:]]+(:[0-9]+)?$" .) -}}
{{- fail "voice.dialogShadow.nats.urls must contain credential-free tls:// endpoints" -}}
{{- end -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.nats.tlsSecretName is required" .Values.voice.dialogShadow.nats.tlsSecretName -}}
{{- $_ := required "voice.dialogShadow.nats.faultDomainsSecretName is required" .Values.voice.dialogShadow.nats.faultDomainsSecretName -}}
{{- $_ := required "voice.dialogShadow.nats.placementCluster is required" .Values.voice.dialogShadow.nats.placementCluster -}}
{{- if empty .Values.voice.dialogShadow.nats.placementTags -}}
{{- fail "voice.dialogShadow.nats.placementTags is required" -}}
{{- end -}}
{{- $streamReplicas := int .Values.voice.dialogShadow.nats.streamReplicas -}}
{{- if not (or (eq $streamReplicas 3) (eq $streamReplicas 5)) -}}
{{- fail "voice.dialogShadow.nats.streamReplicas must be 3 or 5" -}}
{{- end -}}
{{- $requiredFaultDomains := int .Values.voice.dialogShadow.nats.requiredFaultDomains -}}
{{- if or (lt $requiredFaultDomains 2) (gt $requiredFaultDomains $streamReplicas) -}}
{{- fail "voice.dialogShadow.nats.requiredFaultDomains must be between 2 and streamReplicas" -}}
{{- end -}}
{{- if ge (int .Values.voice.dialogShadow.rustPbx.heartbeatIntervalMs) (int .Values.voice.dialogShadow.recovery.nodeLeaseTtlMs) -}}
{{- fail "voice.dialogShadow.rustPbx.heartbeatIntervalMs must be lower than recovery.nodeLeaseTtlMs" -}}
{{- end -}}
{{- end -}}
{{- $opcImage := include "opc.opcImage" . -}}
{{- $databasePassword := required "voice.database.password is required" .Values.voice.database.password -}}
{{- $databaseHost := .Values.voice.database.host | default (printf "%s-postgres" .Release.Name) -}}
{{- $databaseUrl := printf "postgresql://rustpbx_app:%s@%s:%v/rustpbx" ($databasePassword | urlquery) $databaseHost .Values.voice.database.port -}}
{{- $managementToken := required "voice.managementToken is required" .Values.voice.managementToken -}}
{{- $rwiToken := required "voice.rwiToken is required" .Values.voice.rwiToken -}}
{{- if eq $managementToken $rwiToken -}}
{{- fail "voice.managementToken and voice.rwiToken must be distinct" -}}
{{- end -}}
{{- $webhookToken := required "voice.webhookToken is required" .Values.voice.webhookToken -}}
{{- if not (has "127.0.0.1" .Values.voice.amiAllows) -}}
{{- fail "voice.amiAllows must include 127.0.0.1 for local runtime recovery" -}}
{{- end -}}
{{- if has "*" .Values.voice.amiAllows -}}
{{- fail "voice.amiAllows must not contain a wildcard" -}}
{{- end -}}
{{- if .Values.voice.webphone.enabled -}}
{{- $webphoneSecret := required "voice.webphone.jwtSecret is required when WebPhone is enabled" .Values.voice.webphone.jwtSecret -}}
{{- $_ := required "voice.webphone.publicWssUrl is required when WebPhone is enabled" .Values.voice.webphone.publicWssUrl -}}
{{- $_ := required "voice.webphone.sipRealm is required when WebPhone is enabled" .Values.voice.webphone.sipRealm -}}
{{- if lt (len $webphoneSecret) 32 -}}
{{- fail "voice.webphone.jwtSecret must contain at least 32 characters" -}}
{{- end -}}
{{- if or (eq $webphoneSecret $managementToken) (eq $webphoneSecret $rwiToken) (eq $webphoneSecret $webhookToken) -}}
{{- fail "voice.webphone.jwtSecret must be distinct from RustPBX runtime secrets" -}}
{{- end -}}
{{- if .Values.voice.webphone.ingress.enabled -}}
{{- $_ := required "voice.webphone.ingress.host is required when WebPhone ingress is enabled" .Values.voice.webphone.ingress.host -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-rustpbx-config
type: Opaque
stringData:
  rustpbx.toml: |
    # Generated by the OPC Helm chart. Do not edit in the running pod.
    http_addr = "0.0.0.0:{{ $managementPort }}"
    log_level = "info"
    database_url = {{ $databaseUrl | quote }}
    rtp_start_port = {{ $rtpStart }}
    rtp_end_port = {{ $rtpEnd }}
    {{- with .Values.voice.externalIp }}
    external_ip = {{ . | quote }}
    {{- end }}
    storage_dir = "/app/storage"

    [console]
    base_path = "/console"
    api_prefix = "/api"
    allow_registration = false
    secure_cookie = false

    [[console.api_tokens]]
    token = {{ $managementToken | quote }}
    scopes = ["extensions.write", "trunks.write", "routing.write"]
    description = "iveKit management adapter"

    [ami]
    allows = [{{- range $index, $allow := .Values.voice.amiAllows }}{{ if $index }}, {{ end }}{{ $allow | quote }}{{- end }}]

    [proxy]
    addr = "0.0.0.0"
    generated_dir = "/app/generated"
    udp_port = {{ $sipPort }}
    tcp_port = {{ $sipPort }}
    modules = ["acl", "auth", "presence", "registrar", "call"]
    media_proxy = "auto"
    ensure_user = true
    {{- if .Values.voice.webphone.enabled }}
    ws_handler = "/ws"
    {{- end }}
    acl_rules = ["allow all", "deny all"]
    sip_max_active_transactions = {{ int .Values.voice.sipCapacity.maxActiveTransactions }}
    sip_max_finished_transactions = {{ int .Values.voice.sipCapacity.maxFinishedTransactions }}
    sip_incoming_transaction_queue_capacity = {{ int .Values.voice.sipCapacity.incomingTransactionQueueCapacity }}
    sip_max_transport_connections = {{ int .Values.voice.sipCapacity.maxTransportConnections }}
    media_session_cleanup_concurrency = {{ int .Values.voice.mediaCapacity.sessionCleanupConcurrency }}
    media_session_cleanup_timeout_ms = {{ int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs }}
    media_recording_channel_capacity = {{ int .Values.voice.mediaCapacity.recordingChannelCapacity }}
    media_recording_worker_threads = {{ int .Values.voice.mediaCapacity.recordingWorkerThreads }}
    media_recording_worker_queue_capacity = {{ int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity }}
    {{- if .Values.media.realtimeAudioTap.enabled }}
    realtime_audio_tap_socket_path = "/run/ivekit/realtime-audio-tap.sock"
    realtime_audio_tap_channel_capacity = {{ int .Values.media.realtimeAudioTap.rustPbxChannelCapacity }}
    realtime_audio_tap_send_timeout_ms = {{ int .Values.media.realtimeAudioTap.rustPbxSendTimeoutMs }}
    {{- end }}

    {{- if .Values.voice.webphone.enabled }}
    [proxy.jwt_auth]
    enabled = true
    secret = {{ .Values.voice.webphone.jwtSecret | quote }}
    user_id_claim = "sub"
    issuer = {{ .Values.voice.webphone.jwtIssuer | quote }}
    audience = {{ .Values.voice.webphone.jwtAudience | quote }}
    check_local_user = true
    ws_token_param = "token"
    dev_mint_enabled = false
    {{- end }}

    [[proxy.user_backends]]
    type = "extension"
    ttl = 30

    [proxy.http_router]
    url = {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/router" .Release.Name $profileId | quote }}
    timeout_ms = 3000
    fallback_to_static = false
    fallback_action = "reject"

    [proxy.http_router.headers]
    X-PBX-Key = {{ $webhookToken | quote }}

    [rwi]
    enabled = true
    max_connections = 2000
    max_calls_per_connection = 200
    orphan_hold_secs = 30
    originate_rate_limit = 10

    [[rwi.tokens]]
    token = {{ $rwiToken | quote }}
    scopes = ["call.control", "queue.control", "record.control", "supervisor.control", "media.stream"]

    [callrecord]
    type = "http"
    max_concurrent = {{ int .Values.voice.callRecordCapacity.maxConcurrent }}
    channel_capacity = {{ int .Values.voice.callRecordCapacity.channelCapacity }}
    worker_threads = {{ int .Values.voice.callRecordCapacity.workerThreads }}
    persist_to_database = false
    url = {{ printf "http://%s-opc:3000/api/ivekit/voice/providers/%s/cdrs" .Release.Name $profileId | quote }}
    headers = { "X-PBX-Key" = {{ $webhookToken | quote }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustpbx
  labels:
    app: rustpbx
spec:
  serviceName: {{ .Release.Name }}-rustpbx-internal
  podManagementPolicy: Parallel
  replicas: {{ .Values.voice.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: rustpbx
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $managementPort | quote }}
        prometheus.io/path: /metrics
      labels:
        app: rustpbx
        {{- if .Values.voice.dialogShadow.enabled }}
        ivekit.io/t1-shadow-fault-domain: {{ .Values.voice.dialogShadow.faultDomain | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.voice.terminationGracePeriodSeconds }}
      hostNetwork: {{ .Values.voice.network.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.voice.scheduling.hostnameTopologyKey | quote }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: rustpbx
        - maxSkew: 1
          topologyKey: {{ .Values.voice.scheduling.zoneTopologyKey | quote }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: rustpbx
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .Values.voice.scheduling.hostnameTopologyKey | quote }}
              labelSelector:
                matchLabels:
                  app: rustpbx
      nodeSelector:
        {{- toYaml .Values.voice.scheduling.nodeSelector | nindent 8 }}
      {{- with .Values.voice.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.voice.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: route-snapshot-projector
          image: {{ $opcImage | quote }}
          imagePullPolicy: {{ .Values.opc.image.pullPolicy }}
          command: ["node", "--import", "tsx", "src/ivekit-rustpbx-route-snapshot.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
