            - name: RUSTPBX_RWI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-rwi-token
            - name: RUSTPBX_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-webhook-token
            {{- if .Values.voice.webphone.enabled }}
            - name: OPC_IVEKIT_WEBPHONE_ENABLED
