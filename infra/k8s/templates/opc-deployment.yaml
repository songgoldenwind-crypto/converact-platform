{{- if .Values.media.sip.gatewayEnabled }}
{{- if not .Values.voice.enabled }}
{{- fail "media.sip.gatewayEnabled requires voice.enabled so the RustPBX RWI token is available" }}
{{- end }}
{{- required "media.sip.bridgeTarget is required when the SIP/VoLTE gateway is enabled" .Values.media.sip.bridgeTarget }}
{{- required "media.sip.rustpbxTrunk is required when the SIP/VoLTE gateway is enabled" .Values.media.sip.rustpbxTrunk }}
{{- required "media.sip.rustpbxRwiUrl is required when the SIP/VoLTE gateway is enabled" .Values.media.sip.rustpbxRwiUrl }}
{{- end }}
{{- if .Values.voice.enabled }}
{{- required "voice.cdr.regionId is required when voice is enabled" .Values.voice.cdr.regionId }}
{{- required "voice.cdr.tls.secretName is required when voice is enabled" .Values.voice.cdr.tls.secretName }}
{{- end }}
{{- if .Values.media.realtimeAudioTap.enabled }}
{{- if or (lt (int .Values.media.realtimeAudioTap.projectionQueueMaxItems) 1) (gt (int .Values.media.realtimeAudioTap.projectionQueueMaxItems) 100000) }}
{{- fail "media.realtimeAudioTap.projectionQueueMaxItems must be between 1 and 100000" }}
{{- end }}
{{- if or (lt (int .Values.media.realtimeAudioTap.projectionShutdownTimeoutMs) 10) (gt (int .Values.media.realtimeAudioTap.projectionShutdownTimeoutMs) 30000) }}
{{- fail "media.realtimeAudioTap.projectionShutdownTimeoutMs must be between 10 and 30000" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opc
  labels:
    app: opc
spec:
  replicas: {{ .Values.opc.replicaCount }}
  selector:
    matchLabels:
      app: opc
  template:
    metadata:
      labels:
        app: opc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: opc
          image: {{ include "opc.opcImage" . | quote }}
          imagePullPolicy: {{ .Values.opc.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            {{- if .Values.voice.enabled }}
            - name: internal-tls
              containerPort: 3443
              protocol: TCP
            {{- end }}
            {{- if .Values.media.realtimeAudioTap.enabled }}
            - name: audio-tap
              containerPort: {{ .Values.media.realtimeAudioTap.listenPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: PORT
              value: "3000"
            {{- if .Values.voice.enabled }}
            - name: OPC_IVEKIT_INTERNAL_TLS_PORT
              value: "3443"
            - name: OPC_IVEKIT_INTERNAL_TLS_KEY_FILE
              value: /run/ivekit-cdr-tls/server.key
            - name: OPC_IVEKIT_INTERNAL_TLS_CERT_FILE
              value: /run/ivekit-cdr-tls/server.crt
            - name: OPC_IVEKIT_INTERNAL_TLS_CLIENT_CA_FILE
              value: /run/ivekit-cdr-tls/ca.crt
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opc.databaseUrlSecretName" . }}
                  key: {{ include "opc.databaseUrlSecretKey" . }}
            {{ include "opc.redisClientEnv" . | nindent 12 }}
            {{ if .Values.nats.enabled }}
            - name: NATS_URL
              {{ if .Values.nats.tls.enabled }}
              value: tls://{{ .Release.Name }}-nats:4222
              {{ else }}
              value: nats://{{ .Release.Name }}-nats:4222
              {{ end }}
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "nats.auth.existingSecret is required when NATS is enabled" .Values.nats.auth.existingSecret }}
                  key: {{ .Values.nats.auth.userKey }}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "nats.auth.existingSecret is required when NATS is enabled" .Values.nats.auth.existingSecret }}
                  key: {{ .Values.nats.auth.passwordKey }}
            - name: NATS_TLS_MODE
              value: {{ ternary "required" "disabled" .Values.nats.tls.enabled | quote }}
            {{ if .Values.nats.tls.enabled }}
            - name: NATS_TLS_CA_FILE
              value: /etc/nats/tls/{{ .Values.nats.tls.caKey }}
            - name: NATS_TLS_CERT_FILE
              value: /etc/nats/tls/{{ .Values.nats.tls.certKey }}
            - name: NATS_TLS_KEY_FILE
              value: /etc/nats/tls/{{ .Values.nats.tls.keyKey }}
            {{ end }}
            {{ end }}
            - name: LIVEKIT_URL
              value: {{ include "opc.livekitInternalUrl" . | quote }}
            - name: LIVEKIT_PUBLIC_URL
              value: {{ include "opc.livekitPublicUrl" . | quote }}
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: livekit-api-secret
            - name: OPC_MEDIA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: media-api-token
            - name: OPC_MEDIA_INVITE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: media-invite-secret
            {{- if .Values.media.realtimeAudioTap.enabled }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_ENABLED
              value: "1"
            - name: OPC_IVEKIT_RUSTPBX_AUDIO_TAP_GATEWAY_ENABLED
              value: "0"
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_GATEWAY_ENABLED
              value: "1"
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_HMAC_SECRET_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: realtime-audio-tap-hmac-secret-b64
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_TOKEN_TTL_SECONDS
              value: {{ .Values.media.realtimeAudioTap.tokenTtlSeconds | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_LISTEN_HOST
              value: 0.0.0.0
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_LISTEN_PORT
              value: {{ .Values.media.realtimeAudioTap.listenPort | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_PATH
              value: {{ .Values.media.realtimeAudioTap.path | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_GATEWAY_URL
              value: {{ printf "ws://$(POD_NAME).%s-opc-audio-tap.%s.svc:%v%s" .Release.Name .Release.Namespace .Values.media.realtimeAudioTap.listenPort .Values.media.realtimeAudioTap.path | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_MAX_CONNECTIONS
              value: {{ .Values.media.realtimeAudioTap.maxConnections | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_PRESTART_BUFFER_MS
              value: {{ .Values.media.realtimeAudioTap.prestartBufferMs | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_MAX_PAYLOAD_BYTES
              value: {{ .Values.media.realtimeAudioTap.maxPayloadBytes | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_IDLE_TIMEOUT_MS
              value: {{ .Values.media.realtimeAudioTap.idleTimeoutMs | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_START_TIMEOUT_MS
              value: {{ .Values.media.realtimeAudioTap.startTimeoutMs | quote }}
            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.media.realtimeAudioTap.shutdownTimeoutMs | quote }}
            - name: OPC_IVEKIT_REALTIME_PROJECTION_QUEUE_MAX_ITEMS
              value: {{ .Values.media.realtimeAudioTap.projectionQueueMaxItems | quote }}
            - name: OPC_IVEKIT_REALTIME_PROJECTION_SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.media.realtimeAudioTap.projectionShutdownTimeoutMs | quote }}
            - name: OPC_REALTIME_SPEECH_RETENTION_DAYS
              value: {{ .Values.media.realtimeAudioTap.retentionDays | quote }}
            {{- end }}
            - name: OPC_MEDIA_INVITE_TTL_MS
              value: {{ .Values.media.inviteTtlMs | default "86400000" | quote }}
            - name: OPC_MEDIA_RECORDING_RETENTION_DAYS
              value: {{ .Values.media.recordingRetentionDays | default "90" | quote }}
            - name: OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_ENABLED
              value: {{ ternary "1" "0" (and .Values.media.egress.enabled .Values.media.egress.capacityMetrics.enabled) | quote }}
            - name: OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_INTERVAL_MS
              value: {{ .Values.media.egress.capacityMetrics.intervalMs | quote }}
            - name: OPC_LIVEKIT_INGRESS_ENABLED
              value: {{ ternary "1" "0" .Values.media.ingress.enabled | quote }}
            - name: OPC_LIVEKIT_INGRESS_REQUEST_TIMEOUT_MS
              value: {{ .Values.media.ingress.requestTimeoutMs | quote }}
            - name: OPC_LIVEKIT_INGRESS_PULL_HOST_ALLOWLIST
              value: {{ .Values.media.ingress.pullHostAllowlist | quote }}
            - name: OPC_LIVEKIT_INGRESS_ALLOW_HTTP_URL
              value: {{ ternary "1" "0" .Values.media.ingress.allowHttpUrl | quote }}
            - name: OPC_RECORDING_HTTP_ALLOWED_ORIGINS
              value: {{ .Values.media.recordingHttpAllowedOrigins | default (printf "http://%s-minio:9000" .Release.Name) | quote }}
            - name: OPC_RECORDING_HTTP_TIMEOUT_MS
              value: {{ .Values.media.recordingHttpTimeoutMs | default "15000" | quote }}
            - name: OPC_MEDIA_SMOKE_VERIFY_RECORDING_OBJECT
              value: {{ .Values.media.smokeVerifyRecordingObject | default "0" | quote }}
            - name: OPC_MEDIA_SMOKE_RECORDING_OBJECT_TIMEOUT_MS
              value: {{ .Values.media.smokeRecordingObjectTimeoutMs | default "60000" | quote }}
            - name: OPC_MEDIA_SMOKE_RECORDING_OBJECT_POLL_INTERVAL_MS
              value: {{ .Values.media.smokeRecordingObjectPollIntervalMs | default "2000" | quote }}
            - name: OPC_SIP_VOLTE_ENABLED
              value: {{ ternary "1" "0" .Values.media.sip.gatewayEnabled | quote }}
            - name: LIVEKIT_SIP_BRIDGE_TARGET
              value: {{ .Values.media.sip.bridgeTarget | default "" | quote }}
            - name: RUSTPBX_LIVEKIT_TRUNK
              value: {{ .Values.media.sip.rustpbxTrunk | default "" | quote }}
            - name: RUSTPBX_RWI_URL
              value: {{ .Values.media.sip.rustpbxRwiUrl | default "" | quote }}
            - name: OPC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: opc-api-key
            - name: TINODE_BASE_URL
              value: {{ .Values.tinode.baseUrl | default "" | quote }}
            - name: TINODE_WS_URL
              value: {{ .Values.tinode.wsUrl | default "" | quote }}
            - name: TINODE_PUBLIC_BASE_URL
              value: {{ .Values.tinode.publicBaseUrl | default "" | quote }}
            - name: TINODE_PUBLIC_WS_URL
              value: {{ .Values.tinode.publicWsUrl | default "" | quote }}
            - name: TINODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-api-key
            - name: TINODE_ROOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-root-api-key
            - name: TINODE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-auth-token
            - name: TINODE_BASIC_USER
              value: {{ .Values.tinode.basicUser | default "" | quote }}
            - name: TINODE_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-basic-password
            - name: TINODE_USER_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-user-password-secret
            - name: TINODE_REQUEST_TIMEOUT_MS
              value: {{ .Values.tinode.requestTimeoutMs | default "5000" | quote }}
            - name: OPC_CHAT_MESSAGE_MUTATION_WINDOW_MS
              value: {{ .Values.tinode.messageMutationWindowMs | default "900000" | quote }}
            - name: OPC_TINODE_DELIVERY_WORKER_ENABLED
              value: {{ .Values.tinode.deliveryWorker.enabled | default "1" | quote }}
            - name: OPC_TINODE_DELIVERY_INTERVAL_MS
              value: {{ .Values.tinode.deliveryWorker.intervalMs | default "5000" | quote }}
            - name: OPC_TINODE_DELIVERY_BATCH_SIZE
              value: {{ .Values.tinode.deliveryWorker.batchSize | default "50" | quote }}
            - name: OPC_TINODE_DELIVERY_MAX_ATTEMPTS
              value: {{ .Values.tinode.deliveryWorker.maxAttempts | default "3" | quote }}
            - name: OPC_TINODE_DELIVERY_CLAIM_LEASE_MS
              value: {{ .Values.tinode.deliveryWorker.claimLeaseMs | default "30000" | quote }}
            - name: OPC_TINODE_DELIVERY_RETRY_DELAYS_MS
              value: {{ .Values.tinode.deliveryWorker.retryDelaysMs | default "2000,10000" | quote }}
            - name: OPC_TINODE_INBOUND_WORKER_ENABLED
              value: {{ .Values.tinode.inboundWorker.enabled | default "1" | quote }}
            - name: OPC_TINODE_INBOUND_INTERVAL_MS
              value: {{ .Values.tinode.inboundWorker.intervalMs | default "5000" | quote }}
            - name: OPC_TINODE_INBOUND_TENANT_LIMIT
              value: {{ .Values.tinode.inboundWorker.tenantLimit | default "100" | quote }}
            - name: OPC_TINODE_INBOUND_PULL_LIMIT
              value: {{ .Values.tinode.inboundWorker.pullLimit | default "100" | quote }}
            - name: OPC_TINODE_INBOUND_CLAIM_LEASE_MS
              value: {{ .Values.tinode.inboundWorker.claimLeaseMs | default "60000" | quote }}
            - name: OPC_TINODE_INBOUND_RETRY_DELAY_MS
              value: {{ .Values.tinode.inboundWorker.retryDelayMs | default "10000" | quote }}
            - name: OPC_TINODE_INBOUND_DEAD_LETTER_MAX_ATTEMPTS
              value: {{ .Values.tinode.inboundWorker.deadLetterMaxAttempts | default "3" | quote }}
            - name: OPC_TINODE_ATTACHMENT_ALLOWED_HOSTS
              value: {{ .Values.tinode.inboundWorker.attachmentAllowedHosts | default "" | quote }}
            - name: OPC_IVEKIT_EVENT_REPLAY_ENABLED
              value: {{ .Values.opc.eventReplay.enabled | default "1" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_MS
              value: {{ .Values.opc.eventReplay.retentionMs | default "86400000" | quote }}
            - name: OPC_IVEKIT_EVENT_MAX_PAYLOAD_BYTES
              value: {{ .Values.opc.eventReplay.maxPayloadBytes | default "65536" | quote }}
            - name: OPC_IVEKIT_WS_REPLAY_MAX_EVENTS
              value: {{ .Values.opc.eventReplay.wsReplayMaxEvents | default "500" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_WORKER_ENABLED
              value: {{ .Values.opc.eventReplay.retentionWorkerEnabled | default "1" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_INTERVAL_MS
              value: {{ .Values.opc.eventReplay.retentionIntervalMs | default "60000" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_TENANT_LIMIT
              value: {{ .Values.opc.eventReplay.retentionTenantLimit | default "100" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_BATCH_SIZE
              value: {{ .Values.opc.eventReplay.retentionBatchSize | default "1000" | quote }}
            - name: OPC_COLLABORATION_ATTACHMENT_MAX_BYTES
              value: {{ .Values.attachmentProcessing.attachmentMaxBytes | default "26214400" | quote }}
            - name: OPC_IVEKIT_PROVIDER_PROFILES_JSON
              value: {{ .Values.intelligence.providerProfilesJson | default "[]" | quote }}
            - name: OPC_IVEKIT_OCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-ocr-provider-token
            - name: OPC_IVEKIT_ASR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-asr-provider-token
            - name: OPC_IVEKIT_QUALITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-quality-provider-token
            - name: OPC_IVEKIT_TRANSLATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-translation-provider-token
            - name: OPC_OCR_PROVIDER_MODE
              value: {{ .Values.attachmentProcessing.ocrProviderMode | default "third_party" | quote }}
            - name: OPC_OCR_PROVIDER_NAME
              value: {{ .Values.attachmentProcessing.ocrProviderName | default "" | quote }}
