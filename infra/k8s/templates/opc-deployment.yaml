            - name: OPC_RUSTDESK_CHECK_UDP_PORTS
              value: {{ .Values.rustdesk.checkUdpPorts | default "21116" | quote }}
            - name: OPC_RUSTDESK_CHECK_TIMEOUT_MS
              value: {{ .Values.rustdesk.checkTimeoutMs | default "1500" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_DEVICE_ONLINE
              value: {{ .Values.rustdesk.readinessCheckDeviceOnline | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_OPERATION_AUDIT
              value: {{ .Values.rustdesk.readinessCheckOperationAudit | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_SERVER_PORTS
              value: {{ .Values.rustdesk.readinessCheckServerPorts | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_REQUIRE_PROTOCOL_URL
              value: {{ .Values.rustdesk.readinessRequireProtocolUrl | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_LAUNCH_URL
              value: {{ .Values.rustdesk.readinessCheckLaunchUrl | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_REQUIRE_HTTPS_LAUNCH_URL
              value: {{ .Values.rustdesk.readinessRequireHttpsLaunchUrl | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_PHYSICAL_DISCONNECT
              value: {{ .Values.rustdesk.readinessCheckPhysicalDisconnect | default "0" | quote }}
            - name: OPC_RUSTDESK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-api-token
            - name: MINIO_ENDPOINT
              value: {{ .Values.media.minioEndpoint | default (printf "http://%s-minio:9000" .Release.Name) | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.media.minioBucket | default "recordings" | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: minio-secret-key
          resources:
            {{- toYaml .Values.opc.resources | nindent 12 }}
          {{- if .Values.rustdesk.enabled }}
          volumeMounts:
            - name: rustdesk-data
              mountPath: /rustdesk
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.rustdesk.enabled }}
      volumes:
        - name: rustdesk-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-rustdesk-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-opc
spec:
  type: {{ .Values.opc.service.type }}
  ports:
    - port: {{ .Values.opc.service.port }}
      targetPort: 3000
  selector:
    app: opc
