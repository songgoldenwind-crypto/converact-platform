            {{- end }}
            {{- end }}
            - name: OPC_REMOTE_GATEWAY_PROVIDER
              value: {{ .Values.rustdesk.provider | default "rustdesk" | quote }}
            - name: OPC_REMOTE_GATEWAY_BASE_URL
              value: {{ .Values.rustdesk.controlPlaneBaseUrl | default (printf "http://%s-opc:3000" .Release.Name) | quote }}
            - name: OPC_REMOTE_GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-api-token
            - name: OPC_REMOTE_GATEWAY_TENANT_ID
              value: {{ .Values.rustdesk.remoteGatewayTenantId | default "tenant_led" | quote }}
            - name: OPC_REMOTE_GATEWAY_TARGET_TYPE
              value: {{ .Values.rustdesk.remoteGatewayTargetType | default "device" | quote }}
            - name: OPC_REMOTE_GATEWAY_TARGET_ID
              value: {{ .Values.rustdesk.remoteGatewayTargetId | default "" | quote }}
            - name: OPC_REMOTE_GATEWAY_TARGET_DISPLAY_NAME
              value: {{ .Values.rustdesk.remoteGatewayTargetDisplayName | default "Remote gateway smoke device" | quote }}
            - name: OPC_REMOTE_GATEWAY_ACTOR_IDENTITY
              value: {{ .Values.rustdesk.remoteGatewayActorIdentity | default "agent_remote_gateway_smoke" | quote }}
            - name: OPC_REMOTE_GATEWAY_CONSENT_SCOPES
              value: {{ .Values.rustdesk.remoteGatewayConsentScopes | default "view_screen,control_mouse_keyboard,record_screen,transfer_file,clipboard" | quote }}
            - name: OPC_REMOTE_GATEWAY_CHECK_LAUNCH_URL
              value: {{ .Values.rustdesk.remoteGatewayCheckLaunchUrl | default "0" | quote }}
            - name: OPC_RUSTDESK_CONTROL_PLANE_BASE_URL
              value: {{ .Values.rustdesk.controlPlaneBaseUrl | default (printf "http://%s-opc:3000" .Release.Name) | quote }}
            - name: RUSTDESK_SERVER_IMAGE_TAG
              value: {{ .Values.rustdesk.serverVersion | quote }}
            - name: OPC_RUSTDESK_CLIENT_VERSION
              value: {{ .Values.rustdesk.clientVersion | quote }}
            - name: OPC_RUSTDESK_CLIENT_PROFILE_TTL_SECONDS
              value: {{ .Values.rustdesk.clientProfileTtlSeconds | quote }}
            - name: OPC_RUSTDESK_CLIENT_ARTIFACTS_JSON
              value: {{ .Values.rustdesk.clientArtifactsJson | quote }}
            - name: OPC_RUSTDESK_ID_SERVER
              value: {{ .Values.rustdesk.publicHost | quote }}
            - name: OPC_RUSTDESK_RELAY_SERVER
              value: {{ .Values.rustdesk.relayHost | default .Values.rustdesk.publicHost | quote }}
            - name: OPC_RUSTDESK_API_SERVER
              value: {{ .Values.rustdesk.apiServer | default "" | quote }}
            - name: OPC_RUSTDESK_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-public-key
            - name: OPC_RUSTDESK_PUBLIC_KEY_FILE
              value: {{ .Values.rustdesk.publicKeyFile | default "/rustdesk/id_ed25519.pub" | quote }}
            - name: OPC_RUSTDESK_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-server-key
            - name: OPC_RUSTDESK_LAUNCH_BASE_URL
              value: {{ .Values.rustdesk.launchBaseUrl | quote }}
            - name: OPC_RUSTDESK_LAUNCH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-launch-secret
            - name: OPC_RUSTDESK_AUTHORIZATION_CODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-authorization-code-secret
            - name: OPC_RUSTDESK_REQUIRE_AUTHORIZATION_CODE
              value: {{ .Values.rustdesk.requireAuthorizationCode | default "0" | quote }}
            - name: OPC_RUSTDESK_LAUNCH_TOKEN_TTL_MS
              value: {{ .Values.rustdesk.launchTokenTtlMs | default "900000" | quote }}
            - name: OPC_RUSTDESK_PROTOCOL_URL_TEMPLATE
              value: {{ .Values.rustdesk.protocolUrlTemplate | default "" | quote }}
            - name: OPC_RUSTDESK_REQUIRE_PROTOCOL_URL
              value: {{ .Values.rustdesk.requireProtocolUrl | default "0" | quote }}
            - name: OPC_RUSTDESK_REQUIRE_DEVICE_ONLINE
              value: {{ .Values.rustdesk.requireDeviceOnline | default "0" | quote }}
            - name: OPC_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT
              value: {{ .Values.rustdesk.requirePhysicalDisconnect | default "0" | quote }}
            - name: OPC_RUSTDESK_EDGE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-edge-token-secret
            - name: OPC_RUSTDESK_DEVICE_ONLINE_TTL_MS
              value: {{ .Values.rustdesk.deviceOnlineTtlMs | default "300000" | quote }}
            - name: OPC_RUSTDESK_CHECK_DEVICE_ONLINE
              value: {{ .Values.rustdesk.checkDeviceOnline | default "0" | quote }}
            - name: OPC_RUSTDESK_CHECK_OPERATION_AUDIT
              value: {{ .Values.rustdesk.checkOperationAudit | default "1" | quote }}
            - name: OPC_RUSTDESK_CHECK_SERVER_PORTS
              value: {{ .Values.rustdesk.checkServerPorts | default "0" | quote }}
            - name: OPC_RUSTDESK_CHECK_HOST
              value: {{ .Values.rustdesk.checkHost | default "" | quote }}
            - name: OPC_RUSTDESK_CHECK_TCP_PORTS
              value: {{ .Values.rustdesk.checkTcpPorts | default "21115,21116,21117,21118,21119" | quote }}
            - name: OPC_RUSTDESK_CHECK_UDP_PORTS
              value: {{ .Values.rustdesk.checkUdpPorts | default "21116" | quote }}
            - name: OPC_RUSTDESK_CHECK_TIMEOUT_MS
              value: {{ .Values.rustdesk.checkTimeoutMs | default "1500" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_DEVICE_ONLINE
              value: {{ .Values.rustdesk.readinessCheckDeviceOnline | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_OPERATION_AUDIT
              value: {{ .Values.rustdesk.readinessCheckOperationAudit | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_SERVER_PORTS
              value: {{ .Values.rustdesk.readinessCheckServerPorts | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_REQUIRE_PROTOCOL_URL
              value: {{ .Values.rustdesk.readinessRequireProtocolUrl | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_LAUNCH_URL
              value: {{ .Values.rustdesk.readinessCheckLaunchUrl | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_REQUIRE_HTTPS_LAUNCH_URL
              value: {{ .Values.rustdesk.readinessRequireHttpsLaunchUrl | default "1" | quote }}
            - name: OPC_RUSTDESK_READINESS_CHECK_PHYSICAL_DISCONNECT
              value: {{ .Values.rustdesk.readinessCheckPhysicalDisconnect | default "0" | quote }}
            - name: OPC_RUSTDESK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-api-token
            {{ include "opc.objectStorageEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.opc.resources | nindent 12 }}
          {{ if or .Values.voice.enabled .Values.rustdesk.enabled (and .Values.nats.enabled .Values.nats.tls.enabled) .Values.livekit.redis.tls.enabled .Values.media.realtimeAudioTap.enabled }}
          volumeMounts:
          {{ if .Values.voice.enabled }}
            - name: ivekit-cdr-tls
              mountPath: /run/ivekit-cdr-tls
              readOnly: true
          {{ end }}
          {{ if .Values.rustdesk.enabled }}
            - name: rustdesk-data
              mountPath: /rustdesk
              readOnly: true
          {{ end }}
          {{ if and .Values.nats.enabled .Values.nats.tls.enabled }}
            - name: nats-tls
              mountPath: /etc/nats/tls
              readOnly: true
          {{ end }}
          {{ include "opc.livekitRedisTLSVolumeMount" . | nindent 12 }}
          {{ end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      {{ if or .Values.voice.enabled .Values.rustdesk.enabled (and .Values.nats.enabled .Values.nats.tls.enabled) .Values.livekit.redis.tls.enabled .Values.media.realtimeAudioTap.enabled }}
      volumes:
      {{ if .Values.voice.enabled }}
        - name: ivekit-cdr-tls
          secret:
            secretName: {{ required "voice.cdr.tls.secretName is required when voice is enabled" .Values.voice.cdr.tls.secretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.voice.cdr.tls.serverKeyKey }}
                path: server.key
              - key: {{ .Values.voice.cdr.tls.serverCertKey }}
                path: server.crt
              - key: {{ .Values.voice.cdr.tls.caKey }}
                path: ca.crt
      {{ end }}
      {{ if .Values.rustdesk.enabled }}
        - name: rustdesk-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-rustdesk-data
      {{ end }}
      {{ if and .Values.nats.enabled .Values.nats.tls.enabled }}
        - name: nats-tls
          secret:
            secretName: {{ required "nats.tls.secretName is required when NATS TLS is enabled" .Values.nats.tls.secretName }}
      {{ end }}
      {{ include "opc.livekitRedisTLSVolume" . | nindent 8 }}
      {{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-opc
spec:
  type: {{ .Values.opc.service.type }}
  ports:
    - name: http
      port: {{ .Values.opc.service.port }}
      targetPort: http
    {{- if .Values.voice.enabled }}
    - name: internal-tls
      port: 3443
      targetPort: internal-tls
    {{- end }}
    {{- if .Values.media.realtimeAudioTap.enabled }}
    - name: audio-tap
      port: {{ .Values.media.realtimeAudioTap.listenPort }}
      targetPort: audio-tap
    {{- end }}
  selector:
    app: opc
{{- if .Values.media.realtimeAudioTap.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-opc-audio-tap
spec:
  clusterIP: None
  selector:
    app: opc
  ports:
    - name: audio-tap
      port: {{ .Values.media.realtimeAudioTap.listenPort }}
      targetPort: audio-tap
      protocol: TCP
{{- end }}
