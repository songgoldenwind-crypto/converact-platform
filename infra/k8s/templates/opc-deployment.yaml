apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opc
  labels:
    app: opc
spec:
  replicas: {{ .Values.opc.replicaCount }}
  selector:
    matchLabels:
      app: opc
  template:
    metadata:
      labels:
        app: opc
    spec:
      containers:
        - name: opc
          image: "{{ .Values.opc.image.repository }}:{{ .Values.opc.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://{{ .Release.Name }}-redis:6379
            - name: NATS_URL
              value: nats://{{ .Release.Name }}-nats:4222
            - name: LIVEKIT_URL
              value: {{ include "opc.livekitInternalUrl" . | quote }}
            - name: LIVEKIT_PUBLIC_URL
              value: {{ include "opc.livekitPublicUrl" . | quote }}
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: livekit-api-secret
            - name: OPC_MEDIA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: media-api-token
            - name: OPC_MEDIA_INVITE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: media-invite-secret
            - name: OPC_MEDIA_INVITE_TTL_MS
              value: {{ .Values.media.inviteTtlMs | default "86400000" | quote }}
            - name: OPC_MEDIA_RECORDING_RETENTION_DAYS
              value: {{ .Values.media.recordingRetentionDays | default "90" | quote }}
            - name: OPC_RECORDING_HTTP_ALLOWED_ORIGINS
              value: {{ .Values.media.recordingHttpAllowedOrigins | default (printf "http://%s-minio:9000" .Release.Name) | quote }}
            - name: OPC_RECORDING_HTTP_TIMEOUT_MS
              value: {{ .Values.media.recordingHttpTimeoutMs | default "15000" | quote }}
            - name: OPC_MEDIA_SMOKE_VERIFY_RECORDING_OBJECT
              value: {{ .Values.media.smokeVerifyRecordingObject | default "0" | quote }}
            - name: OPC_MEDIA_SMOKE_RECORDING_OBJECT_TIMEOUT_MS
              value: {{ .Values.media.smokeRecordingObjectTimeoutMs | default "60000" | quote }}
            - name: OPC_MEDIA_SMOKE_RECORDING_OBJECT_POLL_INTERVAL_MS
              value: {{ .Values.media.smokeRecordingObjectPollIntervalMs | default "2000" | quote }}
            - name: OPC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: opc-api-key
            - name: TINODE_BASE_URL
              value: {{ .Values.tinode.baseUrl | default "" | quote }}
            - name: TINODE_WS_URL
              value: {{ .Values.tinode.wsUrl | default "" | quote }}
            - name: TINODE_PUBLIC_BASE_URL
              value: {{ .Values.tinode.publicBaseUrl | default "" | quote }}
            - name: TINODE_PUBLIC_WS_URL
              value: {{ .Values.tinode.publicWsUrl | default "" | quote }}
            - name: TINODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-api-key
            - name: TINODE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-auth-token
            - name: TINODE_BASIC_USER
              value: {{ .Values.tinode.basicUser | default "" | quote }}
            - name: TINODE_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-basic-password
            - name: TINODE_USER_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: tinode-user-password-secret
            - name: TINODE_REQUEST_TIMEOUT_MS
              value: {{ .Values.tinode.requestTimeoutMs | default "5000" | quote }}
            - name: OPC_CHAT_MESSAGE_MUTATION_WINDOW_MS
              value: {{ .Values.tinode.messageMutationWindowMs | default "900000" | quote }}
            - name: OPC_TINODE_DELIVERY_WORKER_ENABLED
              value: {{ .Values.tinode.deliveryWorker.enabled | default "1" | quote }}
            - name: OPC_TINODE_DELIVERY_INTERVAL_MS
              value: {{ .Values.tinode.deliveryWorker.intervalMs | default "5000" | quote }}
            - name: OPC_TINODE_DELIVERY_BATCH_SIZE
              value: {{ .Values.tinode.deliveryWorker.batchSize | default "50" | quote }}
            - name: OPC_TINODE_DELIVERY_MAX_ATTEMPTS
              value: {{ .Values.tinode.deliveryWorker.maxAttempts | default "3" | quote }}
            - name: OPC_TINODE_DELIVERY_CLAIM_LEASE_MS
              value: {{ .Values.tinode.deliveryWorker.claimLeaseMs | default "30000" | quote }}
            - name: OPC_TINODE_DELIVERY_RETRY_DELAYS_MS
              value: {{ .Values.tinode.deliveryWorker.retryDelaysMs | default "2000,10000" | quote }}
            - name: OPC_TINODE_INBOUND_WORKER_ENABLED
              value: {{ .Values.tinode.inboundWorker.enabled | default "1" | quote }}
            - name: OPC_TINODE_INBOUND_INTERVAL_MS
              value: {{ .Values.tinode.inboundWorker.intervalMs | default "5000" | quote }}
            - name: OPC_TINODE_INBOUND_TENANT_LIMIT
              value: {{ .Values.tinode.inboundWorker.tenantLimit | default "100" | quote }}
            - name: OPC_TINODE_INBOUND_PULL_LIMIT
              value: {{ .Values.tinode.inboundWorker.pullLimit | default "100" | quote }}
            - name: OPC_TINODE_INBOUND_CLAIM_LEASE_MS
              value: {{ .Values.tinode.inboundWorker.claimLeaseMs | default "60000" | quote }}
            - name: OPC_TINODE_INBOUND_RETRY_DELAY_MS
              value: {{ .Values.tinode.inboundWorker.retryDelayMs | default "10000" | quote }}
            - name: OPC_TINODE_INBOUND_DEAD_LETTER_MAX_ATTEMPTS
              value: {{ .Values.tinode.inboundWorker.deadLetterMaxAttempts | default "3" | quote }}
            - name: OPC_TINODE_ATTACHMENT_ALLOWED_HOSTS
              value: {{ .Values.tinode.inboundWorker.attachmentAllowedHosts | default "" | quote }}
            - name: OPC_IVEKIT_EVENT_REPLAY_ENABLED
              value: {{ .Values.opc.eventReplay.enabled | default "1" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_MS
              value: {{ .Values.opc.eventReplay.retentionMs | default "86400000" | quote }}
            - name: OPC_IVEKIT_EVENT_MAX_PAYLOAD_BYTES
              value: {{ .Values.opc.eventReplay.maxPayloadBytes | default "65536" | quote }}
            - name: OPC_IVEKIT_WS_REPLAY_MAX_EVENTS
              value: {{ .Values.opc.eventReplay.wsReplayMaxEvents | default "500" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_WORKER_ENABLED
              value: {{ .Values.opc.eventReplay.retentionWorkerEnabled | default "1" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_INTERVAL_MS
              value: {{ .Values.opc.eventReplay.retentionIntervalMs | default "60000" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_TENANT_LIMIT
              value: {{ .Values.opc.eventReplay.retentionTenantLimit | default "100" | quote }}
            - name: OPC_IVEKIT_EVENT_RETENTION_BATCH_SIZE
              value: {{ .Values.opc.eventReplay.retentionBatchSize | default "1000" | quote }}
            - name: OPC_COLLABORATION_ATTACHMENT_MAX_BYTES
              value: {{ .Values.attachmentProcessing.attachmentMaxBytes | default "26214400" | quote }}
            - name: OPC_IVEKIT_PROVIDER_PROFILES_JSON
              value: {{ .Values.intelligence.providerProfilesJson | default "[]" | quote }}
            - name: OPC_IVEKIT_OCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-ocr-provider-token
            - name: OPC_IVEKIT_ASR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-asr-provider-token
            - name: OPC_IVEKIT_QUALITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-quality-provider-token
            - name: OPC_IVEKIT_TRANSLATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-translation-provider-token
            - name: OPC_OCR_PROVIDER_MODE
              value: {{ .Values.attachmentProcessing.ocrProviderMode | default "self_hosted" | quote }}
            - name: OPC_OCR_PROVIDER_NAME
              value: {{ .Values.attachmentProcessing.ocrProviderName | default "" | quote }}
            - name: OPC_OCR_BASE_URL
              value: {{ .Values.attachmentProcessing.ocrBaseUrl | default "" | quote }}
            - name: OPC_OCR_ENDPOINT
              value: {{ .Values.attachmentProcessing.ocrEndpoint | default "/v1/ocr" | quote }}
            - name: OPC_OCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ocr-provider-token
            - name: OPC_OCR_TIMEOUT_MS
              value: {{ .Values.attachmentProcessing.ocrTimeoutMs | default "30000" | quote }}
            - name: OPC_ASR_PROVIDER_MODE
              value: {{ .Values.attachmentProcessing.asrProviderMode | default "self_hosted" | quote }}
            - name: OPC_ASR_PROVIDER_NAME
              value: {{ .Values.attachmentProcessing.asrProviderName | default "" | quote }}
            - name: OPC_ASR_BASE_URL
              value: {{ .Values.attachmentProcessing.asrBaseUrl | default "" | quote }}
            - name: OPC_ASR_ENDPOINT
              value: {{ .Values.attachmentProcessing.asrEndpoint | default "/v1/asr" | quote }}
            - name: OPC_ASR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: asr-provider-token
            - name: OPC_ASR_TIMEOUT_MS
              value: {{ .Values.attachmentProcessing.asrTimeoutMs | default "30000" | quote }}
            - name: OPC_ATTACHMENT_PROCESSING_WORKER_ENABLED
              value: {{ .Values.attachmentProcessing.worker.enabled | default "0" | quote }}
            - name: OPC_ATTACHMENT_PROCESSING_INTERVAL_MS
              value: {{ .Values.attachmentProcessing.worker.intervalMs | default "5000" | quote }}
            - name: OPC_ATTACHMENT_PROCESSING_BATCH_SIZE
              value: {{ .Values.attachmentProcessing.worker.batchSize | default "25" | quote }}
            - name: OPC_ATTACHMENT_PROCESSING_MAX_ATTEMPTS
              value: {{ .Values.attachmentProcessing.worker.maxAttempts | default "3" | quote }}
            - name: OPC_ATTACHMENT_PROCESSING_CLAIM_LEASE_MS
              value: {{ .Values.attachmentProcessing.worker.claimLeaseMs | default "120000" | quote }}
            - name: OPC_ATTACHMENT_PROCESSING_RETRY_DELAYS_MS
              value: {{ .Values.attachmentProcessing.worker.retryDelaysMs | default "5000,30000" | quote }}
            - name: OPC_QUALITY_REVIEW_PROVIDER_MODE
              value: {{ .Values.qualityReview.providerMode | default "self_hosted" | quote }}
            - name: OPC_QUALITY_REVIEW_PROVIDER_NAME
              value: {{ .Values.qualityReview.providerName | default "" | quote }}
            - name: OPC_QUALITY_REVIEW_BASE_URL
              value: {{ .Values.qualityReview.baseUrl | default "" | quote }}
            - name: OPC_QUALITY_REVIEW_ENDPOINT
              value: {{ .Values.qualityReview.endpoint | default "/v1/quality-review" | quote }}
            - name: OPC_QUALITY_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: quality-review-token
            - name: OPC_QUALITY_REVIEW_TIMEOUT_MS
              value: {{ .Values.qualityReview.timeoutMs | default "30000" | quote }}
            - name: OPC_QUALITY_REVIEW_AUTO_ENQUEUE
              value: {{ .Values.qualityReview.autoEnqueue | default "0" | quote }}
            - name: OPC_QUALITY_REVIEW_WORKER_ENABLED
              value: {{ .Values.qualityReview.worker.enabled | default "0" | quote }}
            - name: OPC_QUALITY_REVIEW_INTERVAL_MS
              value: {{ .Values.qualityReview.worker.intervalMs | default "5000" | quote }}
            - name: OPC_QUALITY_REVIEW_BATCH_SIZE
              value: {{ .Values.qualityReview.worker.batchSize | default "25" | quote }}
            - name: OPC_QUALITY_REVIEW_MAX_ATTEMPTS
              value: {{ .Values.qualityReview.worker.maxAttempts | default "3" | quote }}
            - name: OPC_QUALITY_REVIEW_CLAIM_LEASE_MS
              value: {{ .Values.qualityReview.worker.claimLeaseMs | default "120000" | quote }}
            - name: OPC_QUALITY_REVIEW_RETRY_DELAYS_MS
              value: {{ .Values.qualityReview.worker.retryDelaysMs | default "5000,30000" | quote }}
            - name: OPC_TRANSLATION_WORKER_ENABLED
              value: {{ .Values.intelligence.translationWorker.enabled | default "0" | quote }}
            - name: OPC_TRANSLATION_INTERVAL_MS
              value: {{ .Values.intelligence.translationWorker.intervalMs | default "5000" | quote }}
            - name: OPC_TRANSLATION_BATCH_SIZE
              value: {{ .Values.intelligence.translationWorker.batchSize | default "25" | quote }}
            - name: OPC_TRANSLATION_MAX_ATTEMPTS
              value: {{ .Values.intelligence.translationWorker.maxAttempts | default "3" | quote }}
            - name: OPC_TRANSLATION_CLAIM_LEASE_MS
              value: {{ .Values.intelligence.translationWorker.claimLeaseMs | default "120000" | quote }}
            - name: OPC_TRANSLATION_RETRY_DELAYS_MS
              value: {{ .Values.intelligence.translationWorker.retryDelaysMs | default "5000,30000" | quote }}
            - name: OPC_IVEKIT_IVR_WORKERS_ENABLED
              value: {{ .Values.ivr.workers.enabled | default "0" | quote }}
            - name: OPC_IVEKIT_IVR_ACTION_INTERVAL_MS
              value: {{ .Values.ivr.workers.actionIntervalMs | default "1000" | quote }}
            - name: OPC_IVEKIT_IVR_ACTION_BATCH_SIZE
              value: {{ .Values.ivr.workers.actionBatchSize | default "25" | quote }}
            - name: OPC_IVEKIT_IVR_ACTION_LEASE_MS
              value: {{ .Values.ivr.workers.actionLeaseMs | default "30000" | quote }}
            - name: OPC_IVEKIT_IVR_ACTION_RETRY_BASE_MS
              value: {{ .Values.ivr.workers.actionRetryBaseMs | default "1000" | quote }}
            - name: OPC_IVEKIT_IVR_ACTION_RETRY_MAX_MS
              value: {{ .Values.ivr.workers.actionRetryMaxMs | default "60000" | quote }}
            - name: OPC_IVEKIT_IVR_RECONCILIATION_INTERVAL_MS
              value: {{ .Values.ivr.workers.reconciliationIntervalMs | default "10000" | quote }}
            - name: OPC_IVEKIT_IVR_RECONCILIATION_LEASE_MS
              value: {{ .Values.ivr.workers.reconciliationLeaseMs | default "30000" | quote }}
            - name: OPC_IVEKIT_IVR_RECONCILIATION_RETRY_MS
              value: {{ .Values.ivr.workers.reconciliationRetryMs | default "10000" | quote }}
            - name: OPC_IVEKIT_IVR_RECONCILIATION_MAX_ATTEMPTS
              value: {{ .Values.ivr.workers.reconciliationMaxAttempts | default "20" | quote }}
            - name: OPC_IVEKIT_IVR_TENANT_LIMIT
              value: {{ .Values.ivr.workers.tenantLimit | default "100" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_WORKER_ENABLED
              value: {{ .Values.contactCenter.worker.enabled | default "0" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_INTERVAL_MS
              value: {{ .Values.contactCenter.worker.intervalMs | default "1000" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_TENANT_LIMIT
              value: {{ .Values.contactCenter.worker.tenantLimit | default "100" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_BATCH_SIZE
              value: {{ .Values.contactCenter.worker.batchSize | default "100" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_OFFER_TTL_SECONDS
              value: {{ .Values.contactCenter.worker.offerTtlSeconds | default "20" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_CALLBACK_RETRY_DELAY_MS
              value: {{ .Values.contactCenter.worker.callbackRetryDelayMs | default "30000" | quote }}
            - name: OPC_IVEKIT_CONTACT_CENTER_OVERFLOW_RETRY_DELAY_MS
              value: {{ .Values.contactCenter.worker.overflowRetryDelayMs | default "30000" | quote }}
            {{- if .Values.voice.enabled }}
            - name: OPC_IVEKIT_VOICE_WORKERS_ENABLED
              value: "1"
            - name: OPC_IVEKIT_VOICE_COMMAND_INTERVAL_MS
              value: {{ .Values.voice.workers.commandIntervalMs | quote }}
            - name: OPC_IVEKIT_VOICE_COMMAND_BATCH_SIZE
              value: {{ .Values.voice.workers.commandBatchSize | quote }}
            - name: OPC_IVEKIT_VOICE_COMMAND_LEASE_MS
              value: {{ .Values.voice.workers.commandLeaseMs | quote }}
            - name: OPC_IVEKIT_VOICE_COMMAND_MAX_ATTEMPTS
              value: {{ .Values.voice.workers.commandMaxAttempts | quote }}
            - name: OPC_IVEKIT_VOICE_COMMAND_RETRY_DELAYS_MS
              value: {{ .Values.voice.workers.commandRetryDelaysMs | quote }}
            - name: OPC_IVEKIT_VOICE_EVENT_INTERVAL_MS
              value: {{ .Values.voice.workers.eventIntervalMs | quote }}
            - name: OPC_IVEKIT_VOICE_EVENT_BATCH_SIZE
              value: {{ .Values.voice.workers.eventBatchSize | quote }}
            - name: OPC_IVEKIT_VOICE_EVENT_LEASE_MS
              value: {{ .Values.voice.workers.eventLeaseMs | quote }}
            - name: OPC_IVEKIT_VOICE_RECONCILIATION_INTERVAL_MS
              value: {{ .Values.voice.workers.reconciliationIntervalMs | quote }}
            - name: OPC_IVEKIT_VOICE_RECONCILIATION_MAX_AGE_MS
              value: {{ .Values.voice.workers.reconciliationMaxAgeMs | quote }}
            - name: OPC_IVEKIT_VOICE_PROVIDER_TIMEOUT_MS
              value: {{ .Values.voice.workers.providerTimeoutMs | quote }}
            - name: OPC_IVEKIT_VOICE_ADDRESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-voice-address-key
            - name: OPC_IVEKIT_VOICE_ADDRESS_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ivekit-voice-address-hmac-key
            - name: OPC_IVEKIT_VOICE_SECRET_ENV_NAMES
              value: RUSTPBX_MANAGEMENT_TOKEN,RUSTPBX_RWI_TOKEN
            - name: OPC_IVEKIT_VOICE_WEBHOOK_SECRET_ENV_NAMES
              value: RUSTPBX_WEBHOOK_TOKEN
            - name: RUSTPBX_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-rwi-token
            - name: RUSTPBX_RWI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-rwi-token
            - name: RUSTPBX_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustpbx-webhook-token
            {{- end }}
            - name: OPC_REMOTE_GATEWAY_PROVIDER
              value: {{ .Values.rustdesk.provider | default "rustdesk" | quote }}
            - name: OPC_REMOTE_GATEWAY_BASE_URL
              value: {{ .Values.rustdesk.controlPlaneBaseUrl | default (printf "http://%s-opc:3000" .Release.Name) | quote }}
            - name: OPC_REMOTE_GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: rustdesk-api-token
            - name: OPC_REMOTE_GATEWAY_TENANT_ID
              value: {{ .Values.rustdesk.remoteGatewayTenantId | default "tenant_led" | quote }}
            - name: OPC_REMOTE_GATEWAY_TARGET_TYPE
              value: {{ .Values.rustdesk.remoteGatewayTargetType | default "device" | quote }}
            - name: OPC_REMOTE_GATEWAY_TARGET_ID
              value: {{ .Values.rustdesk.remoteGatewayTargetId | default "" | quote }}
