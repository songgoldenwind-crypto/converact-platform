{{- if .Values.media.sip.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-livekit-sip
  labels:
    app: livekit-sip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-sip
  template:
    metadata:
      labels:
        app: livekit-sip
    spec:
      containers:
        - name: livekit-sip
          image: {{ include "opc.livekitSipImage" . | quote }}
          imagePullPolicy: {{ .Values.media.sip.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: LIVEKIT_URL
              value: {{ include "opc.livekitInternalUrl" . | quote }}
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: livekit-api-secret
            - name: SIP_PORT
              value: {{ .Values.media.sip.service.port | default 5061 | quote }}
          ports:
            - name: sip-udp
              containerPort: 5061
              protocol: UDP
            - name: sip-tcp
              containerPort: 5061
              protocol: TCP
          resources:
            {{- toYaml .Values.media.sip.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-livekit-sip
spec:
  type: {{ .Values.media.sip.service.type }}
  selector:
    app: livekit-sip
  ports:
    - name: sip-udp
      port: {{ .Values.media.sip.service.port | default 5061 }}
      targetPort: 5061
      protocol: UDP
    - name: sip-tcp
      port: {{ .Values.media.sip.service.port | default 5061 }}
      targetPort: 5061
      protocol: TCP
{{- end }}
