    pullPolicy: IfNotPresent
  providerRuntime:
    llmFallbackProviders: "deepseek"
    speechAsrProvider: "funasr"
    speechAsrFallbackProviders: "deepgram,openai"
    speechTtsProvider: "cosyvoice"
    speechTtsFallbackProviders: "cartesia,openai"
    sttAttemptTimeoutMs: 2000
    llmAttemptTimeoutMs: 1200
    ttsAttemptTimeoutMs: 1500
    maxUnrecoverableErrors: 3
  providers:
    llmBaseUrl: ""
    llmModel: "Qwen3.6-27B"
    llmExtraBody: '{"chat_template_kwargs":{"enable_thinking":false}}'
    deepseekApiBase: "https://api.deepseek.com/v1"
    deepseekModel: "deepseek-chat"
    funasrUrl: ""
    cosyvoiceUrl: ""
    cosyvoiceSpeakerId: "中文女"
    credentials:
      existingSecret: ""
      llmApiKeyKey: "llm-api-key"
      deepseekApiKeyKey: "deepseek-api-key"
      openaiApiKeyKey: "openai-api-key"
      deepgramApiKeyKey: "deepgram-api-key"
      cartesiaApiKeyKey: "cartesia-api-key"
  metrics:
    port: 9090
    udpHost: 127.0.0.1
    udpPort: 9125
    serviceMonitor:
      enabled: false
      interval: 15s
      scrapeTimeout: 5s
      labels: {}
    prometheusRule:
      enabled: false
      duration: 5m
    latencyBudgetsSeconds:
      asr_final: 0.35
      end_of_turn: 0.5
      llm_first_token: 0.35
      tts_first_audio: 0.3
      speech_to_speech: 1.2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

frontend:
  replicaCount: 1
  image:
