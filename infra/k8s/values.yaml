# OPC Platform Helm Values

global:
  imageRegistry: ""
  imagePullSecrets: []

opc:
  replicaCount: 2
  image:
    repository: opc/platform
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  apiKey: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    PORT: "3000"
  eventReplay:
    enabled: "1"
    retentionMs: "86400000"
    maxPayloadBytes: "65536"
    wsReplayMaxEvents: "500"
    retentionWorkerEnabled: "1"
    retentionIntervalMs: "60000"
    retentionTenantLimit: "100"
    retentionBatchSize: "1000"

aiAgent:
