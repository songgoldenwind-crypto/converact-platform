    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  apiKey: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    PORT: "3000"
  eventReplay:
    enabled: "1"
    retentionMs: "86400000"
