# Converact Platform Call Center stack (RustPBX + LiveKit)
# Usage: docker compose -f docker-compose.callcenter.yml up -d

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-minio-bucket.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-recordings}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_INIT_MAX_ATTEMPTS: ${MINIO_INIT_MAX_ATTEMPTS:-30}
      MINIO_INIT_RETRY_SECONDS: ${MINIO_INIT_RETRY_SECONDS:-2}
    volumes:
      - ./infra/scripts/bootstrap-minio-bucket.sh:/bootstrap/bootstrap-minio-bucket.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  livekit:
    image: ${LIVEKIT_SERVER_IMAGE:-ghcr.io/songgoldenwind-crypto/converact-livekit-server:v1.13.4-ivekit.1-0b3fd288}
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882-7892:7882-7892/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  livekit-sip:
    image: livekit/sip:${LIVEKIT_SIP_IMAGE_TAG:-v1.7.0}
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      SIP_PORT: "5061"
    ports:
      - "5061:5061/udp"
      - "5061:5061/tcp"
    depends_on:
      - livekit
      - redis

  livekit-egress:
    image: livekit/egress:${LIVEKIT_EGRESS_IMAGE_TAG:-v1.13.0}
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./config/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8091/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  rustpbx:
    image: ghcr.io/restsend/rustpbx:latest
    command: ["--conf", "/app/rustpbx.toml"]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8080:8080"
    volumes:
      - ./config/rustpbx.docker.toml:/app/rustpbx.toml:ro
      - ./config/rustpbx-routes:/app/config/rustpbx-routes:ro
      - ./config/ivr:/app/config/ivr:ro
      - rustpbx_data:/app/db
      - rustpbx_recordings:/app/recordings

  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:${RUSTDESK_SERVER_IMAGE_TAG:-1.1.16}
    command: hbbs
    profiles: ["rustdesk"]
    environment:
      ALWAYS_USE_RELAY: ${RUSTDESK_ALWAYS_USE_RELAY:-N}
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    volumes:
      - rustdesk_data:/root
    depends_on:
      - rustdesk-hbbr
    restart: unless-stopped

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:${RUSTDESK_SERVER_IMAGE_TAG:-1.1.16}
    command: hbbr
    profiles: ["rustdesk"]
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    volumes:
      - rustdesk_data:/root
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opc_dev_pass}
      POSTGRES_DB: opc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc -d opc"]
      interval: 5s
      timeout: 5s
      retries: 10

  tinode:
    image: tinode/tinode:${TINODE_IMAGE_TAG:-0.25.3}
    restart: unless-stopped
    ports:
      - "6060:6060"
    environment:
      STORE_USE_ADAPTER: postgres
      POSTGRES_DSN: postgresql://opc:${POSTGRES_PASSWORD:-opc_dev_pass}@postgres:5432/tinode?sslmode=disable&connect_timeout=10
      WAIT_FOR: postgres:5432
      AUTH_TOKEN_KEY: ${TINODE_AUTH_TOKEN_KEY:-b3BjLWxvY2FsLXRpbm9kZS1hdXRoLWtleS0zMmJ5dGU=}
      UID_ENCRYPTION_KEY: ${TINODE_UID_ENCRYPTION_KEY:-b3BjLXRpbm9kZS11aWQxNg==}
      SAMPLE_DATA: ${TINODE_SAMPLE_DATA:-}
      UPGRADE_DB: ${TINODE_UPGRADE_DB:-false}
      RESET_DB: "false"
      WEBRTC_ENABLED: "false"
      ACC_GC_ENABLED: "true"
    volumes:
      - tinode_botdata:/botdata
    depends_on:
      postgres:
        condition: service_healthy

  converact:
    build: .
    ports:
      - "${CONVERACT_HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://opc:${POSTGRES_PASSWORD:-opc_dev_pass}@postgres:5432/opc
      CONVERACT_JWT_SECRET: ${CONVERACT_JWT_SECRET:-dev-jwt-secret-change-in-production}
      CONVERACT_AUTH_DISABLED: "0"
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      CONVERACT_MEDIA_API_TOKEN: ${CONVERACT_MEDIA_API_TOKEN:-dev-media-token}
      CONVERACT_MEDIA_INVITE_SECRET: ${CONVERACT_MEDIA_INVITE_SECRET:-dev-media-invite-secret}
      CONVERACT_MEDIA_INVITE_TTL_MS: ${CONVERACT_MEDIA_INVITE_TTL_MS:-86400000}
      CONVERACT_MEDIA_RECORDING_RETENTION_DAYS: ${CONVERACT_MEDIA_RECORDING_RETENTION_DAYS:-90}
      CONVERACT_RECORDING_EXPORT_MAX_BYTES: ${CONVERACT_RECORDING_EXPORT_MAX_BYTES:-67108864}
      CONVERACT_MEDIA_CALL_TIMEOUT_WORKER_ENABLED: ${CONVERACT_MEDIA_CALL_TIMEOUT_WORKER_ENABLED:-1}
      CONVERACT_MEDIA_CALL_TIMEOUT_INTERVAL_MS: ${CONVERACT_MEDIA_CALL_TIMEOUT_INTERVAL_MS:-1000}
      CONVERACT_MEDIA_CALL_TIMEOUT_BATCH_SIZE: ${CONVERACT_MEDIA_CALL_TIMEOUT_BATCH_SIZE:-50}
      CONVERACT_MEDIA_CALL_TIMEOUT_TENANT_LIMIT: ${CONVERACT_MEDIA_CALL_TIMEOUT_TENANT_LIMIT:-100}
      CONVERACT_RECORDING_HTTP_ALLOWED_ORIGINS: ${CONVERACT_RECORDING_HTTP_ALLOWED_ORIGINS:-http://minio:9000}
      CONVERACT_RECORDING_HTTP_TIMEOUT_MS: ${CONVERACT_RECORDING_HTTP_TIMEOUT_MS:-15000}
      CONVERACT_MEDIA_SMOKE_VERIFY_RECORDING_OBJECT: ${CONVERACT_MEDIA_SMOKE_VERIFY_RECORDING_OBJECT:-0}
      CONVERACT_MEDIA_SMOKE_RECORDING_OBJECT_TIMEOUT_MS: ${CONVERACT_MEDIA_SMOKE_RECORDING_OBJECT_TIMEOUT_MS:-60000}
      CONVERACT_MEDIA_SMOKE_RECORDING_OBJECT_POLL_INTERVAL_MS: ${CONVERACT_MEDIA_SMOKE_RECORDING_OBJECT_POLL_INTERVAL_MS:-2000}
      LIVEKIT_SIP_BRIDGE_TARGET: sip:livekit-bridge@livekit-sip:5061
      RUSTPBX_LIVEKIT_TRUNK: ${RUSTPBX_LIVEKIT_TRUNK:-livekit-bridge}
      CONVERACT_SIP_VOLTE_ENABLED: ${CONVERACT_SIP_VOLTE_ENABLED:-0}
      RUSTPBX_WEBHOOK_KEY: ${RUSTPBX_WEBHOOK_KEY:-dev-pbx-key}
      RUSTPBX_RWI_URL: ws://rustpbx:8080/rwi/v1
      RUSTPBX_RWI_TOKEN: ${RUSTPBX_RWI_TOKEN:-dev-rwi-token}
      CONVERACT_DISABLE_IVR_RWI: ${CONVERACT_DISABLE_IVR_RWI:-1}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-recordings}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CONVERACT_API_KEY: ${CONVERACT_API_KEY:-dev-converact-key}
      CONVERACT_BASE_URL: ${CONVERACT_BASE_URL:-http://localhost:3000}
      TINODE_BASE_URL: ${TINODE_BASE_URL:-http://tinode:6060}
      TINODE_WS_URL: ${TINODE_WS_URL:-ws://tinode:6060/v0/channels}
      TINODE_PUBLIC_BASE_URL: ${TINODE_PUBLIC_BASE_URL:-}
      TINODE_PUBLIC_WS_URL: ${TINODE_PUBLIC_WS_URL:-}
      TINODE_API_KEY: ${TINODE_API_KEY:-}
      TINODE_ROOT_API_KEY: ${TINODE_ROOT_API_KEY:-}
      TINODE_AUTH_TOKEN: ${TINODE_AUTH_TOKEN:-}
      TINODE_BASIC_USER: ${TINODE_BASIC_USER:-}
      TINODE_BASIC_PASSWORD: ${TINODE_BASIC_PASSWORD:-}
      TINODE_USER_PASSWORD_SECRET: ${TINODE_USER_PASSWORD_SECRET:-}
      TINODE_REQUEST_TIMEOUT_MS: ${TINODE_REQUEST_TIMEOUT_MS:-5000}
      CONVERACT_CHAT_MESSAGE_MUTATION_WINDOW_MS: ${CONVERACT_CHAT_MESSAGE_MUTATION_WINDOW_MS:-900000}
      CONVERACT_TINODE_DELIVERY_WORKER_ENABLED: ${CONVERACT_TINODE_DELIVERY_WORKER_ENABLED:-1}
      CONVERACT_TINODE_DELIVERY_INTERVAL_MS: ${CONVERACT_TINODE_DELIVERY_INTERVAL_MS:-5000}
      CONVERACT_TINODE_DELIVERY_BATCH_SIZE: ${CONVERACT_TINODE_DELIVERY_BATCH_SIZE:-50}
      CONVERACT_TINODE_DELIVERY_MAX_ATTEMPTS: ${CONVERACT_TINODE_DELIVERY_MAX_ATTEMPTS:-3}
      CONVERACT_TINODE_DELIVERY_CLAIM_LEASE_MS: ${CONVERACT_TINODE_DELIVERY_CLAIM_LEASE_MS:-30000}
      CONVERACT_TINODE_DELIVERY_RETRY_DELAYS_MS: ${CONVERACT_TINODE_DELIVERY_RETRY_DELAYS_MS:-2000,10000}
      CONVERACT_TINODE_INBOUND_WORKER_ENABLED: ${CONVERACT_TINODE_INBOUND_WORKER_ENABLED:-1}
      CONVERACT_TINODE_INBOUND_INTERVAL_MS: ${CONVERACT_TINODE_INBOUND_INTERVAL_MS:-5000}
      CONVERACT_TINODE_INBOUND_TENANT_LIMIT: ${CONVERACT_TINODE_INBOUND_TENANT_LIMIT:-100}
      CONVERACT_TINODE_INBOUND_PULL_LIMIT: ${CONVERACT_TINODE_INBOUND_PULL_LIMIT:-100}
      CONVERACT_TINODE_INBOUND_CLAIM_LEASE_MS: ${CONVERACT_TINODE_INBOUND_CLAIM_LEASE_MS:-60000}
      CONVERACT_TINODE_INBOUND_RETRY_DELAY_MS: ${CONVERACT_TINODE_INBOUND_RETRY_DELAY_MS:-10000}
      CONVERACT_TINODE_INBOUND_DEAD_LETTER_MAX_ATTEMPTS: ${CONVERACT_TINODE_INBOUND_DEAD_LETTER_MAX_ATTEMPTS:-3}
      CONVERACT_TINODE_ATTACHMENT_ALLOWED_HOSTS: ${CONVERACT_TINODE_ATTACHMENT_ALLOWED_HOSTS:-}
      CONVERACT_COLLABORATION_ATTACHMENT_MAX_BYTES: ${CONVERACT_COLLABORATION_ATTACHMENT_MAX_BYTES:-26214400}
      CONVERACT_OCR_PROVIDER_MODE: ${CONVERACT_OCR_PROVIDER_MODE:-self_hosted}
      CONVERACT_OCR_PROVIDER_NAME: ${CONVERACT_OCR_PROVIDER_NAME:-}
      CONVERACT_OCR_BASE_URL: ${CONVERACT_OCR_BASE_URL:-}
      CONVERACT_OCR_ENDPOINT: ${CONVERACT_OCR_ENDPOINT:-/v1/ocr}
      CONVERACT_OCR_TOKEN: ${CONVERACT_OCR_TOKEN:-}
      CONVERACT_OCR_TIMEOUT_MS: ${CONVERACT_OCR_TIMEOUT_MS:-30000}
      CONVERACT_ASR_PROVIDER_MODE: ${CONVERACT_ASR_PROVIDER_MODE:-self_hosted}
      CONVERACT_ASR_PROVIDER_NAME: ${CONVERACT_ASR_PROVIDER_NAME:-}
      CONVERACT_ASR_BASE_URL: ${CONVERACT_ASR_BASE_URL:-}
      CONVERACT_ASR_ENDPOINT: ${CONVERACT_ASR_ENDPOINT:-/v1/asr}
      CONVERACT_ASR_TOKEN: ${CONVERACT_ASR_TOKEN:-}
      CONVERACT_ASR_TIMEOUT_MS: ${CONVERACT_ASR_TIMEOUT_MS:-30000}
      CONVERACT_ATTACHMENT_PROCESSING_WORKER_ENABLED: ${CONVERACT_ATTACHMENT_PROCESSING_WORKER_ENABLED:-1}
      CONVERACT_ATTACHMENT_PROCESSING_INTERVAL_MS: ${CONVERACT_ATTACHMENT_PROCESSING_INTERVAL_MS:-5000}
      CONVERACT_ATTACHMENT_PROCESSING_BATCH_SIZE: ${CONVERACT_ATTACHMENT_PROCESSING_BATCH_SIZE:-25}
      CONVERACT_ATTACHMENT_PROCESSING_MAX_ATTEMPTS: ${CONVERACT_ATTACHMENT_PROCESSING_MAX_ATTEMPTS:-3}
      CONVERACT_ATTACHMENT_PROCESSING_CLAIM_LEASE_MS: ${CONVERACT_ATTACHMENT_PROCESSING_CLAIM_LEASE_MS:-60000}
      CONVERACT_ATTACHMENT_PROCESSING_RETRY_DELAYS_MS: ${CONVERACT_ATTACHMENT_PROCESSING_RETRY_DELAYS_MS:-2000,10000}
      CONVERACT_QUALITY_REVIEW_PROVIDER_MODE: ${CONVERACT_QUALITY_REVIEW_PROVIDER_MODE:-self_hosted}
      CONVERACT_QUALITY_REVIEW_PROVIDER_NAME: ${CONVERACT_QUALITY_REVIEW_PROVIDER_NAME:-}
      CONVERACT_QUALITY_REVIEW_BASE_URL: ${CONVERACT_QUALITY_REVIEW_BASE_URL:-}
      CONVERACT_QUALITY_REVIEW_ENDPOINT: ${CONVERACT_QUALITY_REVIEW_ENDPOINT:-/v1/quality-review}
      CONVERACT_QUALITY_REVIEW_TOKEN: ${CONVERACT_QUALITY_REVIEW_TOKEN:-}
      CONVERACT_QUALITY_REVIEW_TIMEOUT_MS: ${CONVERACT_QUALITY_REVIEW_TIMEOUT_MS:-30000}
      CONVERACT_QUALITY_REVIEW_AUTO_ENQUEUE: ${CONVERACT_QUALITY_REVIEW_AUTO_ENQUEUE:-1}
      CONVERACT_QUALITY_REVIEW_WORKER_ENABLED: ${CONVERACT_QUALITY_REVIEW_WORKER_ENABLED:-1}
      CONVERACT_QUALITY_REVIEW_INTERVAL_MS: ${CONVERACT_QUALITY_REVIEW_INTERVAL_MS:-5000}
      CONVERACT_QUALITY_REVIEW_BATCH_SIZE: ${CONVERACT_QUALITY_REVIEW_BATCH_SIZE:-25}
      CONVERACT_QUALITY_REVIEW_MAX_ATTEMPTS: ${CONVERACT_QUALITY_REVIEW_MAX_ATTEMPTS:-3}
      CONVERACT_QUALITY_REVIEW_CLAIM_LEASE_MS: ${CONVERACT_QUALITY_REVIEW_CLAIM_LEASE_MS:-120000}
      CONVERACT_QUALITY_REVIEW_RETRY_DELAYS_MS: ${CONVERACT_QUALITY_REVIEW_RETRY_DELAYS_MS:-5000,30000}
      CONVERACT_REMOTE_GATEWAY_PROVIDER: ${CONVERACT_REMOTE_GATEWAY_PROVIDER:-rustdesk}
      CONVERACT_REMOTE_GATEWAY_BASE_URL: ${CONVERACT_REMOTE_GATEWAY_BASE_URL:-http://converact:3000}
      CONVERACT_REMOTE_GATEWAY_API_TOKEN: ${CONVERACT_REMOTE_GATEWAY_API_TOKEN:-dev-rustdesk-control-token}
      CONVERACT_REMOTE_GATEWAY_TENANT_ID: ${CONVERACT_REMOTE_GATEWAY_TENANT_ID:-tenant_led}
      CONVERACT_REMOTE_GATEWAY_TARGET_TYPE: ${CONVERACT_REMOTE_GATEWAY_TARGET_TYPE:-device}
      CONVERACT_REMOTE_GATEWAY_TARGET_ID: ${CONVERACT_REMOTE_GATEWAY_TARGET_ID:-}
      CONVERACT_REMOTE_GATEWAY_TARGET_DISPLAY_NAME: ${CONVERACT_REMOTE_GATEWAY_TARGET_DISPLAY_NAME:-Remote gateway smoke device}
      CONVERACT_REMOTE_GATEWAY_ACTOR_IDENTITY: ${CONVERACT_REMOTE_GATEWAY_ACTOR_IDENTITY:-agent_remote_gateway_smoke}
      CONVERACT_REMOTE_GATEWAY_CONSENT_SCOPES: ${CONVERACT_REMOTE_GATEWAY_CONSENT_SCOPES:-view_screen,control_mouse_keyboard,record_screen,transfer_file,clipboard}
      CONVERACT_REMOTE_GATEWAY_CHECK_LAUNCH_URL: ${CONVERACT_REMOTE_GATEWAY_CHECK_LAUNCH_URL:-0}
      CONVERACT_RUSTDESK_CONTROL_PLANE_BASE_URL: ${CONVERACT_RUSTDESK_CONTROL_PLANE_BASE_URL:-http://converact:3000}
      RUSTDESK_SERVER_IMAGE_TAG: ${RUSTDESK_SERVER_IMAGE_TAG:-1.1.16}
      CONVERACT_RUSTDESK_CLIENT_VERSION: ${CONVERACT_RUSTDESK_CLIENT_VERSION:-1.4.9}
      CONVERACT_RUSTDESK_ID_SERVER: ${CONVERACT_RUSTDESK_ID_SERVER:-localhost}
      CONVERACT_RUSTDESK_RELAY_SERVER: ${CONVERACT_RUSTDESK_RELAY_SERVER:-localhost}
      CONVERACT_RUSTDESK_API_SERVER: ${CONVERACT_RUSTDESK_API_SERVER:-}
      CONVERACT_RUSTDESK_PUBLIC_KEY: ${CONVERACT_RUSTDESK_PUBLIC_KEY:-}
      CONVERACT_RUSTDESK_PUBLIC_KEY_FILE: ${CONVERACT_RUSTDESK_PUBLIC_KEY_FILE:-/rustdesk/id_ed25519.pub}
      CONVERACT_RUSTDESK_SERVER_KEY: ${CONVERACT_RUSTDESK_SERVER_KEY:-}
      CONVERACT_RUSTDESK_CLIENT_ARTIFACTS_JSON: ${CONVERACT_RUSTDESK_CLIENT_ARTIFACTS_JSON:-}
      CONVERACT_RUSTDESK_CLIENT_PROFILE_TTL_SECONDS: ${CONVERACT_RUSTDESK_CLIENT_PROFILE_TTL_SECONDS:-900}
      CONVERACT_RUSTDESK_LAUNCH_BASE_URL: ${CONVERACT_RUSTDESK_LAUNCH_BASE_URL:-http://localhost:3000}
      CONVERACT_RUSTDESK_LAUNCH_SECRET: ${CONVERACT_RUSTDESK_LAUNCH_SECRET:-dev-rustdesk-launch-secret}
      CONVERACT_RUSTDESK_LAUNCH_TOKEN_TTL_MS: ${CONVERACT_RUSTDESK_LAUNCH_TOKEN_TTL_MS:-900000}
      CONVERACT_RUSTDESK_PROTOCOL_URL_TEMPLATE: ${CONVERACT_RUSTDESK_PROTOCOL_URL_TEMPLATE:-}
      CONVERACT_RUSTDESK_REQUIRE_PROTOCOL_URL: ${CONVERACT_RUSTDESK_REQUIRE_PROTOCOL_URL:-0}
      CONVERACT_RUSTDESK_REQUIRE_DEVICE_ONLINE: ${CONVERACT_RUSTDESK_REQUIRE_DEVICE_ONLINE:-0}
      CONVERACT_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT: ${CONVERACT_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT:-0}
      CONVERACT_RUSTDESK_EDGE_TOKEN_SECRET: ${CONVERACT_RUSTDESK_EDGE_TOKEN_SECRET:-dev-rustdesk-edge-token-secret-change-me}
      CONVERACT_RUSTDESK_DEVICE_ONLINE_TTL_MS: ${CONVERACT_RUSTDESK_DEVICE_ONLINE_TTL_MS:-300000}
      CONVERACT_RUSTDESK_CHECK_DEVICE_ONLINE: ${CONVERACT_RUSTDESK_CHECK_DEVICE_ONLINE:-0}
      CONVERACT_RUSTDESK_CHECK_OPERATION_AUDIT: ${CONVERACT_RUSTDESK_CHECK_OPERATION_AUDIT:-1}
      CONVERACT_RUSTDESK_CHECK_SERVER_PORTS: ${CONVERACT_RUSTDESK_CHECK_SERVER_PORTS:-0}
      CONVERACT_RUSTDESK_CHECK_HOST: ${CONVERACT_RUSTDESK_CHECK_HOST:-}
      CONVERACT_RUSTDESK_CHECK_TCP_PORTS: ${CONVERACT_RUSTDESK_CHECK_TCP_PORTS:-21115,21116,21117,21118,21119}
      CONVERACT_RUSTDESK_CHECK_UDP_PORTS: ${CONVERACT_RUSTDESK_CHECK_UDP_PORTS:-21116}
      CONVERACT_RUSTDESK_CHECK_TIMEOUT_MS: ${CONVERACT_RUSTDESK_CHECK_TIMEOUT_MS:-1500}
      CONVERACT_RUSTDESK_READINESS_CHECK_DEVICE_ONLINE: ${CONVERACT_RUSTDESK_READINESS_CHECK_DEVICE_ONLINE:-1}
      CONVERACT_RUSTDESK_READINESS_CHECK_OPERATION_AUDIT: ${CONVERACT_RUSTDESK_READINESS_CHECK_OPERATION_AUDIT:-1}
      CONVERACT_RUSTDESK_READINESS_CHECK_SERVER_PORTS: ${CONVERACT_RUSTDESK_READINESS_CHECK_SERVER_PORTS:-1}
      CONVERACT_RUSTDESK_READINESS_REQUIRE_PROTOCOL_URL: ${CONVERACT_RUSTDESK_READINESS_REQUIRE_PROTOCOL_URL:-1}
      CONVERACT_RUSTDESK_READINESS_CHECK_LAUNCH_URL: ${CONVERACT_RUSTDESK_READINESS_CHECK_LAUNCH_URL:-1}
      CONVERACT_RUSTDESK_READINESS_REQUIRE_HTTPS_LAUNCH_URL: ${CONVERACT_RUSTDESK_READINESS_REQUIRE_HTTPS_LAUNCH_URL:-1}
      CONVERACT_RUSTDESK_READINESS_CHECK_PHYSICAL_DISCONNECT: ${CONVERACT_RUSTDESK_READINESS_CHECK_PHYSICAL_DISCONNECT:-0}
      CONVERACT_RUSTDESK_API_TOKEN: ${CONVERACT_RUSTDESK_API_TOKEN:-dev-rustdesk-control-token}
      CONVERACT_DEFAULT_TIMEZONE: Asia/Shanghai
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.6-27B}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-{"chat_template_kwargs":{"enable_thinking":false}}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
    volumes:
      - converact_data:/data
      - rustdesk_data:/rustdesk:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
      rustpbx:
        condition: service_started
      tinode:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-agent:
    build: ./services/ai-agent-py
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      CONVERACT_API_URL: http://converact:3000
      CONVERACT_API_KEY: ${CONVERACT_API_KEY:-dev-converact-key}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.6-27B}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-{"chat_template_kwargs":{"enable_thinking":false}}}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      SPEECH_ASR_PROVIDER: ${SPEECH_ASR_PROVIDER:-funasr}
      SPEECH_ASR_FALLBACK_PROVIDERS: ${SPEECH_ASR_FALLBACK_PROVIDERS:-deepgram,openai}
      SPEECH_TTS_PROVIDER: ${SPEECH_TTS_PROVIDER:-cosyvoice}
      SPEECH_TTS_FALLBACK_PROVIDERS: ${SPEECH_TTS_FALLBACK_PROVIDERS:-cartesia,openai}
      FUNASR_URL: ${FUNASR_URL:-http://host.docker.internal:8899}
      COSYVOICE_URL: ${COSYVOICE_URL:-http://host.docker.internal:50000}
      COSYVOICE_SPK_ID: ${COSYVOICE_SPK_ID:-中文女}
      AI_AGENT_STT_ATTEMPT_TIMEOUT_MS: ${AI_AGENT_STT_ATTEMPT_TIMEOUT_MS:-2000}
      AI_AGENT_LLM_ATTEMPT_TIMEOUT_MS: ${AI_AGENT_LLM_ATTEMPT_TIMEOUT_MS:-1200}
      AI_AGENT_TTS_ATTEMPT_TIMEOUT_MS: ${AI_AGENT_TTS_ATTEMPT_TIMEOUT_MS:-1500}
      AI_AGENT_MAX_UNRECOVERABLE_PROVIDER_ERRORS: ${AI_AGENT_MAX_UNRECOVERABLE_PROVIDER_ERRORS:-3}
      AI_AGENT_PROMETHEUS_PORT: ${AI_AGENT_PROMETHEUS_PORT:-9090}
      AI_AGENT_VOICE_METRICS_UDP_HOST: 127.0.0.1
      AI_AGENT_VOICE_METRICS_UDP_PORT: ${AI_AGENT_VOICE_METRICS_UDP_PORT:-9125}
    expose:
      - "9090"
    depends_on:
      - livekit
      - converact
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===== Monitoring Stack =====
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    depends_on: [converact]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://opc:opc@postgres:5432/opc?sslmode=disable
    ports:
      - "9187:9187"
    depends_on: [postgres]

volumes:
  redis_data:
  minio_data:
  rustpbx_data:
  rustpbx_recordings:
  rustdesk_data:
  converact_data:
  postgres_data:
  tinode_botdata:
  prometheus_data:
  grafana_data:
