[package]
name = "voice-media-rs"
version = "0.2.0"
edition = "2021"

[dependencies]
audio-codec = "=0.3.40"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-queue = "0.3"
mio = { version = "1.0", features = ["net", "os-poll"] }
rand = "0.8"
rustrtc = "=0.3.90"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tiny_http = "0.12"
