services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE immutable digest reference is required}
    environment:
      POSTGRES_DB: opc
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc -d opc"]
      interval: 1s
      timeout: 1s
      retries: 30
    restart: "no"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - recovery

networks:
  recovery:
    name: ${COMPOSE_PROJECT_NAME:-ivekit-realtime-recovery}-network

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-ivekit-realtime-recovery}-data
