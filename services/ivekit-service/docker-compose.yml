x-ivekit-image: &ivekit-image
  image: ${IVEKIT_SERVICE_IMAGE:-ivekit-service:local}
  build:
    context: .

services:
  postgres:
    image: ${IVEKIT_POSTGRES_IMAGE:?IVEKIT_POSTGRES_IMAGE immutable digest reference is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: opc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: opc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc_admin -d opc"]
      interval: 5s
      timeout: 3s
      retries: 30

  runtime-role-init:
    <<: *ivekit-image
    entrypoint: ["node", "dist/ivekit-init-runtime-role.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OPC_RUNTIME_DB_PASSWORD: ${OPC_RUNTIME_DB_PASSWORD:?OPC_RUNTIME_DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *ivekit-image
    entrypoint: ["node", "dist/ivekit-migrate.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      runtime-role-init:
        condition: service_completed_successfully

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE immutable digest reference is required}
    user: clamav
    entrypoint: ["/init-unprivileged"]
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 2G
        limits:
          cpus: "2.0"
          memory: 4G

  placement-projector:
    <<: *ivekit-image
    profiles: ["capacity"]
    entrypoint: ["node", "dist/ivekit-placement-snapshot-projector.js"]
    restart: unless-stopped
    environment:
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_FILE: /run/ivekit-placement/placement.json
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON: ${OPC_IVEKIT_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON:-}
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_KEY_ID: ${OPC_IVEKIT_PLACEMENT_SNAPSHOT_KEY_ID:-}
      OPC_IVEKIT_PLACEMENT_PROFILE_ID: ${OPC_IVEKIT_PLACEMENT_PROFILE_ID:-}
      OPC_IVEKIT_PLACEMENT_TOPOLOGY_JSON: ${OPC_IVEKIT_PLACEMENT_TOPOLOGY_JSON:-}
      OPC_IVEKIT_CELL_ADMISSION_TOKEN: ${OPC_IVEKIT_CELL_ADMISSION_TOKEN:-}
      OPC_IVEKIT_PLACEMENT_PROJECTOR_INTERVAL_MS: ${OPC_IVEKIT_PLACEMENT_PROJECTOR_INTERVAL_MS:-2000}
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_TTL_MS: ${OPC_IVEKIT_PLACEMENT_SNAPSHOT_TTL_MS:-10000}
      OPC_IVEKIT_PLACEMENT_PROJECTOR_TIMEOUT_MS: ${OPC_IVEKIT_PLACEMENT_PROJECTOR_TIMEOUT_MS:-2000}
    volumes:
      - placement_snapshot:/run/ivekit-placement

  ivekit:
    <<: *ivekit-image
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IVEKIT_HTTP_PORT:-8300}:3000"
    env_file:
      - path: ${OPC_IVEKIT_VOICE_RUNTIME_ENV_FILE:-./voice-runtime.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_runtime
      PGPASSWORD: ${OPC_RUNTIME_DB_PASSWORD:?OPC_RUNTIME_DB_PASSWORD is required}
      OPC_SCHEMA_MANAGED_BY_MIGRATIONS: "1"
      REDIS_URL: ${REDIS_URL:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      OPC_SIP_VOLTE_ENABLED: ${OPC_SIP_VOLTE_ENABLED:-0}
      LIVEKIT_SIP_BRIDGE_TARGET: ${LIVEKIT_SIP_BRIDGE_TARGET:-}
      RUSTPBX_LIVEKIT_TRUNK: ${RUSTPBX_LIVEKIT_TRUNK:-}
      RUSTPBX_RWI_URL: ${RUSTPBX_RWI_URL:-}
      OPC_API_KEY: ${OPC_API_KEY:-}
      OPC_JWT_SECRET: ${OPC_JWT_SECRET:-}
      OPC_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT: ${OPC_RUSTDESK_REQUIRE_PHYSICAL_DISCONNECT:-0}
      OPC_RUSTDESK_AUTHORIZATION_CODE_SECRET: ${OPC_RUSTDESK_AUTHORIZATION_CODE_SECRET:-}
      OPC_RUSTDESK_REQUIRE_AUTHORIZATION_CODE: ${OPC_RUSTDESK_REQUIRE_AUTHORIZATION_CODE:-0}
      OPC_RUSTDESK_EDGE_TOKEN_SECRET: ${OPC_RUSTDESK_EDGE_TOKEN_SECRET:-}
      OPC_IVEKIT_ALLOWED_ORIGINS: ${OPC_IVEKIT_ALLOWED_ORIGINS:-}
      OPC_IVEKIT_PLACEMENT_ENABLED: ${OPC_IVEKIT_PLACEMENT_ENABLED:-0}
      OPC_IVEKIT_PLACEMENT_SNAPSHOT_FILE: /run/ivekit-placement/placement.json
