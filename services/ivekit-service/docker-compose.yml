      OPC_QUALITY_REVIEW_INTERVAL_MS: ${OPC_QUALITY_REVIEW_INTERVAL_MS:-5000}
      OPC_QUALITY_REVIEW_BATCH_SIZE: ${OPC_QUALITY_REVIEW_BATCH_SIZE:-25}
      OPC_QUALITY_REVIEW_MAX_ATTEMPTS: ${OPC_QUALITY_REVIEW_MAX_ATTEMPTS:-3}
      OPC_QUALITY_REVIEW_CLAIM_LEASE_MS: ${OPC_QUALITY_REVIEW_CLAIM_LEASE_MS:-120000}
      OPC_QUALITY_REVIEW_RETRY_DELAYS_MS: ${OPC_QUALITY_REVIEW_RETRY_DELAYS_MS:-5000,30000}
      OPC_TRANSLATION_WORKER_ENABLED: ${OPC_TRANSLATION_WORKER_ENABLED:-0}
      OPC_TRANSLATION_INTERVAL_MS: ${OPC_TRANSLATION_INTERVAL_MS:-5000}
      OPC_TRANSLATION_BATCH_SIZE: ${OPC_TRANSLATION_BATCH_SIZE:-25}
      OPC_TRANSLATION_MAX_ATTEMPTS: ${OPC_TRANSLATION_MAX_ATTEMPTS:-3}
      OPC_TRANSLATION_CLAIM_LEASE_MS: ${OPC_TRANSLATION_CLAIM_LEASE_MS:-120000}
      OPC_TRANSLATION_RETRY_DELAYS_MS: ${OPC_TRANSLATION_RETRY_DELAYS_MS:-5000,30000}
      OPC_MEDIA_CALL_TIMEOUT_WORKER_ENABLED: ${OPC_MEDIA_CALL_TIMEOUT_WORKER_ENABLED:-0}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_ENABLED: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_ENABLED:-0}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_INTERVAL_MS: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_INTERVAL_MS:-10000}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_BATCH_SIZE: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_BATCH_SIZE:-25}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_TENANT_LIMIT: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_TENANT_LIMIT:-100}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_LEASE_MS: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_LEASE_MS:-30000}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_STALE_MS: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_STALE_MS:-30000}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_RETRY_BASE_MS: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_RETRY_BASE_MS:-5000}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_RETRY_MAX_MS: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_RETRY_MAX_MS:-300000}
      OPC_LIVEKIT_EGRESS_RECONCILIATION_MAX_MISSING: ${OPC_LIVEKIT_EGRESS_RECONCILIATION_MAX_MISSING:-2}
      OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_ENABLED: ${OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_ENABLED:-0}
      OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_INTERVAL_MS: ${OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_INTERVAL_MS:-5000}
      OPC_IVEKIT_CONTACT_CENTER_WORKER_ENABLED: ${OPC_IVEKIT_CONTACT_CENTER_WORKER_ENABLED:-0}
      OPC_IVEKIT_CONTACT_CENTER_INTERVAL_MS: ${OPC_IVEKIT_CONTACT_CENTER_INTERVAL_MS:-1000}
      OPC_IVEKIT_CONTACT_CENTER_TENANT_LIMIT: ${OPC_IVEKIT_CONTACT_CENTER_TENANT_LIMIT:-100}
      OPC_IVEKIT_CONTACT_CENTER_BATCH_SIZE: ${OPC_IVEKIT_CONTACT_CENTER_BATCH_SIZE:-100}
      OPC_IVEKIT_CONTACT_CENTER_OFFER_TTL_SECONDS: ${OPC_IVEKIT_CONTACT_CENTER_OFFER_TTL_SECONDS:-20}
      OPC_IVEKIT_CONTACT_CENTER_CALLBACK_RETRY_DELAY_MS: ${OPC_IVEKIT_CONTACT_CENTER_CALLBACK_RETRY_DELAY_MS:-30000}
      OPC_IVEKIT_CONTACT_CENTER_OVERFLOW_RETRY_DELAY_MS: ${OPC_IVEKIT_CONTACT_CENTER_OVERFLOW_RETRY_DELAY_MS:-30000}
    volumes:
      - placement_snapshot:/run/ivekit-placement:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  backup:
    <<: *ivekit-image
    profiles: ["operations"]
    entrypoint: ["node", "dist/ivekit-backup.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OPC_IVEKIT_TINODE_ADMIN_DATABASE_URL: ${OPC_IVEKIT_TINODE_ADMIN_DATABASE_URL:-}
      OPC_IVEKIT_RUSTPBX_ADMIN_DATABASE_URL: ${OPC_IVEKIT_RUSTPBX_ADMIN_DATABASE_URL:-}
      OPC_IVEKIT_BACKUP_ROOT: /backups
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      IVEKIT_RESTORE_CONFIRM: ${IVEKIT_RESTORE_CONFIRM:-}
      IVEKIT_RESTORE_TARGET_EMPTY: ${IVEKIT_RESTORE_TARGET_EMPTY:-0}
    volumes:
      - ${OPC_IVEKIT_BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  clamav_signatures:
  placement_snapshot:
