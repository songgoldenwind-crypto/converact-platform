replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

terminationGracePeriodSeconds: 60
preStopDelaySeconds: 10

topologySpreadConstraints:
  enabled: true
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

secrets:
  existingSecret: ""
  runtimeEnvironmentSecret: ""
  adminDatabaseUrlKey: admin-database-url
  runtimeDatabaseUrlKey: runtime-database-url
  runtimeDatabasePasswordKey: runtime-database-password
  auditIpHmacKeyKey: audit-ip-hmac-key
  rateLimitHmacKeyKey: rate-limit-hmac-key

config:
  allowedOrigins: ""
  env:
    OPC_IVEKIT_EVENT_REPLAY_ENABLED: "1"
    OPC_IVEKIT_RATE_LIMIT_ENABLED: "1"
    OPC_IVEKIT_RATE_LIMIT_NOTIFICATION_TENANT_PER_MINUTE: "1000"
    OPC_IVEKIT_RATE_LIMIT_NOTIFICATION_ACTOR_PER_MINUTE: "60"
    OPC_IVEKIT_RATE_LIMIT_NOTIFICATION_SOURCE_IP_PER_MINUTE: "120"
    OPC_IVEKIT_RATE_LIMIT_NOTIFICATION_RECIPIENT_PER_MINUTE: "10"
    OPC_IVEKIT_RATE_LIMIT_RECEIPT_TENANT_PER_MINUTE: "5000"
    OPC_IVEKIT_RATE_LIMIT_RECEIPT_PROVIDER_PER_MINUTE: "600"
    OPC_IVEKIT_RATE_LIMIT_RECEIPT_SOURCE_IP_PER_MINUTE: "1200"
    OPC_IVEKIT_RATE_LIMIT_EVENT_WEBHOOK_TENANT_PER_MINUTE: "120"
    OPC_IVEKIT_RATE_LIMIT_EVENT_WEBHOOK_ACTOR_PER_MINUTE: "30"
    OPC_IVEKIT_RATE_LIMIT_EVENT_WEBHOOK_SOURCE_IP_PER_MINUTE: "60"
    OPC_IVEKIT_NOTIFICATION_WORKER_ENABLED: "0"
    OPC_IVEKIT_NOTIFICATION_INTERVAL_MS: "5000"
    OPC_IVEKIT_NOTIFICATION_BATCH_SIZE: "25"
    OPC_IVEKIT_NOTIFICATION_TENANT_LIMIT: "100"
    OPC_IVEKIT_NOTIFICATION_LEASE_MS: "120000"
    OPC_IVEKIT_NOTIFICATION_PARTITION_COUNT: "1"
    OPC_IVEKIT_NOTIFICATION_PARTITION_INDEX: "0"
    OPC_IVEKIT_NOTIFICATION_RETRY_DELAYS_MS: "5000,30000,120000,600000"
    OPC_IVEKIT_EVENT_WEBHOOK_WORKER_ENABLED: "0"
    OPC_IVEKIT_EVENT_WEBHOOK_INTERVAL_MS: "5000"
    OPC_IVEKIT_EVENT_WEBHOOK_TENANT_LIMIT: "100"
    OPC_IVEKIT_EVENT_WEBHOOK_SUBSCRIPTION_LIMIT: "25"
    OPC_IVEKIT_EVENT_WEBHOOK_EVENT_BATCH_SIZE: "100"
    OPC_IVEKIT_EVENT_WEBHOOK_LEASE_MS: "120000"
    OPC_IVEKIT_EVENT_WEBHOOK_RETRY_DELAYS_MS: "5000,30000,120000,600000"
    OPC_IVEKIT_NOTIFICATION_WEBHOOK_SECRET_ENV_NAMES: ""
    OPC_IVEKIT_NOTIFICATION_PROVIDER_SECRET_ENV_NAMES: ""
    OPC_IVEKIT_NOTIFICATION_HEALTH_WORKER_ENABLED: "0"
    OPC_IVEKIT_NOTIFICATION_HEALTH_INTERVAL_MS: "60000"
    OPC_IVEKIT_NOTIFICATION_HEALTH_STALE_MS: "300000"
    OPC_IVEKIT_NOTIFICATION_HEALTH_LEASE_MS: "120000"
    OPC_IVEKIT_NOTIFICATION_HEALTH_TENANT_LIMIT: "100"
    OPC_IVEKIT_NOTIFICATION_HEALTH_BATCH_SIZE: "25"
    OPC_IVEKIT_NOTIFICATION_HEALTH_CONCURRENCY: "5"
    OPC_IVEKIT_NOTIFICATION_ALLOW_CONTROLLED: "0"
    OPC_IVEKIT_READINESS_REQUIRE_HEALTHY_NOTIFICATION_PROVIDER: "0"
    OPC_IVEKIT_RETENTION_WORKER_ENABLED: "0"
    OPC_IVEKIT_RETENTION_INTERVAL_MS: "60000"
    OPC_IVEKIT_RETENTION_TENANT_LIMIT: "100"
    OPC_IVEKIT_RETENTION_POLICY_LIMIT: "20"
    OPC_IVEKIT_RETENTION_LEASE_MS: "120000"
    OPC_IVEKIT_RUNTIME_HEARTBEAT_ENABLED: "1"
    OPC_IVEKIT_RUNTIME_HEARTBEAT_INTERVAL_MS: "10000"
    OPC_IVEKIT_RUNTIME_HEARTBEAT_STALE_AFTER_MS: "45000"
    OPC_IVEKIT_EVENT_RETENTION_MS: "86400000"
    OPC_IVEKIT_EVENT_MAX_PAYLOAD_BYTES: "65536"
    OPC_IVEKIT_WS_REPLAY_MAX_EVENTS: "500"
    OPC_IVEKIT_EVENT_RETENTION_WORKER_ENABLED: "1"
    OPC_IVEKIT_EVENT_RETENTION_INTERVAL_MS: "60000"
    OPC_IVEKIT_EVENT_RETENTION_TENANT_LIMIT: "100"
    OPC_IVEKIT_EVENT_RETENTION_BATCH_SIZE: "1000"
    OPC_TINODE_DELIVERY_WORKER_ENABLED: "0"
    OPC_TINODE_INBOUND_WORKER_ENABLED: "0"
    OPC_ATTACHMENT_PROCESSING_WORKER_ENABLED: "0"
    OPC_QUALITY_REVIEW_WORKER_ENABLED: "0"
    OPC_TRANSLATION_WORKER_ENABLED: "0"
    OPC_MEDIA_CALL_TIMEOUT_WORKER_ENABLED: "0"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_ENABLED: "0"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_INTERVAL_MS: "10000"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_BATCH_SIZE: "25"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_TENANT_LIMIT: "100"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_LEASE_MS: "30000"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_STALE_MS: "30000"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_RETRY_BASE_MS: "5000"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_RETRY_MAX_MS: "300000"
    OPC_LIVEKIT_EGRESS_RECONCILIATION_MAX_MISSING: "2"
    OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_ENABLED: "0"
    OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_INTERVAL_MS: "5000"
    OPC_IVEKIT_IVR_WORKERS_ENABLED: "0"
    OPC_IVEKIT_VOICE_WORKERS_ENABLED: "0"
    OPC_IVEKIT_VOICE_SECRET_ENV_NAMES: "RUSTPBX_MANAGEMENT_TOKEN,RUSTPBX_RWI_TOKEN"
    OPC_IVEKIT_VOICE_WEBHOOK_SECRET_ENV_NAMES: "RUSTPBX_WEBHOOK_TOKEN"
    OPC_IVEKIT_CONTACT_CENTER_WORKER_ENABLED: "0"

placement:
  enabled: false
  profileId: cell-10k-v1
  homeRegionId: region-a
  failoverRegionIds: ""
  topologyJson: ""
  mediaPolicyJson: '{"profile_id":"cell-10k-v1","fixed_capacity":{},"per_participant_capacity":{"video.participants":1}}'
  egressTrackPolicyJson: '{"profile_id":"cell-10k-v1","fixed_capacity":{"workers.track_egress_slots":1}}'
  egressCompositePolicyJson: '{"profile_id":"cell-10k-v1","fixed_capacity":{"workers.composite_egress_slots":1}}'
  voicePolicyJson: '{"profile_id":"cell-10k-v1","fixed_capacity":{"voice.weighted_calls":1}}'
  tinodePolicyJson: '{"profile_id":"cell-10k-v1","fixed_capacity":{"im.presence_sessions":1}}'
  rustdeskPolicyJson: '{"profile_id":"cell-10k-v1","fixed_capacity":{"remote.active_sessions":1}}'
  snapshotKeyId: snapshot-v1
  tokenKeyId: placement-v1
  projectorIntervalMs: "2000"
  projectorTimeoutMs: "2000"
  snapshotTtlMs: "10000"
  snapshotRefreshMs: "1000"
  staleGraceMs: "30000"
  admissionTimeoutMs: "2000"
  workerIntervalMs: "250"
  workerTenantLimit: "100"
  workerBatchSize: "50"
  snapshotVolumeSizeLimit: 16Mi
  secrets:
    snapshotHmacKeysKey: placement-snapshot-hmac-keys-json
    tokenHmacKeysKey: placement-token-hmac-keys-json
    admissionTokenKey: cell-admission-token
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

service:
  type: ClusterIP
  port: 3000

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

migration:
  activeDeadlineSeconds: 900
  backoffLimit: 1

backup:
  enabled: false
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 21600
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backupRoot: /backups
  persistence:
    existingClaim: ""
  localObjectStorage:
    existingClaim: ""
    mountPath: /objects
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

notificationWorker:
  enabled: false
  replicaCount: 2
  intervalMs: "5000"
  batchSize: "25"
  tenantLimit: "100"
  leaseMs: "120000"
  retryDelaysMs: "5000,30000,120000,600000"
  terminationGracePeriodSeconds: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

fileSecurity:
  scannerMode: clamd
  scanWorkerEnabled: "1"
  scanIntervalMs: "5000"
  scanBatchSize: "25"
  scanLeaseMs: "60000"
  scanMaxBytes: "104857600"
  mimeConflictAction: quarantine
  clamdHost: ""
  clamdPort: "3310"
  derivativeProviderMode: local_ffmpeg
  derivativeWorkerEnabled: "1"
  derivativeIntervalMs: "5000"
  derivativeBatchSize: "10"
  derivativeLeaseMs: "120000"
  cleanupWorkerEnabled: "0"
  cleanupConfirm: "0"

clamav:
  enabled: true
  replicaCount: 1
  image:
    repository: clamav/clamav
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

voice:
  enabled: false
  tenantId: ""
  profileId: ""
  cellId: ""
  regionId: ""
  zoneId: ""
  image:
    repository: ghcr.io/restsend/rustpbx
    digest: ""
    pullPolicy: IfNotPresent
  sipCapacity:
    maxActiveTransactions: 65536
    maxFinishedTransactions: 65536
    incomingTransactionQueueCapacity: 8192
    maxTransportConnections: 32768
  mediaCapacity:
    recordingChannelCapacity: 256
    recordingWorkerThreads: 4
    recordingWorkerQueueCapacity: 4096
  databaseUrlKey: rustpbx-database-url
  databasePasswordKey: rustpbx-database-password
  managementTokenKey: rustpbx-management-token
  rwiTokenKey: rustpbx-rwi-token
  webhookTokenKey: rustpbx-webhook-token
  addressHmacKeyKey: ivekit-voice-address-hmac-key
  routeSnapshot:
    hmacKeyKey: rustpbx-route-snapshot-hmac-key
    intervalMs: "1000"
    ttlMs: "10000"
    refreshMs: "500"
    dependencies: ""
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  recordingSpool:
    enabled: true
    leaseSecretKey: rustpbx-recording-lease-secret
    segmentSeconds: "60"
    segmentMaxBytes: "67108864"
    partSizeBytes: "8388608"
    leaseMs: "300000"
    uploadConcurrency: "4"
    pollIntervalMs: "1000"
    metricsRefreshMs: "1000"
    metricsStaleMs: "5000"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  componentNode:
    enabled: false
    tokenKey: ivekit-component-node-token
    regionId: ""
    zoneId: ""
    profileIds: []
    dimensionsJson: ""
    port: 3210
    timeoutMs: "500"
    refreshMs: "3000"
    terminalRetentionMs: "300000"
    sweepIntervalMs: "1000"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  amiAllows:
    - 127.0.0.1
  externalIp: ""
  sipPort: 5060
  rtpStartPort: 20000
  rtpEndPort: 20100
  service:
    sipType: LoadBalancer
    rtpType: LoadBalancer
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

tinode:
  enabled: false
  replicaCount: 1
  image:
    repository: tinode/tinode
    digest: ""
    pullPolicy: IfNotPresent
  secrets:
    postgresDsnKey: tinode-postgres-dsn
    apiKeySaltKey: tinode-api-key-salt
    apiKeyKey: tinode-api-key
    authTokenKeyKey: tinode-auth-token-key
    uidEncryptionKeyKey: tinode-uid-encryption-key
    basicUserKey: tinode-basic-user
    basicPasswordKey: tinode-basic-password
    userPasswordSecretKey: tinode-user-password-secret
  config:
    upgradeDatabase: "false"
    accountGarbageCollectionEnabled: "true"
    bootstrapTimeoutMs: "10000"
    deliveryWorkerEnabled: "1"
    inboundWorkerEnabled: "1"
  publicBaseUrl: ""
  publicWsUrl: ""
  service:
    type: ClusterIP
    port: 6060
  persistence:
    enabled: true
    existingClaim: ""
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  networkPolicy:
    enabled: false
    additionalIngressFrom: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
