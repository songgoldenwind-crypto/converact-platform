deploymentProfiles:
  # core is the mandatory base. Optional capability groups require an explicit
  # overlay from profiles/ and cannot silently enable themselves.
  core: true
  ai: false
  observability: false
  benchmark: false

replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

terminationGracePeriodSeconds: 60
preStopDelaySeconds: 10

topologySpreadConstraints:
  enabled: true
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

telemetry:
  enabled: false
  collectorEndpoint: ""
  sampleRatio: "0.1"
  maxQueueSize: "2048"
  maxExportBatchSize: "256"
  scheduledDelayMs: "5000"
  exportTimeoutMs: "3000"

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

secrets:
  existingSecret: ""
  runtimeEnvironmentSecret: ""
  adminDatabaseUrlKey: admin-database-url
  runtimeDatabaseUrlKey: runtime-database-url
  runtimeDatabasePasswordKey: runtime-database-password
  auditIpHmacKeyKey: audit-ip-hmac-key
  rateLimitHmacKeyKey: rate-limit-hmac-key
  realtimeAudioTapHmacSecretKey: realtime-audio-tap-hmac-secret-b64

