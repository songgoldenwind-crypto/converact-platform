apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ivekit.fullname" . }}-migrate
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "ivekit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: runtime-role-init
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/ivekit-init-runtime-role.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.secrets.adminDatabaseUrlKey }}
            - name: OPC_RUNTIME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.secrets.runtimeDatabasePasswordKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: migrate
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/ivekit-migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.secrets.adminDatabaseUrlKey }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
