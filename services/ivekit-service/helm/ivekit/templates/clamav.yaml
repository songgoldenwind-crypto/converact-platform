{{- if .Values.clamav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivekit.clamavFullname" . }}
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: {{ .Values.clamav.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        {{- include "ivekit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clamav
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.clamav.podSecurityContext | nindent 8 }}
      containers:
        - name: clamav
          image: {{ include "ivekit.clamavImage" . | quote }}
          imagePullPolicy: {{ .Values.clamav.image.pullPolicy }}
          command: ["/init-unprivileged"]
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          startupProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.clamav.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: signatures
          {{- if .Values.clamav.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ivekit.clamavFullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ivekit.clamavFullname" . }}
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  type: ClusterIP
  selector:
    {{- include "ivekit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
      protocol: TCP
{{- if .Values.clamav.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ivekit.clamavFullname" . }}
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.clamav.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.clamav.persistence.size }}
{{- end }}
{{- end }}
