{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ivekit.fullname" . }}-grafana-dashboard
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  ivekit-shared-foundation.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
{{- end }}
