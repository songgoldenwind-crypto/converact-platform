            - name: IVEKIT_DIALOG_SHADOW_FAULT_DOMAIN
              value: {{ .Values.voice.dialogShadow.faultDomain | quote }}
            - name: IVEKIT_DIALOG_SHADOW_JOURNAL_PATH
              value: /app/dialog-shadow/dialog-shadow.wal
            - name: IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_RECORDS
              value: {{ .Values.voice.dialogShadow.journal.maxRecords | quote }}
            - name: IVEKIT_DIALOG_SHADOW_JOURNAL_MAX_BYTES
