            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: component-node
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.componentNode.resources | nindent 12 }}
          {{- if .Values.voice.recordingSpool.enabled }}
          volumeMounts:
            - name: storage
              mountPath: /app/recording-state
              readOnly: true
          {{- end }}
        {{- end }}
        {{- if .Values.realtimeAudioTap.enabled }}
