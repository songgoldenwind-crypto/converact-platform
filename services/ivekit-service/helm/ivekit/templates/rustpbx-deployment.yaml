{{- if .Values.voice.enabled }}
{{- $rustpbxImage := include "ivekit.rustpbxImage" . -}}
{{- $profileId := required "voice.profileId is required when voice is enabled" .Values.voice.profileId -}}
{{- $tenantId := required "voice.tenantId is required when voice is enabled" .Values.voice.tenantId -}}
{{- $cellId := required "voice.cellId is required when voice is enabled" .Values.voice.cellId -}}
{{- $cdrEndpoint := required "voice.cdr.endpoint is required when voice is enabled" .Values.voice.cdr.endpoint -}}
{{- $_ := required "voice.cdr.regionId is required when voice is enabled" .Values.voice.cdr.regionId -}}
{{- $replicaCount := int .Values.voice.replicaCount -}}
{{- if not (hasPrefix "https://" $cdrEndpoint) -}}
{{- fail "voice.cdr.endpoint must use HTTPS" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.cdr.pollIntervalMs) 100) (gt (int .Values.voice.cdr.pollIntervalMs) 60000) -}}
{{- fail "voice.cdr.pollIntervalMs must be between 100 and 60000" -}}
{{- end -}}
{{- if not .Values.voice.persistence.enabled -}}
{{- fail "voice.persistence.enabled must be true for the durable CDR spool" -}}
{{- end -}}
{{- if or (lt $replicaCount 2) (gt $replicaCount 128) -}}
{{- fail "voice.replicaCount must be between 2 and 128" -}}
{{- end -}}
{{- if and (gt $replicaCount 1) (not .Values.voice.network.hostNetwork) -}}
{{- fail "voice.network.hostNetwork must be true for a multi-node RTP pool" -}}
{{- end -}}
{{- if and .Values.voice.kamailio.enabled (not .Values.voice.componentNode.enabled) -}}
{{- fail "voice.componentNode.enabled must be true when Kamailio is enabled" -}}
{{- end -}}
{{- range $name, $value := dict "maxActiveTransactions" .Values.voice.sipCapacity.maxActiveTransactions "maxFinishedTransactions" .Values.voice.sipCapacity.maxFinishedTransactions "incomingTransactionQueueCapacity" .Values.voice.sipCapacity.incomingTransactionQueueCapacity "maxTransportConnections" .Values.voice.sipCapacity.maxTransportConnections -}}
{{- if or (lt (int $value) 1) (gt (int $value) 10000000) -}}
{{- fail (printf "voice.sipCapacity.%s must be between 1 and 10000000" $name) -}}
{{- end -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.sessionCleanupConcurrency) 1) (gt (int .Values.voice.mediaCapacity.sessionCleanupConcurrency) 4096) -}}
{{- fail "voice.mediaCapacity.sessionCleanupConcurrency must be between 1 and 4096" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs) 1) (gt (int .Values.voice.mediaCapacity.sessionCleanupTimeoutMs) 60000) -}}
{{- fail "voice.mediaCapacity.sessionCleanupTimeoutMs must be between 1 and 60000" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingChannelCapacity) 1) (gt (int .Values.voice.mediaCapacity.recordingChannelCapacity) 65536) -}}
{{- fail "voice.mediaCapacity.recordingChannelCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingWorkerThreads) 1) (gt (int .Values.voice.mediaCapacity.recordingWorkerThreads) 64) -}}
{{- fail "voice.mediaCapacity.recordingWorkerThreads must be between 1 and 64" -}}
{{- end -}}
{{- if or (lt (int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity) 1) (gt (int .Values.voice.mediaCapacity.recordingWorkerQueueCapacity) 65536) -}}
{{- fail "voice.mediaCapacity.recordingWorkerQueueCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- range $name, $value := dict "udpReceiveBufferBytes" .Values.voice.mediaCapacity.udpReceiveBufferBytes "udpSendBufferBytes" .Values.voice.mediaCapacity.udpSendBufferBytes -}}
{{- if or (lt (int $value) 65536) (gt (int $value) 16777216) -}}
{{- fail (printf "voice.mediaCapacity.%s must be between 65536 and 16777216" $name) -}}
{{- end -}}
{{- end -}}
{{- if .Values.realtimeAudioTap.enabled -}}
{{- if or (lt (int .Values.realtimeAudioTap.rustPbxChannelCapacity) 1) (gt (int .Values.realtimeAudioTap.rustPbxChannelCapacity) 65536) -}}
{{- fail "realtimeAudioTap.rustPbxChannelCapacity must be between 1 and 65536" -}}
{{- end -}}
{{- if or (lt (int .Values.realtimeAudioTap.rustPbxSendTimeoutMs) 1) (gt (int .Values.realtimeAudioTap.rustPbxSendTimeoutMs) 1000) -}}
{{- fail "realtimeAudioTap.rustPbxSendTimeoutMs must be between 1 and 1000" -}}
{{- end -}}
{{- if or (lt (int .Values.realtimeAudioTap.projectionQueueMaxItems) 1) (gt (int .Values.realtimeAudioTap.projectionQueueMaxItems) 100000) -}}
{{- fail "realtimeAudioTap.projectionQueueMaxItems must be between 1 and 100000" -}}
{{- end -}}
{{- if or (lt (int .Values.realtimeAudioTap.projectionShutdownTimeoutMs) 10) (gt (int .Values.realtimeAudioTap.projectionShutdownTimeoutMs) 30000) -}}
{{- fail "realtimeAudioTap.projectionShutdownTimeoutMs must be between 10 and 30000" -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.recordingSpool.enabled -}}
{{- $_ := required "voice.regionId is required when recording spool is enabled" .Values.voice.regionId -}}
{{- $_ := required "voice.zoneId is required when recording spool is enabled" .Values.voice.zoneId -}}
{{- $_ := required "voice.recordingSpool.leaseSecretKey is required when recording spool is enabled" .Values.voice.recordingSpool.leaseSecretKey -}}
{{- $partSizeBytes := int .Values.voice.recordingSpool.partSizeBytes -}}
{{- if or (lt $partSizeBytes 5242880) (gt $partSizeBytes 16777216) -}}
{{- fail "voice.recordingSpool.partSizeBytes must be between 5 MiB and 16 MiB" -}}
{{- end -}}
{{- $uploadConcurrency := int .Values.voice.recordingSpool.uploadConcurrency -}}
{{- if or (lt $uploadConcurrency 1) (gt $uploadConcurrency 64) -}}
{{- fail "voice.recordingSpool.uploadConcurrency must be between 1 and 64" -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.componentNode.enabled -}}
{{- if ne (int .Values.voice.componentNode.port) 3210 -}}
{{- fail "voice.componentNode.port must be 3210" -}}
{{- end -}}
{{- $_ := required "voice.componentNode.regionId is required when component-node is enabled" .Values.voice.componentNode.regionId -}}
{{- $_ := required "voice.componentNode.zoneId is required when component-node is enabled" .Values.voice.componentNode.zoneId -}}
{{- $_ := required "voice.componentNode.dimensionsJson is required when component-node is enabled" .Values.voice.componentNode.dimensionsJson -}}
{{- if empty .Values.voice.componentNode.profileIds -}}
{{- fail "voice.componentNode.profileIds is required when component-node is enabled" -}}
{{- end -}}
{{- end -}}
{{- if .Values.voice.dialogShadow.enabled -}}
{{- if not .Values.voice.persistence.enabled -}}
{{- fail "voice.persistence.enabled must be true when dialog shadow is enabled" -}}
{{- end -}}
{{- if not (regexMatch "^https://localhost:3212/?$" (required "voice.dialogShadow.endpoint is required" .Values.voice.dialogShadow.endpoint)) -}}
{{- fail "voice.dialogShadow.endpoint must be node-local https://localhost:3212/" -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.faultDomain is required" .Values.voice.dialogShadow.faultDomain -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" .Values.voice.dialogShadow.faultDomain) -}}
{{- fail "voice.dialogShadow.faultDomain is invalid" -}}
{{- end -}}
{{- if not (regexMatch "(^[a-z0-9]$)|(^[a-z0-9][a-z0-9.-]{0,251}[a-z0-9]$)" (required "voice.dialogShadow.spiffeTrustDomain is required" .Values.voice.dialogShadow.spiffeTrustDomain)) -}}
{{- fail "voice.dialogShadow.spiffeTrustDomain is invalid" -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.serviceTokenKey is required" .Values.voice.dialogShadow.serviceTokenKey -}}
{{- $_ := required "voice.dialogShadow.recoveryDatabaseUrlKey is required" .Values.voice.dialogShadow.recoveryDatabaseUrlKey -}}
{{- $_ := required "voice.dialogShadow.currentRecoveryKeyId is required" .Values.voice.dialogShadow.currentRecoveryKeyId -}}
{{- $_ := required "voice.dialogShadow.currentRecoveryKeyKey is required" .Values.voice.dialogShadow.currentRecoveryKeyKey -}}
{{- $_ := required "voice.dialogShadow.previousRecoveryKeyId is required" .Values.voice.dialogShadow.previousRecoveryKeyId -}}
{{- $_ := required "voice.dialogShadow.previousRecoveryKeyKey is required" .Values.voice.dialogShadow.previousRecoveryKeyKey -}}
{{- if eq .Values.voice.dialogShadow.currentRecoveryKeyId .Values.voice.dialogShadow.previousRecoveryKeyId -}}
{{- fail "voice.dialogShadow recovery key ids must be distinct" -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.serverTlsSecretName is required" .Values.voice.dialogShadow.serverTlsSecretName -}}
{{- $_ := required "voice.dialogShadow.clientIdentity.csi.driver is required" .Values.voice.dialogShadow.clientIdentity.csi.driver -}}
{{- if empty .Values.voice.dialogShadow.clientIdentity.csi.volumeAttributes -}}
{{- fail "voice.dialogShadow.clientIdentity.csi.volumeAttributes must identify a per-Pod certificate provider" -}}
{{- end -}}
{{- range $name, $value := dict "identityFile" .Values.voice.dialogShadow.clientIdentity.identityFile "caFile" .Values.voice.dialogShadow.clientIdentity.caFile -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" $value) -}}
{{- fail (printf "voice.dialogShadow.clientIdentity.%s must be a filename" $name) -}}
{{- end -}}
{{- end -}}
{{- if empty .Values.voice.dialogShadow.nats.urls -}}
{{- fail "voice.dialogShadow.nats.urls must contain TLS NATS endpoints" -}}
{{- end -}}
{{- range .Values.voice.dialogShadow.nats.urls -}}
{{- if not (regexMatch "^tls://[^/@[:space:]]+(:[0-9]+)?$" .) -}}
{{- fail "voice.dialogShadow.nats.urls must contain credential-free tls:// endpoints" -}}
{{- end -}}
{{- end -}}
{{- $_ := required "voice.dialogShadow.nats.tlsSecretName is required" .Values.voice.dialogShadow.nats.tlsSecretName -}}
{{- $_ := required "voice.dialogShadow.nats.faultDomainsSecretName is required" .Values.voice.dialogShadow.nats.faultDomainsSecretName -}}
{{- $_ := required "voice.dialogShadow.nats.placementCluster is required" .Values.voice.dialogShadow.nats.placementCluster -}}
{{- if empty .Values.voice.dialogShadow.nats.placementTags -}}
{{- fail "voice.dialogShadow.nats.placementTags is required" -}}
{{- end -}}
{{- $streamReplicas := int .Values.voice.dialogShadow.nats.streamReplicas -}}
{{- if not (or (eq $streamReplicas 3) (eq $streamReplicas 5)) -}}
{{- fail "voice.dialogShadow.nats.streamReplicas must be 3 or 5" -}}
{{- end -}}
{{- $requiredFaultDomains := int .Values.voice.dialogShadow.nats.requiredFaultDomains -}}
{{- if or (lt $requiredFaultDomains 2) (gt $requiredFaultDomains $streamReplicas) -}}
{{- fail "voice.dialogShadow.nats.requiredFaultDomains must be between 2 and streamReplicas" -}}
{{- end -}}
{{- if ge (int .Values.voice.dialogShadow.rustPbx.heartbeatIntervalMs) (int .Values.voice.dialogShadow.recovery.nodeLeaseTtlMs) -}}
{{- fail "voice.dialogShadow.rustPbx.heartbeatIntervalMs must be lower than recovery.nodeLeaseTtlMs" -}}
{{- end -}}
{{- end -}}
{{- if not (has "127.0.0.1" .Values.voice.amiAllows) -}}
{{- fail "voice.amiAllows must include 127.0.0.1 for local runtime recovery" -}}
{{- end -}}
{{- if has "*" .Values.voice.amiAllows -}}
{{- fail "voice.amiAllows must not contain a wildcard" -}}
{{- end -}}
{{- if .Values.voice.webphone.enabled -}}
{{- $_ := required "voice.webphone.publicWssUrl is required when WebPhone is enabled" .Values.voice.webphone.publicWssUrl -}}
{{- $_ := required "voice.webphone.sipRealm is required when WebPhone is enabled" .Values.voice.webphone.sipRealm -}}
{{- $_ := required "voice.webphone.jwtSecretKey is required when WebPhone is enabled" .Values.voice.webphone.jwtSecretKey -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ivekit.fullname" . }}-rustpbx
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustpbx
spec:
  serviceName: {{ include "ivekit.rustpbxHeadlessFullname" . }}
  replicas: {{ .Values.voice.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustpbx
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      labels:
        {{- include "ivekit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustpbx
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.voice.terminationGracePeriodSeconds }}
      hostNetwork: {{ .Values.voice.network.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.voice.scheduling.hostnameTopologyKey | quote }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "ivekit.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: rustpbx
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .Values.voice.scheduling.hostnameTopologyKey | quote }}
              labelSelector:
                matchLabels:
                  {{- include "ivekit.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: rustpbx
      {{- with .Values.voice.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.voice.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: render-config
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/ivekit-render-rustpbx-config.js"]
          env:
            - name: RUSTPBX_CONFIG_OUTPUT
              value: /app/config/rustpbx.toml
            - name: RUSTPBX_IMAGE
              value: {{ $rustpbxImage | quote }}
            - name: RUSTPBX_AMI_ALLOWS
              value: {{ join "," .Values.voice.amiAllows | quote }}
            - name: RUSTPBX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.databaseUrlKey }}
            - name: RUSTPBX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.databasePasswordKey }}
            - name: RUSTPBX_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.managementTokenKey }}
            - name: RUSTPBX_RWI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.rwiTokenKey }}
            - name: RUSTPBX_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.webhookTokenKey }}
            {{- if .Values.voice.webphone.enabled }}
            - name: OPC_IVEKIT_WEBPHONE_ENABLED
              value: "1"
            - name: OPC_IVEKIT_WEBPHONE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.webphone.jwtSecretKey }}
            - name: OPC_IVEKIT_WEBPHONE_JWT_ISSUER
              value: {{ .Values.voice.webphone.jwtIssuer | quote }}
            - name: OPC_IVEKIT_WEBPHONE_JWT_AUDIENCE
              value: {{ .Values.voice.webphone.jwtAudience | quote }}
            {{- else }}
            - name: OPC_IVEKIT_WEBPHONE_ENABLED
              value: "0"
            {{- end }}
            - name: RUSTPBX_ROUTER_URL
              value: {{ printf "http://%s:%v/api/ivekit/voice/providers/%s/router" (include "ivekit.fullname" .) .Values.service.port $profileId | quote }}
            - name: RUSTPBX_CDR_WEBHOOK_URL
              value: {{ printf "http://%s:%v/api/ivekit/voice/providers/%s/cdrs" (include "ivekit.fullname" .) .Values.service.port $profileId | quote }}
            - name: RUSTPBX_EXTERNAL_IP
              {{- if .Values.voice.externalIp }}
              value: {{ .Values.voice.externalIp | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
              {{- end }}
            - name: RUSTPBX_SIP_PORT
              value: {{ .Values.voice.sipPort | quote }}
            - name: RUSTPBX_RTP_START_PORT
              value: {{ .Values.voice.rtpStartPort | quote }}
            - name: RUSTPBX_RTP_END_PORT
              value: {{ .Values.voice.rtpEndPort | quote }}
            - name: RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS
              value: {{ .Values.voice.sipCapacity.maxActiveTransactions | quote }}
            - name: RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS
              value: {{ .Values.voice.sipCapacity.maxFinishedTransactions | quote }}
            - name: RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY
              value: {{ .Values.voice.sipCapacity.incomingTransactionQueueCapacity | quote }}
            - name: RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS
              value: {{ .Values.voice.sipCapacity.maxTransportConnections | quote }}
            - name: RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY
              value: {{ .Values.voice.mediaCapacity.sessionCleanupConcurrency | quote }}
            - name: RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS
              value: {{ .Values.voice.mediaCapacity.sessionCleanupTimeoutMs | quote }}
            - name: RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY
              value: {{ .Values.voice.mediaCapacity.recordingChannelCapacity | quote }}
            - name: RUSTPBX_MEDIA_RECORDING_WORKER_THREADS
              value: {{ .Values.voice.mediaCapacity.recordingWorkerThreads | quote }}
            - name: RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY
              value: {{ .Values.voice.mediaCapacity.recordingWorkerQueueCapacity | quote }}
            - name: RUSTPBX_REALTIME_AUDIO_TAP_SOCKET_PATH
              value: /run/ivekit/realtime-audio-tap.sock
            - name: RUSTPBX_REALTIME_AUDIO_TAP_CHANNEL_CAPACITY
              value: {{ .Values.realtimeAudioTap.rustPbxChannelCapacity | quote }}
            - name: RUSTPBX_REALTIME_AUDIO_TAP_SEND_TIMEOUT_MS
              value: {{ .Values.realtimeAudioTap.rustPbxSendTimeoutMs | quote }}
            - name: RUSTPBX_CALL_RECORD_MAX_CONCURRENT
              value: {{ .Values.voice.callRecordCapacity.maxConcurrent | quote }}
            - name: RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY
              value: {{ .Values.voice.callRecordCapacity.channelCapacity | quote }}
            - name: RUSTPBX_CALL_RECORD_WORKER_THREADS
              value: {{ .Values.voice.callRecordCapacity.workerThreads | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
      containers:
        - name: route-snapshot-projector
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/ivekit-rustpbx-route-snapshot.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.secrets.runtimeDatabaseUrlKey }}
            - name: IVEKIT_RUSTPBX_ROUTE_TENANT_ID
              value: {{ $tenantId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_PROFILE_ID
              value: {{ $profileId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE
              value: /app/route-snapshot/routes.json
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.routeSnapshot.hmacKeyKey }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS
              value: {{ .Values.voice.routeSnapshot.intervalMs | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_TTL_MS
              value: {{ .Values.voice.routeSnapshot.ttlMs | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_DEPENDENCIES
              value: {{ .Values.voice.routeSnapshot.dependencies | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.routeSnapshot.resources | nindent 12 }}
          volumeMounts:
            - name: route-snapshot
              mountPath: /app/route-snapshot
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-spool-uploader
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/ivekit-rustpbx-recording-spool.js"]
          env:
            - name: OPC_IVEKIT_RECORDING_BASE_URL
              value: {{ printf "http://%s:%v" (include "ivekit.fullname" .) .Values.service.port | quote }}
            - name: OPC_IVEKIT_RECORDING_PROFILE_ID
              value: {{ $profileId | quote }}
            - name: OPC_IVEKIT_RECORDING_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_RECORDING_SPOOL_DIR
              value: /app/recording-spool
            - name: OPC_IVEKIT_RECORDING_STATE_DIR
              value: /app/recording-state
            - name: OPC_IVEKIT_RECORDING_SERVICE_KEY_FILE
              value: /run/ivekit-recording-secrets/rustpbx-recording-service-key
            - name: OPC_IVEKIT_RECORDING_LEASE_SECRET_FILE
              value: /run/ivekit-recording-secrets/rustpbx-recording-lease-secret
            - name: OPC_IVEKIT_RECORDING_PART_SIZE_BYTES
              value: {{ .Values.voice.recordingSpool.partSizeBytes | quote }}
            - name: OPC_IVEKIT_RECORDING_LEASE_MS
              value: {{ .Values.voice.recordingSpool.leaseMs | quote }}
            - name: OPC_IVEKIT_RECORDING_UPLOAD_CONCURRENCY
              value: {{ .Values.voice.recordingSpool.uploadConcurrency | quote }}
            - name: OPC_IVEKIT_RECORDING_POLL_INTERVAL_MS
              value: {{ .Values.voice.recordingSpool.pollIntervalMs | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.recordingSpool.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/recording-spool
            - name: storage
              mountPath: /app/recording-state
            - name: recording-secrets
              mountPath: /run/ivekit-recording-secrets
              readOnly: true
        {{- end }}
        {{- if .Values.voice.componentNode.enabled }}
        - name: component-node-admission
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/ivekit-component-node-admission.js"]
          ports:
            - name: component-node
              containerPort: {{ .Values.voice.componentNode.port }}
              protocol: TCP
          env:
            - name: OPC_IVEKIT_COMPONENT_NODE_HOST
              value: "0.0.0.0"
            - name: OPC_IVEKIT_COMPONENT_NODE_PORT
              value: {{ .Values.voice.componentNode.port | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.componentNode.tokenKey }}
            - name: OPC_IVEKIT_COMPONENT_NODE_COMPONENT
              value: rustpbx
            - name: OPC_IVEKIT_COMPONENT_NODE_REGION_ID
              value: {{ .Values.voice.componentNode.regionId | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_ZONE_ID
              value: {{ .Values.voice.componentNode.zoneId | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_CELL_ID
              value: {{ $cellId | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_COMPONENT_NODE_PROFILE_IDS
              value: {{ join "," .Values.voice.componentNode.profileIds | quote }}
            - name: OPC_IVEKIT_COMPONENT_NODE_INTERACTION_KINDS
