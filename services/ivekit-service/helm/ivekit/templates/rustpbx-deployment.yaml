            - name: IVEKIT_DIALOG_SHADOW_COMPACT_INTERVAL_MS
              value: {{ .Values.voice.dialogShadow.journal.compactIntervalMs | quote }}
            - name: IVEKIT_DIALOG_SHADOW_SERVICE_TOKEN_FILE
              value: /run/dialog-shadow-secrets/service-token
            - name: IVEKIT_DIALOG_SHADOW_TLS_KEY_FILE
              value: /run/dialog-shadow-server-tls/server.key
            - name: IVEKIT_DIALOG_SHADOW_TLS_CERT_FILE
              value: /run/dialog-shadow-server-tls/server.crt
            - name: IVEKIT_DIALOG_SHADOW_TLS_CA_FILE
              value: /run/dialog-shadow-server-tls/client-ca.crt
            - name: IVEKIT_DIALOG_SHADOW_SPIFFE_TRUST_DOMAIN
              value: {{ .Values.voice.dialogShadow.spiffeTrustDomain | quote }}
            - name: IVEKIT_DIALOG_RECOVERY_DATABASE_URL_FILE
              value: /run/dialog-shadow-agent-secrets/database-url
            - name: IVEKIT_DIALOG_RECOVERY_CURRENT_KEY_ID
              value: {{ .Values.voice.dialogShadow.currentRecoveryKeyId | quote }}
            - name: IVEKIT_DIALOG_RECOVERY_CURRENT_KEY_FILE
              value: /run/dialog-shadow-secrets/recovery-current-key
            - name: IVEKIT_DIALOG_RECOVERY_PREVIOUS_KEY_ID
              value: {{ .Values.voice.dialogShadow.previousRecoveryKeyId | quote }}
            - name: IVEKIT_DIALOG_RECOVERY_PREVIOUS_KEY_FILE
              value: /run/dialog-shadow-secrets/recovery-previous-key
            - name: IVEKIT_DIALOG_RECOVERY_TOKEN_TTL_MS
              value: {{ .Values.voice.dialogShadow.recovery.tokenTtlMs | quote }}
            - name: IVEKIT_DIALOG_RECOVERY_NODE_LEASE_TTL_MS
              value: {{ .Values.voice.dialogShadow.recovery.nodeLeaseTtlMs | quote }}
            - name: IVEKIT_DIALOG_RECOVERY_POSTGRES_POOL_MAX
              value: {{ .Values.voice.dialogShadow.recovery.postgresPoolMax | quote }}
            - name: IVEKIT_DIALOG_TERMINAL_REPAIR_INTERVAL_MS
              value: {{ .Values.voice.dialogShadow.recovery.terminalRepairIntervalMs | quote }}
            - name: IVEKIT_DIALOG_TERMINAL_REPAIR_LEASE_TTL_MS
              value: {{ .Values.voice.dialogShadow.recovery.terminalRepairLeaseTtlMs | quote }}
            - name: IVEKIT_DIALOG_TERMINAL_REPAIR_TENANT_BATCH_SIZE
