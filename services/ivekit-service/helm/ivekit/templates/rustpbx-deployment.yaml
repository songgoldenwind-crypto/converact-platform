            - name: IVEKIT_DIALOG_SHADOW_NATS_SERVER_FAULT_DOMAINS_FILE
              value: /run/dialog-shadow-nats-fault-domains/fault-domains.json
            - name: IVEKIT_DIALOG_SHADOW_NATS_STREAM
              value: {{ .Values.voice.dialogShadow.nats.streamName | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_SUBJECT_PREFIX
              value: {{ .Values.voice.dialogShadow.nats.subjectPrefix | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER
              value: {{ .Values.voice.dialogShadow.nats.placementCluster | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_PLACEMENT_TAGS
              value: {{ join "," .Values.voice.dialogShadow.nats.placementTags | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_STREAM_REPLICAS
              value: {{ .Values.voice.dialogShadow.nats.streamReplicas | quote }}
            - name: IVEKIT_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS
              value: {{ .Values.voice.dialogShadow.nats.requiredFaultDomains | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_MAX_AGE_MS
              value: {{ .Values.voice.dialogShadow.nats.maxAgeMs | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_ACK_WAIT_MS
              value: {{ .Values.voice.dialogShadow.nats.ackWaitMs | quote }}
            - name: IVEKIT_DIALOG_SHADOW_NATS_MAX_ACK_PENDING
              value: {{ .Values.voice.dialogShadow.nats.maxAckPending | quote }}
            - name: IVEKIT_DIALOG_SHADOW_QUORUM_TIMEOUT_MS
              value: {{ .Values.voice.dialogShadow.nats.quorumTimeoutMs | quote }}
            - name: NATS_URL
              value: {{ join "," .Values.voice.dialogShadow.nats.urls | quote }}
            - name: NATS_TLS_MODE
              value: required
            - name: NATS_TLS_CA_FILE
              value: /run/dialog-shadow-nats-tls/ca.crt
            - name: NATS_TLS_CERT_FILE
              value: /run/dialog-shadow-nats-tls/client.crt
            - name: NATS_TLS_KEY_FILE
              value: /run/dialog-shadow-nats-tls/client.key
          readinessProbe:
            tcpSocket:
              port: 3212
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: 3212
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.dialogShadow.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/dialog-shadow
            - name: dialog-shadow-shared-secrets
              mountPath: /run/dialog-shadow-secrets
              readOnly: true
            - name: dialog-shadow-agent-secrets
              mountPath: /run/dialog-shadow-agent-secrets
              readOnly: true
            - name: dialog-shadow-server-tls
              mountPath: /run/dialog-shadow-server-tls
              readOnly: true
            - name: dialog-shadow-nats-tls
              mountPath: /run/dialog-shadow-nats-tls
              readOnly: true
            - name: dialog-shadow-nats-fault-domains
              mountPath: /run/dialog-shadow-nats-fault-domains
              readOnly: true
        {{- end }}
        - name: rustpbx
          image: {{ $rustpbxImage | quote }}
          imagePullPolicy: {{ .Values.voice.image.pullPolicy }}
          args: ["--conf", "/app/config/rustpbx.toml"]
          env:
            - name: RUSTPBX_ENV
              value: production
            - name: RUSTRTC_UDP_RECEIVE_BUFFER_BYTES
              value: {{ .Values.voice.mediaCapacity.udpReceiveBufferBytes | quote }}
            - name: RUSTRTC_UDP_SEND_BUFFER_BYTES
              value: {{ .Values.voice.mediaCapacity.udpSendBufferBytes | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE
              value: /app/route-snapshot/routes.json
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.routeSnapshot.hmacKeyKey }}
            - name: IVEKIT_RUSTPBX_ROUTE_LOOKUP_HMAC_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.addressHmacKeyKey }}
            - name: IVEKIT_RUSTPBX_ROUTE_TENANT_ID
              value: {{ $tenantId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_PROFILE_ID
              value: {{ $profileId | quote }}
            - name: IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS
              value: {{ .Values.voice.routeSnapshot.refreshMs | quote }}
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_URL
              value: {{ printf "http://%s:%v/api/ivekit/voice/providers/%s/inbound-admission" (include "ivekit.fullname" .) .Values.service.port $profileId | quote }}
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.webhookTokenKey }}
            - name: IVEKIT_RUSTPBX_CELL_ID
              value: {{ $cellId | quote }}
            - name: IVEKIT_RUSTPBX_OWNER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.voice.dialogShadow.enabled }}
            - name: IVEKIT_RUSTPBX_FAULT_DOMAIN
              value: {{ .Values.voice.dialogShadow.faultDomain | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_ENDPOINT
              value: {{ .Values.voice.dialogShadow.endpoint | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TOKEN_FILE
              value: /run/dialog-shadow-secrets/service-token
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_PRODUCTION
              value: "true"
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_IDENTITY_FILE
              value: {{ printf "/run/dialog-shadow-client-tls/%s" .Values.voice.dialogShadow.clientIdentity.identityFile | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_CA_FILE
              value: {{ printf "/run/dialog-shadow-client-tls/%s" .Values.voice.dialogShadow.clientIdentity.caFile | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_INFLIGHT
              value: {{ .Values.voice.dialogShadow.rustPbx.maxInflight | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_TIMEOUT_MS
              value: {{ .Values.voice.dialogShadow.rustPbx.timeoutMs | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES
              value: {{ .Values.voice.dialogShadow.rustPbx.maxResponseBytes | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS
              value: {{ .Values.voice.dialogShadow.rustPbx.heartbeatIntervalMs | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID
              value: {{ .Values.voice.dialogShadow.currentRecoveryKeyId | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE
              value: /run/dialog-shadow-secrets/recovery-current-key
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID
              value: {{ .Values.voice.dialogShadow.previousRecoveryKeyId | quote }}
            - name: IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE
              value: /run/dialog-shadow-secrets/recovery-previous-key
            {{- end }}
            - name: IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS
              value: "250"
            - name: IVEKIT_RUSTPBX_CDR_SPOOL_DIR
              value: /app/storage/cdr-spool
            - name: IVEKIT_RUSTPBX_CDR_ENDPOINT
              value: {{ .Values.voice.cdr.endpoint | quote }}
            - name: IVEKIT_RUSTPBX_CDR_REGION_ID
              value: {{ .Values.voice.cdr.regionId | quote }}
            - name: IVEKIT_RUSTPBX_CDR_SERVICE_KEY_FILE
              value: /run/cdr-secrets/service-key
            - name: IVEKIT_RUSTPBX_CDR_POLL_MS
              value: {{ .Values.voice.cdr.pollIntervalMs | quote }}
            - name: IVEKIT_RUSTPBX_RECORDING_SPOOL_ENABLED
              value: {{ ternary "true" "false" .Values.voice.recordingSpool.enabled | quote }}
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: IVEKIT_RUSTPBX_RECORDING_SPOOL_DIR
              value: /app/recording-spool
            - name: IVEKIT_RUSTPBX_RECORDING_SEGMENT_SECONDS
              value: {{ .Values.voice.recordingSpool.segmentSeconds | quote }}
            - name: IVEKIT_RUSTPBX_RECORDING_SEGMENT_MAX_BYTES
              value: {{ .Values.voice.recordingSpool.segmentMaxBytes | quote }}
            - name: IVEKIT_REGION_ID
              value: {{ .Values.voice.regionId | quote }}
            - name: IVEKIT_ZONE_ID
              value: {{ .Values.voice.zoneId | quote }}
            {{- end }}
            {{- if .Values.voice.componentNode.enabled }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED
              value: "true"
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_URL
              value: "http://127.0.0.1:3210"
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.voice.componentNode.tokenKey }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS
              value: {{ .Values.voice.componentNode.timeoutMs | quote }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS
              value: {{ .Values.voice.componentNode.refreshMs | quote }}
            {{- else }}
            - name: IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED
              value: "false"
            {{- end }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    reload_trunks() {
                      local status=""
                      exec 3<>/dev/tcp/127.0.0.1/8080 || return 1
                      printf 'POST /ami/v1/reload/trunks HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\nContent-Length: 0\r\n\r\n' >&3
                      IFS= read -r status <&3 || return 1
                      exec 3>&- 3<&-
                      [[ "$status" == *" 200 "* ]]
                    }
                    attempt=0
                    until reload_trunks; do
                      attempt=$((attempt + 1))
                      [ "$attempt" -lt 60 ] || exit 1
                      sleep 1
                    done
            {{- if .Values.voice.componentNode.enabled }}
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    drain_component_node() {
                      local status=""
                      exec 3<>/dev/tcp/127.0.0.1/3210 || return 1
                      printf 'POST /v1/drain HTTP/1.1\r\nHost: 127.0.0.1\r\nAuthorization: Bearer %s\r\nConnection: close\r\nContent-Type: application/json\r\nContent-Length: 2\r\n\r\n{}' "$IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN" >&3
                      IFS= read -r status <&3 || return 1
                      exec 3>&- 3<&-
                      [[ "$status" == *" 200 "* ]]
                    }
                    drain_component_node
                    sleep {{ .Values.voice.drainPropagationSeconds }}
            {{- end }}
          ports:
            - name: management
              containerPort: 8080
              protocol: TCP
            - name: sip-udp
              containerPort: {{ .Values.voice.sipPort }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ .Values.voice.sipPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.voice.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: generated
              mountPath: /app/generated
            - name: route-snapshot
              mountPath: /app/route-snapshot
              readOnly: true
            - name: storage
              mountPath: /app/storage
            - name: cdr-secrets
              mountPath: /run/cdr-secrets
              readOnly: true
            {{- if .Values.voice.recordingSpool.enabled }}
            - name: storage
              mountPath: /app/recording-spool
            {{- end }}
            {{- if .Values.realtimeAudioTap.enabled }}
            - name: realtime-audio-tap
              mountPath: /run/ivekit
            {{- end }}
            {{- if .Values.voice.dialogShadow.enabled }}
            - name: dialog-shadow-shared-secrets
              mountPath: /run/dialog-shadow-secrets
              readOnly: true
            - name: dialog-shadow-client-tls
              mountPath: /run/dialog-shadow-client-tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: generated
          emptyDir: {}
        - name: route-snapshot
          emptyDir: {}
        - name: cdr-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ include "ivekit.secretName" . }}
                  items:
                    - key: {{ .Values.voice.webhookTokenKey }}
                      path: service-key
        {{- if not .Values.voice.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- end }}
        {{- if .Values.voice.recordingSpool.enabled }}
        - name: recording-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ include "ivekit.secretName" . }}
                  items:
                    - key: {{ .Values.voice.webhookTokenKey }}
                      path: rustpbx-recording-service-key
                    - key: {{ .Values.voice.recordingSpool.leaseSecretKey }}
                      path: rustpbx-recording-lease-secret
        {{- end }}
        {{- if .Values.voice.dialogShadow.enabled }}
        - name: dialog-shadow-shared-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ include "ivekit.secretName" . }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.serviceTokenKey }}
                      path: service-token
                    - key: {{ .Values.voice.dialogShadow.currentRecoveryKeyKey }}
                      path: recovery-current-key
                    - key: {{ .Values.voice.dialogShadow.previousRecoveryKeyKey }}
                      path: recovery-previous-key
        - name: dialog-shadow-agent-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ include "ivekit.secretName" . }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.recoveryDatabaseUrlKey }}
                      path: database-url
        - name: dialog-shadow-server-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.voice.dialogShadow.serverTlsSecretName }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.serverTlsKeyKey }}
                      path: server.key
                    - key: {{ .Values.voice.dialogShadow.serverTlsCertificateKey }}
                      path: server.crt
                    - key: {{ .Values.voice.dialogShadow.serverTlsClientCaKey }}
                      path: client-ca.crt
        - name: dialog-shadow-client-tls
          csi:
            driver: {{ .Values.voice.dialogShadow.clientIdentity.csi.driver | quote }}
            readOnly: {{ .Values.voice.dialogShadow.clientIdentity.csi.readOnly }}
            volumeAttributes:
              {{- toYaml .Values.voice.dialogShadow.clientIdentity.csi.volumeAttributes | nindent 14 }}
        - name: dialog-shadow-nats-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.voice.dialogShadow.nats.tlsSecretName }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.nats.tlsCaKey }}
                      path: ca.crt
                    - key: {{ .Values.voice.dialogShadow.nats.tlsCertificateKey }}
                      path: client.crt
                    - key: {{ .Values.voice.dialogShadow.nats.tlsPrivateKeyKey }}
                      path: client.key
        - name: dialog-shadow-nats-fault-domains
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.voice.dialogShadow.nats.faultDomainsSecretName }}
                  items:
                    - key: {{ .Values.voice.dialogShadow.nats.faultDomainsKey }}
                      path: fault-domains.json
        {{- end }}
        {{- if .Values.realtimeAudioTap.enabled }}
        - name: realtime-audio-tap
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.realtimeAudioTap.socketVolumeSizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir: {}
  {{- if .Values.voice.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          {{- include "ivekit.labels" . | nindent 10 }}
          app.kubernetes.io/component: rustpbx
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.voice.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.voice.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ivekit.rustpbxHeadlessFullname" . }}
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustpbx
spec:
  clusterIP: None
  # Cell admission must reach a draining Pod before its readiness lease exists.
  publishNotReadyAddresses: true
  selector:
    {{- include "ivekit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustpbx
  ports:
    - name: management
      port: 8080
      targetPort: management
      protocol: TCP
    {{- if .Values.voice.componentNode.enabled }}
    - name: component-node
      port: 3210
      targetPort: component-node
      protocol: TCP
    {{- end }}
    - name: sip-udp
      port: {{ .Values.voice.sipPort }}
      targetPort: sip-udp
      protocol: UDP
    - name: sip-tcp
      port: {{ .Values.voice.sipPort }}
      targetPort: sip-tcp
      protocol: TCP
{{- if .Values.voice.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ivekit.fullname" . }}-rustpbx
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustpbx
  minAvailable: {{ .Values.voice.podDisruptionBudget.minAvailable }}
{{- end }}
{{- end }}
