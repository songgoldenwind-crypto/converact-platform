            - name: OPC_IVEKIT_LIVEKIT_AUDIO_TAP_GATEWAY_ENABLED
              value: "0"
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_HMAC_SECRET_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.secrets.realtimeAudioTapHmacSecretKey }}
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_TOKEN_TTL_SECONDS
              value: {{ .Values.realtimeAudioTap.tokenTtlSeconds | quote }}
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_SOCKET_PATH
              value: /run/ivekit/realtime-audio-tap.sock
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_MAX_CONNECTIONS
              value: {{ .Values.realtimeAudioTap.maxConnections | quote }}
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_PRESTART_BUFFER_MS
              value: {{ .Values.realtimeAudioTap.prestartBufferMs | quote }}
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_IDLE_TIMEOUT_MS
              value: {{ .Values.realtimeAudioTap.idleTimeoutMs | quote }}
            - name: OPC_IVEKIT_REALTIME_AUDIO_TAP_SHUTDOWN_TIMEOUT_MS
