services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE immutable digest reference is required}
    restart: "no"
    environment:
      POSTGRES_USER: opc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: opc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc_admin -d opc"]
      interval: 1s
      timeout: 1s
      retries: 60
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - validation

networks:
  validation:
    internal: true

volumes:
  postgres_data:
