      IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES: ${RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES:-131072}
      IVEKIT_RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS: ${RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS:-1000}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID:-recovery-current}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE: /run/secrets/dialog-recovery-current-key
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID:-recovery-previous}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE: /run/secrets/dialog-recovery-previous-key
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS: ${RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS:-250}
      IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED: "true"
      IVEKIT_RUSTPBX_COMPONENT_NODE_URL: http://127.0.0.1:3210
      IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN: ${CONVERACT_FABRIC_COMPONENT_NODE_TOKEN:?CONVERACT_FABRIC_COMPONENT_NODE_TOKEN is required and must match KAMAILIO_COMPONENT_NODE_TOKEN_FILE}
      IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS: ${RUSTPBX_COMPONENT_NODE_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS: ${RUSTPBX_COMPONENT_NODE_REFRESH_MS:-3000}
      IVEKIT_RUSTPBX_RECORDING_SPOOL_ENABLED: ${RUSTPBX_RECORDING_SPOOL_ENABLED:-true}
