    secrets:
      - component-node-token
    depends_on:
      rustpbx-b:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/livez').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rustpbx-b-runtime-recovery:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice-capacity", "voice-t1"]
    command: ["node", "dist/converact-rustpbx-recovery.js"]
    restart: "no"
    network_mode: service:rustpbx-b
    depends_on:
      rustpbx-b:
        condition: service_healthy

  rustpbx-runtime-recovery:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
