# Optional RustPBX data plane for the generated standalone Converact Fabric build context.
services:
  rustpbx-db-init:
    image: ${CONVERACT_POSTGRES_IMAGE:?CONVERACT_POSTGRES_IMAGE immutable digest reference is required}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    entrypoint: ["sh", "/bootstrap/init-rustpbx-database.sh"]
    restart: "no"
    environment:
      POSTGRES_USER: opc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: opc
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:?RUSTPBX_DB_PASSWORD is required}
    volumes:
      - ./init-rustpbx-database.sh:/bootstrap/init-rustpbx-database.sh:ro
    depends_on:
      runtime-role-init:
        condition: service_completed_successfully

  rustpbx-config-render:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "dist/converact-render-rustpbx-config.js"]
    restart: "no"
    environment:
      RUSTPBX_CONFIG_OUTPUT: /app/config/rustpbx.toml
      RUSTPBX_IMAGE: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
      RUSTPBX_DATABASE_URL: postgresql://rustpbx_app@postgres:5432/rustpbx
      RUSTPBX_DB_PASSWORD: ${RUSTPBX_DB_PASSWORD:?RUSTPBX_DB_PASSWORD is required}
      RUSTPBX_AMI_ALLOWS: ${RUSTPBX_AMI_ALLOWS:?RUSTPBX_AMI_ALLOWS is required}
      RUSTPBX_MANAGEMENT_TOKEN: ${RUSTPBX_MANAGEMENT_TOKEN:?RUSTPBX_MANAGEMENT_TOKEN is required}
      RUSTPBX_RWI_TOKEN: ${RUSTPBX_RWI_TOKEN:?RUSTPBX_RWI_TOKEN is required}
      RUSTPBX_WEBHOOK_TOKEN: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      CONVERACT_FABRIC_WEBPHONE_ENABLED: "1"
      CONVERACT_FABRIC_WEBPHONE_JWT_SECRET: ${CONVERACT_FABRIC_WEBPHONE_JWT_SECRET:?CONVERACT_FABRIC_WEBPHONE_JWT_SECRET is required}
      CONVERACT_FABRIC_WEBPHONE_JWT_ISSUER: ${CONVERACT_FABRIC_WEBPHONE_JWT_ISSUER:-converact}
      CONVERACT_FABRIC_WEBPHONE_JWT_AUDIENCE: ${CONVERACT_FABRIC_WEBPHONE_JWT_AUDIENCE:-rustpbx-webphone}
      RUSTPBX_ROUTER_URL: http://converact:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/router
      RUSTPBX_EXTERNAL_IP: ${RUSTPBX_EXTERNAL_IP:-}
      RUSTPBX_SIP_PORT: "5060"
      RUSTPBX_RTP_START_PORT: ${RUSTPBX_RTP_START_PORT:-20000}
      RUSTPBX_RTP_END_PORT: ${RUSTPBX_RTP_END_PORT:-20099}
      RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS: ${RUSTPBX_SIP_MAX_ACTIVE_TRANSACTIONS:-65536}
      RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS: ${RUSTPBX_SIP_MAX_FINISHED_TRANSACTIONS:-65536}
      RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY: ${RUSTPBX_SIP_INCOMING_TRANSACTION_QUEUE_CAPACITY:-8192}
      RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS: ${RUSTPBX_SIP_MAX_TRANSPORT_CONNECTIONS:-32768}
      RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY: ${RUSTPBX_MEDIA_SESSION_CLEANUP_CONCURRENCY:-64}
      RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS: ${RUSTPBX_MEDIA_SESSION_CLEANUP_TIMEOUT_MS:-2000}
      RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY: ${RUSTPBX_MEDIA_RECORDING_CHANNEL_CAPACITY:-256}
      RUSTPBX_MEDIA_RECORDING_WORKER_THREADS: ${RUSTPBX_MEDIA_RECORDING_WORKER_THREADS:-4}
      RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY: ${RUSTPBX_MEDIA_RECORDING_WORKER_QUEUE_CAPACITY:-4096}
      RUSTPBX_REALTIME_AUDIO_TAP_SOCKET_PATH: /run/converact/realtime-audio-tap.sock
      RUSTPBX_REALTIME_AUDIO_TAP_CHANNEL_CAPACITY: ${RUSTPBX_REALTIME_AUDIO_TAP_CHANNEL_CAPACITY:-256}
      RUSTPBX_REALTIME_AUDIO_TAP_SEND_TIMEOUT_MS: ${RUSTPBX_REALTIME_AUDIO_TAP_SEND_TIMEOUT_MS:-10}
      RUSTPBX_CALL_RECORD_MAX_CONCURRENT: ${RUSTPBX_CALL_RECORD_MAX_CONCURRENT:-64}
      RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY: ${RUSTPBX_CALL_RECORD_CHANNEL_CAPACITY:-65536}
      RUSTPBX_CALL_RECORD_WORKER_THREADS: ${RUSTPBX_CALL_RECORD_WORKER_THREADS:-1}
    volumes:
      - rustpbx-runtime-config:/app/config
    depends_on:
      rustpbx-db-init:
        condition: service_completed_successfully

  rustpbx-route-snapshot:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "dist/converact-rustpbx-route-snapshot.js"]
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://opc_runtime:${CONVERACT_RUNTIME_DB_PASSWORD:?CONVERACT_RUNTIME_DB_PASSWORD is required}@postgres:5432/opc
      IVEKIT_RUSTPBX_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      IVEKIT_RUSTPBX_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY: ${RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY:?RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS: ${RUSTPBX_ROUTE_SNAPSHOT_INTERVAL_MS:-1000}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_TTL_MS: ${RUSTPBX_ROUTE_SNAPSHOT_TTL_MS:-10000}
      IVEKIT_RUSTPBX_ROUTE_DEPENDENCIES: ${RUSTPBX_ROUTE_DEPENDENCIES:-}
    volumes:
      - rustpbx-route-snapshot:/app/route-snapshot
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  rustpbx:
    image: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["--conf", "/app/config/rustpbx.toml"]
    init: true
    restart: unless-stopped
    environment:
      RUSTPBX_ENV: ${RUSTPBX_ENV:-production}
      RUSTRTC_UDP_RECEIVE_BUFFER_BYTES: ${RUSTRTC_UDP_RECEIVE_BUFFER_BYTES:-1048576}
      RUSTRTC_UDP_SEND_BUFFER_BYTES: ${RUSTRTC_UDP_SEND_BUFFER_BYTES:-524288}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_FILE: /app/route-snapshot/routes.json
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY: ${RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY:?RUSTPBX_ROUTE_SNAPSHOT_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_LOOKUP_HMAC_ROOT_KEY: ${CONVERACT_FABRIC_VOICE_ADDRESS_HMAC_KEY:?CONVERACT_FABRIC_VOICE_ADDRESS_HMAC_KEY is required}
      IVEKIT_RUSTPBX_ROUTE_TENANT_ID: ${RUSTPBX_TENANT_ID:?RUSTPBX_TENANT_ID is required}
      IVEKIT_RUSTPBX_ROUTE_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      IVEKIT_RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS: ${RUSTPBX_ROUTE_SNAPSHOT_REFRESH_MS:-500}
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_URL: http://converact:3000/api/ivekit/voice/providers/${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}/inbound-admission
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_SERVICE_KEY: ${RUSTPBX_WEBHOOK_TOKEN:?RUSTPBX_WEBHOOK_TOKEN is required}
      IVEKIT_RUSTPBX_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      IVEKIT_RUSTPBX_OWNER_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:?RUSTPBX_OWNER_NODE_ID is required}
      IVEKIT_RUSTPBX_FAULT_DOMAIN: ${RUSTPBX_FAULT_DOMAIN:-}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_ENDPOINT: ${RUSTPBX_DIALOG_SHADOW_ENDPOINT:-}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TOKEN_FILE: /run/secrets/dialog-shadow-token
      IVEKIT_RUSTPBX_DIALOG_SHADOW_PRODUCTION: "true"
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_IDENTITY_FILE: /run/secrets/dialog-shadow-client-identity
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_CA_FILE: /run/secrets/dialog-shadow-ca
      IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_INFLIGHT: ${RUSTPBX_DIALOG_SHADOW_MAX_INFLIGHT:-2048}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TIMEOUT_MS: ${RUSTPBX_DIALOG_SHADOW_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES: ${RUSTPBX_DIALOG_SHADOW_MAX_RESPONSE_BYTES:-131072}
      IVEKIT_RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS: ${RUSTPBX_DIALOG_HEARTBEAT_INTERVAL_MS:-1000}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID:-recovery-current}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_FILE: /run/secrets/dialog-recovery-current-key
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID:-recovery-previous}
      IVEKIT_RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_FILE: /run/secrets/dialog-recovery-previous-key
      IVEKIT_RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS: ${RUSTPBX_INBOUND_ADMISSION_TIMEOUT_MS:-250}
      IVEKIT_RUSTPBX_COMPONENT_NODE_ENABLED: "true"
      IVEKIT_RUSTPBX_COMPONENT_NODE_URL: http://127.0.0.1:3210
      IVEKIT_RUSTPBX_COMPONENT_NODE_TOKEN: ${CONVERACT_FABRIC_COMPONENT_NODE_TOKEN:?CONVERACT_FABRIC_COMPONENT_NODE_TOKEN is required and must match KAMAILIO_COMPONENT_NODE_TOKEN_FILE}
      IVEKIT_RUSTPBX_COMPONENT_NODE_TIMEOUT_MS: ${RUSTPBX_COMPONENT_NODE_TIMEOUT_MS:-500}
      IVEKIT_RUSTPBX_COMPONENT_NODE_REFRESH_MS: ${RUSTPBX_COMPONENT_NODE_REFRESH_MS:-3000}
      IVEKIT_RUSTPBX_RECORDING_SPOOL_ENABLED: ${RUSTPBX_RECORDING_SPOOL_ENABLED:-true}
      IVEKIT_RUSTPBX_RECORDING_SPOOL_DIR: /app/recording-spool
      IVEKIT_RUSTPBX_RECORDING_SEGMENT_SECONDS: ${RUSTPBX_RECORDING_SEGMENT_SECONDS:-60}
      IVEKIT_RUSTPBX_RECORDING_SEGMENT_MAX_BYTES: ${RUSTPBX_RECORDING_SEGMENT_MAX_BYTES:-67108864}
      IVEKIT_RUSTPBX_CDR_SPOOL_DIR: /app/storage/cdr-spool
      IVEKIT_RUSTPBX_CDR_ENDPOINT: ${RUSTPBX_CDR_ENDPOINT:?RUSTPBX_CDR_ENDPOINT is required}
      IVEKIT_RUSTPBX_CDR_REGION_ID: ${CONVERACT_FABRIC_CDR_REGION_ID:?CONVERACT_FABRIC_CDR_REGION_ID is required}
      IVEKIT_RUSTPBX_CDR_SERVICE_KEY_FILE: /run/secrets/rustpbx-cdr-service-key
      IVEKIT_RUSTPBX_CDR_TLS_IDENTITY_FILE: /run/secrets/rustpbx-cdr-client-identity
      IVEKIT_RUSTPBX_CDR_TLS_CA_FILE: /run/secrets/rustpbx-cdr-ca
      IVEKIT_RUSTPBX_CDR_POLL_MS: ${RUSTPBX_CDR_POLL_MS:-500}
      IVEKIT_REGION_ID: ${RUSTPBX_REGION_ID:?RUSTPBX_REGION_ID is required}
      IVEKIT_ZONE_ID: ${RUSTPBX_ZONE_ID:?RUSTPBX_ZONE_ID is required}
    expose:
      - "8080"
      - "3210"
    ports:
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_RTP_START_PORT:-20000}-${RUSTPBX_RTP_END_PORT:-20099}:${RUSTPBX_RTP_START_PORT:-20000}-${RUSTPBX_RTP_END_PORT:-20099}/udp"
    volumes:
      - rustpbx-runtime-config:/app/config:ro
      - rustpbx-generated-config:/app/generated
      - rustpbx-route-snapshot:/app/route-snapshot:ro
      - rustpbx-storage:/app/storage
      - rustpbx-recording-spool:/app/recording-spool
      - realtime_audio_tap:/run/converact
    secrets:
      - dialog-shadow-token
      - dialog-shadow-client-identity
      - dialog-shadow-ca
      - dialog-recovery-current-key
      - dialog-recovery-previous-key
      - source: rustpbx-cdr-service-key
        target: rustpbx-cdr-service-key
        mode: 0400
      - source: rustpbx-cdr-client-identity
        target: rustpbx-cdr-client-identity
        mode: 0400
      - source: rustpbx-cdr-ca
        target: rustpbx-cdr-ca
    depends_on:
      rustpbx-db-init:
        condition: service_completed_successfully
      rustpbx-config-render:
        condition: service_completed_successfully
      rustpbx-route-snapshot:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/rustpbx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  rustpbx-dialog-shadow:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice-t1"]
    command: ["node", "dist/converact-dialog-shadow-agent.js"]
    init: true
    restart: unless-stopped
    network_mode: service:rustpbx
    environment:
      CONVERACT_FABRIC_DIALOG_SHADOW_PRODUCTION: "true"
      CONVERACT_FABRIC_DIALOG_SHADOW_HOST: 127.0.0.1
      CONVERACT_FABRIC_DIALOG_SHADOW_PORT: 3212
      CONVERACT_FABRIC_DIALOG_SHADOW_CELL_ID: ${RUSTPBX_CELL_ID:-invalid}
      CONVERACT_FABRIC_DIALOG_SHADOW_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:-invalid}
      CONVERACT_FABRIC_DIALOG_SHADOW_FAULT_DOMAIN: ${RUSTPBX_FAULT_DOMAIN:-invalid}
      CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_PATH: /app/dialog-shadow/dialog-shadow.wal
      CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_MAX_RECORDS: ${CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_MAX_RECORDS:-1000000}
      CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_MAX_BYTES: ${CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_MAX_BYTES:-268435456}
      CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_MAX_RECORD_BYTES: ${CONVERACT_FABRIC_DIALOG_SHADOW_JOURNAL_MAX_RECORD_BYTES:-32768}
      CONVERACT_FABRIC_DIALOG_SHADOW_COMPACT_INTERVAL_MS: ${CONVERACT_FABRIC_DIALOG_SHADOW_COMPACT_INTERVAL_MS:-60000}
      CONVERACT_FABRIC_DIALOG_SHADOW_SERVICE_TOKEN_FILE: /run/secrets/dialog-shadow-token
      CONVERACT_FABRIC_DIALOG_SHADOW_TLS_KEY_FILE: /run/secrets/dialog-shadow-server-key
      CONVERACT_FABRIC_DIALOG_SHADOW_TLS_CERT_FILE: /run/secrets/dialog-shadow-server-cert
      CONVERACT_FABRIC_DIALOG_SHADOW_TLS_CA_FILE: /run/secrets/dialog-shadow-ca
      CONVERACT_FABRIC_DIALOG_SHADOW_SPIFFE_TRUST_DOMAIN: ${CONVERACT_FABRIC_DIALOG_SHADOW_SPIFFE_TRUST_DOMAIN:-converact.internal}
      CONVERACT_FABRIC_DIALOG_RECOVERY_DATABASE_URL_FILE: /run/secrets/dialog-recovery-database-url
      CONVERACT_FABRIC_DIALOG_RECOVERY_CURRENT_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_CURRENT_KEY_ID:-recovery-current}
      CONVERACT_FABRIC_DIALOG_RECOVERY_CURRENT_KEY_FILE: /run/secrets/dialog-recovery-current-key
      CONVERACT_FABRIC_DIALOG_RECOVERY_PREVIOUS_KEY_ID: ${RUSTPBX_DIALOG_RECOVERY_PREVIOUS_KEY_ID:-recovery-previous}
      CONVERACT_FABRIC_DIALOG_RECOVERY_PREVIOUS_KEY_FILE: /run/secrets/dialog-recovery-previous-key
      CONVERACT_FABRIC_DIALOG_RECOVERY_TOKEN_TTL_MS: ${CONVERACT_FABRIC_DIALOG_RECOVERY_TOKEN_TTL_MS:-5000}
      CONVERACT_FABRIC_DIALOG_RECOVERY_NODE_LEASE_TTL_MS: ${CONVERACT_FABRIC_DIALOG_RECOVERY_NODE_LEASE_TTL_MS:-3000}
      CONVERACT_FABRIC_DIALOG_RECOVERY_POSTGRES_POOL_MAX: ${CONVERACT_FABRIC_DIALOG_RECOVERY_POSTGRES_POOL_MAX:-8}
      CONVERACT_FABRIC_DIALOG_TERMINAL_REPAIR_INTERVAL_MS: ${CONVERACT_FABRIC_DIALOG_TERMINAL_REPAIR_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_DIALOG_TERMINAL_REPAIR_LEASE_TTL_MS: ${CONVERACT_FABRIC_DIALOG_TERMINAL_REPAIR_LEASE_TTL_MS:-10000}
      CONVERACT_FABRIC_DIALOG_TERMINAL_REPAIR_TENANT_BATCH_SIZE: ${CONVERACT_FABRIC_DIALOG_TERMINAL_REPAIR_TENANT_BATCH_SIZE:-32}
      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_SERVER_FAULT_DOMAINS_FILE: /run/secrets/dialog-shadow-nats-fault-domains
      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER: ${CONVERACT_FABRIC_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER:-invalid}
      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_PLACEMENT_TAGS: ${CONVERACT_FABRIC_DIALOG_SHADOW_NATS_PLACEMENT_TAGS:-}
      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_STREAM_REPLICAS: ${CONVERACT_FABRIC_DIALOG_SHADOW_NATS_STREAM_REPLICAS:-3}
      CONVERACT_FABRIC_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS: ${CONVERACT_FABRIC_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS:-2}
      NATS_URL: ${RUSTPBX_DIALOG_SHADOW_NATS_URL:-}
      NATS_TLS_MODE: required
      NATS_TLS_CA_FILE: /run/secrets/dialog-shadow-nats-ca
      NATS_TLS_CERT_FILE: /run/secrets/dialog-shadow-nats-cert
      NATS_TLS_KEY_FILE: /run/secrets/dialog-shadow-nats-key
      NATS_CONNECT_TIMEOUT_MS: ${NATS_CONNECT_TIMEOUT_MS:-5000}
      NATS_RECONNECT_WAIT_MS: ${NATS_RECONNECT_WAIT_MS:-1000}
      NATS_MAX_RECONNECT_ATTEMPTS: ${NATS_MAX_RECONNECT_ATTEMPTS:--1}
    volumes:
      - rustpbx-storage:/app/dialog-shadow
    secrets:
      - dialog-shadow-token
      - dialog-shadow-server-key
      - dialog-shadow-server-cert
      - dialog-shadow-ca
      - dialog-recovery-database-url
      - dialog-recovery-current-key
      - dialog-recovery-previous-key
      - dialog-shadow-nats-ca
      - dialog-shadow-nats-cert
      - dialog-shadow-nats-key
      - dialog-shadow-nats-fault-domains
    depends_on:
      rustpbx:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const s=net.connect(3212,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.setTimeout(1000,()=>process.exit(1));s.on('error',()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rustpbx-recording-spool:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "dist/converact-rustpbx-recording-spool.js"]
    init: true
    restart: unless-stopped
    environment:
      CONVERACT_FABRIC_RECORDING_BASE_URL: http://converact:3000
      CONVERACT_FABRIC_RECORDING_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      CONVERACT_FABRIC_RECORDING_WORKER_ID: ${RUSTPBX_RECORDING_WORKER_ID:-rustpbx-recording-sidecar}
      CONVERACT_FABRIC_RECORDING_SPOOL_DIR: /app/recording-spool
      CONVERACT_FABRIC_RECORDING_STATE_DIR: /app/recording-state
      CONVERACT_FABRIC_RECORDING_SERVICE_KEY_FILE: /run/secrets/rustpbx-recording-service-key
      CONVERACT_FABRIC_RECORDING_LEASE_SECRET_FILE: /run/secrets/rustpbx-recording-lease-secret
      CONVERACT_FABRIC_RECORDING_PART_SIZE_BYTES: ${RUSTPBX_RECORDING_PART_SIZE_BYTES:-8388608}
      CONVERACT_FABRIC_RECORDING_LEASE_MS: ${RUSTPBX_RECORDING_LEASE_MS:-300000}
      CONVERACT_FABRIC_RECORDING_UPLOAD_CONCURRENCY: ${RUSTPBX_RECORDING_UPLOAD_CONCURRENCY:-4}
      CONVERACT_FABRIC_RECORDING_POLL_INTERVAL_MS: ${RUSTPBX_RECORDING_POLL_INTERVAL_MS:-1000}
    volumes:
      - rustpbx-recording-spool:/app/recording-spool
      - rustpbx-recording-state:/app/recording-state
    secrets:
      - rustpbx-recording-service-key
      - rustpbx-recording-lease-secret
    depends_on:
      kamailio-route-agent:
        condition: service_started
        required: false
      rustpbx:
        condition: service_started
      converact:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  rustpbx-component-node:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command:
      - sh
      - -ec
      - export CONVERACT_FABRIC_COMPONENT_NODE_TOKEN="$$(cat /run/secrets/component-node-token)"; exec node dist/converact-component-node-admission.js
    init: true
    restart: unless-stopped
    network_mode: service:rustpbx
    environment:
      CONVERACT_FABRIC_COMPONENT_NODE_HOST: 0.0.0.0
      CONVERACT_FABRIC_COMPONENT_NODE_PORT: 3210
      CONVERACT_FABRIC_COMPONENT_NODE_COMPONENT: rustpbx
      CONVERACT_FABRIC_COMPONENT_NODE_REGION_ID: ${RUSTPBX_COMPONENT_NODE_REGION_ID:?RUSTPBX_COMPONENT_NODE_REGION_ID is required}
