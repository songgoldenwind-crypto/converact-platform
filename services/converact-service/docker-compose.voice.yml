      IVEKIT_RUSTPBX_RECORDING_SEGMENT_SECONDS: ${RUSTPBX_RECORDING_SEGMENT_SECONDS:-60}
      IVEKIT_RUSTPBX_RECORDING_SEGMENT_MAX_BYTES: ${RUSTPBX_RECORDING_SEGMENT_MAX_BYTES:-67108864}
      IVEKIT_RUSTPBX_CDR_SPOOL_DIR: /app/storage/cdr-spool
      IVEKIT_RUSTPBX_CDR_ENDPOINT: ${RUSTPBX_CDR_ENDPOINT:?RUSTPBX_CDR_ENDPOINT is required}
      IVEKIT_RUSTPBX_CDR_REGION_ID: ${CONVERACT_FABRIC_CDR_REGION_ID:?CONVERACT_FABRIC_CDR_REGION_ID is required}
      IVEKIT_RUSTPBX_CDR_SERVICE_KEY_FILE: /run/secrets/rustpbx-cdr-service-key
      IVEKIT_RUSTPBX_CDR_TLS_IDENTITY_FILE: /run/secrets/rustpbx-cdr-client-identity-b
      IVEKIT_RUSTPBX_CDR_TLS_CA_FILE: /run/secrets/rustpbx-cdr-ca
      IVEKIT_RUSTPBX_CDR_POLL_MS: ${RUSTPBX_CDR_POLL_MS:-500}
      IVEKIT_REGION_ID: ${RUSTPBX_REGION_ID:?RUSTPBX_REGION_ID is required}
      IVEKIT_ZONE_ID: ${RUSTPBX_ZONE_ID:?RUSTPBX_ZONE_ID is required}
    expose:
      - "8080"
      - "3210"
    ports:
      - "${RUSTPBX_BIND_ADDRESS:-0.0.0.0}:${RUSTPBX_RTP_START_PORT_B:-20100}-${RUSTPBX_RTP_END_PORT_B:-20199}:${RUSTPBX_RTP_START_PORT_B:-20100}-${RUSTPBX_RTP_END_PORT_B:-20199}/udp"
    volumes:
      - rustpbx-b-runtime-config:/app/config:ro
      - rustpbx-b-generated-config:/app/generated
      - rustpbx-route-snapshot:/app/route-snapshot:ro
      - rustpbx-b-storage:/app/storage
      - rustpbx-b-recording-spool:/app/recording-spool
      - realtime_audio_tap:/run/converact
    secrets:
      - dialog-shadow-token
      - dialog-shadow-client-identity-b
      - dialog-shadow-ca
      - dialog-recovery-current-key
      - dialog-recovery-previous-key
      - source: rustpbx-cdr-service-key
        target: rustpbx-cdr-service-key
        mode: 0400
      - source: rustpbx-cdr-client-identity-b
        target: rustpbx-cdr-client-identity-b
        mode: 0400
      - source: rustpbx-cdr-ca
        target: rustpbx-cdr-ca
    depends_on:
      rustpbx-db-init:
        condition: service_completed_successfully
      rustpbx-b-config-render:
        condition: service_completed_successfully
      rustpbx-route-snapshot:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/rustpbx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

