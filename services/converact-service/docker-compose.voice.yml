    command: ["node", "dist/converact-rustpbx-recovery.js"]
    restart: "no"
    network_mode: service:rustpbx
    depends_on:
      rustpbx:
        condition: service_healthy

  kamailio-compose-config-render:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
