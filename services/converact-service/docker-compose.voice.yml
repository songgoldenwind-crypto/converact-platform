    user: "0:0"
    command:
      - sh
      - -ec
      - node dist/converact-kamailio-compose-config.js; chown 1000:1000 /etc/converact-kamailio/*.json; chmod 0440 /etc/converact-kamailio/*.json
    restart: "no"
    environment:
      CONVERACT_FABRIC_KAMAILIO_REGION_ID: ${RUSTPBX_REGION_ID:?RUSTPBX_REGION_ID is required}
      CONVERACT_FABRIC_KAMAILIO_ZONE_ID: ${RUSTPBX_ZONE_ID:?RUSTPBX_ZONE_ID is required}
      CONVERACT_FABRIC_KAMAILIO_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      CONVERACT_FABRIC_KAMAILIO_CELL_LEASE_EPOCH: ${CONVERACT_FABRIC_KAMAILIO_CELL_LEASE_EPOCH:?CONVERACT_FABRIC_KAMAILIO_CELL_LEASE_EPOCH is required}
      CONVERACT_FABRIC_KAMAILIO_PROFILE_ID: ${RUSTPBX_PROFILE_ID:?RUSTPBX_PROFILE_ID is required}
      CONVERACT_FABRIC_KAMAILIO_ADVERTISE_SIP_HOST: ${CONVERACT_FABRIC_KAMAILIO_ADVERTISE_SIP_HOST:?CONVERACT_FABRIC_KAMAILIO_ADVERTISE_SIP_HOST is required}
      CONVERACT_FABRIC_KAMAILIO_ADVERTISE_WSS_HOST: ${CONVERACT_FABRIC_KAMAILIO_ADVERTISE_WSS_HOST:?CONVERACT_FABRIC_KAMAILIO_ADVERTISE_WSS_HOST is required}
      CONVERACT_FABRIC_KAMAILIO_TRUSTED_SOURCE_CIDRS: ${CONVERACT_FABRIC_KAMAILIO_TRUSTED_SOURCE_CIDRS:?CONVERACT_FABRIC_KAMAILIO_TRUSTED_SOURCE_CIDRS is required}
      CONVERACT_FABRIC_KAMAILIO_RUSTPBX_SOURCE_CIDRS: ${CONVERACT_FABRIC_KAMAILIO_RUSTPBX_SOURCE_CIDRS:?CONVERACT_FABRIC_KAMAILIO_RUSTPBX_SOURCE_CIDRS is required}
      CONVERACT_FABRIC_KAMAILIO_DMQ_SOURCE_CIDRS: ${CONVERACT_FABRIC_KAMAILIO_DMQ_SOURCE_CIDRS:-127.0.0.1/32}
      CONVERACT_FABRIC_KAMAILIO_SIP_TRACE_ENABLED: ${CONVERACT_FABRIC_KAMAILIO_SIP_TRACE_ENABLED:-false}
      CONVERACT_FABRIC_KAMAILIO_HEP_COLLECTOR_HOST: ${CONVERACT_FABRIC_KAMAILIO_HEP_COLLECTOR_HOST:-127.0.0.1}
      CONVERACT_FABRIC_KAMAILIO_HEP_COLLECTOR_PORT: ${CONVERACT_FABRIC_KAMAILIO_HEP_COLLECTOR_PORT:-9060}
      CONVERACT_FABRIC_KAMAILIO_HEP_CAPTURE_ID: ${CONVERACT_FABRIC_KAMAILIO_HEP_CAPTURE_ID:-101}
      CONVERACT_FABRIC_KAMAILIO_HEP_INCLUDE_OPTIONS: ${CONVERACT_FABRIC_KAMAILIO_HEP_INCLUDE_OPTIONS:-false}
      CONVERACT_FABRIC_KAMAILIO_WEBPHONE_ALLOWED_ORIGINS: ${CONVERACT_FABRIC_KAMAILIO_WEBPHONE_ALLOWED_ORIGINS:?CONVERACT_FABRIC_KAMAILIO_WEBPHONE_ALLOWED_ORIGINS is required}
      CONVERACT_FABRIC_WEBPHONE_JWT_ISSUER: ${CONVERACT_FABRIC_WEBPHONE_JWT_ISSUER:-converact}
      CONVERACT_FABRIC_WEBPHONE_JWT_AUDIENCE: ${CONVERACT_FABRIC_WEBPHONE_JWT_AUDIENCE:-rustpbx-webphone}
      CONVERACT_FABRIC_KAMAILIO_ALLOW_PUBLIC_WSS: ${CONVERACT_FABRIC_KAMAILIO_ALLOW_PUBLIC_WSS:-true}
      CONVERACT_FABRIC_KAMAILIO_REQUIRE_CLIENT_CERTIFICATE: ${CONVERACT_FABRIC_KAMAILIO_REQUIRE_CLIENT_CERTIFICATE:-false}
      CONVERACT_FABRIC_KAMAILIO_SIP_PORT: ${CONVERACT_FABRIC_KAMAILIO_SIP_PORT:-5060}
      CONVERACT_FABRIC_KAMAILIO_TLS_PORT: ${CONVERACT_FABRIC_KAMAILIO_TLS_PORT:-5061}
      CONVERACT_FABRIC_KAMAILIO_WSS_PORT: ${CONVERACT_FABRIC_KAMAILIO_WSS_PORT:-7443}
      CONVERACT_FABRIC_KAMAILIO_RPC_PORT: ${CONVERACT_FABRIC_KAMAILIO_RPC_PORT:-5065}
      CONVERACT_FABRIC_KAMAILIO_PER_SOURCE_INVITE_CPS: ${CONVERACT_FABRIC_KAMAILIO_PER_SOURCE_INVITE_CPS:-20}
      CONVERACT_FABRIC_KAMAILIO_CELL_INVITE_CPS: ${CONVERACT_FABRIC_KAMAILIO_CELL_INVITE_CPS:-500}
      CONVERACT_FABRIC_KAMAILIO_MAX_FAILOVERS: ${CONVERACT_FABRIC_KAMAILIO_MAX_FAILOVERS:-2}
      RUSTPBX_OWNER_NODE_ID: ${RUSTPBX_OWNER_NODE_ID:?RUSTPBX_OWNER_NODE_ID is required}
      RUSTPBX_OWNER_NODE_ID_B: ${RUSTPBX_OWNER_NODE_ID_B:?RUSTPBX_OWNER_NODE_ID_B is required}
    volumes:
      - kamailio-runtime-config:/etc/converact-kamailio
    security_opt:
      - no-new-privileges:true

  kamailio-config-render:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    user: "0:0"
    command:
      - sh
      - -ec
      - node dist/converact-render-kamailio-config.js; chown 10001:10001 /etc/kamailio/*.cfg; chmod 0440 /etc/kamailio/*.cfg
    restart: "no"
    environment:
      CONVERACT_FABRIC_KAMAILIO_CONFIG_FILE: /etc/converact-kamailio/kamailio-runtime.json
      CONVERACT_FABRIC_KAMAILIO_TOPOH_KEY_FILE: /run/secrets/kamailio-topoh-key
      CONVERACT_FABRIC_KAMAILIO_RPC_TOKEN_FILE: /run/secrets/kamailio-jsonrpc-token
      CONVERACT_FABRIC_KAMAILIO_WEBPHONE_JWT_SECRET_FILE: /run/secrets/kamailio-webphone-jwt-secret
      CONVERACT_FABRIC_KAMAILIO_OUTPUT_FILE: /etc/kamailio/kamailio.cfg
      CONVERACT_FABRIC_KAMAILIO_TLS_OUTPUT_FILE: /etc/kamailio/tls.cfg
    volumes:
      - kamailio-runtime-config:/etc/converact-kamailio:ro
      - kamailio-generated-config:/etc/kamailio
    secrets:
      - kamailio-topoh-key
      - kamailio-jsonrpc-token
      - kamailio-webphone-jwt-secret
    depends_on:
      kamailio-compose-config-render:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  kamailio-state-init:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    user: "0:0"
    command:
      - sh
      - -ec
      - install -d -o 1000 -g 10001 -m 0770 /var/lib/kamailio /var/run/kamailio; printf '# waiting for a signed route snapshot\n' > /var/lib/kamailio/dispatcher.list; chown -R 1000:10001 /var/lib/kamailio /var/run/kamailio; chmod 0640 /var/lib/kamailio/dispatcher.list
    restart: "no"
    volumes:
      - kamailio-route-state:/var/lib/kamailio
      - kamailio-run:/var/run/kamailio
    security_opt:
      - no-new-privileges:true

  kamailio:
    image: ${CONVERACT_FABRIC_KAMAILIO_IMAGE:?CONVERACT_FABRIC_KAMAILIO_IMAGE immutable digest reference is required}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command:
      - -DD
      - -E
      - -x
      - ${KAMAILIO_SHM_ALLOCATOR:-fm}
      - -m
      - ${KAMAILIO_SHM_MEMORY_MB:-512}
      - -M
      - ${KAMAILIO_PKG_MEMORY_MB:-32}
      - -f
      - /etc/kamailio/kamailio.cfg
    init: true
    restart: unless-stopped
    ports:
      - "${KAMAILIO_BIND_ADDRESS:-0.0.0.0}:${CONVERACT_FABRIC_KAMAILIO_SIP_PORT:-5060}:${CONVERACT_FABRIC_KAMAILIO_SIP_PORT:-5060}/udp"
      - "${KAMAILIO_BIND_ADDRESS:-0.0.0.0}:${CONVERACT_FABRIC_KAMAILIO_SIP_PORT:-5060}:${CONVERACT_FABRIC_KAMAILIO_SIP_PORT:-5060}/tcp"
      - "${KAMAILIO_BIND_ADDRESS:-0.0.0.0}:${CONVERACT_FABRIC_KAMAILIO_TLS_PORT:-5061}:${CONVERACT_FABRIC_KAMAILIO_TLS_PORT:-5061}/tcp"
      - "${KAMAILIO_BIND_ADDRESS:-0.0.0.0}:${CONVERACT_FABRIC_KAMAILIO_WSS_PORT:-7443}:${CONVERACT_FABRIC_KAMAILIO_WSS_PORT:-7443}/tcp"
      - "127.0.0.1:${CONVERACT_FABRIC_KAMAILIO_METRICS_PORT:-3220}:3220/tcp"
    volumes:
      - kamailio-generated-config:/etc/kamailio:ro
      - kamailio-route-state:/var/lib/kamailio:ro
      - kamailio-run:/var/run/kamailio
    secrets:
      - kamailio-tls-key
      - kamailio-tls-cert
      - kamailio-tls-ca
      - kamailio-webphone-jwt-secret
    depends_on:
      kamailio-config-render:
        condition: service_completed_successfully
      kamailio-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/kamailio/sbin/kamailio", "-c", "-f", "/etc/kamailio/kamailio.cfg"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  kamailio-route-agent:
    image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
    profiles: ["voice", "voice-capacity", "voice-t1"]
    command: ["node", "dist/converact-kamailio-route-agent.js"]
    init: true
    user: "1000:10001"
    restart: unless-stopped
    network_mode: service:kamailio
    environment:
      CONVERACT_FABRIC_KAMAILIO_HOST: 0.0.0.0
      CONVERACT_FABRIC_KAMAILIO_PORT: 3220
      CONVERACT_FABRIC_KAMAILIO_REGION_ID: ${RUSTPBX_REGION_ID:?RUSTPBX_REGION_ID is required}
      CONVERACT_FABRIC_KAMAILIO_ZONE_ID: ${RUSTPBX_ZONE_ID:?RUSTPBX_ZONE_ID is required}
      CONVERACT_FABRIC_KAMAILIO_CELL_ID: ${RUSTPBX_CELL_ID:?RUSTPBX_CELL_ID is required}
      CONVERACT_FABRIC_KAMAILIO_CELL_LEASE_EPOCH: ${CONVERACT_FABRIC_KAMAILIO_CELL_LEASE_EPOCH:?CONVERACT_FABRIC_KAMAILIO_CELL_LEASE_EPOCH is required}
      CONVERACT_FABRIC_KAMAILIO_EDGE_REPLICA_COUNT: "1"
      CONVERACT_FABRIC_KAMAILIO_TOPOLOGY_FILE: /etc/converact-kamailio/kamailio-topology.json
      CONVERACT_FABRIC_KAMAILIO_CURRENT_KEY_ID: ${CONVERACT_FABRIC_KAMAILIO_CURRENT_KEY_ID:-kamailio-route-key-1}
      CONVERACT_FABRIC_KAMAILIO_CURRENT_KEY_FILE: /run/secrets/kamailio-route-key-current
      CONVERACT_FABRIC_KAMAILIO_SNAPSHOT_PATH: /var/lib/kamailio/routes.snapshot
      CONVERACT_FABRIC_KAMAILIO_DISPATCHER_PATH: /var/lib/kamailio/dispatcher.list
      CONVERACT_FABRIC_KAMAILIO_SNAPSHOT_TTL_MS: ${CONVERACT_FABRIC_KAMAILIO_SNAPSHOT_TTL_MS:-10000}
      CONVERACT_FABRIC_KAMAILIO_POLL_INTERVAL_MS: ${CONVERACT_FABRIC_KAMAILIO_POLL_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_KAMAILIO_MAX_PARALLEL_POLLS: ${CONVERACT_FABRIC_KAMAILIO_MAX_PARALLEL_POLLS:-16}
