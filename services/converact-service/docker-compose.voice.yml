      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_STREAM_REPLICAS: ${CONVERACT_FABRIC_DIALOG_SHADOW_NATS_STREAM_REPLICAS:-3}
      CONVERACT_FABRIC_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS: ${CONVERACT_FABRIC_DIALOG_SHADOW_REQUIRED_FAULT_DOMAINS:-2}
      NATS_URL: ${RUSTPBX_DIALOG_SHADOW_NATS_URL:-}
