      CONVERACT_FABRIC_KAMAILIO_RPC_TOKEN_FILE: /run/secrets/kamailio-jsonrpc-token
      CONVERACT_FABRIC_KAMAILIO_RPC_MAX_ATTEMPTS: ${CONVERACT_FABRIC_KAMAILIO_RPC_MAX_ATTEMPTS:-3}
      CONVERACT_FABRIC_KAMAILIO_RPC_RETRY_DELAY_MS: ${CONVERACT_FABRIC_KAMAILIO_RPC_RETRY_DELAY_MS:-100}
      CONVERACT_FABRIC_KAMAILIO_RPC_TIMEOUT_MS: ${CONVERACT_FABRIC_KAMAILIO_RPC_TIMEOUT_MS:-1000}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_ENABLED: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_ENABLED:-false}
      CONVERACT_FABRIC_KAMAILIO_HOMER_METRICS_ENDPOINT: ${CONVERACT_FABRIC_KAMAILIO_HOMER_METRICS_ENDPOINT:-http://127.0.0.1:9090/metrics}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_POLL_INTERVAL_MS: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_POLL_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_METRICS_TIMEOUT_MS: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_METRICS_TIMEOUT_MS:-1000}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_SAMPLE_PERCENT: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_SAMPLE_PERCENT:-10}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_QUEUE_RECOVER_RATIO: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_QUEUE_RECOVER_RATIO:-0.2}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_QUEUE_SAMPLE_RATIO: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_QUEUE_SAMPLE_RATIO:-0.5}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_QUEUE_OFF_RATIO: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_QUEUE_OFF_RATIO:-0.8}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_CPU_RECOVER_CORES: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_CPU_RECOVER_CORES:-0.3}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_CPU_SAMPLE_CORES: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_CPU_SAMPLE_CORES:-0.7}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_CPU_OFF_CORES: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_CPU_OFF_CORES:-1.5}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PACKETS_RECOVER_PER_SECOND: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PACKETS_RECOVER_PER_SECOND:-2000}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PACKETS_SAMPLE_PER_SECOND: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PACKETS_SAMPLE_PER_SECOND:-5000}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PACKETS_OFF_PER_SECOND: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PACKETS_OFF_PER_SECOND:-10000}
      CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PROCESSING_GAP_RECOVER_PER_SECOND: ${CONVERACT_FABRIC_KAMAILIO_HEP_HIGH_WATER_PROCESSING_GAP_RECOVER_PER_SECOND:-25}
