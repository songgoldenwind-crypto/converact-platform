      IVEKIT_RUSTPBX_FAULT_DOMAIN: ${RUSTPBX_FAULT_DOMAIN_B:-}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_ENDPOINT: ${RUSTPBX_DIALOG_SHADOW_ENDPOINT:-}
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TOKEN_FILE: /run/secrets/dialog-shadow-token
      IVEKIT_RUSTPBX_DIALOG_SHADOW_PRODUCTION: "true"
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_IDENTITY_FILE: /run/secrets/dialog-shadow-client-identity-b
      IVEKIT_RUSTPBX_DIALOG_SHADOW_TLS_CA_FILE: /run/secrets/dialog-shadow-ca
