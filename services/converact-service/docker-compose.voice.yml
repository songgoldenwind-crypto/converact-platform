      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_SERVER_FAULT_DOMAINS_FILE: /run/secrets/dialog-shadow-nats-fault-domains
      CONVERACT_FABRIC_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER: ${CONVERACT_FABRIC_DIALOG_SHADOW_NATS_PLACEMENT_CLUSTER:-invalid}
