  rustpbx-b:
    image: ${RUSTPBX_IMAGE:?RUSTPBX_IMAGE is required}
    profiles: ["voice-capacity", "voice-t1"]
    command: ["--conf", "/app/config/rustpbx.toml"]
    init: true
    restart: unless-stopped
    environment:
