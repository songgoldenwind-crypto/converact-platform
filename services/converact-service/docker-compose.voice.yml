      CONVERACT_FABRIC_COMPONENT_NODE_ID: ${RUSTPBX_OWNER_NODE_ID_B:?RUSTPBX_OWNER_NODE_ID_B is required}
      CONVERACT_FABRIC_COMPONENT_NODE_PROFILE_IDS: ${RUSTPBX_COMPONENT_NODE_PROFILE_IDS:?RUSTPBX_COMPONENT_NODE_PROFILE_IDS is required}
      CONVERACT_FABRIC_COMPONENT_NODE_INTERACTION_KINDS: sip_voice
      CONVERACT_FABRIC_COMPONENT_NODE_DIMENSIONS_JSON: ${RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON:?RUSTPBX_COMPONENT_NODE_DIMENSIONS_JSON is required}
      CONVERACT_FABRIC_COMPONENT_NODE_TERMINAL_RETENTION_MS: ${RUSTPBX_COMPONENT_NODE_TERMINAL_RETENTION_MS:-300000}
      CONVERACT_FABRIC_COMPONENT_NODE_SWEEP_INTERVAL_MS: ${RUSTPBX_COMPONENT_NODE_SWEEP_INTERVAL_MS:-1000}
      CONVERACT_FABRIC_COMPONENT_NODE_RECORDING_SPOOL_METRICS_FILE: /app/recording-state/metrics.json
      CONVERACT_FABRIC_COMPONENT_NODE_RECORDING_SPOOL_REFRESH_MS: ${RUSTPBX_RECORDING_METRICS_REFRESH_MS:-1000}
      CONVERACT_FABRIC_COMPONENT_NODE_RECORDING_SPOOL_STALE_MS: ${RUSTPBX_RECORDING_METRICS_STALE_MS:-5000}
    volumes:
