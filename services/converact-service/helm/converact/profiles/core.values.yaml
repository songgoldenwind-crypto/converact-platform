deploymentProfiles:
  core: true
  ai: false
  observability: false
  benchmark: false

# The default core deploys only the Converact Fabric API. Media, IM, file security and
# provider workloads are attached explicitly after their immutable identities,
# endpoints, Secrets and capacity budgets are supplied.
clamav:
  enabled: false
fileSecurity:
  scanWorkerEnabled: "0"
  derivativeWorkerEnabled: "0"
voice:
  enabled: false
tinode:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafanaDashboard:
    enabled: false
  sipExporter:
    enabled: false
