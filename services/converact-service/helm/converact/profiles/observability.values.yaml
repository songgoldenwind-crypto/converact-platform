deploymentProfiles:
  core: true
  observability: true

config:
  env:
    CONVERACT_FABRIC_WORKER_BACKLOG_METRICS_ENABLED: "1"
    CONVERACT_FABRIC_WORKER_BACKLOG_METRICS_INTERVAL_MS: "5000"

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true
  # The eBPF observer additionally requires an exact digest, host interface
  # and voice-node selector, so the generic observability overlay cannot safely
  # activate it.
  sipExporter:
    enabled: false
