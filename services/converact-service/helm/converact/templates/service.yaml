apiVersion: v1
kind: Service
metadata:
  name: {{ include "converact.fullname" . }}
  labels:
    {{- include "converact.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "converact.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.voice.enabled }}
    - name: internal-tls
      port: 3443
      targetPort: internal-tls
      protocol: TCP
    {{- end }}
    {{- if .Values.realtimeAudioTap.enabled }}
    - name: audio-tap
      port: {{ .Values.realtimeAudioTap.listenPort }}
      targetPort: audio-tap
      protocol: TCP
    {{- end }}
{{- if .Values.realtimeAudioTap.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "converact.fullname" . }}-audio-tap
  labels:
    {{- include "converact.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  clusterIP: None
  selector:
    {{- include "converact.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: audio-tap
      port: {{ .Values.realtimeAudioTap.listenPort }}
      targetPort: audio-tap
      protocol: TCP
{{- end }}
