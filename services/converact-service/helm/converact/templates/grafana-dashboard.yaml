{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "converact.fullname" . }}-grafana-dashboard
  labels:
    {{- include "converact.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  converact-shared-foundation.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
{{- end }}
