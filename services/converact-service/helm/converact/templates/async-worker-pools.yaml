{{- include "ivekit.workerPoolsValidate" . }}
{{- $root := . -}}
{{- $pools := dict
  "event-webhook" .Values.workerPools.pools.eventWebhook
  "attachment" .Values.workerPools.pools.attachment
  "quality" .Values.workerPools.pools.quality
  "translation" .Values.workerPools.pools.translation
  "file-security" .Values.workerPools.pools.fileSecurity -}}
{{- range $poolName, $pool := $pools }}
{{- if $pool.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s-worker" (include "ivekit.fullname" $root) $poolName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "ivekit.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ printf "%s-worker" $poolName }}
spec:
  {{- if not $pool.autoscaling.enabled }}
  replicas: {{ $pool.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ printf "%s-worker" $poolName }}
  template:
    metadata:
      labels:
        {{- include "ivekit.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ printf "%s-worker" $poolName }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $root.Values.workerPools.terminationGracePeriodSeconds }}
      {{- if $root.Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $root.Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ $root.Values.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ $root.Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "ivekit.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: {{ printf "%s-worker" $poolName }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ printf "%s-worker" $poolName }}
          image: {{ include "ivekit.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $root.Values.telemetry.enabled }}
          command: ["node", "--import", "dist/telemetry.js", "dist/converact-worker.js"]
          {{- else }}
          command: ["node", "dist/converact-worker.js"]
          {{- end }}
          {{- with $root.Values.secrets.runtimeEnvironmentSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" $root }}
                  key: {{ $root.Values.secrets.runtimeDatabaseUrlKey }}
            - name: OPC_SCHEMA_MANAGED_BY_MIGRATIONS
              value: "1"
            - name: OPC_OTEL_ENABLED
              value: {{ ternary "1" "0" $root.Values.telemetry.enabled | quote }}
            - name: OPC_OTEL_SERVICE_NAME
              value: {{ printf "ivekit-%s-worker" $poolName | quote }}
            - name: OPC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ $root.Values.telemetry.collectorEndpoint | quote }}
            - name: OPC_OTEL_TRACE_SAMPLE_RATIO
              value: {{ $root.Values.telemetry.sampleRatio | quote }}
            - name: OPC_OTEL_MAX_QUEUE_SIZE
              value: {{ $root.Values.telemetry.maxQueueSize | quote }}
            - name: OPC_OTEL_MAX_EXPORT_BATCH_SIZE
              value: {{ $root.Values.telemetry.maxExportBatchSize | quote }}
            - name: OPC_OTEL_SCHEDULED_DELAY_MS
              value: {{ $root.Values.telemetry.scheduledDelayMs | quote }}
            - name: OPC_OTEL_EXPORT_TIMEOUT_MS
              value: {{ $root.Values.telemetry.exportTimeoutMs | quote }}
            - name: OPC_OBJECT_STORAGE_REQUIRED
              value: "1"
            - name: OPC_IVEKIT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_RUNTIME_HEARTBEAT_ENABLED
              value: "1"
            - name: OPC_IVEKIT_WORKER_BACKLOG_METRICS_ENABLED
              value: "0"
            - name: OPC_IVEKIT_NOTIFICATION_WORKER_ENABLED
              value: "0"
            - name: OPC_TINODE_DELIVERY_WORKER_ENABLED
              value: "0"
            - name: OPC_TINODE_INBOUND_WORKER_ENABLED
              value: "0"
            - name: OPC_ATTACHMENT_PROCESSING_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "attachment") | quote }}
            - name: OPC_QUALITY_REVIEW_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "quality") | quote }}
            - name: OPC_TRANSLATION_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "translation") | quote }}
            - name: OPC_IVEKIT_EVENT_WEBHOOK_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "event-webhook") | quote }}
            - name: OPC_FILE_SECURITY_SCAN_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "file-security") | quote }}
            - name: OPC_FILE_DERIVATIVE_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "file-security") | quote }}
            - name: OPC_FILE_CLEANUP_WORKER_ENABLED
              value: {{ ternary "1" "0" (eq $poolName "file-security") | quote }}
            - name: OPC_FILE_SECURITY_SCANNER_MODE
              value: {{ $root.Values.fileSecurity.scannerMode | quote }}
            - name: OPC_FILE_SECURITY_SCAN_INTERVAL_MS
              value: {{ $root.Values.fileSecurity.scanIntervalMs | quote }}
            - name: OPC_FILE_SECURITY_SCAN_BATCH_SIZE
              value: {{ $root.Values.fileSecurity.scanBatchSize | quote }}
            - name: OPC_FILE_SECURITY_SCAN_LEASE_MS
              value: {{ $root.Values.fileSecurity.scanLeaseMs | quote }}
            - name: OPC_FILE_SECURITY_SCAN_MAX_BYTES
              value: {{ $root.Values.fileSecurity.scanMaxBytes | quote }}
            - name: OPC_FILE_SECURITY_MIME_CONFLICT_ACTION
              value: {{ $root.Values.fileSecurity.mimeConflictAction | quote }}
            - name: OPC_FILE_SECURITY_ALLOW_CONTROLLED
              value: "0"
            - name: OPC_FILE_SECURITY_CLAMD_HOST
              value: {{ ternary (include "ivekit.clamavFullname" $root) $root.Values.fileSecurity.clamdHost $root.Values.clamav.enabled | quote }}
            - name: OPC_FILE_SECURITY_CLAMD_PORT
              value: {{ $root.Values.fileSecurity.clamdPort | quote }}
            - name: OPC_FILE_DERIVATIVE_PROVIDER_MODE
              value: {{ $root.Values.fileSecurity.derivativeProviderMode | quote }}
            - name: OPC_FILE_DERIVATIVE_INTERVAL_MS
              value: {{ $root.Values.fileSecurity.derivativeIntervalMs | quote }}
            - name: OPC_FILE_DERIVATIVE_BATCH_SIZE
              value: {{ $root.Values.fileSecurity.derivativeBatchSize | quote }}
            - name: OPC_FILE_DERIVATIVE_LEASE_MS
              value: {{ $root.Values.fileSecurity.derivativeLeaseMs | quote }}
            - name: OPC_FILE_DERIVATIVE_FFMPEG_EXECUTABLE
              value: ffmpeg
            - name: OPC_FILE_CLEANUP_CONFIRM
              value: {{ $root.Values.fileSecurity.cleanupConfirm | quote }}
            - name: OPC_MEDIA_CALL_TIMEOUT_WORKER_ENABLED
              value: "0"
            - name: OPC_LIVEKIT_EGRESS_RECONCILIATION_ENABLED
              value: "0"
            - name: OPC_LIVEKIT_EGRESS_CAPACITY_METRICS_ENABLED
              value: "0"
            - name: OPC_IVEKIT_EVENT_RETENTION_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_NOTIFICATION_HEALTH_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_RETENTION_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_IVR_WORKERS_ENABLED
              value: "0"
            - name: OPC_IVEKIT_VOICE_WORKERS_ENABLED
              value: "0"
            - name: OPC_IVEKIT_CONTACT_CENTER_WORKER_ENABLED
              value: "0"
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $pool.resources | nindent 12 }}
{{- if $root.Values.workerPools.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-%s-worker" (include "ivekit.fullname" $root) $poolName | trunc 63 | trimSuffix "-" }}
spec:
  minAvailable: {{ $root.Values.workerPools.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ printf "%s-worker" $poolName }}
{{- end }}
{{- if $pool.autoscaling.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-%s-worker" (include "ivekit.fullname" $root) $poolName | trunc 63 | trimSuffix "-" }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s-worker" (include "ivekit.fullname" $root) $poolName | trunc 63 | trimSuffix "-" }}
  pollingInterval: {{ $root.Values.workerPools.pollingInterval }}
  cooldownPeriod: {{ $root.Values.workerPools.cooldownPeriod }}
  minReplicaCount: {{ $pool.autoscaling.minReplicas }}
  maxReplicaCount: {{ $pool.autoscaling.maxReplicas }}
  fallback:
    failureThreshold: {{ $root.Values.workerPools.fallbackFailureThreshold }}
    replicas: {{ $pool.autoscaling.fallbackReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: {{ $root.Values.workerPools.scaleDownStabilizationSeconds }}
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $root.Values.workerPools.prometheusAddress | quote }}
        metricName: {{ printf "ivekit_%s_backlog_depth" $poolName | replace "-" "_" }}
        query: {{ printf "sum(opc_ivekit_worker_backlog_depth{pool=\"%s\"})" $poolName | quote }}
        threshold: {{ $pool.autoscaling.depthPerReplica | quote }}
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: {{ $root.Values.workerPools.prometheusAddress | quote }}
        metricName: {{ printf "ivekit_%s_backlog_oldest_age" $poolName | replace "-" "_" }}
        query: {{ printf "max(opc_ivekit_worker_backlog_oldest_age_seconds{pool=\"%s\"})" $poolName | quote }}
        threshold: {{ $pool.autoscaling.oldestAgeThresholdSeconds | quote }}
        activationThreshold: {{ $pool.autoscaling.oldestAgeActivationSeconds | quote }}
{{- end }}
{{- end }}
{{- end }}
