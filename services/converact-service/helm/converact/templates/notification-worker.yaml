{{- if .Values.notificationWorker.enabled }}
{{- include "ivekit.notificationWorkerValidate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivekit.notificationWorkerFullname" . }}
  labels:
    {{- include "ivekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-worker
spec:
  {{- if not .Values.notificationWorker.autoscaling.enabled }}
  replicas: {{ .Values.notificationWorker.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification-worker
  template:
    metadata:
      labels:
        {{- include "ivekit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notification-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.notificationWorker.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "ivekit.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: notification-worker
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: notification-worker
          image: {{ include "ivekit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            {{- if .Values.telemetry.enabled }}
            - exec node --import dist/telemetry.js dist/converact-worker.js
            {{- else }}
            - exec node dist/converact-worker.js
            {{- end }}
          {{- with .Values.secrets.runtimeEnvironmentSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ivekit.secretName" . }}
                  key: {{ .Values.secrets.runtimeDatabaseUrlKey }}
            - name: OPC_SCHEMA_MANAGED_BY_MIGRATIONS
              value: "1"
            - name: OPC_OTEL_ENABLED
              value: {{ ternary "1" "0" .Values.telemetry.enabled | quote }}
            - name: OPC_OTEL_SERVICE_NAME
              value: ivekit-notification-worker
            - name: OPC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.telemetry.collectorEndpoint | quote }}
            - name: OPC_OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.telemetry.sampleRatio | quote }}
            - name: OPC_OTEL_MAX_QUEUE_SIZE
              value: {{ .Values.telemetry.maxQueueSize | quote }}
            - name: OPC_OTEL_MAX_EXPORT_BATCH_SIZE
              value: {{ .Values.telemetry.maxExportBatchSize | quote }}
            - name: OPC_OTEL_SCHEDULED_DELAY_MS
              value: {{ .Values.telemetry.scheduledDelayMs | quote }}
            - name: OPC_OTEL_EXPORT_TIMEOUT_MS
              value: {{ .Values.telemetry.exportTimeoutMs | quote }}
            - name: OPC_IVEKIT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPC_IVEKIT_NOTIFICATION_WORKER_ENABLED
              value: "1"
            # All replicas compete over all logical shards. PostgreSQL leases,
            # SKIP LOCKED and completion fencing are the ownership boundary.
            - name: OPC_IVEKIT_NOTIFICATION_PARTITION_COUNT
              value: "1"
            - name: OPC_IVEKIT_NOTIFICATION_PARTITION_INDEX
              value: "0"
            - name: OPC_IVEKIT_NOTIFICATION_INTERVAL_MS
              value: {{ .Values.notificationWorker.intervalMs | quote }}
            - name: OPC_IVEKIT_NOTIFICATION_BATCH_SIZE
              value: {{ .Values.notificationWorker.batchSize | quote }}
            - name: OPC_IVEKIT_NOTIFICATION_TENANT_LIMIT
              value: {{ .Values.notificationWorker.tenantLimit | quote }}
            - name: OPC_IVEKIT_NOTIFICATION_LEASE_MS
              value: {{ .Values.notificationWorker.leaseMs | quote }}
            - name: OPC_IVEKIT_NOTIFICATION_RETRY_DELAYS_MS
              value: {{ .Values.notificationWorker.retryDelaysMs | quote }}
            - name: OPC_IVEKIT_RUNTIME_HEARTBEAT_ENABLED
              value: "1"
            - name: OPC_IVEKIT_WORKER_BACKLOG_METRICS_ENABLED
              value: "0"
            - name: OPC_TINODE_DELIVERY_WORKER_ENABLED
              value: "0"
            - name: OPC_TINODE_INBOUND_WORKER_ENABLED
              value: "0"
            - name: OPC_ATTACHMENT_PROCESSING_WORKER_ENABLED
              value: "0"
            - name: OPC_QUALITY_REVIEW_WORKER_ENABLED
              value: "0"
            - name: OPC_TRANSLATION_WORKER_ENABLED
              value: "0"
            - name: OPC_FILE_SECURITY_SCAN_WORKER_ENABLED
              value: "0"
            - name: OPC_FILE_DERIVATIVE_WORKER_ENABLED
              value: "0"
            - name: OPC_FILE_CLEANUP_WORKER_ENABLED
              value: "0"
            - name: OPC_MEDIA_CALL_TIMEOUT_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_EVENT_RETENTION_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_EVENT_WEBHOOK_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_NOTIFICATION_HEALTH_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_RETENTION_WORKER_ENABLED
              value: "0"
            - name: OPC_IVEKIT_IVR_WORKERS_ENABLED
              value: "0"
            - name: OPC_IVEKIT_VOICE_WORKERS_ENABLED
              value: "0"
            - name: OPC_IVEKIT_CONTACT_CENTER_WORKER_ENABLED
              value: "0"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.notificationWorker.resources | nindent 12 }}
{{- if .Values.notificationWorker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ivekit.notificationWorkerFullname" . }}
spec:
  minAvailable: {{ .Values.notificationWorker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ivekit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification-worker
{{- end }}
{{- if .Values.notificationWorker.autoscaling.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ivekit.notificationWorkerFullname" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ivekit.notificationWorkerFullname" . }}
  pollingInterval: {{ .Values.notificationWorker.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.notificationWorker.autoscaling.cooldownPeriod }}
  minReplicaCount: {{ .Values.notificationWorker.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.notificationWorker.autoscaling.maxReplicas }}
  fallback:
    failureThreshold: {{ .Values.notificationWorker.autoscaling.fallbackFailureThreshold }}
    replicas: {{ .Values.notificationWorker.autoscaling.fallbackReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.notificationWorker.autoscaling.scaleDownStabilizationSeconds }}
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.notificationWorker.autoscaling.prometheusAddress | quote }}
        metricName: ivekit_notification_backlog_depth
        query: 'sum(opc_ivekit_worker_backlog_depth{pool="notification"})'
        threshold: {{ .Values.notificationWorker.autoscaling.depthPerReplica | quote }}
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.notificationWorker.autoscaling.prometheusAddress | quote }}
        metricName: ivekit_notification_backlog_oldest_age
        query: 'max(opc_ivekit_worker_backlog_oldest_age_seconds{pool="notification"})'
        threshold: {{ .Values.notificationWorker.autoscaling.oldestAgeThresholdSeconds | quote }}
        activationThreshold: {{ .Values.notificationWorker.autoscaling.oldestAgeActivationSeconds | quote }}
{{- end }}
{{- end }}
