{{- if and .Values.tinode.enabled (eq .Values.tinode.mode "compact") .Values.tinode.persistence.enabled (not .Values.tinode.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "converact.tinodeFullname" . }}
  labels:
    {{- include "converact.labels" . | nindent 4 }}
    app.kubernetes.io/component: tinode
spec:
  accessModes:
    - {{ .Values.tinode.persistence.accessMode }}
  {{- with .Values.tinode.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tinode.persistence.size }}
{{- end }}
