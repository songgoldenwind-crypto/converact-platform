groups:
  - name: ivekit.availability
    rules:
      - alert: ConveractFabricApiUnavailable
        expr: up{job=~".*converact.*"} == 0
        for: 2m
        labels:
          severity: critical
          service: converact
          component: api
        annotations:
          summary: Converact Fabric API metrics target is unavailable
          description: Prometheus has failed to scrape a Converact Fabric API target for two minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitapiunavailable
      - alert: ConveractFabricApiHighErrorRate
        expr: sum(rate(opc_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(opc_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
          service: converact
          component: api
        annotations:
          summary: Converact Fabric API 5xx ratio is above five percent
          description: The aggregate HTTP 5xx ratio has remained above five percent for ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitapihigherrorrate
      - alert: ConveractFabricEventLoopLagHigh
        expr: max(opc_node_nodejs_eventloop_lag_p99_seconds) > 0.5
        for: 10m
        labels:
          severity: warning
          service: converact
          component: api
        annotations:
          summary: Converact Fabric Node.js event loop lag is high
          description: P99 event loop lag has exceeded 500 ms for ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekiteventlooplaghigh

  - name: ivekit.notifications
    rules:
      - alert: ConveractFabricEventWebhookLag
        expr: max(opc_ivekit_event_webhook_oldest_event_age_seconds) > 300
        for: 10m
        labels:
          severity: warning
          service: converact
          component: event_webhook
        annotations:
          summary: Converact Fabric integration event webhook bridge is delayed
          description: The oldest tenant event observed by the webhook bridge is more than five minutes old.
          runbook: docs/converact-monitoring-runbook.md#ivekiteventwebhooklag
      - alert: ConveractFabricEventWebhookFailures
        expr: increase(opc_ivekit_event_webhook_operations_total{result=~"failed|lease_lost|worker_error"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          service: converact
          component: event_webhook
        annotations:
          summary: Converact Fabric integration event webhook bridge is failing
          description: A subscription delivery, worker batch, or lease-fenced cursor update failed in the last ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekiteventwebhookfailures
      - alert: ConveractFabricNotificationQueueStalled
        expr: max(opc_ivekit_notification_queue_oldest_age_seconds{state=~"pending|processing|retry_wait"}) > 300
        for: 10m
        labels:
          severity: critical
          service: converact
          component: notification
        annotations:
          summary: Converact Fabric notification queue is stalled
          description: The oldest actionable notification delivery has been waiting for more than five minutes.
          runbook: docs/converact-notification-operations-runbook.md#incident-playbooks
      - alert: ConveractFabricNotificationQueueBacklog
        expr: sum(opc_ivekit_notification_queue_depth{state=~"pending|processing|retry_wait"}) > 100
        for: 10m
        labels:
          severity: warning
          service: converact
          component: notification
        annotations:
          summary: Converact Fabric notification queue backlog is growing
          description: More than 100 actionable notification deliveries have remained queued for ten minutes.
          runbook: docs/converact-notification-operations-runbook.md#incident-playbooks
      - alert: ConveractFabricNotificationDeadLetters
        expr: increase(opc_ivekit_notification_delivery_attempts_total{result=~"dead_letter|failed"}[15m]) > 0
        for: 2m
        labels:
          severity: critical
          service: converact
          component: notification
        annotations:
          summary: Converact Fabric notification deliveries reached a terminal failure
          description: At least one notification delivery entered failed or dead-letter state in the last 15 minutes.
          runbook: docs/converact-notification-operations-runbook.md#incident-playbooks
      - alert: ConveractFabricNotificationUncertainDelivery
        expr: increase(opc_ivekit_notification_delivery_attempts_total{result="uncertain"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: converact
          component: notification
        annotations:
          summary: Converact Fabric has an uncertain notification delivery
          description: A provider request may have succeeded but did not return a conclusive result. Do not retry blindly.
          runbook: docs/converact-notification-operations-runbook.md#uncertain-delivery
      - alert: ConveractFabricNotificationProviderUnhealthy
        expr: sum by (channel, provider) (increase(opc_ivekit_notification_health_probes_total{outcome="unhealthy"}[10m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: converact
          component: notification_provider
        annotations:
          summary: Converact Fabric notification provider health checks are failing
          description: A channel/provider pair produced at least three unhealthy probes in ten minutes.
          runbook: docs/converact-notification-operations-runbook.md#incident-playbooks
      - alert: ConveractFabricNotificationLeaseContention
        expr: increase(opc_ivekit_notification_lease_lost_total[10m]) > 3
        for: 5m
        labels:
          severity: warning
          service: converact
          component: notification_worker
        annotations:
          summary: Converact Fabric notification worker is losing leases
          description: Repeated fencing losses indicate a slow provider, undersized lease, or unhealthy worker instance.
          runbook: docs/converact-notification-operations-runbook.md#incident-playbooks

  - name: ivekit.collaboration
    rules:
      - alert: ConveractFabricTinodeDeliveryLag
        expr: opc_ivekit_tinode_delivery_queue_lag_seconds > 120
        for: 10m
        labels:
          severity: warning
          service: converact
          component: tinode
        annotations:
          summary: Converact Fabric Tinode outbound delivery is delayed
          description: The oldest due Tinode delivery has exceeded two minutes for ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekittinodedeliverylag
      - alert: ConveractFabricTinodeInboundDeadLetters
        expr: sum(opc_ivekit_tinode_inbound_dead_letters) > 0
        for: 5m
        labels:
          severity: critical
          service: converact
          component: tinode
        annotations:
          summary: Converact Fabric Tinode inbound synchronization has dead letters
          description: At least one inbound Tinode event is awaiting intervention or terminal review.
          runbook: docs/converact-monitoring-runbook.md#ivekittinodeinbounddeadletters
      - alert: ConveractFabricFileSecurityBlockedTerminal
        expr: opc_ivekit_tinode_file_blocked_messages{state="terminal"} > 0
        for: 5m
        labels:
          severity: warning
          service: converact
          component: file_security
        annotations:
          summary: Converact Fabric messages are terminally blocked by file security
          description: One or more messages cannot be delivered because an attachment failed or was quarantined.
          runbook: docs/converact-monitoring-runbook.md#ivekitfilesecurityblockedterminal
      - alert: ConveractFabricIntelligenceRouteExhausted
        expr: increase(opc_ivekit_intelligence_provider_routes_exhausted_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: converact
          component: intelligence_provider
        annotations:
          summary: Converact Fabric intelligence provider route was exhausted
          description: OCR, ASR, translation, or quality review could not find an allowed healthy provider route.
          runbook: docs/converact-monitoring-runbook.md#ivekitintelligencerouteexhausted

  - name: ivekit.media_voice
    rules:
      - alert: ConveractFabricMediaPacketLossHigh
        expr: histogram_quantile(0.95, sum by (le, track_source) (rate(opc_ivekit_media_qos_packet_loss_ratio_bucket[10m]))) > 0.10
        for: 10m
        labels:
          severity: warning
          service: converact
          component: livekit
        annotations:
          summary: Converact Fabric media packet loss is high
          description: P95 reported packet loss has exceeded ten percent for ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitmediapacketlosshigh
      - alert: ConveractFabricMediaQualityDegraded
        expr: increase(opc_ivekit_media_qos_transitions_total{event_type=~"quality.degraded|quality.poor"}[10m]) > 5
        for: 5m
        labels:
          severity: warning
          service: converact
          component: livekit
        annotations:
          summary: Converact Fabric media quality degradation is frequent
          description: More than five debounced degraded or poor media transitions occurred in ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitmediaqualitydegraded
      - alert: ConveractFabricVoiceCommandUncertain
        expr: increase(opc_ivekit_voice_uncertain_commands_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
          service: converact
          component: voice
        annotations:
          summary: Converact Fabric Voice command entered uncertain state
          description: A RustPBX or SIP command may have executed without a conclusive response and requires reconciliation.
          runbook: docs/converact-monitoring-runbook.md#ivekitvoicecommanduncertain
      - alert: ConveractFabricVoiceProviderEventLag
        expr: histogram_quantile(0.95, sum by (le, adapter) (rate(opc_ivekit_voice_provider_event_lag_seconds_bucket[10m]))) > 30
        for: 10m
        labels:
          severity: warning
          service: converact
          component: voice
        annotations:
          summary: Converact Fabric Voice provider events are delayed
          description: P95 Voice provider event lag has exceeded 30 seconds for ten minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitvoiceprovidereventlag
      - alert: ConveractFabricRealtimeAudioTapFailure
        expr: increase(opc_ivekit_voice_audio_tap_events_total{event_type=~"tap.session.failed|tap.gateway.error"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: converact
          component: realtime_audio_tap
        annotations:
          summary: Converact Fabric realtime audio tap is failing
          description: A RustPBX or LiveKit auxiliary PCM tap failed while the primary media path remained active.
          runbook: docs/converact-monitoring-runbook.md#ivekitrealtimeaudiotapfailure
      - alert: ConveractFabricRealtimeAudioTapDroppingAudio
        expr: sum(rate(opc_ivekit_voice_audio_tap_dropped_seconds_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: converact
          component: realtime_audio_tap
        annotations:
          summary: Converact Fabric realtime audio tap is dropping sustained audio
          description: Auxiliary ASR or translation consumers are not keeping up; primary RTC media is intentionally not backpressured.
          runbook: docs/converact-monitoring-runbook.md#ivekitrealtimeaudiotapdroppingaudio
      - alert: ConveractFabricRealtimeAudioTapReplayAttempt
        expr: increase(opc_ivekit_voice_audio_tap_events_total{event_type="tap.connection.rejected",reason="token_replayed"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: converact
          component: realtime_audio_tap
        annotations:
          summary: Converact Fabric realtime audio tap token replay was rejected
          description: A one-time PCM tap authorization was reused and requires security investigation.
          runbook: docs/converact-monitoring-runbook.md#ivekitrealtimeaudiotapreplayattempt
      - alert: ConveractFabricIvrActionFailures
        expr: increase(opc_ivekit_ivr_pending_actions_total{result="failed"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
          service: converact
          component: ivr
        annotations:
          summary: Converact Fabric IVR pending actions are failing
          description: More than five IVR actions failed in the last 15 minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitivractionfailures

  - name: ivekit.governance
    rules:
      - alert: ConveractFabricRetentionFailure
        expr: increase(opc_ivekit_retention_runs_total{result="failed"}[30m]) > 0
        for: 5m
        labels:
          severity: critical
          service: converact
          component: retention
        annotations:
          summary: Converact Fabric retention worker failed
          description: At least one retention category failed in the last 30 minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitretentionfailure
      - alert: ConveractFabricBackupJobFailed
        expr: kube_job_status_failed{job_name=~".*converact-backup-.*"} > 0
        for: 5m
        labels:
          severity: critical
          service: converact
          component: backup
        annotations:
          summary: Converact Fabric backup CronJob failed
          description: Kubernetes reports a failed Converact Fabric backup job. Verify the backup manifest before retrying.
          runbook: docs/converact-backup-restore-runbook.md

  - name: ivekit.rustpbx.capacity
    rules:
      - alert: ConveractFabricRustPbxSipTransactionSaturation
        expr: 100 * rustpbx_sip_endpoint_running_transactions / clamp_min(rustpbx_sip_endpoint_active_transaction_limit, 1) > 90
        for: 5m
        labels:
          severity: warning
          service: converact
          component: rustpbx
        annotations:
          summary: RustPBX SIP active transaction capacity is above 90 percent
          description: Scale or rebalance the Cell before the hard active transaction limit is reached.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxsipcapacity
      - alert: ConveractFabricRustPbxSipQueueSaturation
        expr: 100 * rustpbx_sip_endpoint_incoming_queue_depth / clamp_min(rustpbx_sip_endpoint_incoming_queue_capacity, 1) > 80
        for: 2m
        labels:
          severity: warning
          service: converact
          component: rustpbx
        annotations:
          summary: RustPBX SIP transaction queue is above 80 percent
          description: The bounded incoming transaction queue is approaching overload rejection.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxsipcapacity
      - alert: ConveractFabricRustPbxSipTransportSaturation
        expr: 100 * rustpbx_sip_transport_connections_active / clamp_min(rustpbx_sip_transport_connection_limit, 1) > 90
        for: 5m
        labels:
          severity: warning
          service: converact
          component: rustpbx
        annotations:
          summary: RustPBX SIP transport connection capacity is above 90 percent
          description: TCP, TLS, and WebSocket transport capacity is nearly exhausted.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxsipcapacity
      - alert: ConveractFabricRustPbxSipOverloadRejections
        expr: sum(increase({__name__=~"rustpbx_sip_(endpoint_(active_limit|incoming_queue)_rejections|transport_connection_limit_rejections)_total"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: converact
          component: rustpbx
        annotations:
          summary: RustPBX rejected SIP work because a bounded capacity limit was reached
          description: Inspect per-node saturation, rebalance the Cell, and preserve the rejection evidence.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxsipcapacity
      - alert: ConveractFabricRustPbxRecordingQueueDrops
        expr: sum(increase(rustpbx_media_recording_queue_drops_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: converact
          component: rustpbx
        annotations:
          summary: RustPBX dropped recording samples to protect live RTP forwarding
          description: Recording codec or disk work could not keep up with the bounded capture queue.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxrecordingqueue
      - alert: ConveractFabricRustPbxSessionCleanupDegraded
        expr: sum(increase(rustpbx_media_session_cleanup_total{outcome=~"timed_out|capacity_exhausted"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: converact
          component: rustpbx
        annotations:
          summary: RustPBX force-dropped session resources to keep the media loop responsive
          description: A playback, MCU, or bridge cleanup timed out or the bounded cleanup executor was full; live calls remained isolated but cleanup evidence requires investigation.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxsessioncleanup
      - alert: ConveractFabricRustPbxOrdinaryRelayCapacityUnavailable
        expr: min(ivekit_rustpbx_media_profile_ready{profile="voice-ordinary-v1"}) < 1
        for: 30s
        labels:
          severity: critical
          service: converact
          component: rustpbx
        annotations:
          summary: A RustPBX node cannot admit ordinary relayed calls
          description: The ordinary relay profile has no safe capacity on at least one node; it is removed from new-call routing while established media continues.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxmediaprofiles
      - alert: ConveractFabricRustPbxRecordingProfileExhausted
        expr: min(ivekit_rustpbx_media_profile_ready{profile="voice-recording-v1"}) < 1
        for: 2m
        labels:
          severity: warning
          service: converact
          component: rustpbx
        annotations:
          summary: A RustPBX recording profile is out of safe capacity
          description: New recording work is degraded independently; ordinary relayed calls and established RTP must remain available.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxmediaprofiles
      - alert: ConveractFabricRustPbxAiTapProfileExhausted
        expr: min(ivekit_rustpbx_media_profile_ready{profile="voice-ai-tap-v1"}) < 1
        for: 2m
        labels:
          severity: warning
          service: converact
          component: rustpbx
        annotations:
          summary: A RustPBX AI audio-tap profile is out of safe capacity
          description: New ASR or translation taps are degraded independently and must not backpressure ordinary relayed calls.
          runbook: docs/converact-monitoring-runbook.md#ivekitrustpbxmediaprofiles

  - name: ivekit.kamailio.edge
    rules:
      - alert: ConveractFabricKamailioSnapshotExpired
        expr: min by (namespace, pod) (ivekit_kamailio_snapshot_valid) < 1
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio route snapshot is absent or expired
          description: This Edge replica is fail-closed for new calls; inspect component-node polling, snapshot signing, and dispatcher reload.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailioroutesnapshot
      - alert: ConveractFabricKamailioCoreMetricsUnavailable
        expr: min by (namespace, pod) (ivekit_kamailio_core_metrics_up) < 1
        for: 30s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio core metrics are unavailable through the route-agent proxy
          description: Route-agent remains observable, but dispatcher exhaustion and dialog pin failure telemetry from the loopback-only Kamailio endpoint is unavailable.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiocoremetrics
      - alert: ConveractFabricKamailioHepCollectorUnavailable
        expr: min by (namespace, pod) (ivekit_kamailio_hep_collector_up) < 1
        for: 30s
        labels:
          severity: warning
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio HEP collector telemetry is unavailable
          description: The local controller is shedding trace copies while HOMER metrics are unavailable; SIP routing and media readiness remain independent.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiohephighwater
      - alert: ConveractFabricKamailioHepControlFailure
        expr: increase(ivekit_kamailio_hep_control_apply_failures_total[5m]) > 0
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio rejected a local HEP control transition
          description: Route-agent could not apply full, sampled, or off mode through authenticated loopback RPC and will retry without changing call readiness.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiohephighwater
      - alert: ConveractFabricKamailioHepControlPending
        expr: max by (namespace, pod) (ivekit_kamailio_hep_control_pending) > 0
        for: 30s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio HEP desired state is not confirmed
          description: The controller has not confirmed that the desired HEP mode and revision are committed in the local Kamailio htable; SIP routing and media readiness remain independent.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiohephighwater
      - alert: ConveractFabricKamailioHepTraceDisabled
        expr: max by (namespace, pod) (ivekit_kamailio_hep_mode{mode="off"}) > 0
        for: 30s
        labels:
          severity: warning
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio HEP trace copies are disabled by high-water protection
          description: HOMER queue, CPU, receive-processing gap, packet rate, or repeated scrape failure crossed the off threshold; calls continue without HEP copies.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiohephighwater
      - alert: ConveractFabricKamailioNoAvailableRustPbx
        expr: min by (namespace, pod) (ivekit_kamailio_new_call_nodes) < 1
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio has no RustPBX destination eligible for new calls
          description: Every RustPBX node is offline, draining, lease-stale, recovery-pending, or out of safe capacity.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailioroutecapacity
      - alert: ConveractFabricKamailioMajorityDestinationsDown
        expr: sum by (namespace, pod) (ivekit_kamailio_route_nodes{state="offline"}) / clamp_min(sum by (namespace, pod) (ivekit_kamailio_route_nodes), 1) > 0.5
        for: 30s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: A majority of RustPBX destinations are offline
          description: More than half of this Cell/Zone RustPBX pool is unavailable to the local SIP Edge.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailioroutecapacity
      - alert: ConveractFabricKamailioRouteReloadFailure
        expr: increase(ivekit_kamailio_route_reload_total{result="failure"}[5m]) > 0
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio dispatcher reload failed
          description: A signed route snapshot was published but could not be activated through the loopback-only RPC endpoint.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailioroutereload
      - alert: ConveractFabricKamailioFailoverExhausted
        expr: increase(kamailio_core_ivekit_dispatch_failures[5m]) > 0
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio exhausted an initial-call RustPBX candidate set
          description: Initial INVITE routing returned no capacity or exhausted all finite transport and retryable 5xx candidates.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiofailover
      - alert: ConveractFabricKamailioDialogPinFailure
        expr: increase(kamailio_core_ivekit_pin_failures[5m]) > 0
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio could not honor a dialog owner pin
          description: An in-dialog request had an invalid owner token, stale Cell epoch, missing pin set, or unavailable owner node.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiodialogpin
      - alert: ConveractFabricKamailioWebPhoneAuthFailures
        expr: increase(kamailio_core_ivekit_webphone_auth_failures[5m]) > 20
        for: 1m
        labels:
          severity: warning
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio is rejecting an unusual number of WebPhone identities
          description: WSS Origin, JWT, connection identity, or SIP From validation failed more than twenty times in five minutes.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiowebphone
      - alert: ConveractFabricKamailioWebPhoneLocationSaveFailure
        expr: increase(kamailio_core_ivekit_webphone_location_save_failures[5m]) > 0
        for: 15s
        labels:
          severity: critical
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio could not save an authenticated WebPhone registration
          description: RustPBX accepted REGISTER, but the Edge failed to persist the location into its replicated usrloc state.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiowebphone
      - alert: ConveractFabricKamailioDmqRejected
        expr: increase(kamailio_core_ivekit_dmq_rejects[5m]) > 0
        for: 15s
        labels:
          severity: warning
          service: converact
          component: kamailio
        annotations:
          summary: Kamailio rejected traffic presented as DMQ replication
          description: A KDMQ request arrived outside the dedicated Cell-internal port or the configured peer CIDRs.
          runbook: docs/converact-monitoring-runbook.md#ivekitkamailiodmq
