      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  backup:
    <<: *converact-fabric-image
    profiles: ["operations"]
    entrypoint: ["node", "dist/converact-backup.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CONVERACT_FABRIC_TINODE_ADMIN_DATABASE_URL: ${CONVERACT_FABRIC_TINODE_ADMIN_DATABASE_URL:-}
      CONVERACT_FABRIC_RUSTPBX_ADMIN_DATABASE_URL: ${CONVERACT_FABRIC_RUSTPBX_ADMIN_DATABASE_URL:-}
      CONVERACT_FABRIC_BACKUP_ROOT: /backups
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      CONVERACT_FABRIC_RESTORE_CONFIRM: ${CONVERACT_FABRIC_RESTORE_CONFIRM:-}
      CONVERACT_FABRIC_RESTORE_TARGET_EMPTY: ${CONVERACT_FABRIC_RESTORE_TARGET_EMPTY:-0}
    volumes:
      - ${CONVERACT_FABRIC_BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  clamav_signatures:
  placement_snapshot:
  realtime_audio_tap:
