x-converact-image: &converact-fabric-image
  image: ${CONVERACT_FABRIC_IMAGE:-converact-fabric:local}
  build:
    context: .

services:
  postgres:
    image: ${CONVERACT_POSTGRES_IMAGE:?CONVERACT_POSTGRES_IMAGE immutable digest reference is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: opc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: opc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc_admin -d opc"]
      interval: 5s
      timeout: 3s
      retries: 30

  runtime-role-init:
    <<: *converact-fabric-image
    entrypoint: ["node", "dist/converact-init-runtime-role.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CONVERACT_RUNTIME_DB_PASSWORD: ${CONVERACT_RUNTIME_DB_PASSWORD:?CONVERACT_RUNTIME_DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *converact-fabric-image
    entrypoint: ["node", "dist/converact-migrate.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      runtime-role-init:
        condition: service_completed_successfully

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE immutable digest reference is required}
    user: clamav
    entrypoint: ["/init-unprivileged"]
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 2G
        limits:
          cpus: "2.0"
          memory: 4G

  placement-projector:
    <<: *converact-fabric-image
    profiles: ["capacity"]
    entrypoint: ["node", "dist/converact-placement-snapshot-projector.js"]
    restart: unless-stopped
    environment:
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_FILE: /run/converact-placement/placement.json
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_HMAC_KEYS_JSON:-}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_KEY_ID:-}
      CONVERACT_FABRIC_PLACEMENT_PROFILE_ID: ${CONVERACT_FABRIC_PLACEMENT_PROFILE_ID:-}
      CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON: ${CONVERACT_FABRIC_PLACEMENT_TOPOLOGY_JSON:-}
      CONVERACT_FABRIC_CELL_ADMISSION_TOKEN: ${CONVERACT_FABRIC_CELL_ADMISSION_TOKEN:-}
      CONVERACT_FABRIC_PLACEMENT_PROJECTOR_INTERVAL_MS: ${CONVERACT_FABRIC_PLACEMENT_PROJECTOR_INTERVAL_MS:-2000}
      CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_TTL_MS: ${CONVERACT_FABRIC_PLACEMENT_SNAPSHOT_TTL_MS:-10000}
      CONVERACT_FABRIC_PLACEMENT_PROJECTOR_TIMEOUT_MS: ${CONVERACT_FABRIC_PLACEMENT_PROJECTOR_TIMEOUT_MS:-2000}
    volumes:
      - placement_snapshot:/run/converact-placement

  converact:
    <<: *converact-fabric-image
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONVERACT_FABRIC_HTTP_PORT:-8300}:3000"
    expose:
      - "3010"
    env_file:
      - path: ${CONVERACT_FABRIC_VOICE_RUNTIME_ENV_FILE:-./voice-runtime.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: opc
      PGUSER: opc_runtime
      PGPASSWORD: ${CONVERACT_RUNTIME_DB_PASSWORD:?CONVERACT_RUNTIME_DB_PASSWORD is required}
      CONVERACT_SCHEMA_MANAGED_BY_MIGRATIONS: "1"
      REDIS_TOPOLOGY: ${REDIS_TOPOLOGY:-direct}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-}
      REDIS_SENTINEL_ADDRESSES: ${REDIS_SENTINEL_ADDRESSES:-}
      REDIS_SENTINEL_USERNAME: ${REDIS_SENTINEL_USERNAME:-}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      REDIS_TLS_MODE: ${REDIS_TLS_MODE:-disabled}
      REDIS_TLS_SERVER_NAME: ${REDIS_TLS_SERVER_NAME:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_TLS_CERT_FILE: ${REDIS_TLS_CERT_FILE:-}
      REDIS_TLS_KEY_FILE: ${REDIS_TLS_KEY_FILE:-}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      REDIS_RECONNECT_WAIT_MS: ${REDIS_RECONNECT_WAIT_MS:-1000}
      REDIS_MAX_RECONNECT_ATTEMPTS: ${REDIS_MAX_RECONNECT_ATTEMPTS:--1}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CONVERACT_SIP_VOLTE_ENABLED: ${CONVERACT_SIP_VOLTE_ENABLED:-0}
      LIVEKIT_SIP_BRIDGE_TARGET: ${LIVEKIT_SIP_BRIDGE_TARGET:-}
